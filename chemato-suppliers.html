    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0c2d4a;
            --primary: #1a4a6e;
            --primary-light: #2d7a9e;
            --accent: #3498db;
            --accent-dark: #2c81ba;
            --gray-light: #f8fafc;
            --gray: #e2e8f0;
            --gray-dark: #64748b;
            --text-dark: #0c2d4a;
            --text-light: #475569;
            --white: #ffffff;
            --danger: #e53e3e;
            --success: #2a9d8f;
            --warning: #f4a261;
            --shadow-sm: 0 4px 12px rgba(12,45,74,0.05);
            --shadow-md: 0 10px 25px rgba(12,45,74,0.08);
            --shadow-lg: 0 20px 40px rgba(12,45,74,0.12);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --gray-light: #1a1a2e;
                --gray: #1a2a3a;
                --gray-dark: #6a7a8a;
                --text-dark: #e0e0e0;
                --text-light: #a0aec0;
                --white: #16213e;
                --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
                --shadow-md: 0 10px 25px rgba(0,0,0,0.4);
                --shadow-lg: 0 20px 40px rgba(0,0,0,0.5);
            }
            body {
                background: #1a1a2e !important;
            }
            .navbar {
                background: #0a1a2a !important;
            }
            .page-header {
                background: linear-gradient(135deg, #0a1a2a, #1a4a6e) !important;
            }
            .supplier-card {
                background: #16213e !important;
                border-color: #0f3460 !important;
            }
            .supplier-name {
                color: #e0e0e0 !important;
            }
            .supplier-company {
                color: #a0aec0 !important;
            }
            .supplier-city {
                color: #6a7a8a !important;
            }
            .supplier-badge {
                background: #1a2a3a !important;
                color: #7ec8e3 !important;
            }
            .stat-item {
                color: #a0aec0 !important;
            }
            .stat-item .number {
                color: #e0e0e0 !important;
            }
            .search-filter-bar {
                background: #16213e !important;
                border-color: #0f3460 !important;
            }
            .search-input {
                background: #1a2a3a !important;
                color: #e0e0e0 !important;
            }
            .search-input::placeholder {
                color: #6a7a8a;
            }
            .search-input-wrapper {
                background: #1a2a3a !important;
                border-color: #0f3460 !important;
            }
            .city-filter {
                background: #1a2a3a !important;
                color: #e0e0e0 !important;
                border-color: #0f3460 !important;
            }
            .city-filter option {
                background: #1a2a3a;
                color: #e0e0e0;
            }
            .dropdown-content {
                background: #16213e !important;
                border-color: #0f3460 !important;
            }
            .dropdown-content a {
                color: #e0e0e0 !important;
                border-bottom-color: #1a2a3a !important;
            }
            .dropdown-content a:hover {
                background: #1a2a3a !important;
            }
            .dropdown-content .logout-item {
                border-top-color: #1a2a3a !important;
            }
            .footer {
                background: #0a1a2a !important;
            }
            .footer-links a {
                color: #5a9bc7 !important;
            }
            .footer-links a:hover {
                color: #fff !important;
            }
            .no-results {
                background: #16213e !important;
                color: #a0aec0 !important;
            }
            .no-results i {
                color: #2a3a4a !important;
            }
            .toast {
                background: #0a1a2a !important;
            }
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2eaf2 100%);
            min-height: 100vh;
            color: var(--text-dark);
            transition: background 0.3s, color 0.3s;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes dropFade {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .skeleton-loader {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        .skeleton-card {
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            height: 280px;
            border-radius: var(--radius-md);
        }
        @media (prefers-color-scheme: dark) {
            .skeleton-card {
                background: linear-gradient(90deg, #2a2a3e 25%, #3a3a4e 50%, #2a2a3e 75%);
            }
        }

        /* ========== الهيدر ========== */
        .navbar {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(12,45,74,0.25);
            border-bottom: 2px solid rgba(52,152,219,0.30);
        }

        .logo a {
            text-decoration: none;
        }

        .logo-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 22px;
        }

        .logo-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #3498db;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(52,152,219,0.35);
        }

        .logo-text span:first-child { color: #3498db; }
        .logo-text span:last-child { color: #b0c9d9; font-size: 16px; }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 7px 18px;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
        }

        .nav-links a:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        .nav-links a.active {
            background: #3498db;
            color: white;
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        /* ========== القائمة المنسدلة ========== */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 7px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 14px;
            font-family: inherit;
        }

        .dropdown-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--white);
            min-width: 200px;
            box-shadow: 0 24px 56px rgba(0,0,0,0.12);
            border-radius: 20px;
            z-index: 1000;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid rgba(52,152,219,0.15);
        }

        .dropdown-content.show {
            display: block;
            animation: dropFade 0.25s ease;
        }

        .dropdown-content a {
            color: var(--text-dark);
            padding: 12px 22px;
            text-decoration: none;
            display: block;
            transition: 0.2s;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid var(--gray);
        }

        .dropdown-content a:hover {
            background: #ebf5fb;
            color: var(--primary);
        }

        .dropdown-content .logout-item {
            color: var(--danger);
            border-top: 1px solid var(--gray);
        }

        .dropdown-content .logout-item:hover {
            background: #fee2e2;
        }

        /* ========== المحتوى الرئيسي ========== */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* رأس الصفحة */
        .page-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-radius: var(--radius-lg);
            padding: 40px;
            margin-bottom: 30px;
            color: white;
            text-align: center;
            box-shadow: 0 24px 64px rgba(12,45,74,0.25);
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .page-header h1 i {
            color: #3498db;
        }

        .page-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .results-count {
            margin-top: 15px;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.15);
            display: inline-block;
            padding: 6px 24px;
            border-radius: 30px;
            font-weight: 600;
        }

        /* ===== شريط البحث والفلترة ===== */
        .search-filter-bar {
            background: var(--white);
            border-radius: 60px;
            padding: 10px 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(52,152,219,0.06);
        }

        .search-input-wrapper {
            flex: 2;
            display: flex;
            background: var(--gray-light);
            border-radius: 50px;
            overflow: hidden;
            border: 1px solid var(--gray);
            min-width: 200px;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            font-size: 1rem;
            background: transparent;
            outline: none;
            font-family: inherit;
        }

        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
        }

        .search-btn {
            background: linear-gradient(145deg, #3498db, #2c81ba);
            border: none;
            padding: 0 28px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
            color: white;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
        }

        .city-filter {
            padding: 12px 18px;
            border: 1px solid var(--gray);
            border-radius: 50px;
            background: var(--white);
            cursor: pointer;
            min-width: 140px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
            color: var(--text-dark);
        }

        .city-filter:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52,152,219,0.15);
        }

        /* ===== شبكة الموردين ===== */
        .suppliers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .supplier-card {
            background: var(--white);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.15,0.75,0.45,1);
            border: 1px solid rgba(52,152,219,0.06);
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
            padding: 24px;
        }

        .supplier-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: #3498db;
        }

        .supplier-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .supplier-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .supplier-info {
            flex: 1;
            min-width: 0;
        }

        .supplier-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .supplier-company {
            font-size: 0.9rem;
            color: var(--gray-dark);
            font-weight: 600;
        }

        .supplier-city {
            font-size: 0.8rem;
            color: var(--gray-dark);
            margin-top: 2px;
        }

        .supplier-city i {
            color: #3498db;
            margin-left: 4px;
        }

        .supplier-stats {
            display: flex;
            gap: 20px;
            padding: 12px 0;
            border-top: 1px solid var(--gray);
            border-bottom: 1px solid var(--gray);
            margin: 8px 0 12px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
            color: var(--text-light);
        }

        .stat-item .number {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary-dark);
            display: block;
        }

        .stat-item .label {
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.7;
        }

        .supplier-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 4px 0 12px;
        }

        .supplier-badge {
            background: #ecf3f8;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--primary);
        }

        .supplier-badge i {
            margin-left: 4px;
        }

        .supplier-description {
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .supplier-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .supplier-actions .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            text-decoration: none;
            color: white;
        }

        .btn-whatsapp {
            background: #25D366;
            box-shadow: 0 4px 16px rgba(37,211,102,0.25);
        }

        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37,211,102,0.35);
        }

        .btn-profile {
            background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
            box-shadow: 0 4px 16px rgba(26,74,110,0.15);
        }

        .btn-profile:hover {
            background: linear-gradient(145deg, #3498db, #2c81ba);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(52,152,219,0.35);
        }

        /* ===== حالة فارغة ===== */
        .no-results {
            text-align: center;
            padding: 60px 40px;
            background: var(--white);
            border-radius: var(--radius-lg);
            color: var(--gray-dark);
            grid-column: 1 / -1;
        }

        .no-results i {
            font-size: 60px;
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        .no-results h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            max-width: 90%;
            width: 420px;
        }

        .toast {
            background: #0a2538;
            color: #fff;
            padding: 14px 20px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            border-right: 4px solid #3498db;
            animation: fadeUp 0.4s ease;
        }

        .toast .icon {
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .toast .content {
            flex: 1;
        }

        .toast .content .title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .toast .content .desc {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .toast .close {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .toast .close:hover {
            background: rgba(255,255,255,0.2);
        }

        /* ===== الفوتر ===== */
        .footer {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            color: white;
            text-align: center;
            padding: 35px 20px;
            margin-top: 60px;
            border-top: 4px solid #3498db;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            font-size: 14px;
        }

        .footer-links a:hover {
            color: white;
            transform: translateY(-3px);
        }

        /* ===== استجابة ===== */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 14px 20px;
            }
            .logo-content {
                font-size: 18px;
            }
            .logo-img {
                width: 40px;
                height: 40px;
            }
            .nav-links {
                justify-content: center;
            }
            .nav-links a {
                padding: 6px 14px;
                font-size: 12px;
            }
            .container {
                padding: 0 16px;
                margin: 20px auto;
            }
            .page-header {
                padding: 24px 16px;
            }
            .page-header h1 {
                font-size: 1.6rem;
            }
            .page-header p {
                font-size: 0.95rem;
            }
            .search-filter-bar {
                flex-direction: column;
                border-radius: 28px;
                padding: 12px;
                gap: 10px;
            }
            .search-input-wrapper {
                width: 100%;
            }
            .city-filter {
                width: 100%;
                min-width: unset;
            }
            .search-btn {
                padding: 0 16px;
                font-size: 0.85rem;
            }
            .suppliers-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .dropdown-content {
                left: auto;
                right: 0;
                min-width: 170px;
            }
            .footer-links {
                gap: 12px;
            }
            .footer-links a {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.3rem;
            }
            .supplier-card {
                padding: 18px;
            }
            .supplier-avatar {
                width: 48px;
                height: 48px;
                font-size: 1.3rem;
            }
            .supplier-name {
                font-size: 1rem;
            }
            .supplier-stats {
                gap: 12px;
            }
            .stat-item .number {
                font-size: 1.1rem;
            }
            .supplier-actions {
                flex-direction: column;
            }
            .skeleton-loader {
                grid-template-columns: 1fr;
            }
        }

        @media (hover: none) {
            .supplier-card:hover {
                transform: none;
            }
            .btn-whatsapp:hover {
                background: #25D366;
                transform: none;
            }
            .btn-profile:hover {
                background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
                transform: none;
            }
            .nav-links a:hover {
                background: rgba(255,255,255,0.06);
                transform: none;
            }
            .dropdown-btn:hover {
                background: rgba(255,255,255,0.08);
                transform: none;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <a href="index.html">
            <div class="logo-content">
                <img src="logo.png" class="logo-img" alt="كيماتو">
                <div class="logo-text">
                    <span>كيماتو</span>
                    <span> | الموردين</span>
                </div>
            </div>
        </a>
    </div>
    <div class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="all-products.html"><i class="fas fa-flask"></i> المنتجات</a>
        <a href="all-requests.html"><i class="fas fa-clipboard-list"></i> الطلبات</a>
        <a href="all-suppliers.html" class="active"><i class="fas fa-truck"></i> الموردين</a>
        <div class="dropdown">
            <button class="dropdown-btn" id="dropdownToggle"><i class="fas fa-user-circle"></i> القائمة</button>
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>
    </div>
</div>

<div class="container">
    <!-- ===== رأس الصفحة ===== -->
    <div class="page-header">
        <h1><i class="fas fa-truck"></i> جميع الموردين</h1>
        <p>استعرض جميع موردي المواد الكيماوية في مصر وتواصل معهم مباشرة</p>
        <div class="results-count" id="resultsCount">📊 جاري التحميل...</div>
    </div>

    <!-- ===== شريط البحث ===== -->
    <div class="search-filter-bar">
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن مورد... (اسم، شركة، مدينة)" autocomplete="off" />
            <button id="searchBtn" class="search-btn"><i class="fas fa-search"></i> بحث</button>
        </div>
        <select id="cityFilter" class="city-filter">
            <option value="all">📍 جميع المدن</option>
        </select>
    </div>

    <!-- ===== شبكة الموردين ===== -->
    <div id="suppliersContainer" class="suppliers-grid">
        <div class="skeleton-loader" id="skeletonLoader">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== الفوتر ===== -->
<div class="footer">
    <div class="footer-links">
        <a href="index.html">الرئيسية</a>
        <a href="all-products.html">جميع المنتجات</a>
        <a href="all-requests.html">جميع الطلبات</a>
        <a href="all-suppliers.html">الموردين</a>
        <a href="auth.html">تسجيل الدخول</a>
    </div>
    <div>© 2026 كيماتو - سوق المواد الكيماوية في مصر</div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let currentSearch = ''
    let currentCity = 'all'
    let allSuppliers = []
    let cities = []

    // ========== TOAST ==========
    function showToast(icon, title, desc) {
        const container = document.getElementById('toastContainer')
        if (!container) return
        const toast = document.createElement('div')
        toast.className = 'toast'
        toast.innerHTML = `
            <div class="icon">${icon}</div>
            <div class="content">
                <div class="title">${title}</div>
                <div class="desc">${desc}</div>
            </div>
            <button class="close" onclick="this.parentElement.remove()">✕</button>
        `
        container.appendChild(toast)
        setTimeout(() => toast.remove(), 5000)
    }

    // ========== DROPDOWN ==========
    function setupDropdown() {
        const toggle = document.getElementById('dropdownToggle')
        const content = document.getElementById('dropdownContent')
        if (toggle && content) {
            toggle.addEventListener('click', (e) => {
                e.stopPropagation()
                content.classList.toggle('show')
            })
            document.addEventListener('click', () => content.classList.remove('show'))
        }
    }

    async function updateDropdownContent() {
        const { data: { user } } = await supabase.auth.getUser()
        const dropdownContent = document.getElementById('dropdownContent')
        if (!dropdownContent) return

        if (user) {
            const { data: profile } = await supabase
                .from('profiles')
                .select('user_type')
                .eq('id', user.id)
                .single()

            dropdownContent.innerHTML = `
                <a href="profile.html"><i class="fas fa-user"></i> الملف الشخصي</a>
                ${profile?.user_type === 'supplier' ? '<a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> لوحة المورد</a>' : ''}
                ${profile?.user_type === 'buyer' ? '<a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> لوحة العميل</a>' : ''}
                <a href="#" id="logoutLink" class="logout-item"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
            `
            document.getElementById('logoutLink')?.addEventListener('click', async (e) => {
                e.preventDefault()
                await supabase.auth.signOut()
                window.location.href = 'index.html'
            })
        } else {
            dropdownContent.innerHTML = `
                <a href="auth.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
                <a href="auth.html"><i class="fas fa-user-plus"></i> حساب جديد</a>
                <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> للموردين</a>
                <a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> للعملاء</a>
            `
        }
    }

    // ========== WHATSAPP LINK ==========
    function getWhatsAppLink(phone, name) {
        if (!phone) return '#'
        const cleanPhone = phone.replace(/\D/g, '')
        const formattedPhone = cleanPhone.startsWith('20') ? cleanPhone : `20${cleanPhone}`
        const message = `مرحباً، أنا مهتم بالتعاون معكم (منصة كيماتو)`
        return `https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`
    }

    // ========== LOAD CITIES ==========
    async function loadCities() {
        try {
            const { data } = await supabase
                .from('profiles')
                .select('city')
                .eq('user_type', 'supplier')
                .not('city', 'is', null)
                .not('city', 'eq', '')

            const uniqueCities = new Set()
            data?.forEach(p => {
                if (p.city) uniqueCities.add(p.city)
            })
            cities = Array.from(uniqueCities).sort()

            const select = document.getElementById('cityFilter')
            cities.forEach(city => {
                select.innerHTML += `<option value="${city}">📍 ${city}</option>`
            })
        } catch (e) {
            console.error('Error loading cities:', e)
        }
    }

    // ========== LOAD SUPPLIERS ==========
    async function loadSuppliers() {
        const container = document.getElementById('suppliersContainer')
        container.innerHTML = `
            <div class="skeleton-loader">
                ${Array(6).fill(0).map(() => '<div class="skeleton-card"></div>').join('')}
            </div>
        `

        try {
            let query = supabase
                .from('profiles')
                .select('*')
                .eq('user_type', 'supplier')

            if (currentSearch) {
                query = query.or(`full_name.ilike.%${currentSearch}%,company_name.ilike.%${currentSearch}%,city.ilike.%${currentSearch}%`)
            }

            if (currentCity !== 'all') {
                query = query.eq('city', currentCity)
            }

            const { data: suppliers, error } = await query

            if (error) {
                showToast('❌', 'خطأ', error.message)
                return
            }

            allSuppliers = suppliers || []

            if (allSuppliers.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-users"></i>
                        <h3>لا توجد موردين</h3>
                        <p>${currentSearch || currentCity !== 'all' ? 'لا يوجد موردين يطابقون معايير البحث' : 'لم يتم تسجيل أي موردين حتى الآن'}</p>
                    </div>
                `
                document.getElementById('resultsCount').innerHTML = '📊 0 مورد'
                return
            }

            // Get product counts for each supplier
            const suppliersWithStats = await Promise.all(allSuppliers.map(async (supplier) => {
                const { count: productCount } = await supabase
                    .from('products')
                    .select('*', { count: 'exact', head: true })
                    .eq('supplier_id', supplier.id)
                    .eq('status', 'active')

                const { count: viewsCount } = await supabase
                    .from('products')
                    .select('views_count', { count: 'exact', head: false })
                    .eq('supplier_id', supplier.id)

                // Get category badges (top 3 categories)
                const { data: products } = await supabase
                    .from('products')
                    .select('category')
                    .eq('supplier_id', supplier.id)
                    .eq('status', 'active')
                    .limit(10)

                const categories = new Set()
                products?.forEach(p => {
                    if (p.category) categories.add(p.category)
                })
                const badges = Array.from(categories).slice(0, 3)

                return {
                    ...supplier,
                    productCount: productCount || 0,
                    viewsCount: viewsCount?.reduce((sum, p) => sum + (p.views_count || 0), 0) || 0,
                    badges
                }
            }))

            // Sort by product count (highest first)
            suppliersWithStats.sort((a, b) => b.productCount - a.productCount)

            const colors = ['#1a4a6e', '#2d7a9e', '#3a8aaa', '#1a5f7a', '#4a7a9e', '#6a4a9e']
            const getColor = (name) => {
                const index = (name?.length || 0) % colors.length
                return colors[index]
            }

            container.innerHTML = suppliersWithStats.map((supplier, index) => {
                const avatarColor = getColor(supplier.full_name)
                const initial = supplier.full_name?.charAt(0)?.toUpperCase() || 'م'
                const whatsappLink = getWhatsAppLink(supplier.phone, supplier.full_name)
                const companyName = supplier.company_name || 'مورد مستقل'
                const city = supplier.city || 'مدينة غير محددة'

                return `
                    <div class="supplier-card" style="animation-delay:${(index % 6) * 0.05}s;">
                        <div class="supplier-header">
                            <div class="supplier-avatar" style="background:${avatarColor};">${initial}</div>
                            <div class="supplier-info">
                                <div class="supplier-name">${supplier.full_name || 'مورد'}</div>
                                <div class="supplier-company"><i class="fas fa-building"></i> ${companyName}</div>
                                <div class="supplier-city"><i class="fas fa-map-marker-alt"></i> ${city}</div>
                            </div>
                        </div>

                        <div class="supplier-stats">
                            <div class="stat-item">
                                <span class="number">${supplier.productCount}</span>
                                <span class="label">منتج</span>
                            </div>
                            <div class="stat-item">
                                <span class="number">${supplier.viewsCount}</span>
                                <span class="label">مشاهدة</span>
                            </div>
                            <div class="stat-item">
                                <span class="number">${supplier.phone ? '📱' : '📧'}</span>
                                <span class="label">${supplier.phone ? 'متاح' : 'بريد'}</span>
                            </div>
                        </div>

                        ${supplier.badges.length > 0 ? `
                            <div class="supplier-badges">
                                ${supplier.badges.map(cat => `<span class="supplier-badge"><i class="fas fa-tag"></i> ${cat}</span>`).join('')}
                                ${supplier.badges.length < 3 && supplier.productCount > 3 ? `<span class="supplier-badge"><i class="fas fa-plus"></i> ${supplier.productCount - 3} أخرى</span>` : ''}
                            </div>
                        ` : ''}

                        <div class="supplier-actions">
                            <a href="${whatsappLink}" target="_blank" class="btn btn-whatsapp" onclick="event.stopPropagation();">
                                <i class="fab fa-whatsapp"></i> واتساب
                            </a>
                            <button class="btn btn-profile" onclick="viewSupplier('${supplier.id}')">
                                <i class="fas fa-user"></i> ملف
                            </button>
                        </div>
                    </div>
                `
            }).join('')

            document.getElementById('resultsCount').innerHTML = `📊 عرض ${allSuppliers.length} مورد`
        } catch (e) {
            console.error('Error loading suppliers:', e)
            container.innerHTML = `
                <div class="no-results" style="border:2px solid #e74c3c;">
                    <i class="fas fa-exclamation-triangle" style="color:#e74c3c;"></i>
                    <h3>حدث خطأ</h3>
                    <p>لم نتمكن من تحميل الموردين</p>
                    <button onclick="location.reload()" style="margin-top:20px;padding:12px 28px;background:#3498db;color:white;border:none;border-radius:30px;cursor:pointer;font-weight:700;font-family:inherit;">🔄 إعادة المحاولة</button>
                </div>
            `
        }
    }

    // ========== VIEW SUPPLIER ==========
    window.viewSupplier = (id) => {
        window.location.href = `supplier-profile.html?id=${id}`
    }

    // ========== SEARCH ==========
    document.getElementById('searchBtn').addEventListener('click', () => {
        currentSearch = document.getElementById('searchInput').value.trim()
        loadSuppliers()
    })

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            currentSearch = e.target.value.trim()
            loadSuppliers()
        }
    })

    document.getElementById('cityFilter').addEventListener('change', (e) => {
        currentCity = e.target.value
        loadSuppliers()
    })

    // ========== INIT ==========
    async function init() {
        setupDropdown()
        await updateDropdownContent()
        await loadCities()
        await loadSuppliers()

        console.log('✅ كيماتو | جميع الموردين يعمل')
        console.log('✅ عدد الموردين:', allSuppliers.length)
    }

    // Auth state change
    supabase.auth.onAuthStateChange(() => {
        updateDropdownContent()
    })

    init()
</script>
</body>
</html>
