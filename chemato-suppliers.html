    <style>

        /* SEARCH */

        .search-wrapper {

        .search-btn:hover {

        .suggestions-box {

            <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });

        // ============================================================
        // STATE
        // ============================================================
        const state = {
            search: '',
            cityFilter: 'all',
            verifiedFilter: 'all',
            sort: 'products',

            page: 0,
            pageSize: 12,
            total: 0,
            suppliers: [],
            featuredSuppliers: [],
            suggestions: [],
            allCities: [],

            user: null,
            loading: false,
            hasMore: true,
            selectedSuggestionIndex: -1,
            channel: null,
        };

        const THEME_KEY = 'chemato-theme';

        // ============================================================
        // UTILS
        // ============================================================
        const escapeHtml = (str) => {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        const sanitizePhone = (p) => p ? String(p).replace(/\D/g, '') : '';
        const isValidUUID = (id) =>
            id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

        const sanitizeSearch = (s) =>
            String(s || '').trim().slice(0, 100).replace(/[<>'"]/g, '');

        const formatNumber = (n) => Number(n || 0).toLocaleString('ar-EG');

        const debounce = (fn, delay = 300) => {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        };

        // ============================================================
        // THEME
        // ============================================================
        const updateThemeIcon = (theme) => {
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        };

        const initTheme = () => {
            const saved = localStorage.getItem(THEME_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);

            document.getElementById('themeToggle')?.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem(THEME_KEY, next);
                updateThemeIcon(next);
            });
        };

        // ============================================================
        // TOAST
        // ============================================================
        const removeToast = (toast) => {
            if (!toast || !toast.parentNode) return;
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 300);
        };

        const showToast = (icon, title, desc, linkText = null, linkUrl = null, type = '') => {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const iconEl = document.createElement('div');
            iconEl.className = 'toast-icon';
            iconEl.textContent = icon;

            const content = document.createElement('div');
            content.className = 'toast-content';

            const titleEl = document.createElement('div');
            titleEl.className = 'toast-title';
            titleEl.textContent = title;

            const descEl = document.createElement('div');
            descEl.className = 'toast-desc';
            descEl.textContent = desc + (linkText ? ' ' : '');

            if (linkText && linkUrl) {
                const link = document.createElement('a');
                link.href = linkUrl;
                link.textContent = linkText;
                if (!linkUrl.startsWith('/') && !linkUrl.startsWith(window.location.origin)) {
                    link.rel = 'noopener noreferrer';
                    link.target = '_blank';
                }
                descEl.appendChild(link);
            }

            content.appendChild(titleEl);
            content.appendChild(descEl);

            const closeBtn = document.createElement('button');
            closeBtn.className = 'toast-close';
            closeBtn.setAttribute('aria-label', 'إغلاق');
            closeBtn.innerHTML = '<i class="fas fa-times"></i>';
            closeBtn.onclick = () => removeToast(toast);

            toast.appendChild(iconEl);
            toast.appendChild(content);
            toast.appendChild(closeBtn);
            container.appendChild(toast);

            setTimeout(() => removeToast(toast), 6000);
        };

        // ============================================================
        // READING PROGRESS
        // ============================================================
        const initReadingProgress = () => {
            const bar = document.getElementById('readingProgress');
            if (!bar) return;
            const update = () => {
                const winScroll = document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - window.innerHeight;
                const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
                bar.style.width = scrolled + '%';
            };
            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', update, { passive: true });
            update();
        };

        // ============================================================
        // NAVBAR
        // ============================================================
        const initNavbar = () => {
            const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.getElementById('navLinks');

            menuToggle?.addEventListener('click', () => {
                const isOpen = navLinks.classList.toggle('open');
                menuToggle.setAttribute('aria-expanded', isOpen);
                menuToggle.innerHTML = isOpen
                    ? '<i class="fas fa-times"></i>'
                    : '<i class="fas fa-bars"></i>';
            });

            const dropdownToggle = document.getElementById('dropdownToggle');
            const dropdownContent = document.getElementById('dropdownContent');

            dropdownToggle?.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = dropdownContent.classList.toggle('show');
                dropdownToggle.setAttribute('aria-expanded', isOpen);
            });

            document.addEventListener('click', () => {
                dropdownContent?.classList.remove('show');
                dropdownToggle?.setAttribute('aria-expanded', 'false');
            });
        };

        // ============================================================
        // AUTH CHECK
        // ============================================================
        const checkUser = async () => {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                state.user = user || null;

                const dropdownContent = document.getElementById('dropdownContent');

                if (user) {
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('user_type, full_name, company_name')
                        .eq('id', user.id)
                        .single();

                    if (dropdownContent) {
                        const dashboardUrl = profile?.user_type === 'supplier'
                            ? 'supplier-dashboard.html'
                            : 'buyer-dashboard.html';

                        dropdownContent.innerHTML = `
                            <a href="${dashboardUrl}"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
                            <a href="profile.html"><i class="fas fa-user"></i> الملف الشخصي</a>
                            <a href="#" id="logoutLink" class="logout"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
                        `;

                        document.getElementById('logoutLink')?.addEventListener('click', async (e) => {
                            e.preventDefault();
                            await supabase.auth.signOut();
                            window.location.reload();
                        });
                    }
                } else {
                    if (dropdownContent) {
                        dropdownContent.innerHTML = `
                            <a href="auth.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
                            <a href="auth.html"><i class="fas fa-user-plus"></i> حساب جديد</a>
                            <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> للموردين</a>
                            <a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> للعملاء</a>
                        `;
                    }
                }
            } catch (e) {
                console.warn('Auth check failed:', e.message);
            }
        };

        // ============================================================
        // STATS
        // ============================================================
        const animateNumber = (el, target) => {
            if (!el) return;
            const duration = 900;
            const start = performance.now();
            const step = (now) => {
                const progress = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const value = Math.floor(target * eased);
                el.textContent = value.toLocaleString('ar-EG');
                if (progress < 1) requestAnimationFrame(step);
                else {
                    el.textContent = target.toLocaleString('ar-EG');
                    el.classList.remove('updated');
                    void el.offsetWidth;
                    el.classList.add('updated');
                }
            };
            requestAnimationFrame(step);
        };

        const loadStats = async () => {
            try {
                console.log('📊 Loading stats...');

                const [suppliersRes, verifiedRes, productsRes] = await Promise.all([
                    supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('user_type', 'supplier'),
                    supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('user_type', 'supplier').eq('is_verified', true),
                    supabase.from('products').select('*', { count: 'exact', head: true }).eq('status', 'active'),
                ]);

                const suppliersCount = suppliersRes.count || 0;
                const verifiedCount = verifiedRes.count || 0;
                const productsCount = productsRes.count || 0;

                // Get unique cities
                const { data: citiesData } = await supabase
                    .from('profiles')
                    .select('city')
                    .eq('user_type', 'supplier')
                    .not('city', 'is', null);

                const uniqueCities = new Set((citiesData || []).map(r => r.city).filter(Boolean));

                console.log(`✅ Stats: ${suppliersCount} suppliers, ${verifiedCount} verified, ${uniqueCities.size} cities, ${productsCount} products`);

                animateNumber(document.getElementById('statSuppliers'), suppliersCount);
                animateNumber(document.getElementById('statVerified'), verifiedCount);
                animateNumber(document.getElementById('statCities'), uniqueCities.size);
                animateNumber(document.getElementById('statProducts'), productsCount);

            } catch (e) {
                console.warn('❌ Stats load failed:', e.message);
                // Set default values
                animateNumber(document.getElementById('statSuppliers'), 0);
                animateNumber(document.getElementById('statVerified'), 0);
                animateNumber(document.getElementById('statCities'), 0);
                animateNumber(document.getElementById('statProducts'), 0);
            }
        };

        // ============================================================
        // LOAD CITIES (for filter)
        // ============================================================
        const loadCities = async () => {
            try {
                console.log('🌆 Loading cities...');

                const { data, error } = await supabase
                    .from('profiles')
                    .select('city')
                    .eq('user_type', 'supplier')
                    .not('city', 'is', null);

                if (error) {
                    console.warn('❌ Cities fetch error:', error.message);
                    return;
                }

                const cities = [...new Set((data || []).map(r => r.city).filter(Boolean))].sort();
                state.allCities = cities;

                console.log(`✅ Found ${cities.length} cities`);

                const select = document.getElementById('cityFilter');
                if (!select) return;

                cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = `📍 ${city}`;
                    select.appendChild(option);
                });
            } catch (e) {
                console.warn('❌ Cities load exception:', e.message);
            }
        };

        // ============================================================
        // BUILD QUERY
        // ============================================================
        const buildQuery = () => {
            let query = supabase
                .from('profiles')
                .select('id, full_name, company_name, city, phone, whatsapp, is_verified, created_at, avatar_url', { count: 'exact' })
                .eq('user_type', 'supplier');

            // Search - name or company or city
            if (state.search) {
                query = query.or(`company_name.ilike.%${state.search}%,full_name.ilike.%${state.search}%,city.ilike.%${state.search}%`);
            }

            // City filter
            if (state.cityFilter !== 'all') {
                query = query.eq('city', state.cityFilter);
            }

            // Verified filter
            if (state.verifiedFilter === 'verified') {
                query = query.eq('is_verified', true);
            } else if (state.verifiedFilter === 'unverified') {
                query = query.eq('is_verified', false);
            }

            // Sort
            const sortMap = {
                'newest': ['created_at', false],
                'name': ['company_name', true],
                'products': ['created_at', false],
                'views': ['created_at', false],
            };
            const [sortCol, asc] = sortMap[state.sort] || sortMap['newest'];
            query = query.order(sortCol, { ascending: asc, nullsFirst: false });

            return query;
        };

        // ============================================================
        // FETCH PRODUCTS FOR SUPPLIERS
        // ============================================================
        const fetchProductsForSuppliers = async (supplierIds) => {
            const map = {};
            if (!supplierIds.length) return map;

            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('id, name, image_url, price, supplier_id, views, status, is_featured')
                    .in('supplier_id', supplierIds)
                    .eq('status', 'active');

                if (error) {
                    console.warn('⚠️ Products fetch error:', error.message);
                    return map;
                }

                (data || []).forEach(p => {
                    if (!map[p.supplier_id]) {
                        map[p.supplier_id] = { products: [], count: 0, totalViews: 0, featured: [] };
                    }
                    map[p.supplier_id].products.push(p);
                    map[p.supplier_id].count++;
                    map[p.supplier_id].totalViews += (p.views || 0);
                    if (p.is_featured) map[p.supplier_id].featured.push(p);
                });
            } catch (e) {
                console.warn('⚠️ Products fetch exception:', e.message);
            }
            return map;
        };

        // ============================================================
        // LOAD SUPPLIERS
        // ============================================================
        const renderSkeleton = () => {
            const container = document.getElementById('suppliersList');
            if (!container) return;
            container.setAttribute('aria-busy', 'true');
            container.innerHTML = Array(6).fill(0).map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-card-inner">
                        <div class="skeleton" style="height: 60px; width: 60px; border-radius: 50%;"></div>
                        <div class="skeleton" style="height: 16px; width: 70%;"></div>
                        <div class="skeleton" style="height: 12px; width: 40%;"></div>
                        <div class="skeleton" style="height: 60px; width: 100%; margin-top: 12px;"></div>
                        <div class="skeleton" style="height: 12px; width: 90%;"></div>
                        <div class="skeleton" style="height: 12px; width: 60%;"></div>
                    </div>
                </div>
            `).join('');
        };

        const loadSuppliers = async ({ append = false } = {}) => {
            if (state.loading) return;
            state.loading = true;

            const container = document.getElementById('suppliersList');
            const infiniteLoading = document.getElementById('infiniteLoading');

            if (!append) {
                state.page = 0;
                state.suppliers = [];
                renderSkeleton();
            } else {
                if (infiniteLoading) infiniteLoading.style.display = 'flex';
            }

            try {
                const from = state.page * state.pageSize;
                const to = from + state.pageSize - 1;

                console.log(`🔄 Loading suppliers: page ${state.page + 1} (${from} to ${to})`);

                const query = buildQuery().range(from, to);
                const { data, error, count } = await query;

                if (error) {
                    console.error('❌ Suppliers query error:', error);
                    throw error;
                }

                const suppliers = data || [];
                state.total = count || 0;

                console.log(`✅ Found ${suppliers.length} suppliers (total: ${state.total})`);

                // Fetch products for these suppliers
                const supplierIds = suppliers.map(s => s.id);
                const productsMap = await fetchProductsForSuppliers(supplierIds);

                // Enrich suppliers
                let enriched = suppliers.map(s => ({
                    ...s,
                    productsData: productsMap[s.id] || { products: [], count: 0, totalViews: 0, featured: [] },
                }));

                // Client-side sort for products/views
                if (state.sort === 'products') {
                    enriched.sort((a, b) => b.productsData.count - a.productsData.count);
                } else if (state.sort === 'views') {
                    enriched.sort((a, b) => b.productsData.totalViews - a.productsData.totalViews);
                }

                if (append) {
                    state.suppliers = [...state.suppliers, ...enriched];
                } else {
                    state.suppliers = enriched;
                }

                renderSuppliers(enriched, !append);
                state.hasMore = state.suppliers.length < state.total;
                updateResultsCount();

            } catch (error) {
                console.error('❌ Suppliers load exception:', error);
                if (!append) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle empty-icon" style="color: var(--c-danger);"></i>
                            <h3>حدث خطأ في التحميل</h3>
                            <p>${escapeHtml(error?.message || 'خطأ غير معروف')}</p>
                            <button onclick="location.reload()" class="btn-reset-filters">
                                <i class="fas fa-redo"></i> إعادة المحاولة
                            </button>
                        </div>
                    `;
                }
                showToast('⚠️', 'خطأ', 'تعذر تحميل الموردين', null, null, 'error');
            } finally {
                state.loading = false;
                if (infiniteLoading) infiniteLoading.style.display = 'none';
                container?.setAttribute('aria-busy', 'false');
            }
        };

        const renderSuppliers = (suppliers, replace = true) => {
            const container = document.getElementById('suppliersList');
            if (!container) return;

            if (!suppliers.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-truck empty-icon"></i>
                        <h3>لا يوجد موردين</h3>
                        <p>لم نجد أي موردين يطابقون معايير البحث</p>
                        <button class="btn-reset-filters" id="emptyResetBtn" type="button">
                            <i class="fas fa-redo"></i> إعادة تعيين الفلاتر
                        </button>
                    </div>
                `;
                document.getElementById('emptyResetBtn')?.addEventListener('click', resetFilters);
                return;
            }

            const html = suppliers.map((s, i) => renderSupplierCard(s, i)).join('');

            if (replace) {
                container.innerHTML = html;
            } else {
                const temp = document.createElement('div');
                temp.innerHTML = html;
                while (temp.firstChild) container.appendChild(temp.firstChild);
            }
        };

        const renderSupplierCard = (s, index = 0) => {
            const name = s.company_name || s.full_name || 'مورد';
            const initial = name.charAt(0).toUpperCase();
            const isVerified = s.is_verified === true;
            const productsData = s.productsData || { products: [], count: 0, totalViews: 0 };
            const productsCount = productsData.count;
            const totalViews = productsData.totalViews;

            const rawPhone = s.phone || s.whatsapp || '';
            const cleanPhone = sanitizePhone(rawPhone);
            const phoneWithCountry = cleanPhone
                ? (cleanPhone.startsWith('20') ? cleanPhone : '20' + cleanPhone)
                : '';
            const waMessage = encodeURIComponent(`مرحباً، وجدتكم على منصة كيماتو وأرغب في الاستفسار عن منتجاتكم`);
            const waLink = phoneWithCountry ? `https://wa.me/${phoneWithCountry}?text=${waMessage}` : '';

            const featuredProducts = productsData.products.slice(0, 3);

            return `
                <article class="supplier-card" style="animation-delay: ${Math.min(index * 0.05, 0.3)}s;" data-supplier-id="${escapeHtml(s.id)}">
                    <div class="supplier-card-header">
                        <div class="supplier-badges-top">
                            ${isVerified ? `
                                <span class="badge-pill badge-verified">
                                    <i class="fas fa-check-circle"></i> موثّق
                                </span>
                            ` : ''}
                            ${productsCount > 0 ? `
                                <span class="badge-pill badge-active">
                                    <i class="fas fa-circle" style="font-size: 0.5rem;"></i> نشط
                                </span>
                            ` : ''}
                        </div>

                        <div class="supplier-avatar-wrapper">
                            <div class="supplier-avatar-lg">
                                ${s.avatar_url && /^https?:\/\//i.test(s.avatar_url) ? `
                                    <img src="${escapeHtml(s.avatar_url)}" alt="${escapeHtml(name)}"
                                         onerror="this.onerror=null;this.parentElement.textContent='${initial}';" />
                                ` : initial}
                            </div>
                            <div class="supplier-name-block">
                                <h3 class="supplier-name">${escapeHtml(name)}</h3>
                                ${s.city ? `
                                    <div class="supplier-location-mini">
                                        <i class="fas fa-map-marker-alt"></i>
                                        ${escapeHtml(s.city)}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="supplier-card-body">
                        <div class="supplier-stats-row">
                            <div class="supplier-stat">
                                <span class="supplier-stat-value primary">${formatNumber(productsCount)}</span>
                                <span class="supplier-stat-label">منتج</span>
                            </div>
                            <div class="supplier-stat">
                                <span class="supplier-stat-value accent">${formatNumber(totalViews)}</span>
                                <span class="supplier-stat-label">مشاهدة</span>
                            </div>
                            <div class="supplier-stat">
                                <span class="supplier-stat-value">${new Date(s.created_at).getFullYear()}</span>
                                <span class="supplier-stat-label">انضم</span>
                            </div>
                        </div>

                        ${featuredProducts.length > 0 ? `
                            <div class="supplier-featured-preview">
                                ${featuredProducts.map(p => {
                                    const hasImg = p.image_url && /^https?:\/\//i.test(p.image_url);
                                    return `
                                        <div class="supplier-product-thumb" title="${escapeHtml(p.name)}">
                                            ${hasImg ? `
                                                <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" loading="lazy"
                                                     onerror="this.onerror=null;this.parentElement.textContent='🧪';" />
                                            ` : '🧪'}
                                        </div>
                                    `;
                                }).join('')}
                                ${Array(Math.max(0, 3 - featuredProducts.length)).fill(0).map(() => `
                                    <div class="supplier-product-thumb" style="opacity: 0.4;">🧪</div>
                                `).join('')}
                            </div>
                        ` : `
                            <div class="supplier-featured-preview">
                                <div class="supplier-product-thumb" style="opacity: 0.3;">📦</div>
                                <div class="supplier-product-thumb" style="opacity: 0.3;">📦</div>
                                <div class="supplier-product-thumb" style="opacity: 0.3;">📦</div>
                            </div>
                        `}

                        <div class="supplier-actions">
                            <a href="supplier-profile.html?id=${encodeURIComponent(s.id)}"
                               class="btn-supplier btn-view-supplier">
                                <i class="fas fa-eye"></i> عرض الملف
                            </a>
                            ${waLink ? `
                                <a href="${waLink}" target="_blank" rel="noopener noreferrer"
                                   class="btn-supplier btn-wa"
                                   data-action="whatsapp"
                                   data-supplier-id="${escapeHtml(s.id)}">
                                    <i class="fab fa-whatsapp"></i> واتساب
                                </a>
                            ` : ''}
                            <button class="btn-supplier btn-icon-supplier"
                                    type="button"
                                    data-action="share"
                                    data-supplier-id="${escapeHtml(s.id)}"
                                    data-supplier-name="${escapeHtml(name)}"
                                    aria-label="مشاركة">
                                <i class="fas fa-share-alt"></i>
                            </button>
                        </div>
                    </div>
                </article>
            `;
        };

        const updateResultsCount = () => {
            const el = document.getElementById('resultsCount');
            if (!el) return;
            if (state.total === 0) {
                el.innerHTML = `<i class="fas fa-info-circle"></i> <span>لا توجد نتائج</span>`;
                return;
            }
            el.innerHTML = `<i class="fas fa-truck"></i> <span>عرض <strong>${state.suppliers.length.toLocaleString('ar-EG')}</strong> من أصل <strong>${state.total.toLocaleString('ar-EG')}</strong> مورد</span>`;
        };

        // ============================================================
        // SUGGESTIONS
        // ============================================================
        const loadSuggestions = async () => {
            try {
                const { data } = await supabase
                    .from('profiles')
                    .select('id, full_name, company_name, city')
                    .eq('user_type', 'supplier')
                    .limit(300);

                state.suggestions = data || [];
                console.log(`✅ Loaded ${state.suggestions.length} suggestions`);
            } catch (e) {
                state.suggestions = [];
            }
        };

        const highlightMatch = (text, query) => {
            if (!text || !query) return escapeHtml(text);
            const safeText = escapeHtml(text);
            const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            try {
                return safeText.replace(new RegExp(`(${safeQuery})`, 'gi'), '<span class="highlight">$1</span>');
            } catch { return safeText; }
        };

        const showSuggestions = (query) => {
            const box = document.getElementById('suggestionsBox');
            if (!box) return;

            if (!query || query.length < 1) {
                box.classList.remove('show');
                return;
            }

            const lower = query.toLowerCase();
            const results = state.suggestions
                .filter(s => {
                    const name = (s.company_name || s.full_name || '').toLowerCase();
                    const city = (s.city || '').toLowerCase();
                    return name.includes(lower) || city.includes(lower);
                })
                .slice(0, 8);

            if (!results.length) {
                box.innerHTML = `<div class="suggestion-empty">🔍 لا توجد نتائج لـ "${escapeHtml(query)}"</div>`;
                box.classList.add('show');
                return;
            }

            const safeQuery = escapeHtml(query);
            let html = `
                <div class="suggestion-item suggestion-view-all" data-action="view-all" data-query="${safeQuery}" role="option">
                    <span class="text">🔍 عرض كل النتائج لـ "<span class="highlight">${safeQuery}</span>"</span>
                    <span class="badge">${results.length}</span>
                </div>
            `;

            results.forEach(s => {
                const name = s.company_name || s.full_name || 'مورد';
                const city = s.city ? `<span class="sub-text"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(s.city)}</span>` : '';
                html += `
                    <div class="suggestion-item" data-supplier-id="${escapeHtml(s.id)}" role="option">
                        <span class="text">${highlightMatch(name, query)}</span>
                        ${city}
                    </div>
                `;
            });

            box.innerHTML = html;
            box.classList.add('show');
            state.selectedSuggestionIndex = -1;
        };

        const hideSuggestions = () => {
            document.getElementById('suggestionsBox')?.classList.remove('show');
            state.selectedSuggestionIndex = -1;
        };

        const navigateSuggestions = (direction) => {
            const box = document.getElementById('suggestionsBox');
            if (!box?.classList.contains('show')) return;
            const items = box.querySelectorAll('.suggestion-item');
            if (!items.length) return;
            items.forEach(el => el.classList.remove('active'));
            if (direction === 'down') {
                state.selectedSuggestionIndex = Math.min(state.selectedSuggestionIndex + 1, items.length - 1);
            } else {
                state.selectedSuggestionIndex = Math.max(state.selectedSuggestionIndex - 1, 0);
            }
            if (state.selectedSuggestionIndex >= 0) {
                items[state.selectedSuggestionIndex].classList.add('active');
                items[state.selectedSuggestionIndex].scrollIntoView({ block: 'nearest' });
            }
        };

        const selectCurrentSuggestion = () => {
            const box = document.getElementById('suggestionsBox');
            if (!box?.classList.contains('show')) return;
            const items = box.querySelectorAll('.suggestion-item');
            if (!items.length) return;
            const idx = state.selectedSuggestionIndex >= 0 ? state.selectedSuggestionIndex : 0;
            items[idx]?.click();
        };

        // ============================================================
        // SEARCH
        // ============================================================
        const performSearch = () => {
            const input = document.getElementById('searchInput');
            state.search = sanitizeSearch(input?.value || '');
            hideSuggestions();
            resetAndLoad();
        };

        const initSearch = () => {
            const input = document.getElementById('searchInput');
            const btn = document.getElementById('searchBtn');
            const clearBtn = document.getElementById('clearSearch');
            const box = document.getElementById('suggestionsBox');

            const debouncedShow = debounce((q) => showSuggestions(q), 200);

            input?.addEventListener('input', (e) => {
                const q = e.target.value.trim();
                clearBtn?.classList.toggle('visible', e.target.value.length > 0);
                if (q.length >= 1) debouncedShow(q);
                else hideSuggestions();
            });

            input?.addEventListener('focus', () => {
                const q = input.value.trim();
                if (q.length >= 1) showSuggestions(q);
            });

            input?.addEventListener('blur', () => setTimeout(hideSuggestions, 250));

            input?.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') { e.preventDefault(); navigateSuggestions('down'); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); navigateSuggestions('up'); }
                else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (box?.classList.contains('show')) selectCurrentSuggestion();
                    else performSearch();
                } else if (e.key === 'Escape') hideSuggestions();
            });

            btn?.addEventListener('click', performSearch);

            clearBtn?.addEventListener('click', () => {
                if (input) input.value = '';
                state.search = '';
                clearBtn.classList.remove('visible');
                hideSuggestions();
                resetAndLoad();
                input?.focus();
            });

            box?.addEventListener('click', (e) => {
                const item = e.target.closest('.suggestion-item');
                if (!item) return;

                if (item.dataset.action === 'view-all') {
                    const q = item.dataset.query || '';
                    if (input) input.value = q;
                    state.search = sanitizeSearch(q);
                    hideSuggestions();
                    resetAndLoad();
                } else if (item.dataset.supplierId) {
                    window.location.href = `supplier-profile.html?id=${encodeURIComponent(item.dataset.supplierId)}`;
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrapper-outer')) hideSuggestions();
            });
        };

        // ============================================================
        // FILTERS
        // ============================================================
        const initFilters = () => {
            document.getElementById('cityFilter')?.addEventListener('change', (e) => {
                state.cityFilter = e.target.value;
                resetAndLoad();
            });

            document.getElementById('verifiedFilter')?.addEventListener('change', (e) => {
                state.verifiedFilter = e.target.value;
                resetAndLoad();
            });

            document.getElementById('sortFilter')?.addEventListener('change', (e) => {
                state.sort = e.target.value;
                resetAndLoad();
            });
        };

        const resetFilters = () => {
            state.cityFilter = 'all';
            state.verifiedFilter = 'all';
            state.sort = 'products';
            state.search = '';

            const citySel = document.getElementById('cityFilter');
            if (citySel) citySel.value = 'all';
            const verifSel = document.getElementById('verifiedFilter');
            if (verifSel) verifSel.value = 'all';
            const sortSel = document.getElementById('sortFilter');
            if (sortSel) sortSel.value = 'products';
            const input = document.getElementById('searchInput');
            if (input) input.value = '';
            document.getElementById('clearSearch')?.classList.remove('visible');

            resetAndLoad();
            showToast('🔄', 'تم إعادة التعيين', 'كل الفلاتر رجعت افتراضي', null, null, 'info');
        };

        const resetAndLoad = () => {
            state.page = 0;
            state.hasMore = true;
            loadSuppliers();
        };

        // ============================================================
        // FEATURED SUPPLIERS
        // ============================================================
        const loadFeaturedSuppliers = async () => {
            try {
                console.log('⭐ Loading featured suppliers...');

                const { data: suppliers, error } = await supabase
                    .from('profiles')
                    .select('id, full_name, company_name, city, phone, whatsapp, is_verified, created_at, avatar_url')
                    .eq('user_type', 'supplier')
                    .eq('is_verified', true)
                    .limit(6);

                if (error) {
                    console.warn('❌ Featured fetch error:', error.message);
                    document.getElementById('featuredSection').style.display = 'none';
                    return;
                }

                if (!suppliers?.length) {
                    console.log('ℹ️ No verified suppliers');
                    document.getElementById('featuredSection').style.display = 'none';
                    return;
                }

                const supplierIds = suppliers.map(s => s.id);
                const productsMap = await fetchProductsForSuppliers(supplierIds);

                const enriched = suppliers
                    .map(s => ({
                        ...s,
                        productsData: productsMap[s.id] || { products: [], count: 0, totalViews: 0, featured: [] },
                    }))
                    .filter(s => s.productsData.count > 0)
                    .slice(0, 4);

                if (!enriched.length) {
                    console.log('ℹ️ No featured suppliers with products');
                    document.getElementById('featuredSection').style.display = 'none';
                    return;
                }

                console.log(`✅ Featured: ${enriched.length} suppliers`);

                const grid = document.getElementById('featuredGrid');
                const section = document.getElementById('featuredSection');
                if (section) section.style.display = 'block';
                if (grid) grid.innerHTML = enriched.map((s, i) => renderSupplierCard(s, i)).join('');

            } catch (e) {
                console.warn('❌ Featured exception:', e.message);
                const section = document.getElementById('featuredSection');
                if (section) section.style.display = 'none';
            }
        };

        // ============================================================
        // CARD ACTIONS
        // ============================================================
        const initCardActions = () => {
            document.addEventListener('click', async (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;

                const action = btn.dataset.action;

                if (action === 'share') {
                    e.preventDefault();
                    handleShare(btn.dataset.supplierId, btn.dataset.supplierName);
                } else if (action === 'whatsapp') {
                    const supplierId = btn.dataset.supplierId;
                    if (isValidUUID(supplierId) && state.user) {
                        logContact(supplierId).catch(() => {});
                    }
                }
            });
        };

        const handleShare = async (supplierId, name) => {
            const url = `${window.location.origin}/supplier-profile.html?id=${encodeURIComponent(supplierId)}`;
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: name || 'مورد',
                        text: `تحقق من ${name || 'هذا المورد'} على كيماتو`,
                        url,
                    });
                    return;
                } catch (e) { if (e.name === 'AbortError') return; }
            }
            try {
                await navigator.clipboard.writeText(url);
                showToast('📋', 'تم النسخ!', `تم نسخ رابط ${name || 'المورد'}`, null, null, 'success');
            } catch {
                showToast('⚠️', 'خطأ', 'تعذر نسخ الرابط', null, null, 'error');
            }
        };

        const logContact = async (supplierId) => {
            if (!state.user || !isValidUUID(supplierId)) return;
            try {
                await supabase.from('supplier_contacts').insert({
                    supplier_id: supplierId,
                    buyer_id: state.user.id,
                    contact_type: 'whatsapp',
                    contact_data: { page: window.location.pathname, timestamp: new Date().toISOString() },
                });
            } catch (e) { /* silent */ }
        };

        // ============================================================
        // INFINITE SCROLL
        // ============================================================
        const initInfiniteScroll = () => {
            const sentinel = document.getElementById('infiniteSentinel');
            if (!sentinel || !('IntersectionObserver' in window)) return;

            let isLoading = false;
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !isLoading && state.hasMore && !state.loading) {
                    isLoading = true;
                    state.page += 1;
                    loadSuppliers({ append: true }).finally(() => { isLoading = false; });
                }
            }, { rootMargin: '400px' });

            observer.observe(sentinel);
        };

        // ============================================================
        // SCROLL TOP
        // ============================================================
        const initScrollTop = () => {
            const btn = document.getElementById('scrollTopBtn');
            if (!btn) return;
            const onScroll = () => btn.classList.toggle('visible', window.scrollY > 400);
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        };

        // ============================================================
        // REALTIME
        // ============================================================
        const setupRealtime = () => {
            if (state.channel) supabase.removeChannel(state.channel);
            try {
                state.channel = supabase
                    .channel('suppliers_realtime')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'profiles',
                    }, (payload) => {
                        if (payload.new?.user_type === 'supplier') {
                            const name = payload.new.company_name || payload.new.full_name || 'مورد جديد';
                            showToast('🏭', 'مورد جديد!', `انضم: ${name}`, 'عرض', 'chemato-suppliers.html', 'success');
                            loadStats();
                            loadSuppliers();
                        }
                    })
                    .subscribe();
            } catch (e) { /* silent */ }
        };

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        const initKeyboardShortcuts = () => {
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    document.getElementById('searchInput')?.focus();
                }
                if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                    e.preventDefault();
                    document.getElementById('searchInput')?.focus();
                }
                if (e.key === 'Escape') {
                    hideSuggestions();
                    document.querySelector('.dropdown-content')?.classList.remove('show');
                }
            });
        };

        // ============================================================
        // READ URL
        // ============================================================
        const readURL = () => {
            const params = new URLSearchParams(window.location.search);
            state.search = sanitizeSearch(params.get('search') || '');
            state.cityFilter = params.get('city') || 'all';
            state.verifiedFilter = params.get('verified') || 'all';
            state.sort = params.get('sort') || 'products';

            const input = document.getElementById('searchInput');
            if (input && state.search) input.value = state.search;

            const citySel = document.getElementById('cityFilter');
            if (citySel && state.cityFilter !== 'all') citySel.value = state.cityFilter;
            const verifSel = document.getElementById('verifiedFilter');
            if (verifSel && state.verifiedFilter !== 'all') verifSel.value = state.verifiedFilter;
            const sortSel = document.getElementById('sortFilter');
            if (sortSel && state.sort !== 'products') sortSel.value = state.sort;
        };

        // ============================================================
        // INIT
        // ============================================================
        const init = async () => {
            console.log('🚀 كيماتو | الموردين');

            initTheme();
            initNavbar();
            initReadingProgress();
            initSearch();
            initFilters();
            initCardActions();
            initInfiniteScroll();
            initScrollTop();
            initKeyboardShortcuts();

            readURL();

            await Promise.all([
                checkUser(),
                loadStats(),
                loadCities(),
                loadSuggestions(),
            ]);

            await Promise.all([
                loadFeaturedSuppliers(),
                loadSuppliers(),
            ]);

            setupRealtime();

            setTimeout(() => {
                if (state.total > 0) {
                    showToast('👋', 'أهلاً بك!', `${state.total} مورد متاح على كيماتو`, null, null, 'info');
                }
            }, 1500);

            console.log('✅ جاهز');
        };

        supabase.auth.onAuthStateChange(async () => {
            await checkUser();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
            }
        }
    </style>
</head>
