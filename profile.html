<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>كيماتو | الملف الشخصي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0c2d4a;
            --primary: #1a4a6e;
            --primary-light: #2d7a9e;
            --accent: #3498db;
            --accent-dark: #2c81ba;
            --gray-light: #f8fafc;
            --gray: #e2e8f0;
            --gray-dark: #64748b;
            --text-dark: #0c2d4a;
            --text-light: #475569;
            --white: #ffffff;
            --danger: #e53e3e;
            --success: #2a9d8f;
            --warning: #f4a261;
            --shadow-sm: 0 4px 12px rgba(12,45,74,0.05);
            --shadow-md: 0 10px 25px rgba(12,45,74,0.08);
            --shadow-lg: 0 20px 40px rgba(12,45,74,0.12);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2eaf2 100%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* ========== الهيدر ========== */
        .navbar {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(12,45,74,0.25);
            border-bottom: 2px solid rgba(52,152,219,0.30);
        }

        .logo a {
            text-decoration: none;
        }

        .logo-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 22px;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #3498db;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(52,152,219,0.35);
        }

        .logo-text span:first-child { color: #3498db; }
        .logo-text span:last-child { color: #b0c9d9; font-size: 16px; }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
        }

        .nav-links a:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        .nav-links a.active {
            background: #3498db;
            color: white;
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        /* ========== القائمة المنسدلة ========== */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 14px;
            font-family: inherit;
        }

        .dropdown-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            min-width: 200px;
            box-shadow: 0 24px 56px rgba(0,0,0,0.12);
            border-radius: 20px;
            z-index: 1000;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid rgba(52,152,219,0.15);
        }

        .dropdown-content.show {
            display: block;
            animation: dropFade 0.25s ease;
        }

        @keyframes dropFade {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .dropdown-content a {
            color: var(--text-dark);
            padding: 14px 22px;
            text-decoration: none;
            display: block;
            transition: 0.2s;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid var(--gray);
        }

        .dropdown-content a:hover {
            background: #ebf5fb;
            color: var(--primary);
        }

        .dropdown-content .logout-item {
            color: var(--danger);
            border-top: 1px solid var(--gray);
        }

        .dropdown-content .logout-item:hover {
            background: #fee2e2;
        }

        /* ========== المحتوى الرئيسي ========== */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* ===== بطاقة البروفايل ===== */
        .profile-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(12,45,74,0.06);
            border: 1px solid rgba(52,152,219,0.06);
        }

        /* ===== رأس البروفايل ===== */
        .profile-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 35px 30px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .profile-header::after {
            content: "👤";
            position: absolute;
            font-size: 12rem;
            opacity: 0.04;
            left: -20px;
            bottom: -60px;
        }

        .profile-avatar {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            object-fit: cover;
            border: 4px solid #3498db;
            background: var(--white);
            box-shadow: 0 8px 24px rgba(52,152,219,0.25);
        }

        @media (min-width: 768px) {
            .avatar-img {
                width: 150px;
                height: 150px;
                border-radius: 75px;
            }
        }

        .avatar-upload {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: linear-gradient(145deg, #3498db, #2c81ba);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid var(--white);
            box-shadow: 0 4px 16px rgba(52,152,219,0.30);
        }

        @media (min-width: 768px) {
            .avatar-upload {
                width: 42px;
                height: 42px;
                bottom: 8px;
                right: 8px;
            }
        }

        .avatar-upload:hover {
            background: var(--primary-dark);
            transform: scale(1.08);
        }

        .avatar-upload i {
            color: white;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .avatar-upload i {
                font-size: 16px;
            }
        }

        #avatarInput {
            display: none;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 768px) {
            .profile-name {
                font-size: 1.8rem;
            }
        }

        .profile-type {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            position: relative;
            z-index: 1;
        }

        /* ===== محتوى البروفايل ===== */
        .profile-content {
            padding: 30px;
        }

        @media (min-width: 768px) {
            .profile-content {
                padding: 35px;
            }
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        @media (min-width: 768px) {
            .section-title {
                font-size: 1.3rem;
            }
        }

        .section-title i {
            color: #3498db;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 640px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .form-group {
            margin-bottom: 5px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        label i {
            color: #3498db;
            margin-left: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--gray);
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--gray-light);
            font-family: inherit;
        }

        @media (min-width: 768px) {
            input, textarea {
                padding: 14px 18px;
                font-size: 1rem;
            }
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(52,152,219,0.10);
        }

        textarea {
            border-radius: 24px;
            resize: vertical;
            min-height: 80px;
        }

        input[readonly] {
            background: var(--gray);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ===== أزرار ===== */
        .btn-save {
            background: linear-gradient(145deg, #3498db, #2c81ba);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 16px rgba(52,152,219,0.30);
        }

        @media (min-width: 768px) {
            .btn-save {
                padding: 16px 35px;
                font-size: 1.1rem;
            }
        }

        .btn-save:hover {
            background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(26,74,110,0.35);
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== رسائل ===== */
        .message {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 700;
            text-align: center;
        }

        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border-right: 4px solid #22543d;
        }

        .message.error {
            background: #fed7d7;
            color: #742a2a;
            border-right: 4px solid #742a2a;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
            border-right: 4px solid #1e40af;
        }

        /* ===== تحميل ===== */
        .loading {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray);
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: var(--gray-dark);
            font-weight: 600;
        }

        /* ===== الفوتر ===== */
        .footer {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            color: white;
            text-align: center;
            padding: 35px 20px;
            margin-top: 60px;
            border-top: 4px solid #3498db;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            font-size: 14px;
        }

        .footer-links a:hover {
            color: white;
            transform: translateY(-3px);
        }

        /* ===== استجابة ===== */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 14px 20px;
            }
            
            .logo-content {
                font-size: 18px;
            }
            
            .logo-img {
                width: 40px;
                height: 40px;
            }
            
            .nav-links {
                justify-content: center;
            }
            
            .nav-links a {
                padding: 6px 14px;
                font-size: 12px;
            }
            
            .container {
                padding: 0 16px;
                margin: 20px auto;
            }
            
            .profile-header {
                padding: 25px 20px;
            }
            
            .avatar-img {
                width: 100px;
                height: 100px;
            }
            
            .profile-name {
                font-size: 1.2rem;
            }
            
            .profile-content {
                padding: 20px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .btn-save {
                width: 100%;
                justify-content: center;
            }
            
            .dropdown-content {
                left: auto;
                right: 0;
            }
        }

        @media (max-width: 480px) {
            .avatar-img {
                width: 80px;
                height: 80px;
            }
            
            .avatar-upload {
                width: 30px;
                height: 30px;
                bottom: 2px;
                right: 2px;
            }
            
            .avatar-upload i {
                font-size: 12px;
            }
            
            .profile-name {
                font-size: 1rem;
            }
            
            .profile-type {
                font-size: 11px;
                padding: 4px 14px;
            }
            
            .section-title {
                font-size: 1rem;
            }
            
            input, textarea {
                padding: 12px 14px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <a href="index.html" style="text-decoration:none;">
            <div class="logo-content">
                <img src="709548215_2209434319875128_7640925248715427952_n.jpg"
                     class="logo-img" alt="كيماتو">

                <img id="avatarPreview" class="avatar-img" src="https://placehold.co/150x150?text=👤" alt="صورة شخصية">

                <div class="spinner"></div>
                <p>⏳ جاري تحميل البيانات...</p>
            </div>

            <form id="profileForm" style="display: none;">
                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> الاسم كاملاً</label>
                        <input type="text" id="fullName" required placeholder="أدخل اسمك كاملاً">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-building"></i> اسم الشركة</label>
                        <input type="text" id="companyName" placeholder="اختياري للموردين">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> رقم الهاتف</label>
                        <input type="tel" id="phone" placeholder="01234567890">

                    <div class="form-group">
                        <label><i class="fab fa-whatsapp"></i> رقم واتساب</label>

                    <div class="form-group">

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                        <input type="email" id="email" readonly placeholder="البريد الإلكتروني">
                    </div>
                    <div class="form-group full-width">
                        <label><i class="fas fa-map-marker-alt"></i> العنوان التفصيلي</label>
                        <textarea id="address" rows="2" placeholder="المنطقة - الشارع - رقم المبنى"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-save" id="submitBtn">

            </form>

            <div id="messageDiv"></div>
        </div>
    </div>
</div>

        <a href="index.html">الرئيسية</a>

</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let currentUser = null
    let currentProfile = null
    let selectedAvatarFile = null

    // ========== عناصر DOM ==========
    const loadingDiv = document.getElementById('loading')
    const form = document.getElementById('profileForm')
    const messageDiv = document.getElementById('messageDiv')
    const submitBtn = document.getElementById('submitBtn')

    // ========== القائمة المنسدلة ==========
    function setupDropdown() {
        const dropdownBtn = document.querySelector('.dropdown-btn')
        const dropdownContent = document.getElementById('dropdownContent')
        
        if (dropdownBtn && dropdownContent) {
            dropdownBtn.addEventListener('click', (e) => {
                e.stopPropagation()
                dropdownContent.classList.toggle('show')
            })
            document.addEventListener('click', () => {
                dropdownContent.classList.remove('show')
            })
        }
    }

    async function updateDropdownContent() {
        const { data: { user } } = await supabase.auth.getUser()
        currentUser = user
        const dropdownContent = document.getElementById('dropdownContent')
        
        if (user) {
            dropdownContent.innerHTML = `
                <a href="profile.html"><i class="fas fa-user"></i> الملف الشخصي</a>
                <a href="#" id="logoutLink" class="logout-item"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
            `
            const logoutLink = document.getElementById('logoutLink')
            if (logoutLink) {
                logoutLink.onclick = async (e) => {
                    e.preventDefault()
                    await supabase.auth.signOut()
                    window.location.href = 'index.html'
                }
            }
        } else {
            dropdownContent.innerHTML = `
                <a href="auth.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
                <a href="auth.html"><i class="fas fa-user-plus"></i> حساب جديد</a>
                <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> للموردين</a>
                <a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> للعملاء</a>
            `
        }
    }

    // ========== رفع الصورة ==========
    const avatarUploadBtn = document.getElementById('avatarUploadBtn')
    const avatarInput = document.getElementById('avatarInput')
    const avatarPreview = document.getElementById('avatarPreview')

    avatarUploadBtn.addEventListener('click', () => {
        avatarInput.click()
    })

    avatarInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            // التحقق من حجم الملف (5 ميجابايت)
            if (e.target.files[0].size > 5 * 1024 * 1024) {
                alert('⚠️ حجم الصورة يتجاوز 5 ميجابايت. يرجى اختيار صورة أصغر.')
                avatarInput.value = ''
                return
            }
            
            selectedAvatarFile = e.target.files[0]
            const reader = new FileReader()
            reader.onload = (event) => {
                avatarPreview.src = event.target.result
            }
            reader.readAsDataURL(selectedAvatarFile)
        }
    })

    // ========== رفع الصورة إلى Supabase Storage ==========
    async function uploadAvatar(userId, file) {
        const fileExt = file.name.split('.').pop()
        const fileName = `avatar_${userId}_${Date.now()}.${fileExt}`
        
        const { error: uploadError } = await supabase.storage
            .from('avatars')
            .upload(fileName, file)

        if (uploadError) {
            console.error('خطأ في رفع الصورة:', uploadError)
            return null
        }

        const { data: urlData } = supabase.storage
            .from('avatars')
            .getPublicUrl(fileName)

        return urlData.publicUrl
    }

    // ========== تحميل البيانات ==========
    async function loadProfile() {
        const { data: { user } } = await supabase.auth.getUser()
        if (!user) {
            window.location.href = 'auth.html'
            return
        }
        currentUser = user

        const { data: profile, error } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single()
        
        if (error) {
            console.error('خطأ في جلب البيانات:', error)
        }
        
        currentProfile = profile

        // تعيين رابط لوحة التحكم
        const dashboardLink = document.getElementById('dashboardLink')
        if (profile?.user_type === 'supplier') {
            dashboardLink.href = 'supplier-dashboard.html'
            dashboardLink.innerHTML = '<i class="fas fa-warehouse"></i> لوحة المورد'
        } else if (profile?.user_type === 'buyer') {
            dashboardLink.href = 'buyer-dashboard.html'
            dashboardLink.innerHTML = '<i class="fas fa-shopping-cart"></i> لوحة العميل'
        } else {
            dashboardLink.href = '#'
            dashboardLink.innerHTML = '<i class="fas fa-tachometer-alt"></i> لوحة التحكم'
        }

        // عرض البيانات
        document.getElementById('displayName').innerText = profile?.full_name || 'مستخدم'
        
        const typeMap = {
            'supplier': '🏭 مورد',
            'buyer': '🛒 عميل'
        }
        document.getElementById('userTypeBadge').innerText = typeMap[profile?.user_type] || 'مستخدم'
        
        document.getElementById('fullName').value = profile?.full_name || ''
        document.getElementById('companyName').value = profile?.company_name || ''
        document.getElementById('phone').value = profile?.phone || ''
        document.getElementById('whatsapp').value = profile?.whatsapp || ''
        document.getElementById('city').value = profile?.city || ''
        document.getElementById('address').value = profile?.address || ''
        document.getElementById('email').value = user.email || ''

        // عرض الصورة إذا وجدت
        if (profile?.avatar_url) {
            avatarPreview.src = profile.avatar_url
        }

        // إخفاء التحميل وإظهار الفورم
        loadingDiv.classList.remove('show')
        loadingDiv.style.display = 'none'
        form.style.display = 'block'
    }

    // ========== حفظ البيانات ==========
    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        messageDiv.innerHTML = ''
        loadingDiv.classList.add('show')
        loadingDiv.style.display = 'block'
        submitBtn.disabled = true

        const fullName = document.getElementById('fullName').value.trim()
        const companyName = document.getElementById('companyName').value.trim()
        const phone = document.getElementById('phone').value.trim()
        const whatsapp = document.getElementById('whatsapp').value.trim()
        const city = document.getElementById('city').value.trim()
        const address = document.getElementById('address').value.trim()

        if (!fullName) {
            messageDiv.innerHTML = '<div class="message error">❌ الاسم كاملاً مطلوب</div>'
            loadingDiv.classList.remove('show')
            loadingDiv.style.display = 'none'
            submitBtn.disabled = false
            return
        }

        let avatarUrl = currentProfile?.avatar_url

        // رفع الصورة الجديدة إن وجدت
        if (selectedAvatarFile) {
            const uploadedUrl = await uploadAvatar(currentUser.id, selectedAvatarFile)
            if (uploadedUrl) {
                avatarUrl = uploadedUrl
            }
        }

        const { error } = await supabase
            .from('profiles')
            .update({
                full_name: fullName,
                company_name: companyName || null,
                phone: phone || null,
                whatsapp: whatsapp || null,
                city: city || null,
                address: address || null,
                avatar_url: avatarUrl
            })
            .eq('id', currentUser.id)

        loadingDiv.classList.remove('show')
        loadingDiv.style.display = 'none'
        submitBtn.disabled = false

        if (error) {
            messageDiv.innerHTML = `<div class="message error">❌ ${error.message}</div>`
        } else {
            messageDiv.innerHTML = '<div class="message success">✅ تم تحديث الملف الشخصي بنجاح!</div>'
            document.getElementById('displayName').innerText = fullName
            // تحديث الصورة إذا تم تغييرها
            if (avatarUrl) {
                avatarPreview.src = avatarUrl
            }
            setTimeout(() => {
                messageDiv.innerHTML = ''
            }, 3000)
        }
    })

    // ========== بدء التشغيل ==========
    setupDropdown()
    updateDropdownContent()
    loadProfile()
</script>
</body>
</html>
