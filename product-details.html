            --accent: #3498db;

            --gray-light: #f8fafc;
            --gray: #e2e8f0;
            --gray-dark: #64748b;

            --danger: #e53e3e;
            --whatsapp: #25D366;

            --shadow-lg: 0 20px 40px rgba(12,45,74,0.12);

            --radius-lg: 32px;
        }

            }

            .navbar { background: #0a1a2a !important; }
            .product-card { background: #16213e !important; border-color: #0f3460 !important; }
            .product-title h1 { color: #e0e0e0 !important; }

            .product-price { background: linear-gradient(145deg, #b8860b, #d4880f) !important; }
            .details-section { background: #1a2a3a !important; border-color: #0f3460 !important; }
            .section-title { color: #e0e0e0 !important; border-bottom-color: #0f3460 !important; }
            .section-title i { color: #7ec8e3 !important; }

            .detail-value { color: #a0aec0 !important; }
            .supplier-section { background: #1a2a3a !important; border-color: #0f3460 !important; }
            .supplier-section h3 { color: #e0e0e0 !important; }
            .supplier-info-item { background: #16213e !important; border-color: #0f3460 !important; }
            .supplier-info-item i { background: linear-gradient(145deg, #3498db, #2c81ba) !important; }
            .supplier-info-item .info-text { color: #a0aec0 !important; }
            .product-img-placeholder { background: linear-gradient(145deg, #1a2a3a, #0f1f2f) !important; color: #7ec8e3 !important; }
            .product-img-placeholder span { background: #0a1a2a !important; color: #e0e0e0 !important; }
            .back-link { background: #16213e !important; border-color: #0f3460 !important; color: #7ec8e3 !important; }
            .back-link:hover { background: linear-gradient(145deg, #3498db, #2c81ba) !important; color: white !important; }
            .dropdown-content { background: #16213e !important; border-color: #0f3460 !important; }
            .dropdown-content a { color: #e0e0e0 !important; border-bottom-color: #1a2a3a !important; }
            .dropdown-content a:hover { background: #1a2a3a !important; }
            .dropdown-content .logout-item { border-top-color: #1a2a3a !important; }
            .footer { background: #0a1a2a !important; }
            .footer-links a { color: #5a9bc7 !important; }
            .footer-links a:hover { color: #fff !important; }
            .loader { background: #16213e !important; color: #a0aec0 !important; }
            .error-box { background: #16213e !important; }
            .error-box h2 { color: #e0e0e0 !important; }
            .error-box p { color: #a0aec0 !important; }
            .similar-products-section h3 { color: #e0e0e0 !important; }
            .similar-product-card { background: #16213e !important; border-color: #0f3460 !important; }
            .similar-product-card .name { color: #e0e0e0 !important; }

            .review-form textarea::placeholder { color: #6a7a8a; }

            .review-form select option { background: #1a2a3a; }

            .review-type-badge.product { background: #2a2a1a !important; color: #f1c40f !important; }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2eaf2 100%);
            min-height: 100vh;
            color: var(--text-dark);
            transition: background 0.3s, color 0.3s;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes dropFade {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .navbar {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(12,45,74,0.25);
            border-bottom: 2px solid rgba(52,152,219,0.30);
        }

        .logo a {
            text-decoration: none;
        }

        .logo-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 22px;
        }

        .logo-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #3498db;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(52,152,219,0.35);
        }

        .logo-text span:first-child { color: #3498db; }
        .logo-text span:last-child { color: #b0c9d9; font-size: 16px; }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 7px 18px;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
        }

        .nav-links a:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 7px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 14px;
            font-family: inherit;
        }

        .dropdown-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            min-width: 200px;
            box-shadow: 0 24px 56px rgba(0,0,0,0.12);
            border-radius: 20px;
            z-index: 1000;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid rgba(52,152,219,0.15);
        }

        .dropdown-content.show {
            display: block;
            animation: dropFade 0.25s ease;
        }

        .dropdown-content a {
            color: var(--text-dark);
            padding: 12px 22px;
            text-decoration: none;
            display: block;
            transition: 0.2s;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid var(--gray);
        }

        .dropdown-content a:hover {
            background: #ebf5fb;
            color: var(--primary);
        }

        .dropdown-content .logout-item {
            color: var(--danger);
            border-top: 1px solid var(--gray);
        }

        .dropdown-content .logout-item:hover {
            background: #fee2e2;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(52,152,219,0.06);
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }

        .product-gallery {
            background: linear-gradient(145deg, #e6edf4, #f0f6fb);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        @media (min-width: 640px) {
            .product-gallery { min-height: 320px; }
        }
        @media (min-width: 1024px) {
            .product-gallery { min-height: 400px; }
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            padding: 20px;
            transition: transform 0.3s ease;
        }
        @media (min-width: 640px) {
            .product-img { height: 320px; padding: 30px; }
        }
        @media (min-width: 1024px) {
            .product-img { height: 400px; padding: 40px; }
        }
        .product-img:hover {
            transform: scale(1.02);
        }

        .product-img-placeholder {
            width: 100%;
            height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            color: #1a4a6e;
            background: linear-gradient(145deg, #dce8f0, #eef4f8);
            padding: 20px;
            text-align: center;
        }
        @media (min-width: 640px) {
            .product-img-placeholder { height: 320px; font-size: 7rem; }
        }
        @media (min-width: 1024px) {
            .product-img-placeholder { height: 400px; font-size: 8rem; }
        }
        .product-img-placeholder span {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0c2d4a;
            background: rgba(255,255,255,0.88);
            padding: 8px 24px;
            border-radius: 40px;
            margin-top: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .product-info {
            padding: 24px;
        }
        @media (min-width: 768px) {
            .product-info { padding: 35px; }
        }

        .product-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .product-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-start;
            }
        }

        .product-title h1 {
            color: var(--primary-dark);
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 800;
        }
        @media (min-width: 768px) {
            .product-title h1 { font-size: 2rem; }
        }

        .product-category {
            display: inline-block;
            background: #ecf3f8;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #1a4a6e;
        }
        @media (min-width: 768px) {
            .product-category { font-size: 14px; padding: 6px 20px; }
        }

        .product-price {
            background: linear-gradient(145deg, #d4880f, #f0a030);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 800;
            font-size: 1.3rem;
            text-align: center;
            display: inline-block;
            box-shadow: 0 4px 16px rgba(212,136,15,0.25);
        }
        @media (min-width: 768px) {
            .product-price { font-size: 1.8rem; padding: 12px 25px; }
        }

        .price-alert-btn {
            background: rgba(52,152,219,0.08);
            border: 1px solid rgba(52,152,219,0.2);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #3498db;
            font-weight: 600;
            transition: 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-right: 8px;
            vertical-align: middle;
        }
        .price-alert-btn:hover {
            background: #3498db;
            color: #fff;
            border-color: #3498db;
        }
        .price-alert-btn.active {
            background: #2ecc71;
            color: #fff;
            border-color: #2ecc71;
        }

        .details-section {
            margin: 25px 0;
            background: var(--gray-light);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid rgba(52,152,219,0.06);
        }
        @media (min-width: 768px) {
            .details-section { padding: 25px; }
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }
        @media (min-width: 768px) {
            .section-title { font-size: 1.3rem; margin-bottom: 20px; }
        }
        .section-title i { color: #3498db; }

        .detail-row {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray);
        }
        @media (min-width: 640px) {
            .detail-row { flex-direction: row; }
        }
        .detail-label {
            font-weight: 700;
            color: var(--text-dark);
            width: 100%;
            margin-bottom: 5px;
        }
        @media (min-width: 640px) {
            .detail-label { width: 140px; margin-bottom: 0; }
        }
        .detail-value {
            color: var(--text-light);
            flex: 1;
        }

        .supplier-section {
            background: linear-gradient(145deg, #eef2f7, #e6edf4);
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 25px 0;
            border: 1px solid rgba(52,152,219,0.08);
            position: relative;
            overflow: hidden;
        }

        .supplier-section::before {
            content: '🏭';
            position: absolute;
            font-size: 6rem;
            opacity: 0.03;
            left: -10px;
            bottom: -20px;
        }

        @media (min-width: 768px) {
            .supplier-section { padding: 25px; }
        }

        .supplier-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .supplier-section h3 {
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
        }
        @media (min-width: 768px) {
            .supplier-section h3 { font-size: 1.3rem; }
        }
        .supplier-section h3 i { color: #3498db; }

        .supplier-rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(241, 196, 15, 0.12);
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 700;
            color: #f39c12;
            font-size: 0.9rem;
        }
        .supplier-rating-badge i {
            color: #f1c40f !important;
        }
        .supplier-rating-badge .count {
            font-weight: 400;
            font-size: 0.75rem;
            color: var(--gray-dark);
        }

        .supplier-info {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 640px) {
            .supplier-info { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        }
        @media (min-width: 1024px) {
            .supplier-info { grid-template-columns: repeat(3, 1fr); }
        }

        .supplier-info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--white);
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
            border: 1px solid rgba(52,152,219,0.06);
            text-decoration: none;
            color: inherit;
            cursor: default;
            position: relative;
            z-index: 1;
        }
        .supplier-info-item:hover {
            transform: translateX(-5px);
            border-color: #3498db;
            box-shadow: var(--shadow-sm);
        }
        .supplier-info-item i {
            width: 35px;
            height: 35px;
            background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        @media (min-width: 768px) {
            .supplier-info-item i { width: 40px; height: 40px; font-size: 16px; }
        }
        .supplier-info-item .info-text {
            font-size: 14px;
            color: var(--text-light);
            word-break: break-word;
        }
        @media (min-width: 768px) {
            .supplier-info-item .info-text { font-size: 15px; }
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }
        @media (min-width: 640px) {
            .action-buttons { flex-direction: row; gap: 15px; }
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-family: inherit;
            min-height: 54px;
        }
        @media (min-width: 768px) {
            .btn { padding: 16px 24px; font-size: 1.05rem; min-height: 60px; }
        }

        .btn-whatsapp {
            background: linear-gradient(145deg, #25D366, #128C7E);
            color: white;
            box-shadow: 0 4px 16px rgba(37,211,102,0.25);
        }
        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(37,211,102,0.35);
        }
        .btn-whatsapp i { font-size: 1.4rem; }

        .btn-call {
            background: linear-gradient(145deg, #3498db, #2c81ba);
            color: white;
            box-shadow: 0 4px 16px rgba(52,152,219,0.25);
        }
        .btn-call:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(52,152,219,0.35);
        }

        toast.innerHTML = `

            <div class="content">

        const toggle = document.getElementById('dropdownToggle')

                e.stopPropagation()
                content.classList.toggle('show')
            })
            document.addEventListener('click', () => content.classList.remove('show'))
        }
    }

    // ========== PRICE ALERT ==========
    window.setPriceAlert = async function(productId, productName, targetPrice) {
        try {
            if (!currentUser) {
                showToast('🔒', 'تسجيل الدخول مطلوب', 'يرجى تسجيل الدخول لتفعيل تنبيه السعر', 'warning')
                window.location.href = 'auth.html'
                return
            }

            const { data: existing } = await supabase
                .from('price_alerts')
                .select('id')
                .eq('product_id', productId)
                .eq('user_id', currentUser.id)
                .eq('active', true)
                .single()

            if (existing) {
                await supabase
                    .from('price_alerts')
                    .update({ active: false })
                    .eq('id', existing.id)
                showToast('🔕', 'تم إلغاء التنبيه', `لن يتم إعلامك عند انخفاض سعر ${productName}`, 'success')
                isPriceAlertActive = false
                const alertBtn = document.querySelector('.price-alert-btn')
                if (alertBtn) {
                    alertBtn.classList.remove('active')
                    alertBtn.innerHTML = `<i class="fas fa-bell"></i> تفعيل تنبيه السعر`
                }
                return
            }

            await supabase
                .from('price_alerts')
                .insert({
                    product_id: productId,
                    user_id: currentUser.id,
                    target_price: targetPrice || 0,
                    active: true
                })
            showToast('🔔', 'تم تفعيل التنبيه!', `سيتم إعلامك عند انخفاض سعر ${productName}`, 'success')
            isPriceAlertActive = true
            const alertBtn = document.querySelector('.price-alert-btn')
            if (alertBtn) {
                alertBtn.classList.add('active')
                alertBtn.innerHTML = `<i class="fas fa-bell-slash"></i> إلغاء التنبيه`
            }
        } catch (e) {
            console.error('Error setting price alert:', e)
            showToast('⚠️', 'حدث خطأ', 'لم نتمكن من تفعيل التنبيه، حاول مرة أخرى', 'error')
        }
    }

    // ========== SUBMIT REVIEW ==========
    window.submitReview = async function() {
        if (!currentUser) {
            showToast('🔒', 'تسجيل الدخول مطلوب', 'يرجى تسجيل الدخول لإضافة تقييم', 'warning')
            window.location.href = 'auth.html'
            return
        }

        const ratingEl = document.getElementById('reviewRating')
        const commentEl = document.getElementById('reviewComment')
        const typeEl = document.getElementById('reviewType')

        if (!ratingEl || !commentEl) {
            showToast('⚠️', 'خطأ', 'حدث خطأ في النموذج، حاول مرة أخرى', 'error')
            return
        }

        const rating = ratingEl.value
        const comment = commentEl.value.trim()
        const reviewType = typeEl?.value || 'product'
        const productData = window.__productData

        if (!rating || !comment) {
            showToast('⚠️', 'بيانات ناقصة', 'يرجى اختيار التقييم وكتابة التعليق', 'error')
            return
        }

        try {
            const { error } = await supabase
                .from('reviews')
                .insert({
                    product_id: productId,
                    supplier_id: productData?.supplier_id || null,
                    user_id: currentUser.id,
                    rating: parseInt(rating),
                    comment: comment,
                    review_type: reviewType
                })

            if (error) throw error

            showToast('✅', 'تم إضافة التقييم!', 'شكراً لتقييمك للمنتج', 'success')
            const form = document.getElementById('reviewForm')
            if (form) form.classList.remove('show')
            if (commentEl) commentEl.value = ''
            if (ratingEl) ratingEl.value = '5'
            
            // Reload reviews
            await loadReviews(productId)
        } catch (e) {
            console.error('Error submitting review:', e)
            showToast('⚠️', 'حدث خطأ', 'لم نتمكن من إضافة التقييم، حاول مرة أخرى', 'error')
        }
    }

    // ========== LOAD REVIEWS (المعدلة) ==========
    async function loadReviews(productId) {
        const container = document.getElementById('reviewsContainer')
        if (!container) {
            console.error('reviewsContainer not found')
            return
        }

        try {
            console.log('🔍 جاري تحميل التقييمات للمنتج:', productId)
            
            const { data, error } = await supabase
                .from('reviews')
                .select('*, profiles(full_name)')
                .eq('product_id', productId)
                .order('created_at', { ascending: false })

            if (error) {
                console.error('❌ خطأ في جلب التقييمات:', error)
                container.innerHTML = `
                    <div class="no-reviews">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>حدث خطأ في تحميل التقييمات: ${error.message}</p>
                    </div>
                `
                return
            }

            console.log('✅ تم جلب التقييمات:', data?.length || 0)
            
            // تحديث الملخص في الأعلى
            renderReviewsSummary(data || [])
            
            // عرض التقييمات
            renderReviewsList(data || [], container)
            
        } catch (e) {
            console.error('❌ خطأ في loadReviews:', e)
            container.innerHTML = `
                <div class="no-reviews">
                    <i class="fas fa-exclamation-circle"></i>
                    <p>حدث خطأ في تحميل التقييمات</p>
                </div>
            `
        }

    // ========== RENDER REVIEWS SUMMARY ==========
    function renderReviewsSummary(reviews) {
        const avgRatingEl = document.getElementById('avgRating')
        const ratingCountEl = document.getElementById('ratingCount')
        const starsContainer = document.getElementById('ratingStars')

        if (!reviews || reviews.length === 0) {
            if (avgRatingEl) avgRatingEl.textContent = '0'
            if (ratingCountEl) ratingCountEl.textContent = '(0)'
            if (starsContainer) {
                starsContainer.innerHTML = Array(5).fill(0).map(() => `<span class="star">★</span>`).join('')
            }
            return
        }

        const total = reviews.length
        const sum = reviews.reduce((acc, r) => acc + (r.rating || 0), 0)
        const avg = total > 0 ? (sum / total).toFixed(1) : '0'

        if (avgRatingEl) avgRatingEl.textContent = avg
        if (ratingCountEl) ratingCountEl.textContent = `(${total})`

        if (starsContainer) {
            const fullStars = Math.round(parseFloat(avg))
            starsContainer.innerHTML = ''
            for (let i = 0; i < 5; i++) {
                starsContainer.innerHTML += `<span class="star ${i < fullStars ? 'filled' : ''}">★</span>`
            }
        }
    }

    // ========== RENDER REVIEWS LIST ==========
    function renderReviewsList(reviews, container) {
        if (!reviews || reviews.length === 0) {
            container.innerHTML = `
                <div class="no-reviews">
                    <i class="fas fa-star"></i>
                    <p>لا توجد تقييمات لهذا المنتج بعد</p>
                    <p style="font-size:0.8rem;color:var(--gray-dark);">كن أول من يقيم هذا المنتج!</p>
                </div>
            `
            return
        }

        container.innerHTML = reviews.map(review => {
            const date = review.created_at ? new Date(review.created_at) : new Date()
            const formattedDate = date.toLocaleDateString('ar-EG')

            let starsHtml = ''
            const rating = review.rating || 0
            for (let i = 0; i < 5; i++) {
                starsHtml += `<span class="star ${i < rating ? 'filled' : ''}">★</span>`
            }

            const typeLabel = review.review_type === 'supplier' ? 'تقييم للمورد' : 'تقييم للمنتج'
            const typeClass = review.review_type === 'supplier' ? 'supplier' : 'product'
            const userName = review.profiles?.full_name || 'مستخدم'

            return `
                <div class="review-card">
                    <div class="review-header">
                        <span class="review-user">${userName}</span>
                        <span class="review-date">${formattedDate}</span>
                    </div>
                    <div class="review-stars">${starsHtml}</div>
                    <span class="review-type-badge ${typeClass}">${typeLabel}</span>
                    <p class="review-text">${review.comment || ''}</p>
                </div>
            `
        }).join('')
    }

    // ========== LOAD SUPPLIER RATING ==========
    async function loadSupplierRating(supplierId) {
        try {
            if (!supplierId) return { avg: 0, count: 0 }

            const { data, error } = await supabase
                .from('reviews')
                .select('rating')
                .eq('supplier_id', supplierId)

            if (error || !data || data.length === 0) {
                return { avg: 0, count: 0 }
            }

            const sum = data.reduce((acc, r) => acc + (r.rating || 0), 0)
            const avg = data.length > 0 ? (sum / data.length).toFixed(1) : '0'

            return { avg, count: data.length }
        } catch (e) {
            console.error('Error loading supplier rating:', e)
            return { avg: 0, count: 0 }
        }
    }

                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-whatsapp" onclick="trackAndOpenWhatsApp('${supplierId || ''}', '${data.id}', '${phoneNumber}', '${(data.name || 'منتج').replace(/'/g, "\\'")}')">
                                <i class="fab fa-whatsapp"></i> تواصل عبر واتساب
                            </button>
                            <a href="tel:${phoneNumber}" class="btn btn-call">
                                <i class="fas fa-phone-alt"></i> اتصال
                            </a>
                            <button class="btn btn-share" onclick="shareProduct('${(data.name || 'منتج').replace(/'/g, "\\'")}', '${data.id}')">
                                <i class="fas fa-share-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>

                ${similarProductsHtml}
            `

            // ===== LOAD REVIEWS بعد عرض الصفحة =====
            await loadReviews(data.id)

        } catch (e) {
            console.error('Error loading product:', e)
            container.innerHTML = `
                <div class="error-box">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h2>❌ حدث خطأ</h2>
                    <p>${e.message || 'حدث خطأ أثناء تحميل المنتج'}</p>
                </div>
            `
        }
    }

    // ========== LOAD SIMILAR PRODUCTS ==========
    async function loadSimilarProducts(categoryId, currentProductId) {
        if (!categoryId) return ''

        try {
            const { data } = await supabase
                .from('products')
                .select('id, name, price, unit, image_url, category')
                .eq('category_id', categoryId)
                .eq('status', 'active')
                .neq('id', currentProductId)
                .limit(4)

            if (!data || data.length === 0) return ''

            let html = `
                <div class="similar-products-section">
                    <h3><i class="fas fa-layer-group"></i> منتجات مشابهة</h3>
                    <div class="similar-products-grid">
            `

            data.forEach(p => {
                const hasImage = p.image_url && p.image_url.trim() !== '' && !p.image_url.includes('placehold')
                const imgHtml = hasImage 
                    ? `<img src="${p.image_url}" alt="${p.name || 'منتج'}" loading="lazy" decoding="async">`
                    : `<div class="placeholder">🧪</div>`

                html += `
                    <a href="product-details.html?id=${p.id}" class="similar-product-card">
                        <div class="img-wrapper">
                            ${imgHtml}
                        </div>
                        <div class="info">
                            <div class="name">${p.name || 'منتج'}</div>
                            <div class="price">${p.price ? p.price.toLocaleString() + ' جنيه' : 'سعر عند الطلب'}</div>
                            <div class="category">${p.category || 'كيماويات'}</div>
                        </div>
                    </a>
                `
            })

            html += `</div></div>`
            return html
        } catch (e) {
            console.error('Error loading similar products:', e)
            return ''
        }
    }

    // ========== EXPOSE GLOBAL FUNCTIONS ==========
    window.trackAndOpenWhatsApp = trackAndOpenWhatsApp
    window.submitReview = submitReview
    window.setPriceAlert = setPriceAlert
    window.shareProduct = shareProduct

    // ========== INIT ==========
    async function init() {
        setupDropdown()
        await updateDropdownContent()
        await loadProduct()
        setupScrollTop()

        console.log('✅ كيماتو | تفاصيل المنتج يعمل')
    }

    // Auth state change
    supabase.auth.onAuthStateChange(() => {
        updateDropdownContent()
    })

    init()
</script>
</body>
</html>
