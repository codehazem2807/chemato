<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>كيماتو | تفاصيل المنتج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a2f2f;
            --primary: #1a5f5f;
            --primary-light: #2a8f8f;
            --accent: #ffb347;
            --accent-dark: #e69500;
            --gray-light: #f8fafc;
            --gray: #e2e8f0;
            --gray-dark: #64748b;
            --text-dark: #1e2a3e;
            --text-light: #475569;
            --white: #ffffff;
            --danger: #e53e3e;
            --whatsapp: #25D366;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.1);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #eef2f7 0%, #d9e0e8 100%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* ========== الهيدر ========== */
        .navbar {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }

        @media (min-width: 768px) {
            .navbar {
                padding: 18px 40px;
            }
        }

        .logo a {
            text-decoration: none;
        }

        .logo-content {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
        }

        @media (min-width: 768px) {
            .logo-content {
                font-size: 22px;
                gap: 12px;
            }
        }

        .logo-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #2563eb;
            object-fit: cover;
        }

        @media (min-width: 768px) {
            .logo-img {
                width: 45px;
                height: 45px;
            }
        }

        .logo-text span:first-child { color: #2563eb; }
        .logo-text span:last-child { color: #94a3b8; font-size: 14px; }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .nav-links {
                gap: 15px;
            }
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: 500;
            font-size: 13px;
        }

        @media (min-width: 768px) {
            .nav-links a {
                padding: 8px 20px;
                font-size: 1rem;
            }
        }

        .nav-links a:hover {
            background: var(--accent);
            color: var(--text-dark);
        }

        /* ========== القائمة المنسدلة ========== */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            font-size: 13px;
            font-family: inherit;
        }

        @media (min-width: 768px) {
            .dropdown-btn {
                padding: 8px 20px;
                gap: 8px;
                font-size: 1rem;
            }
        }

        .dropdown-btn:hover {
            background: var(--accent);
            color: var(--text-dark);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            min-width: 180px;
            box-shadow: var(--shadow-lg);
            border-radius: var(--radius-sm);
            z-index: 1000;
            overflow: hidden;
            margin-top: 8px;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content a {
            color: var(--text-dark);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            transition: 0.2s;
            font-size: 14px;
            border-bottom: 1px solid var(--gray);
        }

        .dropdown-content a:hover {
            background: var(--gray-light);
            color: var(--primary);
        }

        .dropdown-content .logout-item {
            color: var(--danger);
            border-top: 1px solid var(--gray);
        }

        .dropdown-content .logout-item:hover {
            background: #fee2e2;
        }

        /* ========== الحاوية الرئيسية ========== */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 16px;
        }

        @media (min-width: 768px) {
            .container {
                margin: 40px auto;
                padding: 0 24px;
            }
        }

        /* ========== بطاقة المنتج ========== */
        .product-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        /* معرض الصور */
        .product-gallery {
            background: var(--gray-light);
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        @media (min-width: 640px) {
            .product-img {
                height: 320px;
                padding: 30px;
            }
        }

        @media (min-width: 1024px) {
            .product-img {
                height: 400px;
                padding: 40px;
            }
        }

        .product-img:hover {
            transform: scale(1.02);
        }

        /* معلومات المنتج */
        .product-info {
            padding: 24px;
        }

        @media (min-width: 768px) {
            .product-info {
                padding: 35px;
            }
        }

        /* رأس المنتج */
        .product-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .product-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-start;
            }
        }

        .product-title h1 {
            color: var(--primary-dark);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        @media (min-width: 768px) {
            .product-title h1 {
                font-size: 2rem;
            }
        }

        .product-category {
            display: inline-block;
            background: var(--gray);
            padding: 5px 14px;
            border-radius: 25px;
            font-size: 12px;
            color: var(--primary);
        }

        @media (min-width: 768px) {
            .product-category {
                font-size: 14px;
                padding: 6px 18px;
            }
        }

        .product-price {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            padding: 10px 20px;
            border-radius: 50px;
            color: var(--text-dark);
            font-weight: bold;
            font-size: 1.3rem;
            text-align: center;
            display: inline-block;
        }

        @media (min-width: 768px) {
            .product-price {
                font-size: 1.8rem;
                padding: 12px 25px;
            }
        }

        /* أقسام التفاصيل */
        .details-section {
            margin: 25px 0;
            background: var(--gray-light);
            border-radius: var(--radius-md);
            padding: 20px;
        }

        @media (min-width: 768px) {
            .details-section {
                padding: 25px;
            }
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (min-width: 768px) {
            .section-title {
                font-size: 1.3rem;
                margin-bottom: 20px;
            }
        }

        .detail-row {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray);
        }

        @media (min-width: 640px) {
            .detail-row {
                flex-direction: row;
            }
        }

        .detail-label {
            font-weight: bold;
            color: var(--text-dark);
            width: 100%;
            margin-bottom: 5px;
        }

        @media (min-width: 640px) {
            .detail-label {
                width: 140px;
                margin-bottom: 0;
            }
        }

        .detail-value {
            color: var(--text-light);
            flex: 1;
        }

        /* معلومات المورد */
        .supplier-section {
            background: linear-gradient(135deg, var(--gray-light), var(--gray));
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 25px 0;
        }

        @media (min-width: 768px) {
            .supplier-section {
                padding: 25px;
            }
        }

        .supplier-section h3 {
            color: var(--primary-dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }

        @media (min-width: 768px) {
            .supplier-section h3 {
                font-size: 1.3rem;
            }
        }

        .supplier-info {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 640px) {
            .supplier-info {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }

        @media (min-width: 1024px) {
            .supplier-info {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .supplier-info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--white);
            border-radius: var(--radius-sm);
            transition: transform 0.2s;
        }

        .supplier-info-item:hover {
            transform: translateX(-5px);
        }

        .supplier-info-item i {
            width: 35px;
            height: 35px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        @media (min-width: 768px) {
            .supplier-info-item i {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }

        /* أزرار التواصل */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        @media (min-width: 640px) {
            .action-buttons {
                flex-direction: row;
                gap: 15px;
            }
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        @media (min-width: 768px) {
            .btn {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: white;
        }

        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }

        .btn-call {
            background: var(--accent);
            color: var(--text-dark);
        }

        .btn-call:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* رسالة منبثقة */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-dark);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 1000;
            font-size: 14px;
            white-space: nowrap;
            animation: fadeOut 2s ease forwards;
        }

        @media (min-width: 768px) {
            .toast {
                bottom: 30px;
                padding: 12px 25px;
                font-size: 16px;
            }
        }

        @keyframes fadeOut {
            0% { opacity: 1; bottom: 20px; }
            70% { opacity: 1; bottom: 20px; }
            100% { opacity: 0; bottom: 40px; visibility: hidden; }
        }

        /* حالة التحميل */
        .loader {
            text-align: center;
            padding: 50px;
            background: var(--white);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            color: var(--primary);
        }

        @media (min-width: 768px) {
            .loader {
                padding: 80px;
                font-size: 1.2rem;
            }
        }

        .error-box {
            text-align: center;
            padding: 40px;
            background: var(--white);
            border-radius: var(--radius-lg);
            color: var(--danger);
        }

        @media (min-width: 768px) {
            .error-box {
                padding: 60px;
            }
        }

        /* الفوتر */
        .footer {
            background: var(--primary-dark);
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        @media (min-width: 768px) {
            .footer {
                padding: 35px;
                margin-top: 60px;
            }
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .footer-links {
                gap: 30px;
                margin-bottom: 20px;
            }
        }

        .footer-links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
        }

        @media (min-width: 768px) {
            .footer-links a {
                font-size: 14px;
            }
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: none;
            padding: 8px 16px;
            background: var(--white);
            border-radius: 30px;
            font-size: 14px;
            transition: 0.3s;
        }

        @media (min-width: 768px) {
            .back-link {
                margin-top: 25px;
                padding: 10px 20px;
                font-size: 16px;
            }
        }

        .back-link:hover {
            background: var(--accent);
            color: var(--text-dark);
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <a href="index.html" style="text-decoration:none;">
            <div class="logo-content">
            <img src="709548215_2209434319875128_7640925248715427952_n.jpg"
                     style="width:55px;height:55px;border-radius:50%;border:3px solid #2563eb;box-shadow:0 4px 12px rgba(37,99,235,.25);object-fit:cover;">
                     
                <div class="logo-text">
                    <span>كيماتو</span>
                    <span> | تفاصيل المنتج</span>
                </div>
            </div>
        </a>
    </div>
    <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="all-products.html">📦 المنتجات</a>
        <div class="dropdown">
            <button class="dropdown-btn"><i class="fas fa-bars"></i> القائمة</button>
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>
    </div>
</div>

<div class="container">
    <div id="productDetail" class="loader">⏳ جاري تحميل تفاصيل المنتج...</div>
    <div style="text-align: center;">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    </div>
</div>

<div class="footer">
    <div class="footer-links">
        <a href="index.html">الرئيسية</a>
        <a href="all-products.html">جميع المنتجات</a>
        <a href="all-requests.html">جميع الطلبات</a>
        <a href="auth.html">تسجيل الدخول</a>
    </div>
    <div>© جميع الحقوق محفوظة Hazem Mohamady 2026 | كيماتو - سوق المواد الكيماوية</div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const urlParams = new URLSearchParams(window.location.search)
    const productId = urlParams.get('id')

    let currentUser = null
    let currentProfile = null

    // ========== القائمة المنسدلة ==========
    function setupDropdown() {
        const dropdownBtn = document.querySelector('.dropdown-btn')
        const dropdownContent = document.getElementById('dropdownContent')
        
        if (dropdownBtn && dropdownContent) {
            dropdownBtn.addEventListener('click', (e) => {
                e.stopPropagation()
                dropdownContent.classList.toggle('show')
            })
            document.addEventListener('click', () => {
                dropdownContent.classList.remove('show')
            })
        }
    }

    async function updateDropdownContent() {
        const { data: { user } } = await supabase.auth.getUser()
        currentUser = user
        const dropdownContent = document.getElementById('dropdownContent')
        
        if (user) {
            const { data: profile } = await supabase.from('profiles').select('user_type').eq('id', user.id).single()
            currentProfile = profile
            dropdownContent.innerHTML = `
                <a href="${profile?.user_type === 'supplier' ? 'supplier-dashboard.html' : 'buyer-dashboard.html'}">📦 لوحة التحكم</a>
                <a href="profile.html">👤 الملف الشخصي</a>
                <a href="#" id="logoutLink" class="logout-item">🚪 تسجيل خروج</a>
            `
            const logoutLink = document.getElementById('logoutLink')
            if (logoutLink) {
                logoutLink.onclick = async (e) => {
                    e.preventDefault()
                    await supabase.auth.signOut()
                    window.location.href = 'index.html'
                }
            }
        } else {
            dropdownContent.innerHTML = `
                <a href="auth.html">🔐 تسجيل الدخول</a>
                <a href="auth.html">📝 حساب جديد</a>
                <a href="supplier-dashboard.html">📦 للموردين</a>
                <a href="buyer-dashboard.html">🛒 للعملاء</a>
            `
        }
    }

    // ========== عرض رسالة منبثقة ==========
    function showToast(message) {
        const toast = document.createElement('div')
        toast.className = 'toast'
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`
        document.body.appendChild(toast)
        setTimeout(() => toast.remove(), 2000)
    }

    // ========== فتح واتساب ==========
    window.openWhatsApp = (phone) => {
        if (phone) {
            let whatsappNumber = phone.replace(/[^0-9]/g, '')
            if (whatsappNumber.startsWith('0')) {
                whatsappNumber = '2' + whatsappNumber
            }
            window.open(`https://wa.me/${whatsappNumber}`, '_blank')
        } else {
            showToast('⚠️ رقم التواصل غير متاح')
        }
    }

    // ========== الاتصال ==========
    window.makeCall = (phone) => {
        if (phone) {
            window.location.href = `tel:${phone}`
        } else {
            showToast('⚠️ رقم التواصل غير متاح')
        }
    }

    // ========== تحميل وعرض المنتج ==========
    async function loadProduct() {
        if (!productId) {
            document.getElementById('productDetail').innerHTML = `
                <div class="error-box">
                    <h2>❌ خطأ</h2>
                    <p>لم يتم تحديد المنتج المطلوب</p>
                </div>
            `
            return
        }

        const { data, error } = await supabase
            .from('products')
            .select('*, profiles(full_name, company_name, phone, city, address, whatsapp, user_type)')
            .eq('id', productId)
            .single()

        if (error || !data) {
            document.getElementById('productDetail').innerHTML = `
                <div class="error-box">
                    <h2>❌ عذراً</h2>
                    <p>${error?.message || 'المنتج غير موجود أو تم حذفه'}</p>
                </div>
            `
            return
        }

        // تحديث عدد المشاهدات
        await supabase
            .from('products')
            .update({ views_count: (data.views_count || 0) + 1 })
            .eq('id', productId)

        // جلب اسم القسم
        let categoryName = data.category || 'مواد كيماوية'
        let categoryIcon = '📦'
        if (data.category_id) {
            const { data: cat } = await supabase
                .from('categories')
                .select('name, icon')
                .eq('id', data.category_id)
                .single()
            if (cat) {
                categoryName = cat.name
                categoryIcon = cat.icon || '📦'
            }
        }

        const phoneNumber = data.profiles?.phone || ''
        const whatsappNumber = data.profiles?.whatsapp || data.profiles?.phone || ''

        document.getElementById('productDetail').innerHTML = `
            <div class="product-card">
                <div class="product-gallery">
                    <img class="product-img" src="${data.image_url || 'https://placehold.co/600x400?text=🧪+كيماتو'}" alt="${data.name}">
                </div>
                <div class="product-info">
                    <div class="product-header">
                        <div class="product-title">
                            <h1>🧪 ${data.name}</h1>
                            <span class="product-category">${categoryIcon} ${categoryName}</span>
                        </div>
                        <div class="product-price">
                            ${data.price ? data.price.toLocaleString() + ' جنيه / ' + data.unit : '💰 سعر عند الطلب'}
                        </div>
                    </div>

                    <div class="details-section">
                        <div class="section-title">
                            <i class="fas fa-info-circle"></i>
                            <span>تفاصيل المنتج</span>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">الوحدة:</div>
                            <div class="detail-value">${data.unit || 'كجم'}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">الوصف:</div>
                            <div class="detail-value">${data.description || 'لا يوجد وصف محدد'}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">تاريخ الإضافة:</div>
                            <div class="detail-value">${new Date(data.created_at).toLocaleDateString('ar-EG')}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">المشاهدات:</div>
                            <div class="detail-value"><i class="fas fa-eye"></i> ${(data.views_count || 0) + 1}</div>
                        </div>
                    </div>

                    <div class="supplier-section">
                        <h3><i class="fas fa-building"></i> معلومات المورد</h3>
                        <div class="supplier-info">
                            <div class="supplier-info-item">
                                <i class="fas fa-user"></i>
                                <div>${data.profiles?.company_name || data.profiles?.full_name || 'غير محدد'}</div>
                            </div>
                            <div class="supplier-info-item">
                                <i class="fas fa-city"></i>
                                <div>${data.profiles?.city || 'غير محدد'}</div>
                            </div>
                            <div class="supplier-info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>${data.profiles?.address || 'غير محدد'}</div>
                            </div>
                            ${phoneNumber ? `
                            <div class="supplier-info-item">
                                <i class="fas fa-phone"></i>
                                <div>${phoneNumber}</div>
                            </div>
                            ` : ''}
                            ${data.profiles?.whatsapp ? `
                            <div class="supplier-info-item">
                                <i class="fab fa-whatsapp"></i>
                                <div>${data.profiles.whatsapp}</div>
                            </div>
                            ` : ''}
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-whatsapp" onclick="openWhatsApp('${whatsappNumber}')">
                            <i class="fab fa-whatsapp"></i> واتساب
                        </button>
                        <button class="btn btn-call" onclick="makeCall('${phoneNumber}')">
                            <i class="fas fa-phone-alt"></i> اتصال
                        </button>
                    </div>
                </div>
            </div>
        `
    }

    // ========== بدء التشغيل ==========
    setupDropdown()
    updateDropdownContent()
    loadProduct()
</script>
</body>
</html>
