<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>كيماتو | إضافة منتج جديد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0c2d4a;
            --primary: #1a4a6e;
            --primary-light: #2d7a9e;
            --accent: #3498db;
            --accent-dark: #2c81ba;
            --gray-light: #f8fafc;
            --gray: #e2e8f0;
            --gray-dark: #64748b;
            --text-dark: #0c2d4a;
            --text-light: #475569;
            --white: #ffffff;
            --danger: #e53e3e;
            --success: #2a9d8f;
            --warning: #f4a261;
            --shadow-sm: 0 4px 12px rgba(12,45,74,0.05);
            --shadow-md: 0 10px 25px rgba(12,45,74,0.08);
            --shadow-lg: 0 20px 40px rgba(12,45,74,0.12);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2eaf2 100%);
            min-height: 100vh;
            color: var(--text-dark);
            padding: 20px;
        }

        @media (min-width: 768px) {
            body {
                padding: 40px 20px;
            }
        }

        /* ========== الهيدر ========== */
        .navbar {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
            border-radius: 60px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(12,45,74,0.25);
            border-bottom: 2px solid rgba(52,152,219,0.30);
        }

        .logo a {
            text-decoration: none;
        }

        .logo-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 20px;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #3498db;
            object-fit: cover;
        }

        .logo-text span:first-child { color: #3498db; }
        .logo-text span:last-child { color: #b0c9d9; font-size: 14px; }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
        }

        .nav-links a:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        /* ========== الفورم ========== */
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 35px 30px;
            box-shadow: 0 12px 36px rgba(12,45,74,0.06);
            border: 1px solid rgba(52,152,219,0.06);
        }

        @media (min-width: 768px) {
            .form-container {
                padding: 45px 40px;
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: var(--primary-dark);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 800;
        }

        @media (min-width: 768px) {
            .form-header h1 {
                font-size: 2.2rem;
            }
        }

        .form-header h1 i {
            color: #3498db;
        }

        .form-header p {
            color: var(--gray-dark);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .required::after {
            content: '*';
            color: var(--danger);
            margin-right: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--gray);
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--gray-light);
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(52,152,219,0.10);
        }

        textarea {
            border-radius: 24px;
            resize: vertical;
            min-height: 100px;
        }

        /* ===== صورة المنتج ===== */
        .image-upload {
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--gray-light);
        }

        .image-upload:hover {
            border-color: #3498db;
            background: #f0f7fe;
        }

        .image-upload i {
            font-size: 48px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .image-upload p {
            color: var(--gray-dark);
            font-size: 14px;
        }

        .image-upload .hint {
            font-size: 12px;
            margin-top: 5px;
            color: #94a3b8;
        }

        .image-preview {
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .image-preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 16px;
            border: 3px solid #3498db;
            padding: 4px;
            background: white;
        }

        .remove-image {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .remove-image:hover {
            background: #c53030;
            transform: translateY(-2px);
        }

        /* ===== زر الإرسال ===== */
        .btn-submit {
            width: 100%;
            background: linear-gradient(145deg, #3498db, #2c81ba);
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 16px rgba(52,152,219,0.30);
            margin-top: 5px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(26,74,110,0.35);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== رسائل ===== */
        .message {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 30px;
            font-weight: 700;
            text-align: center;
        }

        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border-right: 4px solid #22543d;
        }

        .message.error {
            background: #fed7d7;
            color: #742a2a;
            border-right: 4px solid #742a2a;
        }

        /* ===== تحميل ===== */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray);
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: var(--gray-dark);
            font-weight: 600;
        }

        /* ===== روابط ===== */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-align: center;
            margin-top: 25px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            padding: 10px 20px;
            background: var(--white);
            border-radius: 40px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(52,152,219,0.06);
        }

        .back-link:hover {
            color: #3498db;
            transform: translateX(-5px);
            box-shadow: var(--shadow-md);
        }

        .text-center {
            text-align: center;
        }

        /* ===== الفوتر ===== */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--gray-dark);
            font-size: 0.8rem;
        }

        /* ===== استجابة ===== */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
                border-radius: var(--radius-md);
            }
            
            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 14px 20px;
                border-radius: 40px;
            }
            
            .nav-links {
                justify-content: center;
            }
            
            .nav-links a {
                padding: 6px 14px;
                font-size: 12px;
            }
            
            .form-header h1 {
                font-size: 1.4rem;
            }
            
            .logo-content {
                font-size: 17px;
            }
            
            .logo-img {
                width: 35px;
                height: 35px;
            }
            
            .form-group {
                margin-bottom: 18px;
            }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 16px;
            }
            
            .form-header h1 {
                font-size: 1.2rem;
            }
            
            .form-header p {
                font-size: 0.85rem;
            }
            
            input, select, textarea {
                padding: 12px 14px;
                font-size: 0.95rem;
            }
            
            .btn-submit {
                padding: 14px;
                font-size: 1rem;
            }
            
            .image-upload {
                padding: 20px;
            }
            
            .image-upload i {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <a href="index.html" style="text-decoration:none;">
            <div class="logo-content">
                <img src="709548215_2209434319875128_7640925248715427952_n.jpg"
                     class="logo-img" alt="كيماتو">
                <div class="logo-text">
                    <span>كيماتو</span>
                    <span> | إضافة منتج</span>
                </div>
            </div>
        </a>
    </div>
    <div class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="all-products.html"><i class="fas fa-flask"></i> جميع المنتجات</a>
        <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> لوحة المورد</a>
    </div>
</div>

<div class="form-container">
    <div class="form-header">
        <h1><i class="fas fa-plus-circle"></i> إضافة منتج جديد</h1>
        <p>أضف منتجك الكيماوي ليصل إلى آلاف العملاء</p>
    </div>

    <form id="productForm">
        <!-- اسم المنتج -->
        <div class="form-group">
            <label class="required">اسم المنتج</label>
            <input type="text" id="name" required placeholder="مثال: كاوية صودا 99% - حمض كبريتيك - سولار صناعي">
        </div>

        <!-- القسم -->
        <div class="form-group">
            <label class="required">القسم</label>
            <select id="categoryId" required>
                <option value="">اختر القسم</option>
            </select>
        </div>

        <!-- الوصف -->
        <div class="form-group">
            <label>وصف المنتج</label>
            <textarea id="description" rows="3" placeholder="المواصفات، التركيز، درجة النقاء، الاستخدامات..."></textarea>
        </div>

        <!-- السعر والوحدة -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>السعر (جنيه)</label>
                <input type="number" id="price" placeholder="مثال: 12500" step="0.01">
            </div>
            <div class="form-group">
                <label>الوحدة</label>
                <select id="unit">
                    <option value="كجم">كيلو جرام (كجم)</option>
                    <option value="طن">طن</option>
                    <option value="لتر">لتر</option>
                    <option value="برميل">برميل</option>
                    <option value="عبوة">عبوة</option>
                </select>
            </div>
        </div>

        <!-- رفع الصورة -->
        <div class="form-group">
            <label>صورة المنتج</label>
            <div class="image-upload" id="imageUpload">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>اضغط لرفع صورة المنتج</p>
                <p class="hint">jpg, png, gif (حد أقصى 5 ميجابايت)</p>
                <input type="file" id="productImage" accept="image/*" style="display: none;">
            </div>
            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="">
                <br>
                <button type="button" class="remove-image" id="removeImageBtn">🗑️ إزالة الصورة</button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <i class="fas fa-rocket"></i> رفع المنتج للسوق
        </button>
    </form>

    <div id="messageDiv"></div>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>⏳ جاري رفع المنتج...</p>
    </div>

    <div class="text-center">
        <a href="supplier-dashboard.html" class="back-link">
            <i class="fas fa-arrow-right"></i> العودة للوحة التحكم
        </a>
    </div>
</div>

<div class="footer">
    © جميع الحقوق محفوظة Hazem Mohamady 2026 | كيماتو - سوق المواد الكيماوية في مصر
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let selectedImageFile = null
    let currentUser = null

    // ========== عناصر DOM ==========
    const form = document.getElementById('productForm')
    const messageDiv = document.getElementById('messageDiv')
    const loadingDiv = document.getElementById('loading')
    const submitBtn = document.getElementById('submitBtn')

    // ========== معاينة الصورة ==========
    const imageUpload = document.getElementById('imageUpload')
    const imageInput = document.getElementById('productImage')
    const imagePreview = document.getElementById('imagePreview')
    const previewImg = document.getElementById('previewImg')
    const removeImageBtn = document.getElementById('removeImageBtn')

    imageUpload.addEventListener('click', () => {
        imageInput.click()
    })

    imageInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            // التحقق من حجم الملف (5 ميجابايت)
            if (e.target.files[0].size > 5 * 1024 * 1024) {
                alert('⚠️ حجم الصورة يتجاوز 5 ميجابايت. يرجى اختيار صورة أصغر.')
                imageInput.value = ''
                return
            }
            
            selectedImageFile = e.target.files[0]
            const reader = new FileReader()
            reader.onload = (event) => {
                previewImg.src = event.target.result
                imagePreview.style.display = 'block'
                imageUpload.style.display = 'none'
            }
            reader.readAsDataURL(selectedImageFile)
        }
    })

    removeImageBtn.addEventListener('click', () => {
        selectedImageFile = null
        imageInput.value = ''
        imagePreview.style.display = 'none'
        imageUpload.style.display = 'block'
        previewImg.src = ''
    })

    // ========== تحميل الأقسام ==========
    async function loadCategories() {
        const { data: categories } = await supabase
            .from('categories')
            .select('*')
            .eq('is_active', true)
            .order('display_order', { ascending: true })

        const select = document.getElementById('categoryId')
        if (categories && categories.length > 0) {
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.icon || '📁'} ${cat.name}</option>`
            })
        }
    }

    // ========== رفع المنتج ==========
    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        messageDiv.innerHTML = ''
        loadingDiv.classList.add('show')
        submitBtn.disabled = true

        // التحقق من تسجيل الدخول
        const { data: { user } } = await supabase.auth.getUser()
        if (!user) {
            messageDiv.innerHTML = '<div class="message error">❌ يجب تسجيل الدخول أولاً</div>'
            loadingDiv.classList.remove('show')
            submitBtn.disabled = false
            setTimeout(() => window.location.href = 'auth.html', 1500)
            return
        }
        currentUser = user

        // التحقق من البيانات
        const name = document.getElementById('name').value.trim()
        const categoryId = document.getElementById('categoryId').value
        const description = document.getElementById('description').value
        const price = parseFloat(document.getElementById('price').value) || null
        const unit = document.getElementById('unit').value

        if (!name) {
            messageDiv.innerHTML = '<div class="message error">❌ الرجاء إدخال اسم المنتج</div>'
            loadingDiv.classList.remove('show')
            submitBtn.disabled = false
            return
        }

        if (!categoryId) {
            messageDiv.innerHTML = '<div class="message error">❌ الرجاء اختيار القسم</div>'
            loadingDiv.classList.remove('show')
            submitBtn.disabled = false
            return
        }

        // رفع الصورة (إن وجدت)
        let imageUrl = null
        if (selectedImageFile) {
            const fileExt = selectedImageFile.name.split('.').pop()
            const fileName = `product_${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`
            
            const { error: uploadError } = await supabase.storage
                .from('product-images')
                .upload(fileName, selectedImageFile)

            if (uploadError) {
                messageDiv.innerHTML = `<div class="message error">❌ خطأ في رفع الصورة: ${uploadError.message}</div>`
                loadingDiv.classList.remove('show')
                submitBtn.disabled = false
                return
            }

            const { data: urlData } = supabase.storage
                .from('product-images')
                .getPublicUrl(fileName)

            imageUrl = urlData.publicUrl
        }

        // جلب اسم القسم
        const { data: categoryData } = await supabase
            .from('categories')
            .select('name')
            .eq('id', categoryId)
            .single()

        // إضافة المنتج
        const { error } = await supabase.from('products').insert({
            supplier_id: user.id,
            name: name,
            category: categoryData?.name || 'أخرى',
            category_id: categoryId,
            description: description,
            price: price,
            unit: unit,
            image_url: imageUrl,
            status: 'active',
            views_count: 0
        })

        if (error) {
            messageDiv.innerHTML = `<div class="message error">❌ ${error.message}</div>`
            loadingDiv.classList.remove('show')
            submitBtn.disabled = false
        } else {
            messageDiv.innerHTML = '<div class="message success">✅ تم إضافة المنتج بنجاح! جاري التحويل...</div>'
            setTimeout(() => {
                window.location.href = 'supplier-dashboard.html'
            }, 2000)
        }
    })

    // ========== بدء التشغيل ==========
    loadCategories()
</script>
</body>
</html>
