<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيماتو | إضافة منتج جديد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Tahoma', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2b2b, #1a5f5f);
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* ========== الهيدر ========== */
        .navbar {
            background: linear-gradient(135deg, #0a2f2f, #1b6b6b);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-radius: 60px;
            margin-bottom: 30px;
        }

        .logo a {
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: 500;
        }

        .nav-links a:hover {
            background: #ffb347;
            color: #1e2a3e;
        }

        /* ========== الفورم ========== */
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 48px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: #1a5f5f;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-header p {
            color: #64748b;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2d3e50;
        }

        .required::after {
            content: '*';
            color: #e53e3e;
            margin-right: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f8fafc;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ffb347;
            background: white;
            box-shadow: 0 0 0 3px rgba(255,179,71,0.1);
        }

        textarea {
            border-radius: 24px;
            resize: vertical;
            min-height: 100px;
        }

        /* صورة المنتج */
        .image-upload {
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f8fafc;
        }

        .image-upload:hover {
            border-color: #ffb347;
            background: #fffaf5;
        }

        .image-upload i {
            font-size: 48px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .image-upload p {
            color: #64748b;
            font-size: 14px;
        }

        .image-preview {
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .image-preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 16px;
            border: 3px solid #ffb347;
            padding: 4px;
        }

        .remove-image {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
        }

        /* زر الإرسال */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ffb347, #ff9500);
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            color: #1e2a3e;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1a5f5f, #0f4f4f);
            color: white;
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* رسائل */
        .message {
            margin-top: 20px;
            text-align: center;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
        }

        .success {
            background: #c6f6d5;
            color: #22543d;
            border-right: 4px solid #22543d;
        }

        .error {
            background: #fed7d7;
            color: #742a2a;
            border-right: 4px solid #742a2a;
        }

        /* تحميل */
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #ffb347;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* روابط */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1a5f5f;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            color: #ffb347;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: white;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 25px;
            }
            .navbar {
                flex-direction: column;
                gap: 15px;
                border-radius: 30px;
                padding: 15px 20px;
            }
            .form-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <a href="/" style="text-decoration:none;">
            <div style="display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;">
                <img src="709548215_2209434319875128_7640925248715427952_n.jpg"
                     style="width:45px;height:45px;border-radius:50%;border:2px solid #2563eb;object-fit:cover;">
                <span><span style="color:#2563eb;">كيماتو</span><span style="color:#64748b;"> | إضافة منتج</span></span>
            </div>
        </a>
    </div>
    <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="all-products.html">📦 جميع المنتجات</a>
        <a href="supplier-dashboard.html">📦 لوحة المورد</a>
    </div>
</div>

<div class="form-container">
    <div class="form-header">
        <h1><i class="fas fa-plus-circle"></i> إضافة منتج جديد</h1>
        <p>أضف منتجك الكيماوي ليصل إلى آلاف العملاء</p>
    </div>

    <form id="productForm">
        <!-- اسم المنتج -->
        <div class="form-group">
            <label class="required">اسم المنتج</label>
            <input type="text" id="name" required placeholder="مثال: كاوية صودا 99% - حمض كبريتيك - سولار صناعي">
        </div>

        <!-- القسم -->
        <div class="form-group">
            <label class="required">القسم</label>
            <select id="categoryId" required>
                <option value="">اختر القسم</option>
            </select>
        </div>

        <!-- الوصف -->
        <div class="form-group">
            <label>وصف المنتج</label>
            <textarea id="description" placeholder="المواصفات، التركيز، درجة النقاء، الاستخدامات..."></textarea>
        </div>

        <!-- السعر والوحدة -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>السعر (جنيه)</label>
                <input type="number" id="price" placeholder="مثال: 12500" step="0.01">
            </div>
            <div class="form-group">
                <label>الوحدة</label>
                <select id="unit">
                    <option value="كجم">كيلو جرام (كجم)</option>
                    <option value="طن">طن</option>
                    <option value="لتر">لتر</option>
                    <option value="برميل">برميل</option>
                    <option value="عبوة">عبوة</option>
                </select>
            </div>
        </div>

        <!-- رفع الصورة -->
        <div class="form-group">
            <label>صورة المنتج</label>
            <div class="image-upload" id="imageUpload">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>اضغط لرفع صورة المنتج</p>
                <p style="font-size: 12px; margin-top: 5px;">jpg, png, gif (حد أقصى 5 ميجابايت)</p>
                <input type="file" id="productImage" accept="image/*" style="display: none;">
            </div>
            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="">
                <button type="button" class="remove-image" id="removeImageBtn">🗑️ إزالة الصورة</button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <i class="fas fa-rocket"></i> رفع المنتج للسوق
        </button>
    </form>

    <div id="messageDiv"></div>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>جاري رفع المنتج...</p>
    </div>

    <a href="supplier-dashboard.html" class="back-link">
        <i class="fas fa-arrow-right"></i> العودة للوحة التحكم
    </a>
</div>

<div class="footer">
    © جميع الحقوق محفوظة Hazem Mohamady 2026 | كيماتو - سوق المواد الكيماوية في مصر
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let selectedImageFile = null

    // ========== معاينة الصورة ==========
    const imageUpload = document.getElementById('imageUpload')
    const imageInput = document.getElementById('productImage')
    const imagePreview = document.getElementById('imagePreview')
    const previewImg = document.getElementById('previewImg')
    const removeImageBtn = document.getElementById('removeImageBtn')

    imageUpload.addEventListener('click', () => {
        imageInput.click()
    })

    imageInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            selectedImageFile = e.target.files[0]
            const reader = new FileReader()
            reader.onload = (event) => {
                previewImg.src = event.target.result
                imagePreview.style.display = 'block'
                imageUpload.style.display = 'none'
            }
            reader.readAsDataURL(selectedImageFile)
        }
    })

    removeImageBtn.addEventListener('click', () => {
        selectedImageFile = null
        imageInput.value = ''
        imagePreview.style.display = 'none'
        imageUpload.style.display = 'block'
        previewImg.src = ''
    })

    // ========== تحميل الأقسام ==========
    async function loadCategories() {
        const { data: categories } = await supabase
            .from('categories')
            .select('*')
            .eq('is_active', true)
            .order('display_order', { ascending: true })

        const select = document.getElementById('categoryId')
        if (categories && categories.length > 0) {
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.icon || '📁'} ${cat.name}</option>`
            })
        }
    }

    // ========== رفع المنتج ==========
    const form = document.getElementById('productForm')
    const messageDiv = document.getElementById('messageDiv')
    const loadingDiv = document.getElementById('loading')
    const submitBtn = document.getElementById('submitBtn')

    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        messageDiv.innerHTML = ''
        loadingDiv.classList.add('show')
        submitBtn.disabled = true

        // التحقق من تسجيل الدخول
        const { data: { user } } = await supabase.auth.getUser()
        if (!user) {
            messageDiv.innerHTML = '<div class="message error">❌ يجب تسجيل الدخول أولاً</div>'
            loadingDiv.classList.remove('show')
            submitBtn.disabled = false
            setTimeout(() => window.location.href = 'auth.html', 1500)
            return
        }

        // التحقق من البيانات
        const name = document.getElementById('name').value.trim()
        const categoryId = document.getElementById('categoryId').value
        const description = document.getElementById('description').value
        const price = parseFloat(document.getElementById('price').value) || null
        const unit = document.getElementById('unit').value

        if (!name) {
            messageDiv.innerHTML = '<div class="message error">❌ الرجاء إدخال اسم المنتج</div>'
            loadingDiv.classList.remove('show')
            submitBtn.disabled = false
            return
        }

        if (!categoryId) {
            messageDiv.innerHTML = '<div class="message error">❌ الرجاء اختيار القسم</div>'
            loadingDiv.classList.remove('show')
            submitBtn.disabled = false
            return
        }

        // رفع الصورة (إن وجدت)
        let imageUrl = null
        if (selectedImageFile) {
            const fileExt = selectedImageFile.name.split('.').pop()
            const fileName = `product_${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`
            
            const { error: uploadError } = await supabase.storage
                .from('product-images')
                .upload(fileName, selectedImageFile)

            if (uploadError) {
                messageDiv.innerHTML = `<div class="message error">❌ خطأ في رفع الصورة: ${uploadError.message}</div>`
                loadingDiv.classList.remove('show')
                submitBtn.disabled = false
                return
            }

            const { data: urlData } = supabase.storage
                .from('product-images')
                .getPublicUrl(fileName)

            imageUrl = urlData.publicUrl
        }

        // جلب اسم القسم
        const { data: categoryData } = await supabase
            .from('categories')
            .select('name')
            .eq('id', categoryId)
            .single()

        // إضافة المنتج
        const { error } = await supabase.from('products').insert({
            supplier_id: user.id,
            name: name,
            category: categoryData?.name || 'أخرى',
            category_id: categoryId,
            description: description,
            price: price,
            unit: unit,
            image_url: imageUrl,
            status: 'active'
        })

        if (error) {
            messageDiv.innerHTML = `<div class="message error">❌ ${error.message}</div>`
            loadingDiv.classList.remove('show')
            submitBtn.disabled = false
        } else {
            messageDiv.innerHTML = '<div class="message success">✅ تم إضافة المنتج بنجاح! جاري التحويل...</div>'
            setTimeout(() => {
                window.location.href = 'supplier-dashboard.html'
            }, 2000)
        }
    })

    // ========== بدء التشغيل ==========
    loadCategories()
</script>
</body>
</html>
