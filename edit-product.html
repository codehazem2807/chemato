<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيماتو | تعديل منتج</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Tahoma', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2b2b, #1a5f5f);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 48px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1a5f5f;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2d3e50;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            font-size: 1rem;
        }
        textarea {
            border-radius: 20px;
            resize: vertical;
        }
        button {
            width: 100%;
            background: #ffb347;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #1a5f5f;
            color: white;
        }
        .message {
            margin-top: 20px;
            text-align: center;
            padding: 12px;
            border-radius: 30px;
        }
        .success {
            background: #c6f6d5;
            color: #22543d;
        }
        .error {
            background: #fed7d7;
            color: #742a2a;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1a5f5f;
            text-decoration: none;
        }
        .copyright {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 0.8rem;
        }
        .image-preview {
            margin-top: 15px;
            text-align: center;
        }
        .image-preview img {
            max-width: 200px;
            border-radius: 16px;
        }
        .current-image {
            background: #eef2f5;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1>✏️ تعديل المنتج</h1>
    
    <form id="productForm">
        <div class="form-group">
            <label>اسم المنتج *</label>
            <input type="text" id="name" required>
        </div>
        
        <div class="form-group">
            <label>التصنيف</label>
            <select id="category">
                <option value="خامات">خامات</option>
                <option value="أحماض">أحماض</option>
                <option value="مذيبات">مذيبات</option>
                <option value="منظفات">منظفات</option>
                <option value="بوليمرات">بوليمرات</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>وصف المنتج</label>
            <textarea id="description" rows="3"></textarea>
        </div>
        
        <div class="form-group">
            <label>السعر (جنيه)</label>
            <input type="number" id="price" step="0.01">
        </div>
        
        <div class="form-group">
            <label>الوحدة</label>
            <select id="unit">
                <option value="كجم">كيلو جرام</option>
                <option value="طن">طن</option>
                <option value="لتر">لتر</option>
                <option value="برميل">برميل</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>الحالة</label>
            <select id="status">
                <option value="active">متاح</option>
                <option value="hidden">مخفي</option>
                <option value="sold">تم البيع</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>الصورة الحالية</label>
            <div id="currentImage" class="current-image"></div>
            <label>تغيير الصورة (اختياري)</label>
            <input type="file" id="productImage" accept="image/*">
            <div class="image-preview" id="imagePreview"></div>
        </div>
        
        <button type="submit">💾 حفظ التعديلات</button>
    </form>
    
    <div id="messageDiv"></div>
    <a href="supplier-dashboard.html" class="back-link">← العودة للوحة التحكم</a>
</div>
<div class="copyright">
    © جميع الحقوق محفوظة Hazem Mohamady 2026
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    
    const urlParams = new URLSearchParams(window.location.search)
    const productId = urlParams.get('id')
    let currentImageUrl = null
    
    // معاينة الصورة الجديدة
    document.getElementById('productImage').addEventListener('change', (e) => {
        const preview = document.getElementById('imagePreview')
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader()
            reader.onload = (event) => {
                preview.innerHTML = `<img src="${event.target.result}" style="max-width:200px; border-radius:16px;">`
            }
            reader.readAsDataURL(e.target.files[0])
        }
    })
    
    async function loadProduct() {
        if (!productId) {
            window.location.href = 'supplier-dashboard.html'
            return
        }
        
        const { data, error } = await supabase
            .from('products')
            .select('*')
            .eq('id', productId)
            .single()
        
        if (error || !data) {
            document.getElementById('messageDiv').innerHTML = `<div class="message error">❌ المنتج غير موجود</div>`
            return
        }
        
        currentImageUrl = data.image_url
        
        document.getElementById('name').value = data.name || ''
        document.getElementById('category').value = data.category || 'خامات'
        document.getElementById('description').value = data.description || ''
        document.getElementById('price').value = data.price || ''
        document.getElementById('unit').value = data.unit || 'كجم'
        document.getElementById('status').value = data.status || 'active'
        
        if (data.image_url) {
            document.getElementById('currentImage').innerHTML = `
                <p>الصورة الحالية:</p>
                <img src="${data.image_url}" style="max-width:150px; border-radius:12px;">
            `
        } else {
            document.getElementById('currentImage').innerHTML = '<p>لا توجد صورة حالية</p>'
        }
    }
    
    const form = document.getElementById('productForm')
    const messageDiv = document.getElementById('messageDiv')
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        messageDiv.innerHTML = '<div class="message">جاري الحفظ...</div>'
        
        // التحقق من تسجيل الدخول
        const { data: { user } } = await supabase.auth.getUser()
        if (!user) {
            messageDiv.innerHTML = '<div class="message error">❌ يجب تسجيل الدخول</div>'
            return
        }
        
        let imageUrl = currentImageUrl
        const file = document.getElementById('productImage').files[0]
        
        // رفع صورة جديدة إن وجدت
        if (file) {
            const fileName = `product_${Date.now()}_${file.name}`
            const { error: uploadError } = await supabase.storage
                .from('product-images')
                .upload(fileName, file)
            
            if (!uploadError) {
                const { data: urlData } = supabase.storage
                    .from('product-images')
                    .getPublicUrl(fileName)
                imageUrl = urlData.publicUrl
            }
        }
        
        // تحديث المنتج
        const { error } = await supabase
            .from('products')
            .update({
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value) || null,
                unit: document.getElementById('unit').value,
                status: document.getElementById('status').value,
                image_url: imageUrl
            })
            .eq('id', productId)
            .eq('supplier_id', user.id)
        
        if (error) {
            messageDiv.innerHTML = `<div class="message error">❌ ${error.message}</div>`
        } else {
            messageDiv.innerHTML = '<div class="message success">✅ تم تحديث المنتج بنجاح!</div>'
            setTimeout(() => {
                window.location.href = 'supplier-dashboard.html'
            }, 1500)
        }
    })
    
    loadProduct()
</script>
</body>
</html>
