<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --primary-50:  #eff6ff;
  --primary-100: #dbeafe;
  --primary-500: #3b82f6;
  --primary-600: #2563eb;
  --primary-700: #1d4ed8;
  --primary-800: #1e40af;
  --primary-900: #0f172a;

  --accent:      #10b981;
  --accent-dark: #059669;
  --amber:       #f59e0b;
  --rose:        #f43f5e;
  --violet:      #8b5cf6;
  --cyan:        #06b6d4;

  --bg:          #f8fafc;
  --surface:     #ffffff;
  --surface-2:   #f1f5f9;
  --border:      #e2e8f0;
  --text:        #0f172a;
  --text-muted:  #64748b;
  --text-sub:    #94a3b8;

  --shadow-sm:   0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-md:   0 4px 16px rgba(15, 23, 42, 0.08);
  --shadow-lg:   0 12px 32px rgba(15, 23, 42, 0.10);
  --shadow-xl:   0 24px 56px rgba(15, 23, 42, 0.14);
  --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.25);

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-xl: 32px;
  --r-full: 999px;

  --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --t-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  --t-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);

  --container: 1320px;
  --header-h: 72px;
}

[data-theme="dark"] {
  --bg:          #0a0f1c;
  --surface:     #111827;
  --surface-2:   #1f2937;
  --border:      #1e293b;
  --text:        #f1f5f9;
  --text-muted:  #94a3b8;
  --text-sub:    #64748b;
  --primary-50:  #1e293b;
  --primary-100: #334155;

  --shadow-sm:   0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-md:   0 4px 16px rgba(0, 0, 0, 0.5);
  --shadow-lg:   0 12px 32px rgba(0, 0, 0, 0.6);
  --shadow-xl:   0 24px 56px rgba(0, 0, 0, 0.7);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background-color var(--t-base), color var(--t-base);
}

img {
  max-width: 100%;
  display: block;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ============================================================
   PROGRESS
   ============================================================ */
.reading-progress {
  position: fixed;
  top: 0;
  right: 0;
  height: 3px;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--cyan), var(--primary-500));
  z-index: 9999;
  transition: width 0.08s linear;
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
}

/* ============================================================
   NAVBAR
   ============================================================ */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--header-h);
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  padding: 0 24px;
}

.navbar-inner {
  max-width: var(--container);
  width: 100%;
  height: 100%;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
  font-weight: 800;
  font-size: 20px;
}

.logo-img {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid rgba(59, 130, 246, 0.6);
  object-fit: cover;
  background: #fff;
  box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
}

.logo-text-blue { color: #60a5fa; }
.logo-text-gray { color: rgba(255, 255, 255, 0.55); font-weight: 400; font-size: 0.9em; }

.nav-links {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
}

.nav-links a {
  color: rgba(255, 255, 255, 0.75);
  padding: 9px 18px;
  border-radius: var(--r-full);
  font-weight: 600;
  font-size: 0.88rem;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all var(--t-fast);
}

.nav-links a:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  transform: translateY(-1px);
}

.nav-links a.active {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(16, 185, 129, 0.2));
  color: #60a5fa;
  border: 1px solid rgba(59, 130, 246, 0.3);
}

.theme-toggle {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.05rem;
  transition: all var(--t-fast);
}

.theme-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
  transform: rotate(20deg) scale(1.05);
}

.menu-toggle {
  display: none;
  width: 42px;
  height: 42px;
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}

/* ============================================================
   MAIN CONTAINER
   ============================================================ */
.main-container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 24px 24px 80px;
}

/* ============================================================
   PAGE LOADER
   ============================================================ */
.page-loader {
  text-align: center;
  padding: 100px 20px;
  background: var(--surface);
  border-radius: var(--r-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.spinner {
  width: 56px;
  height: 56px;
  border: 4px solid var(--border);
  border-top-color: var(--primary-500);
  border-right-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.page-loader h3 {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}

.page-loader p {
  font-size: 0.9rem;
  color: var(--text-muted);
}

/* ============================================================
   HERO
   ============================================================ */
.post-hero {
  position: relative;
  border-radius: var(--r-xl);
  padding: 64px 48px 56px;
  overflow: hidden;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
  color: #fff;
  box-shadow: var(--shadow-xl);
  margin-bottom: 32px;
}

.post-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 15% 25%, rgba(59, 130, 246, 0.3) 0%, transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(16, 185, 129, 0.25) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
  pointer-events: none;
}

.post-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 900px;
  margin: 0 auto;
}

.hero-category {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(16, 185, 129, 0.2));
  border: 1px solid rgba(96, 165, 250, 0.4);
  color: #93c5fd;
  padding: 8px 20px;
  border-radius: var(--r-full);
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 24px;
  backdrop-filter: blur(10px);
}

.hero-category i {
  color: #60a5fa;
}

.post-hero h1 {
  font-size: clamp(1.6rem, 4vw, 2.8rem);
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 24px;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-meta {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  padding-top: 24px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.hero-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.75);
  font-weight: 500;
}

.hero-meta-item i {
  color: #60a5fa;
  font-size: 0.9rem;
}

.hero-meta-item strong {
  color: #fff;
  font-weight: 800;
}

/* ============================================================
   FEATURED IMAGE
   ============================================================ */
.post-featured-image {
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 32px;
  box-shadow: var(--shadow-lg);
  aspect-ratio: 16 / 9;
  background: linear-gradient(135deg, var(--surface-2), var(--border));
  position: relative;
}

.post-featured-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.post-layout {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 36px;
  align-items: start;
}

.post-main {
  min-width: 0;
}

.post-sidebar {
  position: sticky;
  top: calc(var(--header-h) + 24px);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ============================================================
   BACK BUTTON
   ============================================================ */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--text-muted);
  font-weight: 700;
  font-size: 0.88rem;
  padding: 11px 20px;
  border-radius: var(--r-full);
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 24px;
  transition: all var(--t-fast);
  box-shadow: var(--shadow-sm);
}

.back-btn:hover {
  background: var(--primary-600);
  color: #fff;
  border-color: var(--primary-600);
  transform: translateX(-4px);
  box-shadow: var(--shadow-md);
}

/* ============================================================
   POST CONTENT
   ============================================================ */
.post-content {
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 44px 48px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font-size: 1.06rem;
  line-height: 2;
  color: var(--text-muted);
}

.post-content h1,
.post-content h2,
.post-content h3,
.post-content h4 {
  color: var(--text);
  font-weight: 900;
  line-height: 1.35;
  scroll-margin-top: calc(var(--header-h) + 20px);
}

.post-content h1 {
  font-size: 1.9rem;
  margin: 36px 0 18px;
}

.post-content h2 {
  font-size: 1.5rem;
  margin: 40px 0 18px;
  padding-right: 18px;
  border-right: 5px solid var(--accent);
  position: relative;
}

.post-content h3 {
  font-size: 1.22rem;
  margin: 30px 0 14px;
  color: var(--primary-600);
}

[data-theme="dark"] .post-content h3 {
  color: #60a5fa;
}

.post-content h4 {
  font-size: 1.08rem;
  margin: 24px 0 12px;
}

.post-content p {
  margin-bottom: 18px;
  color: var(--text-muted);
}

.post-content strong {
  color: var(--text);
  font-weight: 800;
}

.post-content em {
  font-style: italic;
  color: var(--primary-600);
}

.post-content a {
  color: var(--primary-600);
  font-weight: 700;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
  transition: color var(--t-fast);
}

.post-content a:hover {
  color: var(--accent-dark);
}

.post-content ul,
.post-content ol {
  margin: 16px 0 22px;
  padding-right: 30px;
}

.post-content li {
  margin-bottom: 12px;
  line-height: 1.9;
  color: var(--text-muted);
}

.post-content li::marker {
  color: var(--accent);
  font-weight: 900;
}

.post-content img {
  max-width: 100%;
  border-radius: var(--r-md);
  margin: 24px 0;
  box-shadow: var(--shadow-md);
}

.post-content blockquote {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(6, 182, 212, 0.04));
  border-right: 4px solid var(--accent);
  padding: 20px 24px;
  border-radius: var(--r-md);
  margin: 28px 0;
  font-style: italic;
  color: var(--text);
  font-size: 1.05rem;
}

.post-content code {
  background: var(--surface-2);
  color: var(--primary-700);
  padding: 3px 9px;
  border-radius: 6px;
  font-family: 'Courier New', monospace;
  font-size: 0.9em;
  border: 1px solid var(--border);
}

.post-content pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 22px;
  border-radius: var(--r-md);
  overflow-x: auto;
  margin: 24px 0;
  font-family: 'Courier New', monospace;
  font-size: 0.9rem;
  line-height: 1.7;
  box-shadow: var(--shadow-md);
}

.post-content pre code {
  background: transparent;
  color: inherit;
  padding: 0;
  border: none;
}

.post-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 24px 0;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.post-content table th,
.post-content table td {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  text-align: right;
}

.post-content table th {
  background: var(--surface-2);
  font-weight: 800;
  color: var(--text);
}

.post-content table td {
  color: var(--text-muted);
}

.post-content hr {
  border: none;
  height: 1px;
  background: var(--border);
  margin: 36px 0;
}

/* ============================================================
   TAGS
   ============================================================ */
.post-tags {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 36px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
  align-items: center;
}

.tags-label {
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: 8px;
}

.tags-label i {
  color: var(--accent);
}

.tag {
  background: linear-gradient(135deg, var(--primary-50), var(--primary-100));
  color: var(--primary-700);
  padding: 7px 16px;
  border-radius: var(--r-full);
  font-size: 0.78rem;
  font-weight: 700;
  transition: all var(--t-fast);
  border: 1px solid transparent;
}

[data-theme="dark"] .tag {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(59, 130, 246, 0.08));
  color: #93c5fd;
  border-color: rgba(59, 130, 246, 0.2);
}

.tag:hover {
  background: var(--primary-600);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

/* ============================================================
   SHARE
   ============================================================ */
.share-section {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 32px;
  padding: 24px 0 0;
  border-top: 1px solid var(--border);
}

.share-label {
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-left: 8px;
}

.share-label i {
  color: var(--accent);
}

.share-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 1.05rem;
  transition: all var(--t-fast);
  border: none;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

.share-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), transparent);
  opacity: 0;
  transition: opacity var(--t-fast);
}

.share-btn:hover {
  transform: translateY(-4px) scale(1.1);
  box-shadow: var(--shadow-md);
}

.share-btn:hover::before {
  opacity: 1;
}

.share-btn.facebook { background: linear-gradient(135deg, #1877f2, #0d5dbf); }
.share-btn.twitter { background: linear-gradient(135deg, #000000, #333333); }
.share-btn.whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); }
.share-btn.linkedin { background: linear-gradient(135deg, #0a66c2, #004182); }
.share-btn.copy { background: linear-gradient(135deg, #64748b, #475569); }

/* ============================================================
   AUTHOR CARD
   ============================================================ */
.author-card {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(16, 185, 129, 0.03));
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.author-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent 70%);
  pointer-events: none;
}

.author-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  position: relative;
}

.author-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-600), var(--primary-900));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  font-weight: 800;
  flex-shrink: 0;
  text-transform: uppercase;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
  border: 3px solid var(--surface);
}

.author-info {
  flex: 1;
  min-width: 0;
}

.author-name {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 3px;
}

.author-role {
  font-size: 0.75rem;
  color: var(--text-sub);
  font-weight: 600;
}

.author-bio {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.7;
}

/* ============================================================
   TOC
   ============================================================ */
.toc-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
}

.toc-title {
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--text);
  display: flex;
  align-items: center;

.toast.removing {

<script>
(function() {
  'use strict';

  // ============================================================
  // CONFIG
  // ============================================================
  const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA';
  const SITE_URL = 'https://chemato.vercel.app';

  // ============================================================
  // UTILS
  // ============================================================
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function stripHtml(html) {
    return String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
      return new Date(dateStr).toLocaleDateString('ar-EG', {
        year: 'numeric', month: 'long', day: 'numeric'
      });
    } catch (e) {
      return '';
    }
  }

  function readingTime(content) {
    if (!content) return '1 دقيقة';
    const words = String(content).replace(/<[^>]*>/g, '').split(/\s+/).length;
    const minutes = Math.max(1, Math.ceil(words / 200));
    return minutes + ' دقيقة';
  }

  function getSlug() {
    // من query string
    const params = new URLSearchParams(window.location.search);
    let slug = params.get('slug');
    if (slug) return slug;

    // من pathname /blog/xxx
    const match = window.location.pathname.match(/\/blog\/([^\/\?#]+)/);
    if (match && match[1]) return decodeURIComponent(match[1]);

    return null;
  }

  // ============================================================
  // THEME
  // ============================================================
  var THEME_KEY = 'chemato-theme';
  var themeIcon = document.getElementById('themeIcon');

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    if (themeIcon) {
      themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
  }

  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (prefersDark ? 'dark' : 'light');
    setTheme(theme);

    var toggle = document.getElementById('themeToggle');
    if (toggle) {
      toggle.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        setTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      });
    }
  }

  // ============================================================
  // TOAST
  // ============================================================
  function showToast(icon, title, desc) {
    var container = document.getElementById('toastContainer');
    if (!container) return;

    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML =
      '<div class="toast-icon">' + icon + '</div>' +
      '<div class="toast-content">' +
        '<div class="toast-title">' + title + '</div>' +
        '<div class="toast-desc">' + desc + '</div>' +
      '</div>' +
      '<button class="toast-close" aria-label="إغلاق"><i class="fas fa-times"></i></button>';

    toast.querySelector('.toast-close').addEventListener('click', function() {
      toast.classList.add('removing');
      setTimeout(function() { toast.remove(); }, 300);
    });

    container.appendChild(toast);
    setTimeout(function() {
      if (toast.parentNode) {
        toast.classList.add('removing');
        setTimeout(function() { toast.remove(); }, 300);
      }
    }, 5000);
  }

  // ============================================================
  // NAVBAR
  // ============================================================
  function initNavbar() {
    var menuToggle = document.getElementById('menuToggle');
    var navLinks = document.getElementById('navLinks');

    if (menuToggle && navLinks) {
      menuToggle.addEventListener('click', function() {
        var isOpen = navLinks.classList.toggle('open');
        menuToggle.innerHTML = isOpen
          ? '<i class="fas fa-times"></i>'
          : '<i class="fas fa-bars"></i>';
      });
    }
  }

  // ============================================================
  // READING PROGRESS
  // ============================================================
  function initReadingProgress() {
    var bar = document.getElementById('readingProgress');
    if (!bar) return;

    function update() {
      var ws = document.documentElement.scrollTop;
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var progress = h > 0 ? (ws / h) * 100 : 0;
      bar.style.width = progress + '%';
    }

    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    update();
  }

  // ============================================================
  // SCROLL TOP
  // ============================================================
  function initScrollTop() {
    var btn = document.getElementById('scrollTopBtn');
    if (!btn) return;

    window.addEventListener('scroll', function() {
      btn.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });

    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // ============================================================
  // UPDATE META TAGS
  // ============================================================
  function updateMetaTags(post) {
    var title = post.title || 'مقال';
    var description = (post.excerpt || stripHtml(post.content).substring(0, 160) || '').substring(0, 160);
    var image = (post.image_url && /^https?:\/\//i.test(post.image_url))
      ? post.image_url
      : SITE_URL + '/og-default.jpg';
    var canonical = SITE_URL + '/blog-post.html?slug=' + encodeURIComponent(post.slug || post.id);

    document.title = title + ' | كيماتو';

    function setMeta(id, content) {
      var el = document.getElementById(id);
      if (el) el.setAttribute('content', content);
    }

    setMeta('pageDescription', description);
    setMeta('ogTitle', title);
    setMeta('ogDescription', description);
    setMeta('ogImage', image);
    setMeta('ogUrl', canonical);
    setMeta('twTitle', title);
    setMeta('twDescription', description);
    setMeta('twImage', image);

    var canonicalEl = document.getElementById('pageCanonical');
    if (canonicalEl) canonicalEl.setAttribute('href', canonical);

    // Schema.org
    try {
      var schema = document.createElement('script');
      schema.type = 'application/ld+json';
      schema.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": title,
        "description": description,
        "image": image,
        "datePublished": post.published_at || post.created_at,
        "dateModified": post.updated_at || post.created_at,
        "author": { "@type": "Person", "name": post.author_name || "كيماتو" },
        "publisher": {
          "@type": "Organization",
          "name": "كيماتو",
          "logo": { "@type": "ImageObject", "url": SITE_URL + "/logo.png" }
        },
        "mainEntityOfPage": { "@type": "WebPage", "@id": canonical }
      });
      document.head.appendChild(schema);
    } catch (e) {}
  }

  // ============================================================
  // BUILD TOC
  // ============================================================
  function buildTOC() {
    var container = document.getElementById('tocList');
    var card = document.getElementById('tocCard');
    if (!container) return;

    var contentEl = document.querySelector('.post-content');
    if (!contentEl) return;

    var headings = contentEl.querySelectorAll('h2, h3');
    if (!headings.length) {
      if (card) card.style.display = 'none';
      return;
    }

    var html = '';
    for (var i = 0; i < headings.length; i++) {
      var h = headings[i];
      var id = 'heading-' + i;
      h.id = id;
      var isH3 = h.tagName === 'H3';
      var text = h.textContent.trim().substring(0, 60);
      html += '<a href="#' + id + '" class="toc-link' + (isH3 ? ' h3' : '') + '" data-target="' + id + '">' +
        '<span class="toc-dot"></span>' +
        escapeHtml(text) +
      '</a>';
    }
    container.innerHTML = html;

    var links = container.querySelectorAll('.toc-link');
    for (var j = 0; j < links.length; j++) {
      links[j].addEventListener('click', function(e) {
        e.preventDefault();
        var target = document.getElementById(this.dataset.target);
        if (target) {
          var top = target.getBoundingClientRect().top + window.scrollY - 90;
          window.scrollTo({ top: top, behavior: 'smooth' });
        }
      });
    }

    // Active state
    if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            var id = entry.target.id;
            for (var k = 0; k < links.length; k++) {
              links[k].classList.toggle('active', links[k].dataset.target === id);
            }
          }
        });
      }, { rootMargin: '-100px 0px -70% 0px', threshold: 0 });

      for (var l = 0; l < headings.length; l++) {
        observer.observe(headings[l]);
      }
    }
  }

  // ============================================================
  // SHARE
  // ============================================================
  function bindShareButtons() {
    var buttons = document.querySelectorAll('[data-share]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function() {
        handleShare(this.dataset.share);
      });
    }
  }

  function handleShare(type) {
    var url = window.location.href;
    var title = document.title;

    try {
      if (type === 'facebook') {
        window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank', 'noopener,noreferrer');
      } else if (type === 'twitter') {
        window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(title) + '&url=' + encodeURIComponent(url), '_blank', 'noopener,noreferrer');
      } else if (type === 'whatsapp') {
        window.open('https://wa.me/?text=' + encodeURIComponent(title + '\n' + url), '_blank', 'noopener,noreferrer');
      } else if (type === 'linkedin') {
        window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(url), '_blank', 'noopener,noreferrer');
      } else if (type === 'copy') {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function() {
            showToast('📋', 'تم النسخ!', 'تم نسخ رابط المقال');
          });
        }
      }
    } catch (e) {}
  }

  // ============================================================
  // RENDER POST
  // ============================================================
  function renderPost(post) {
    var container = document.getElementById('pageContent');
    if (!container) return;

    var authorName = post.author_name || 'كيماتو';
    var authorInitial = (authorName || 'ك').charAt(0).toUpperCase();
    var hasImage = post.image_url && /^https?:\/\//i.test(post.image_url);
    var tags = Array.isArray(post.tags) ? post.tags : [];
    var readTime = readingTime(post.content);

    var tagsHtml = '';
    if (tags.length > 0) {
      var tagsInner = '';
      for (var i = 0; i < tags.length; i++) {
        tagsInner += '<span class="tag">#' + escapeHtml(tags[i]) + '</span>';
      }
      tagsHtml = '<div class="post-tags">' +
        '<span class="tags-label"><i class="fas fa-tags"></i> الوسوم:</span>' +
        tagsInner +
      '</div>';
    }

    var html = '';

    // Back button
    html += '<a href="blog.html" class="back-btn">' +
      '<i class="fas fa-arrow-right"></i> العودة إلى المدونة' +
    '</a>';

    // Hero
    html += '<section class="post-hero">' +
      '<div class="hero-content">' +
        (post.category ? '<span class="hero-category"><i class="fas fa-tag"></i> ' + escapeHtml(post.category) + '</span>' : '') +
        '<h1>' + escapeHtml(post.title) + '</h1>' +
        '<div class="hero-meta">' +
          '<span class="hero-meta-item">' +
            '<i class="fas fa-calendar"></i> ' + formatDate(post.published_at || post.created_at) +
          '</span>' +
          (authorName ? '<span class="hero-meta-item"><i class="fas fa-user"></i> <strong>' + escapeHtml(authorName) + '</strong></span>' : '') +
          '<span class="hero-meta-item">' +
            '<i class="fas fa-clock"></i> ' + readTime + ' قراءة' +
          '</span>' +
          '<span class="hero-meta-item">' +
            '<i class="fas fa-eye"></i> <strong>' + Number(post.views || 0).toLocaleString('ar-EG') + '</strong> مشاهدة' +
          '</span>' +
        '</div>' +
      '</div>' +
    '</section>';

    // Featured image
    if (hasImage) {
      html += '<div class="post-featured-image">' +
        '<img src="' + escapeHtml(post.image_url) + '" alt="' + escapeHtml(post.title) + '" loading="eager">' +
      '</div>';
    }

    // Layout
    html += '<div class="post-layout">';

    // Main content
    html += '<div class="post-main">' +
      '<article class="post-content">' +
        (post.content || post.excerpt || '<p>لا يوجد محتوى متاح.</p>') +
        tagsHtml +
        '<div class="share-section">' +
          '<span class="share-label"><i class="fas fa-share-alt"></i> شارك المقال:</span>' +
          '<button class="share-btn facebook" data-share="facebook" type="button" aria-label="فيسبوك"><i class="fab fa-facebook-f"></i></button>' +
          '<button class="share-btn twitter" data-share="twitter" type="button" aria-label="تويتر"><i class="fab fa-twitter"></i></button>' +
          '<button class="share-btn whatsapp" data-share="whatsapp" type="button" aria-label="واتساب"><i class="fab fa-whatsapp"></i></button>' +
          '<button class="share-btn linkedin" data-share="linkedin" type="button" aria-label="لينكد إن"><i class="fab fa-linkedin-in"></i></button>' +
          '<button class="share-btn copy" data-share="copy" type="button" aria-label="نسخ"><i class="fas fa-link"></i></button>' +
        '</div>' +
      '</article>' +
    '</div>';

    // Sidebar
    html += '<aside class="post-sidebar">' +
      '<div class="author-card">' +
        '<div class="author-header">' +
          '<div class="author-avatar">' + authorInitial + '</div>' +
          '<div class="author-info">' +
            '<div class="author-name">' + escapeHtml(authorName) + '</div>' +
            '<div class="author-role">محرر في كيماتو</div>' +
          '</div>' +
        '</div>' +
        '<p class="author-bio">ننشر مقالات متخصصة عن سوق المواد الكيميائية في مصر والشرق الأوسط.</p>' +
      '</div>' +
      '<div class="toc-card" id="tocCard">' +
        '<div class="toc-title"><i class="fas fa-list-ul"></i> محتويات المقال</div>' +
        '<div class="toc-list" id="tocList"></div>' +
      '</div>' +
      '<div class="sidebar-share">' +
        '<div class="sidebar-share-title"><i class="fas fa-share-alt"></i> شارك المقال</div>' +
        '<div class="sidebar-share-buttons">' +
          '<button class="share-btn facebook" data-share="facebook" type="button"><i class="fab fa-facebook-f"></i></button>' +
          '<button class="share-btn twitter" data-share="twitter" type="button"><i class="fab fa-twitter"></i></button>' +
          '<button class="share-btn whatsapp" data-share="whatsapp" type="button"><i class="fab fa-whatsapp"></i></button>' +
          '<button class="share-btn copy" data-share="copy" type="button"><i class="fas fa-link"></i></button>' +
        '</div>' +
      '</div>' +
    '</aside>';

    html += '</div>'; // end layout

    // Related section
    html += '<section class="related-section" id="relatedSection" style="display:none;">' +
      '<div class="related-header">' +
        '<i class="fas fa-newspaper"></i>' +
        '<h2>مقالات ذات صلة</h2>' +
      '</div>' +
      '<div class="related-grid" id="relatedGrid"></div>' +
    '</section>';

    container.innerHTML = html;

    buildTOC();
    bindShareButtons();
  }

  // ============================================================
  // RENDER ERROR
  // ============================================================
  function renderError(title, desc) {
    var container = document.getElementById('pageContent');
    if (!container) return;
    container.innerHTML =
      '<div class="error-state">' +
        '<i class="fas fa-newspaper"></i>' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(desc) + '</p>' +
        '<a href="blog.html" class="btn-back-home">' +
          '<i class="fas fa-arrow-right"></i> العودة للمدونة' +
        '</a>' +
      '</div>';
  }

  // ============================================================
  // FETCH FROM SUPABASE (باستخدام REST API مباشرة)
  // ============================================================
  function fetchPost(slug) {
    var url = SUPABASE_URL + '/rest/v1/blog_posts' +
      '?slug=eq.' + encodeURIComponent(slug) +
      '&status=eq.published' +
      '&select=*' +
      '&limit=1';

    return fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Accept': 'application/json'
      }
    }).then(function(response) {
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      return response.json();
    }).then(function(posts) {
      if (!posts || !posts[0]) return null;
      return posts[0];
    });
  }

  function fetchRelatedPosts(category, excludeId) {
    var baseUrl = SUPABASE_URL + '/rest/v1/blog_posts' +
      '?status=eq.published' +
      '&id=neq.' + excludeId +
      '&select=id,title,slug,image_url,category,published_at,created_at' +
      '&order=published_at.desc.nullslast' +
      '&limit=3';

    if (category) {
      baseUrl += '&category=eq.' + encodeURIComponent(category);
    }

    return fetch(baseUrl, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    }).then(function(r) { return r.json(); }).catch(function() { return []; });
  }

  function incrementViews(postId) {
    fetch(SUPABASE_URL + '/rest/v1/blog_posts?id=eq.' + postId, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ views: 999 })
    }).catch(function() {});
  }

  // ============================================================
  // LOAD RELATED
  // ============================================================
  function loadRelatedPosts(post) {
    fetchRelatedPosts(post.category, post.id).then(function(posts) {
      if (!posts || !posts.length) {
        // حاول بكل المقالات
        return fetchRelatedPosts(null, post.id);
      }
      return posts;
    }).then(function(posts) {
      if (!posts || !posts.length) return;

      var section = document.getElementById('relatedSection');
      var grid = document.getElementById('relatedGrid');
      if (!section || !grid) return;

      section.style.display = 'block';

      var html = '';
      for (var i = 0; i < posts.length; i++) {
        var p = posts[i];
        var hasImg = p.image_url && /^https?:\/\//i.test(p.image_url);
        html += '<a href="blog-post.html?slug=' + encodeURIComponent(p.slug || p.id) + '" class="related-card">' +
          '<div class="related-card-media">' +
            (hasImg
              ? '<img src="' + escapeHtml(p.image_url) + '" alt="' + escapeHtml(p.title) + '" loading="lazy">'
              : '<div class="related-placeholder">📰</div>') +
          '</div>' +
          '<div class="related-card-body">' +
            (p.category
              ? '<span class="related-card-category"><i class="fas fa-tag"></i> ' + escapeHtml(p.category) + '</span>'
              : '') +
            '<h3 class="related-card-title">' + escapeHtml(p.title) + '</h3>' +
            '<div class="related-card-meta">' +
              '<span><i class="fas fa-calendar"></i> ' + formatDate(p.published_at || p.created_at) + '</span>' +
            '</div>' +
          '</div>' +
        '</a>';
      }
      grid.innerHTML = html;
    }).catch(function() {});
  }

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    console.log('🚀 كيماتو | المقال');

    initTheme();
    initNavbar();
    initReadingProgress();
    initScrollTop();

    var slug = getSlug();
    console.log('📍 Slug:', slug);

    if (!slug) {
      renderError('رابط غير صحيح', 'لم يتم تحديد المقال المطلوب.');
      return;
    }

    console.log('🔄 Fetching post...');

    fetchPost(slug)
      .then(function(post) {
        if (!post) {
          console.log('❌ Post not found');
          renderError('المقال غير موجود', 'ربما تم حذفه أو لم يتم نشره بعد.');
          return;
        }

        console.log('✅ Post loaded:', post.title);
        updateMetaTags(post);
        renderPost(post);
        loadRelatedPosts(post);
        incrementViews(post.id);
      })
      .catch(function(err) {
        console.error('❌ Error:', err);
        renderError('حدث خطأ', 'تعذر تحميل المقال: ' + err.message);
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
