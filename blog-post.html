    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" />

    <style>
        :root {
            --c-primary-50:  #eef6fc;
            --c-primary-100: #d4e7f5;
            --c-primary-500: #2c7ab8;
            --c-primary-600: #1d5b8e;
            --c-primary-700: #144167;
            --c-primary-800: #0d2e4a;
            --c-primary-900: #0a2540;
            --c-accent:      #2ecc71;
            --c-accent-dark: #22a95c;
            --c-warning:     #f39c12;
            --c-danger:      #e74c3c;
            --c-whatsapp:    #25D366;
            --c-purple:      #8b5cf6;
            --c-facebook:    #1877f2;
            --c-twitter:     #000;
            --c-linkedin:    #0a66c2;
            --c-bg:          #f6f8fb;
            --c-surface:     #ffffff;
            --c-surface-2:   #f9fbfd;
            --c-border:      #e3eaf2;
            --c-text:        #0a1f33;
            --c-text-muted:  #5a6b7e;
            --c-text-sub:    #8595a8;
            --sh-sm:  0 1px 3px rgba(10, 37, 64, 0.06);
            --sh-md:  0 4px 16px rgba(10, 37, 64, 0.08);
            --sh-lg:  0 12px 32px rgba(10, 37, 64, 0.10);
            --sh-xl:  0 20px 48px rgba(10, 37, 64, 0.14);
            --r-sm: 8px;
            --r-md: 14px;
            --r-lg: 20px;
            --r-xl: 28px;
            --r-full: 999px;
            --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            --container: 1320px;
            --content-w: 760px;
            --header-h: 68px;
        }

        [data-theme="dark"] {
            --c-bg:         #0a1520;
            --c-surface:    #101e2e;
            --c-surface-2:  #16273a;
            --c-border:     #1f3349;
            --c-text:       #e8eef5;
            --c-text-muted: #9fb1c4;
            --c-text-sub:   #6e8298;
            --sh-sm:  0 1px 3px rgba(0, 0, 0, 0.3);
            --sh-md:  0 4px 16px rgba(0, 0, 0, 0.35);
            --sh-lg:  0 12px 32px rgba(0, 0, 0, 0.45);
            --sh-xl:  0 20px 48px rgba(0, 0, 0, 0.55);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--c-bg);
            color: var(--c-text);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--t-base), color var(--t-base);
        }

        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        a { color: inherit; text-decoration: none; }
        input, select, textarea { font-family: inherit; }

        :focus-visible {
            outline: 3px solid var(--c-primary-500);
            outline-offset: 2px;
            border-radius: var(--r-sm);
        }

        .skip-link {
            position: absolute; top: -100px; right: 16px;
            background: var(--c-primary-900); color: #fff;
            padding: 12px 20px; border-radius: var(--r-md);
            z-index: 9999; transition: top var(--t-fast);
        }
        .skip-link:focus { top: 16px; }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .animate-in { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

        /* ============================================================
           READING PROGRESS
           ============================================================ */
        .reading-progress {
            position: fixed;
            top: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--c-verified, #1e88e5), var(--c-accent));
            z-index: 9999;
            width: 0;
            transition: width 0.1s linear;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 37, 64, 0.88);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 24px;
            height: var(--header-h);
        }
        .navbar-inner {
            max-width: var(--container); width: 100%;
            margin: 0 auto; height: 100%;
            display: flex; justify-content: space-between;
            align-items: center; gap: 16px;
        }
        .logo a { display: flex; align-items: center; gap: 10px; color: #fff; }
        .logo img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(30, 136, 229, 0.5); object-fit: cover; background: #fff; }
        .logo-text { font-weight: 800; font-size: 19px; color: #fff; white-space: nowrap; }
        .logo-text .blue { color: #5eb8ee; }
        .logo-text .gray { color: rgba(255, 255, 255, 0.6); font-weight: 400; font-size: 0.9em; }

        .nav-links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .nav-links a, .dropdown-btn {
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: var(--r-full);
            font-weight: 600; font-size: 0.88rem;
            transition: all var(--t-fast);
            display: inline-flex; align-items: center; gap: 6px;
            background: transparent;
        }
        .nav-links a:hover, .dropdown-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-links a.active { background: rgba(30, 136, 229, 0.18); color: #7ec8e3; }

        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all var(--t-fast);
        }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.15); transform: rotate(15deg); }

        .dropdown { position: relative; }
        .dropdown-content {
            position: absolute; top: calc(100% + 8px); left: 0;
            background: var(--c-surface); min-width: 220px;
            border-radius: var(--r-md); box-shadow: var(--sh-xl);
            border: 1px solid var(--c-border); overflow: hidden;
            opacity: 0; visibility: hidden;
            transform: translateY(-8px);
            transition: all var(--t-base); z-index: 1000;
        }
        .dropdown-content.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-content a {
            color: var(--c-text); padding: 12px 18px;
            display: flex; align-items: center; gap: 10px;
            font-size: 0.9rem; font-weight: 500;
            border-bottom: 1px solid var(--c-border);
            transition: all var(--t-fast);
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background: var(--c-surface-2); color: var(--c-primary-600); padding-right: 24px; }
        .dropdown-content a.logout { color: var(--c-danger); }

        .menu-toggle {
            display: none; width: 42px; height: 42px;
            border-radius: var(--r-md);
            background: rgba(255, 255, 255, 0.08); color: #fff;
            align-items: center; justify-content: center; font-size: 1.1rem;
        }

        /* ============================================================
           MAIN
           ============================================================ */
        .main-container { max-width: var(--container); margin: 0 auto; padding: 20px 24px 60px; }

        /* ============================================================
           BACK BUTTON
           ============================================================ */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--c-text-muted);
            font-weight: 700;
            font-size: 0.88rem;
            padding: 10px 18px;
            border-radius: var(--r-full);
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            margin-bottom: 20px;
            transition: all var(--t-fast);
        }
        .back-btn:hover {
            background: var(--c-primary-600);
            color: #fff;
            border-color: transparent;
            transform: translateX(-3px);
        }

        /* ============================================================
           HERO HEADER
           ============================================================ */
        .post-hero {
            position: relative;
            border-radius: var(--r-xl);
            padding: 48px 40px 40px;
            overflow: hidden;
            background:
                radial-gradient(ellipse at top right, rgba(30, 136, 229, 0.20), transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(46, 204, 113, 0.10), transparent 50%),
                linear-gradient(135deg, #0a1f3a 0%, #1a2942 100%);
            color: #fff;
            box-shadow: var(--sh-xl);
            margin-bottom: 24px;
        }
        .post-hero::before {
            content: '';
            position: absolute; inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle at 80% 60%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px, 60px 60px;
            pointer-events: none;
        }
        .post-hero-content { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

        .post-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(30, 136, 229, 0.20);
            border: 1px solid rgba(30, 136, 229, 0.35);
            color: #7ec8e3;
            padding: 6px 16px;
            border-radius: var(--r-full);
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .post-hero h1 {
            font-size: clamp(1.5rem, 3.5vw, 2.4rem);
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 18px;
            letter-spacing: -0.5px;
        }

        .post-hero-meta {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .post-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }
        .post-meta-item i { color: #7ec8e3; font-size: 0.85rem; }
        .post-meta-item strong { color: #fff; font-weight: 800; }

        /* ============================================================
           FEATURED IMAGE
           ============================================================ */
        .post-featured-image {
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: var(--sh-lg);
            aspect-ratio: 16 / 9;
            background: linear-gradient(145deg, var(--c-surface-2), var(--c-border));
        }
        .post-featured-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .post-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 32px;
            align-items: start;
        }

        .post-main { min-width: 0; }

        .post-sidebar {
            position: sticky;
            top: calc(var(--header-h) + 24px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ============================================================
           ARTICLE CONTENT
           ============================================================ */
        .post-content {
            background: var(--c-surface);
            border-radius: var(--r-lg);
            padding: 40px 44px;
            border: 1px solid var(--c-border);
            box-shadow: var(--sh-sm);
            font-size: 1.05rem;
            line-height: 2;
            color: var(--c-text-muted);
        }

        .post-content > *:first-child { margin-top: 0; }
        .post-content > *:last-child { margin-bottom: 0; }

        .post-content h1,
        .post-content h2,
        .post-content h3,
        .post-content h4 {
            color: var(--c-text);
            font-weight: 900;
            line-height: 1.35;
            scroll-margin-top: calc(var(--header-h) + 20px);
        }

        .post-content h1 { font-size: 1.9rem; margin: 32px 0 16px; }
        .post-content h2 {
            font-size: 1.55rem;
            margin: 36px 0 16px;
            padding-right: 16px;
            border-right: 5px solid var(--c-accent);
        }
        .post-content h3 {
            font-size: 1.25rem;
            margin: 28px 0 12px;
            color: var(--c-primary-700);
        }
        [data-theme="dark"] .post-content h3 { color: #7ec8e3; }
        .post-content h4 {
            font-size: 1.1rem;
            margin: 22px 0 10px;
        }

        .post-content p {
            margin-bottom: 18px;
            color: var(--c-text-muted);
        }

        .post-content strong { color: var(--c-text); font-weight: 800; }
        .post-content em { font-style: italic; color: var(--c-primary-600); }
        .post-content a {
            color: var(--c-primary-600);
            font-weight: 700;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            transition: color var(--t-fast);
        }
        .post-content a:hover { color: var(--c-accent-dark); }

        .post-content ul,
        .post-content ol {
            margin: 14px 0 20px;
            padding-right: 28px;
        }
        .post-content li {
            margin-bottom: 10px;
            line-height: 1.9;
            color: var(--c-text-muted);
        }
        .post-content li::marker { color: var(--c-accent); font-weight: 900; }

        .post-content img {
            max-width: 100%;
            border-radius: var(--r-md);
            margin: 20px 0;
            box-shadow: var(--sh-md);
        }

        .post-content blockquote {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.06), rgba(46, 204, 113, 0.02));
            border-right: 4px solid var(--c-accent);
            padding: 18px 22px;
            border-radius: var(--r-md);
            margin: 24px 0;
            font-style: italic;
            color: var(--c-text);
        }

        .post-content code {
            background: var(--c-surface-2);
            color: var(--c-primary-700);
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border: 1px solid var(--c-border);
        }
        [data-theme="dark"] .post-content code { color: #7ec8e3; }

        .post-content pre {
            background: var(--c-primary-900);
            color: #e8eef5;
            padding: 20px;
            border-radius: var(--r-md);
            overflow-x: auto;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .post-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            border: none;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            border-radius: var(--r-md);
            overflow: hidden;
            box-shadow: var(--sh-sm);
        }
        .post-content table th,
        .post-content table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--c-border);
            text-align: right;
        }
        .post-content table th {
            background: var(--c-surface-2);
            font-weight: 800;
            color: var(--c-text);
        }
        .post-content table td { color: var(--c-text-muted); }
        .post-content table tr:last-child td { border-bottom: none; }

        .post-content hr {
            border: none;
            height: 1px;
            background: var(--c-border);
            margin: 32px 0;
        }

        /* ============================================================
           TAGS
           ============================================================ */
        .post-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--c-border);
            align-items: center;
        }
        .post-tags .tags-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }
        .tag {
            background: var(--c-primary-50);
            color: var(--c-primary-700);
            padding: 6px 14px;
            border-radius: var(--r-full);
            font-size: 0.75rem;
            font-weight: 700;
            transition: all var(--t-fast);
            border: 1px solid transparent;
        }
        [data-theme="dark"] .tag {
            background: rgba(44, 122, 184, 0.15);
            color: #7ec8e3;
        }
        .tag:hover {
            background: var(--c-primary-600);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ============================================================
           SHARE SECTION (Inline)
           ============================================================ */
        .share-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding: 20px 0 0;
            border-top: 1px solid var(--c-border);
        }
        .share-section .share-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }
        .share-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            transition: all var(--t-fast);
            border: none;
            cursor: pointer;
            box-shadow: var(--sh-sm);
        }
        .share-btn:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: var(--sh-md);
        }
        .share-btn.facebook { background: var(--c-facebook); }
        .share-btn.twitter { background: var(--c-twitter); }
        .share-btn.whatsapp { background: var(--c-whatsapp); }
        .share-btn.linkedin { background: var(--c-linkedin); }
        .share-btn.copy { background: var(--c-text-muted); }

        /* ============================================================
           AUTHOR CARD
           ============================================================ */
        .author-card {
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.04), rgba(46, 204, 113, 0.02));
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 20px;
        }
        .author-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .author-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--c-primary-600), var(--c-primary-900));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .author-info { flex: 1; min-width: 0; }
        .author-name {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 2px;
        }
        .author-role {
            font-size: 0.72rem;
            color: var(--c-text-sub);
            font-weight: 600;
        }
        .author-bio {
            font-size: 0.82rem;
            color: var(--c-text-muted);
            line-height: 1.6;
        }

        /* ============================================================
           TOC
           ============================================================ */
        .toc-card {
            background: var(--c-surface);
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 18px 20px;
        }
        .toc-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--c-border);
        }
        .toc-title i { color: var(--c-accent); }
        .toc-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .toc-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: var(--r-sm);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--c-text-muted);
            transition: all var(--t-fast);
