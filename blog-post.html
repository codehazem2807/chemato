    <style>
        :root {
            --c-primary-50: #eef6fc;
            --c-primary-100: #d4e7f5;
            --c-primary-500: #2c7ab8;
            --c-primary-600: #1d5b8e;
            --c-primary-700: #144167;
            --c-primary-800: #0d2e4a;
            --c-primary-900: #0a2540;
            --c-accent: #2ecc71;
            --c-accent-dark: #22a95c;
            --c-warning: #f39c12;
            --c-danger: #e74c3c;
            --c-whatsapp: #25D366;
            --c-purple: #8b5cf6;
            --c-verified: #1e88e5;
            --c-facebook: #1877f2;
            --c-twitter: #000000;
            --c-linkedin: #0a66c2;
            --c-bg: #f6f8fb;
            --c-surface: #ffffff;
            --c-surface-2: #f9fbfd;
            --c-border: #e3eaf2;
            --c-text: #0a1f33;
            --c-text-muted: #5a6b7e;
            --c-text-sub: #8595a8;
            --sh-sm: 0 1px 3px rgba(10, 37, 64, 0.06);
            --sh-md: 0 4px 16px rgba(10, 37, 64, 0.08);
            --sh-lg: 0 12px 32px rgba(10, 37, 64, 0.10);
            --sh-xl: 0 20px 48px rgba(10, 37, 64, 0.14);
            --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
            --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            --container: 1320px;
            --header-h: 68px;
        }

        [data-theme="dark"] {
            --c-bg: #0a1520;
            --c-surface: #101e2e;
            --c-surface-2: #16273a;
            --c-border: #1f3349;
            --c-text: #e8eef5;
            --c-text-muted: #9fb1c4;
            --c-text-sub: #6e8298;
            --sh-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --sh-md: 0 4px 16px rgba(0, 0, 0, 0.35);
            --sh-lg: 0 12px 32px rgba(0, 0, 0, 0.45);
            --sh-xl: 0 20px 48px rgba(0, 0, 0, 0.55);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--c-bg);
            color: var(--c-text);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--t-base), color var(--t-base);
        }

        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        a { color: inherit; text-decoration: none; }

        .reading-progress {
            position: fixed; top: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--c-verified), var(--c-accent));
            z-index: 9999; width: 0;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .animate-in { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 37, 64, 0.88);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 24px; height: var(--header-h);
        }
        .navbar-inner {
            max-width: var(--container); width: 100%;
            margin: 0 auto; height: 100%;
            display: flex; justify-content: space-between;
            align-items: center; gap: 16px;
        }
        .logo a { display: flex; align-items: center; gap: 10px; color: #fff; }
        .logo img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(30, 136, 229, 0.5); object-fit: cover; background: #fff; }
        .logo-text { font-weight: 800; font-size: 19px; color: #fff; white-space: nowrap; }
        .logo-text .blue { color: #5eb8ee; }
        .logo-text .gray { color: rgba(255, 255, 255, 0.6); font-weight: 400; font-size: 0.9em; }

        .nav-links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .nav-links a, .dropdown-btn {
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 16px; border-radius: var(--r-full);
            font-weight: 600; font-size: 0.88rem;
            display: inline-flex; align-items: center; gap: 6px;
            background: transparent; transition: all 0.15s;
        }
        .nav-links a:hover, .dropdown-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-links a.active { background: rgba(30, 136, 229, 0.18); color: #7ec8e3; }

        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all 0.15s;
        }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.15); transform: rotate(15deg); }

        .dropdown { position: relative; }
        .dropdown-content {
            position: absolute; top: calc(100% + 8px); left: 0;
            background: var(--c-surface); min-width: 220px;
            border-radius: var(--r-md); box-shadow: var(--sh-xl);
            border: 1px solid var(--c-border); overflow: hidden;
            opacity: 0; visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s; z-index: 1000;
        }
        .dropdown-content.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-content a {
            color: var(--c-text); padding: 12px 18px;
            display: flex; align-items: center; gap: 10px;
            font-size: 0.9rem; font-weight: 500;
            border-bottom: 1px solid var(--c-border);
            transition: all 0.15s;
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background: var(--c-surface-2); color: var(--c-primary-600); padding-right: 24px; }
        .dropdown-content a.logout { color: var(--c-danger); }

        .menu-toggle {
            display: none; width: 42px; height: 42px;
            border-radius: var(--r-md);
            background: rgba(255, 255, 255, 0.08); color: #fff;
            align-items: center; justify-content: center; font-size: 1.1rem;
        }

        .main-container { max-width: var(--container); margin: 0 auto; padding: 20px 24px 60px; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--c-text-muted); font-weight: 700; font-size: 0.88rem;
            padding: 10px 18px; border-radius: var(--r-full);
            background: var(--c-surface); border: 1px solid var(--c-border);
            margin-bottom: 20px;
            transition: all 0.15s;
        }
        .back-btn:hover {
            background: var(--c-primary-600);
            color: #fff;
            border-color: transparent;
            transform: translateX(-3px);
        }

        .post-hero {
            position: relative;
            border-radius: var(--r-xl);
            padding: 48px 40px 40px;
            overflow: hidden;
            background:
                radial-gradient(ellipse at top right, rgba(30, 136, 229, 0.20), transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(46, 204, 113, 0.10), transparent 50%),
                linear-gradient(135deg, #0a1f3a 0%, #1a2942 100%);
            color: #fff;
            box-shadow: var(--sh-xl);
            margin-bottom: 24px;
        }
        .post-hero::before {
            content: '';
            position: absolute; inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle at 80% 60%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px, 60px 60px;
            pointer-events: none;
        }
        .post-hero-bg-icons {
            position: absolute; inset: 0;
            overflow: hidden; pointer-events: none; z-index: 0;
        }
        .post-hero-bg-icons .icon-float {
            position: absolute; font-size: 2.4rem;
            opacity: 0.08; animation: float 6s ease-in-out infinite;
        }
        .post-hero-bg-icons .icon-float.rotate { animation: rotateSlow 30s linear infinite; }
        .post-hero-bg-icons .icon-float:nth-child(1) { top: 12%; left: 6%; font-size: 3rem; animation-delay: 0s; }
        .post-hero-bg-icons .icon-float:nth-child(2) { top: 18%; right: 8%; font-size: 3.6rem; animation-delay: 1s; }
        .post-hero-bg-icons .icon-float:nth-child(3) { bottom: 30%; left: 10%; font-size: 2.6rem; animation-delay: 2s; }
        .post-hero-bg-icons .icon-float:nth-child(4) { bottom: 12%; right: 6%; font-size: 3rem; animation-delay: 0.5s; }

        .post-hero-content { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

        .post-category {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(30, 136, 229, 0.20);
            border: 1px solid rgba(30, 136, 229, 0.35);
            color: #7ec8e3;
            padding: 6px 16px; border-radius: var(--r-full);
            font-size: 0.78rem; font-weight: 700;
            margin-bottom: 18px;
        }

        .post-hero h1 {
            font-size: clamp(1.5rem, 3.5vw, 2.4rem);
            font-weight: 900; line-height: 1.25;
            margin-bottom: 18px; letter-spacing: -0.5px;
        }

        .post-hero-meta {
            display: flex; gap: 18px; flex-wrap: wrap;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .post-meta-item {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.82rem; color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }
        .post-meta-item i { color: #7ec8e3; font-size: 0.85rem; }
        .post-meta-item strong { color: #fff; font-weight: 800; }

        .post-featured-image {
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: var(--sh-lg);
            aspect-ratio: 16 / 9;
            background: linear-gradient(145deg, var(--c-surface-2), var(--c-border));
        }
        .post-featured-image img { width: 100%; height: 100%; object-fit: cover; }

        .post-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 32px;
            align-items: start;
        }

        .post-main { min-width: 0; }

        .post-sidebar {
            position: sticky;
            top: calc(var(--header-h) + 24px);
            display: flex; flex-direction: column;
            gap: 16px;
        }

        .post-content {
            background: var(--c-surface);
            border-radius: var(--r-lg);
            padding: 40px 44px;
            border: 1px solid var(--c-border);
            box-shadow: var(--sh-sm);
            font-size: 1.05rem;
            line-height: 2;
            color: var(--c-text-muted);
        }
        .post-content > *:first-child { margin-top: 0; }
        .post-content > *:last-child { margin-bottom: 0; }

        .post-content h1, .post-content h2, .post-content h3, .post-content h4 {
            color: var(--c-text);
            font-weight: 900; line-height: 1.35;
            scroll-margin-top: calc(var(--header-h) + 20px);
        }
        .post-content h1 { font-size: 1.9rem; margin: 32px 0 16px; }
        .post-content h2 {
            font-size: 1.55rem; margin: 36px 0 16px;
            padding-right: 16px;
            border-right: 5px solid var(--c-accent);
        }
        .post-content h3 {
            font-size: 1.25rem; margin: 28px 0 12px;
            color: var(--c-primary-700);
        }
        [data-theme="dark"] .post-content h3 { color: #7ec8e3; }
        .post-content h4 { font-size: 1.1rem; margin: 22px 0 10px; }
        .post-content p { margin-bottom: 18px; color: var(--c-text-muted); }
        .post-content strong { color: var(--c-text); font-weight: 800; }
        .post-content em { font-style: italic; color: var(--c-primary-600); }
        .post-content a {
            color: var(--c-primary-600); font-weight: 700;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
        }
        .post-content a:hover { color: var(--c-accent-dark); }
        .post-content ul, .post-content ol { margin: 14px 0 20px; padding-right: 28px; }
        .post-content li { margin-bottom: 10px; line-height: 1.9; color: var(--c-text-muted); }
        .post-content li::marker { color: var(--c-accent); font-weight: 900; }
        .post-content img { max-width: 100%; border-radius: var(--r-md); margin: 20px 0; box-shadow: var(--sh-md); }
        .post-content blockquote {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.06), rgba(46, 204, 113, 0.02));
            border-right: 4px solid var(--c-accent);
            padding: 18px 22px; border-radius: var(--r-md);
            margin: 24px 0; font-style: italic; color: var(--c-text);
        }
        .post-content code {
            background: var(--c-surface-2);
            color: var(--c-primary-700);
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border: 1px solid var(--c-border);
        }
        [data-theme="dark"] .post-content code { color: #7ec8e3; }
        .post-content pre {
            background: var(--c-primary-900);
            color: #e8eef5;
            padding: 20px;
            border-radius: var(--r-md);
            overflow-x: auto;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .post-content pre code { background: transparent; color: inherit; padding: 0; border: none; }
        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            border-radius: var(--r-md);
            overflow: hidden;
            box-shadow: var(--sh-sm);
        }
        .post-content table th, .post-content table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--c-border);
            text-align: right;
        }
        .post-content table th {
            background: var(--c-surface-2);
            font-weight: 800;
            color: var(--c-text);
        }
        .post-content table td { color: var(--c-text-muted); }
        .post-content table tr:last-child td { border-bottom: none; }
        .post-content hr { border: none; height: 1px; background: var(--c-border); margin: 32px 0; }

        .post-tags {
            display: flex; gap: 8px; flex-wrap: wrap;
            margin-top: 32px; padding-top: 24px;
            border-top: 1px solid var(--c-border);
            align-items: center;
        }
        .post-tags .tags-label {
            font-size: 0.85rem; font-weight: 800;
            color: var(--c-text);
            display: inline-flex; align-items: center; gap: 6px;
            margin-left: 8px;
        }
        .tag {
            background: var(--c-primary-50);
            color: var(--c-primary-700);
            padding: 6px 14px; border-radius: var(--r-full);
            font-size: 0.75rem; font-weight: 700;
        }
        [data-theme="dark"] .tag {
            background: rgba(44, 122, 184, 0.15);
            color: #7ec8e3;
        }

        .share-section {
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px; padding: 20px 0 0;
            border-top: 1px solid var(--c-border);
        }
        .share-section .share-label {
            font-size: 0.85rem; font-weight: 800;
            color: var(--c-text);
            display: inline-flex; align-items: center; gap: 6px;
            margin-left: 8px;
        }
        .share-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1rem;
            transition: all 0.15s;
            border: none; cursor: pointer;
            box-shadow: var(--sh-sm);
        }
        .share-btn:hover { transform: translateY(-3px) scale(1.08); box-shadow: var(--sh-md); }
        .share-btn.facebook { background: var(--c-facebook); }
        .share-btn.twitter { background: var(--c-twitter); }
        .share-btn.whatsapp { background: var(--c-whatsapp); }
        .share-btn.linkedin { background: var(--c-linkedin); }
        .share-btn.copy { background: var(--c-text-muted); }

        .author-card {
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.04), rgba(46, 204, 113, 0.02));
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 20px;
        }
        .author-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .author-avatar {
            width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, var(--c-primary-600), var(--c-primary-900));
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 800;
            text-transform: uppercase;
        }
        .author-info { flex: 1; min-width: 0; }
        .author-name { font-size: 0.95rem; font-weight: 800; color: var(--c-text); margin-bottom: 2px; }
        .author-role { font-size: 0.72rem; color: var(--c-text-sub); font-weight: 600; }
        .author-bio { font-size: 0.82rem; color: var(--c-text-muted); line-height: 1.6; }

        .toc-card {
            background: var(--c-surface);
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 18px 20px;
        }
        .toc-title {
            font-size: 0.85rem; font-weight: 800;
            color: var(--c-text);
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 12px; padding-bottom: 12px;
            border-bottom: 1px solid var(--c-border);
        }
        .toc-title i { color: var(--c-accent); }
        .toc-list {
            display: flex; flex-direction: column;
            gap: 2px; max-height: 400px;
            overflow-y: auto;
        }
        .toc-link {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; border-radius: var(--r-sm);
            font-size: 0.82rem; font-weight: 600;
            color: var(--c-text-muted);
            transition: all 0.15s;
            cursor: pointer;
            text-decoration: none;
        }
        .toc-link:hover { background: var(--c-surface-2); color: var(--c-text); padding-right: 16px; }
        .toc-link.active {
            background: linear-gradient(90deg, rgba(46, 204, 113, 0.12), transparent);
            color: var(--c-accent-dark);
            font-weight: 800;
            border-right: 3px solid var(--c-accent);
        }
        .toc-link.h3 { padding-right: 24px; font-size: 0.78rem; font-weight: 500; }

        .sidebar-share {
            background: var(--c-surface);
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 18px 20px;
        }
        .sidebar-share-title {
            font-size: 0.85rem; font-weight: 800;
            color: var(--c-text);
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 14px;

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // STATE
        // ============================================================
        const state = {
            slug: null,
            post: null,
            user: null,
        };

        const THEME_KEY = 'chemato-theme';
        const SITE_URL = 'https://chemato.vercel.app';

        // ============================================================
        // UTILS
        // ============================================================
        const escapeHtml = (str) => {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            try {
                return new Date(dateStr).toLocaleDateString('ar-EG', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
            } catch { return ''; }
        };

        const readingTime = (content) => {
            if (!content) return '1 دقيقة';
            const words = String(content).replace(/<[^>]*>/g, '').split(/\s+/).length;
            const minutes = Math.max(1, Math.ceil(words / 200));
            return `${minutes} دقيقة`;
        };

        const stripHtml = (html) => String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();

        const getSlug = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const qSlug = urlParams.get('slug');
            if (qSlug) return qSlug;

            const pathMatch = window.location.pathname.match(/\/blog\/([^\/\?#]+)/);
            if (pathMatch && pathMatch[1]) return decodeURIComponent(pathMatch[1]);

            return null;
        };

        // ============================================================
        // THEME
        // ============================================================
        const updateThemeIcon = (theme) => {
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        };

        const initTheme = () => {
            const saved = localStorage.getItem(THEME_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);

            document.getElementById('themeToggle')?.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem(THEME_KEY, next);
                updateThemeIcon(next);
            });
        };

        // ============================================================
        // TOAST
        // ============================================================
        const showToast = (icon, title, desc, type = '') => {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">${icon}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-desc">${desc}</div>
                </div>
                <button class="toast-close" aria-label="إغلاق"><i class="fas fa-times"></i></button>
            `;
            toast.querySelector('.toast-close').onclick = () => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            };
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add('removing');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 5000);
        };

        // ============================================================
        // NAVBAR
        // ============================================================
        const initNavbar = () => {
            const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.getElementById('navLinks');

            menuToggle?.addEventListener('click', () => {
                const isOpen = navLinks.classList.toggle('open');
                menuToggle.innerHTML = isOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
            });

            const dropdownToggle = document.getElementById('dropdownToggle');
            const dropdownContent = document.getElementById('dropdownContent');

            dropdownToggle?.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownContent.classList.toggle('show');
            });

            document.addEventListener('click', () => {
                dropdownContent?.classList.remove('show');
            });
        };

        // ============================================================
        // AUTH
        // ============================================================
        const checkUser = async () => {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                state.user = user || null;
                const dropdownContent = document.getElementById('dropdownContent');
                if (!dropdownContent) return;

                if (user) {
                    const { data: profile } = await supabase
                        .from('profiles').select('user_type').eq('id', user.id).single();
                    const url = profile?.user_type === 'supplier' ? 'supplier-dashboard.html' : 'buyer-dashboard.html';
                    dropdownContent.innerHTML = `
                        <a href="${url}"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
                        <a href="profile.html"><i class="fas fa-user"></i> الملف الشخصي</a>
                        <a href="#" id="logoutLink" class="logout"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
                    `;
                    document.getElementById('logoutLink')?.addEventListener('click', async (e) => {
                        e.preventDefault();
                        await supabase.auth.signOut();
                        window.location.reload();
                    });
                } else {
                    dropdownContent.innerHTML = `
                        <a href="auth.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
                        <a href="auth.html"><i class="fas fa-user-plus"></i> حساب جديد</a>
                        <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> للموردين</a>
                        <a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> للعملاء</a>
                    `;
                }
            } catch (e) { /* silent */ }
        };

        // ============================================================
        // READING PROGRESS + SCROLL TOP
        // ============================================================
        const initReadingProgress = () => {
            const bar = document.getElementById('readingProgress');
            if (!bar) return;
            const update = () => {
                const ws = document.documentElement.scrollTop;
                const h = document.documentElement.scrollHeight - window.innerHeight;
                bar.style.width = (h > 0 ? (ws / h) * 100 : 0) + '%';
            };
            window.addEventListener('scroll', update, { passive: true });
            update();
        };

        const initScrollTop = () => {
            const btn = document.getElementById('scrollTopBtn');
            if (!btn) return;
            const onScroll = () => btn.classList.toggle('visible', window.scrollY > 400);
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        };

        // ============================================================
        // BUILD TOC
        // ============================================================
        const buildTOC = () => {
            const container = document.getElementById('tocList');
            const card = document.getElementById('tocCard');
            if (!container) return;

            const contentEl = document.querySelector('.post-content');
            if (!contentEl) return;

            const headings = contentEl.querySelectorAll('h2, h3');
            if (!headings.length) {
                if (card) card.style.display = 'none';
                return;
            }

            let html = '';
            headings.forEach((h, i) => {
                const id = `heading-${i}`;
                h.id = id;
                const level = h.tagName === 'H2' ? 2 : 3;
                const text = h.textContent.trim().substring(0, 60);
                html += `
                    <a href="#${id}" class="toc-link ${level === 3 ? 'h3' : ''}" data-target="${id}">
                        <i class="fas fa-circle" style="font-size: 0.4rem; opacity: 0.6;"></i>
                        ${escapeHtml(text)}
                    </a>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.toc-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.getElementById(link.dataset.target);
                    if (target) {
                        const top = target.getBoundingClientRect().top + window.scrollY - 90;
                        window.scrollTo({ top, behavior: 'smooth' });
                    }
                });
            });

            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const id = entry.target.id;
                            container.querySelectorAll('.toc-link').forEach(l => {
                                l.classList.toggle('active', l.dataset.target === id);
                            });
                        }
                    });
                }, { rootMargin: '-100px 0px -70% 0px', threshold: 0 });
                headings.forEach(h => observer.observe(h));
            }
        };

        // ============================================================
        // UPDATE META TAGS
        // ============================================================
        const updateMetaTags = (post) => {
            const title = post.title || 'مقال';
            const description = (post.excerpt || stripHtml(post.content).substring(0, 160) || '').substring(0, 160);
            const image = (post.image_url && /^https?:\/\//i.test(post.image_url))
                ? post.image_url
                : `${SITE_URL}/og-default.jpg`;
            const canonicalUrl = `${SITE_URL}/blog-post.html?slug=${encodeURIComponent(post.slug || post.id)}`;

            document.title = `${title} | كيماتو`;

            const setMeta = (id, content) => {
                const el = document.getElementById(id);
                if (el) el.setAttribute('content', content);
            };

            setMeta('pageDescription', description);
            setMeta('ogTitle', title);
            setMeta('ogDescription', description);
            setMeta('ogImage', image);
            setMeta('ogImageSecure', image);
            setMeta('ogUrl', canonicalUrl);
            setMeta('twTitle', title);
            setMeta('twDescription', description);
            setMeta('twImage', image);

            const canonical = document.getElementById('pageCanonical');
            if (canonical) canonical.setAttribute('href', canonicalUrl);

            try {
                const schema = document.createElement('script');
                schema.type = 'application/ld+json';
                schema.textContent = JSON.stringify({
                    "@context": "https://schema.org",
                    "@type": "Article",
                    "headline": title,
                    "description": description,
                    "image": image,
                    "datePublished": post.published_at || post.created_at,
                    "dateModified": post.updated_at || post.created_at,
                    "author": { "@type": "Person", "name": post.author_name || "كيماتو" },
                    "publisher": {
                        "@type": "Organization",
                        "name": "كيماتو",
                        "logo": { "@type": "ImageObject", "url": `${SITE_URL}/logo.png` }
                    },
                    "mainEntityOfPage": { "@type": "WebPage", "@id": canonicalUrl }
                });
                document.head.appendChild(schema);
            } catch (e) { /* silent */ }
        };

        // ============================================================
        // LOAD POST
        // ============================================================
        const loadPost = async () => {
            const container = document.getElementById('pageContent');
            if (!container) return;

            if (!state.slug) {
                renderError('رابط غير صحيح', 'لم يتم تحديد المقال المطلوب.');
                return;
            }

            try {
                console.log('🔄 Loading post:', state.slug);

                const { data: post, error } = await supabase
                    .from('blog_posts')
                    .select('*')
                    .eq('slug', state.slug)
                    .eq('status', 'published')
                    .maybeSingle();

                if (error || !post) {
                    console.error('Post fetch error:', error);
                    renderError('المقال غير موجود', 'ربما تم حذفه أو لم يتم نشره بعد.');
                    return;
                }

                console.log('✅ Post loaded:', post.title);
                state.post = post;

                updateMetaTags(post);
                renderPost(post);

                // Update views
                supabase
                    .from('blog_posts')
                    .update({ views: (post.views || 0) + 1 })
                    .eq('id', post.id)
                    .then(() => {});

                loadRelatedPosts(post);

            } catch (e) {
                console.error('Load post error:', e);
                renderError('حدث خطأ', 'تعذر تحميل المقال. حاول تحديث الصفحة.');
            }
        };

        // ============================================================
        // RENDER POST
        // ============================================================
        const renderPost = (post) => {
            const container = document.getElementById('pageContent');
            if (!container) return;

            const authorName = post.author_name || 'كيماتو';
            const authorInitial = (authorName || 'ك').charAt(0).toUpperCase();
            const hasImage = post.image_url && /^https?:\/\//i.test(post.image_url);
            const tags = Array.isArray(post.tags) ? post.tags : [];
            const readTime = readingTime(post.content);

            container.innerHTML = `
                <a href="blog.html" class="back-btn animate-in">
                    <i class="fas fa-arrow-right"></i> العودة إلى المدونة
                </a>

                <section class="post-hero animate-in">
                    <div class="post-hero-bg-icons" aria-hidden="true">
                        <span class="icon-float">📰</span>
                        <span class="icon-float rotate">📖</span>
                        <span class="icon-float">✍️</span>
                        <span class="icon-float rotate">💡</span>
                    </div>

                    <div class="post-hero-content">
                        ${post.category ? `
                            <span class="post-category">
                                <i class="fas fa-tag"></i> ${escapeHtml(post.category)}
                            </span>
                        ` : ''}

                        <h1>${escapeHtml(post.title)}</h1>

                        <div class="post-hero-meta">
                            <span class="post-meta-item">
                                <i class="fas fa-calendar"></i>
                                ${formatDate(post.published_at || post.created_at)}
                            </span>
                            ${authorName ? `
                                <span class="post-meta-item">
                                    <i class="fas fa-user"></i>
                                    <strong>${escapeHtml(authorName)}</strong>
                                </span>
                            ` : ''}
                            <span class="post-meta-item">
                                <i class="fas fa-clock"></i>
                                ${readTime} قراءة
                            </span>
                            <span class="post-meta-item">
                                <i class="fas fa-eye"></i>
                                <strong>${Number(post.views || 0).toLocaleString('ar-EG')}</strong> مشاهدة
                            </span>
                        </div>
                    </div>
                </section>

                ${hasImage ? `
                    <div class="post-featured-image animate-in" style="animation-delay: 0.05s;">
                        <img src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.title)}" loading="eager" />
                    </div>
                ` : ''}

                <div class="post-layout">
                    <div class="post-main">
                        <article class="post-content animate-in" style="animation-delay: 0.1s;">
                            ${post.content || post.excerpt || '<p>لا يوجد محتوى متاح.</p>'}

                            ${tags.length > 0 ? `
                                <div class="post-tags">
                                    <span class="tags-label"><i class="fas fa-tags"></i> الوسوم:</span>
                                    ${tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('')}
                                </div>
                            ` : ''}

                            <div class="share-section">
                                <span class="share-label"><i class="fas fa-share-alt"></i> شارك المقال:</span>
                                <button class="share-btn facebook" data-share="facebook" type="button" aria-label="فيسبوك">
                                    <i class="fab fa-facebook-f"></i>
                                </button>
                                <button class="share-btn twitter" data-share="twitter" type="button" aria-label="تويتر">
                                    <i class="fab fa-twitter"></i>
                                </button>
                                <button class="share-btn whatsapp" data-share="whatsapp" type="button" aria-label="واتساب">
                                    <i class="fab fa-whatsapp"></i>
                                </button>
                                <button class="share-btn linkedin" data-share="linkedin" type="button" aria-label="لينكد إن">
                                    <i class="fab fa-linkedin-in"></i>
                                </button>
                                <button class="share-btn copy" data-share="copy" type="button" aria-label="نسخ الرابط">
                                    <i class="fas fa-link"></i>
                                </button>
                            </div>
                        </article>
                    </div>

                    <aside class="post-sidebar">
                        <div class="author-card animate-in" style="animation-delay: 0.15s;">
                            <div class="author-card-header">
                                <div class="author-avatar">${authorInitial}</div>
                                <div class="author-info">
                                    <div class="author-name">${escapeHtml(authorName)}</div>
                                    <div class="author-role">محرر في كيماتو</div>
                                </div>
                            </div>
                            <p class="author-bio">
                                ننشر مقالات متخصصة عن سوق المواد الكيميائية في مصر والشرق الأوسط.
                            </p>
                        </div>

                        <div class="toc-card animate-in" id="tocCard" style="animation-delay: 0.2s;">
                            <div class="toc-title">
                                <i class="fas fa-list-ul"></i>
                                محتويات المقال
                            </div>
                            <div class="toc-list" id="tocList"></div>
                        </div>

                        <div class="sidebar-share animate-in" style="animation-delay: 0.25s;">
                            <div class="sidebar-share-title">
                                <i class="fas fa-share-alt"></i>
                                شارك المقال
                            </div>
                            <div class="sidebar-share-buttons">
                                <button class="share-btn facebook" data-share="facebook" type="button" aria-label="فيسبوك">
                                    <i class="fab fa-facebook-f"></i>
                                </button>
                                <button class="share-btn twitter" data-share="twitter" type="button" aria-label="تويتر">
                                    <i class="fab fa-twitter"></i>
                                </button>
                                <button class="share-btn whatsapp" data-share="whatsapp" type="button" aria-label="واتساب">
                                    <i class="fab fa-whatsapp"></i>
                                </button>
                                <button class="share-btn copy" data-share="copy" type="button" aria-label="نسخ الرابط">
                                    <i class="fas fa-link"></i>
                                </button>
                            </div>
                        </div>
                    </aside>
                </div>

                <section class="related-section animate-in" id="relatedSection" style="display: none; animation-delay: 0.3s;">
                    <div class="related-header">
                        <i class="fas fa-newspaper"></i>
                        <h2>مقالات ذات صلة</h2>
                    </div>
                    <div class="related-grid" id="relatedGrid"></div>
                </section>
            `;

            buildTOC();
            bindShareButtons();
        };

        const renderError = (title, desc) => {
            const container = document.getElementById('pageContent');
            if (!container) return;
            container.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-newspaper"></i>
                    <h2>${escapeHtml(title)}</h2>
                    <p>${escapeHtml(desc)}</p>
                    <a href="blog.html" class="btn-back-home">
                        <i class="fas fa-arrow-right"></i> العودة للمدونة
                    </a>
                </div>
            `;
        };

        // ============================================================
        // RELATED
        // ============================================================
        const loadRelatedPosts = async (post) => {
            try {
                let query = supabase
                    .from('blog_posts')
                    .select('id, title, slug, image_url, category, published_at, created_at')
                    .eq('status', 'published')
                    .neq('id', post.id)
                    .order('published_at', { ascending: false, nullsFirst: false })
                    .limit(3);

                if (post.category) query = query.eq('category', post.category);

                let { data } = await query;

                if (!data || data.length === 0) {
                    const fb = await supabase
                        .from('blog_posts')
                        .select('id, title, slug, image_url, category, published_at, created_at')
                        .eq('status', 'published')
                        .neq('id', post.id)
                        .order('published_at', { ascending: false, nullsFirst: false })
                        .limit(3);
                    data = fb.data;
                }

                if (!data || data.length === 0) return;

                const section = document.getElementById('relatedSection');
                const grid = document.getElementById('relatedGrid');
                if (!section || !grid) return;
                section.style.display = 'block';

                grid.innerHTML = data.map(p => {
                    const hasImg = p.image_url && /^https?:\/\//i.test(p.image_url);
                    return `
                        <a href="blog-post.html?slug=${encodeURIComponent(p.slug || p.id)}" class="related-card">
                            <div class="related-card-media">
                                ${hasImg
                                    ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.title)}" loading="lazy" />`
                                    : `<div class="related-card-placeholder">📰</div>`}
                            </div>
                            <div class="related-card-body">
                                ${p.category ? `
                                    <span class="related-card-category"><i class="fas fa-tag"></i> ${escapeHtml(p.category)}</span>
                                ` : ''}
                                <h3 class="related-card-title">${escapeHtml(p.title)}</h3>
                                <div class="related-card-meta">
                                    <span><i class="fas fa-calendar"></i> ${formatDate(p.published_at || p.created_at)}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (e) { /* silent */ }
        };

        // ============================================================
        // SHARE
        // ============================================================
        const bindShareButtons = () => {
            document.querySelectorAll('[data-share]').forEach(btn => {
                btn.addEventListener('click', () => handleShare(btn.dataset.share));
            });
        };

        const handleShare = async (type) => {
            const url = window.location.href;
            const title = state.post?.title || document.title;

            try {
                switch (type) {
                    case 'facebook':
                        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank', 'noopener,noreferrer');
                        break;
                    case 'twitter':
                        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`, '_blank', 'noopener,noreferrer');
                        break;
                    case 'whatsapp':
                        window.open(`https://wa.me/?text=${encodeURIComponent(`${title}\n${url}`)}`, '_blank', 'noopener,noreferrer');
                        break;
                    case 'linkedin':
                        window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`, '_blank', 'noopener,noreferrer');
                        break;
                    case 'copy':
                        await navigator.clipboard.writeText(url);
                        showToast('📋', 'تم النسخ!', 'تم نسخ رابط المقال', 'success');
                        break;
                }
            } catch (e) { /* silent */ }
        };

        // ============================================================
        // INIT
        // ============================================================
        const init = async () => {
            console.log('🚀 كيماتو | المقال');

            state.slug = getSlug();
            console.log('📍 Slug:', state.slug);

            initTheme();
            initNavbar();
            initReadingProgress();
            initScrollTop();

            await checkUser();
            await loadPost();

            console.log('✅ جاهز');
        };

        supabase.auth.onAuthStateChange(() => checkUser());

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
