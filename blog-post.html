<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">المقال | كيماتو</title>
    <meta name="description" id="pageDescription" content="اقرأ المقال كاملاً" />
    <link rel="canonical" id="pageCanonical" href="https://chemato.vercel.app/blog-post.html" />
    <link rel="icon" type="image/x-icon" href="logo.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <meta name="theme-color" content="#0c2d4a" />

    <link rel="preconnect" href="https://soqvhvqtpgeoxwmkvbih.supabase.co" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Tahoma', sans-serif;
        }

        body {
            background: #f0f4f8;
            color: #1a2634;
            min-height: 100vh;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a2e;
                color: #e0e0e0;
            }
            .post-content {
                background: #16213e;
                border-color: #0f3460;
            }
            .post-content h1,
            .post-content h2,
            .post-content h3 {
                color: #e0e0e0;
            }
            .post-content p {
                color: #c0c0c0;
            }
            .footer {
                background: #0a1a2a;
            }
            .dropdown-content {
                background: #16213e;
            }
            .dropdown-content a {
                color: #e0e0e0;
                border-bottom-color: #1a2a3a;
            }
            .dropdown-content a:hover {
                background: #1a2a3a;
            }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate {
            animation: fadeUp 0.6s ease forwards;
            opacity: 0;
        }

        .navbar {
            background: linear-gradient(135deg, #0a2538, #143b57);
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(52, 152, 219, 0.2);
            backdrop-filter: blur(12px);
        }

        .logo a {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #3498db;
            object-fit: cover;
        }

        .logo-text {
            font-weight: 800;
            font-size: 20px;
            color: #fff;
        }
        .logo-text .blue { color: #3498db; }
        .logo-text .gray { color: #9bb7d4; font-weight: 400; }

        .nav-links {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            padding: 7px 18px;
            border-radius: 30px;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
        }

        .nav-links a:hover {
            background: #3498db;
            color: #fff;
            transform: translateY(-1px);
        }

        .dropdown {
            position: relative;
        }

        .dropdown-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 7px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.9rem;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .dropdown-btn:hover {
            background: #3498db;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 110%;
            left: 0;
            background: #fff;
            min-width: 200px;
            border-radius: 16px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            z-index: 1000;
        }

        .dropdown-content.show {
            display: block;
            animation: fadeUp 0.2s ease;
        }

        .dropdown-content a {
            color: #1a2634;
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 1px solid #f0f2f5;
            transition: 0.2s;
        }

        .dropdown-content a:hover {
            background: #eef5fa;
            padding-right: 28px;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 30px;
        }

        .post-header {
            background: linear-gradient(135deg, #0a2538 0%, #1a4a6e 100%);
            border-radius: 32px;
            padding: 40px 44px;
            margin-top: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .post-header .category {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .post-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.3;
        }

        .post-header .meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 12px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .post-header .meta i {
            margin-left: 4px;
        }

        .post-content {
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            margin-top: 20px;
            border: 1px solid rgba(52, 152, 219, 0.06);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            line-height: 1.9;
            font-size: 1.05rem;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 16px;
            margin: 16px 0;
        }

        .post-content h2 {
            font-size: 1.6rem;
            margin: 24px 0 12px;
            color: #0a2538;
            border-right: 4px solid #3498db;
            padding-right: 12px;
        }

        .post-content h3 {
            font-size: 1.3rem;
            margin: 20px 0 10px;
            color: #0a2538;
        }

        .post-content p {
            margin-bottom: 16px;
            color: #2d3748;
        }

        .post-content ul,
        .post-content ol {
            margin: 12px 0 16px 30px;
        }

        .post-content li {
            margin-bottom: 8px;
        }

        .post-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .post-tags .tag {
            background: #ecf3f8;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a4a6e;
        }

        .share-section {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            flex-wrap: wrap;
            align-items: center;
        }

        .share-section .label {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .share-btn {
            background: #e8edf3;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .share-btn:hover {
            background: #d0dce8;
        }

        .share-btn.facebook { background: #1877f2; color: #fff; }
        .share-btn.twitter { background: #000; color: #fff; }
        .share-btn.whatsapp { background: #25D366; color: #fff; }
        .share-btn.copy { background: #6c757d; color: #fff; }

        .share-btn.facebook:hover { background: #1557b0; }
        .share-btn.twitter:hover { background: #1a1a1a; }
        .share-btn.whatsapp:hover { background: #128C7E; }
        .share-btn.copy:hover { background: #495057; }

        .loader {
            text-align: center;
            padding: 60px;
            color: #1a4a6e;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .footer {
            background: linear-gradient(135deg, #0a2538, #143b57);
            color: #fff;
            text-align: center;
            padding: 24px 20px;
            margin-top: 30px;
            border-top: 3px solid #3498db;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #5a9bc7;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .footer-links a:hover {
            color: #fff;
        }

        .footer-copy {
            opacity: 0.5;
            font-size: 0.8rem;
        }

        .not-found {
            text-align: center;
            padding: 60px 20px;
        }

        .not-found h2 {
            font-size: 2rem;
            color: #1a4a6e;
        }

        .not-found p {
            color: #64748b;
            margin: 12px 0 20px;
        }

        .not-found .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #1a4a6e, #0a2538);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            transition: 0.3s;
        }

        .not-found .btn:hover {
            background: #3498db;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 16px;
            transition: 0.3s;
        }

        .back-btn:hover {
            color: #0a2538;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 10px 16px;
                flex-direction: column;
                gap: 8px;
            }
            .post-header {
                padding: 28px 20px;
            }
            .post-header h1 {
                font-size: 1.6rem;
            }
            .post-content {
                padding: 20px;
                font-size: 0.95rem;
            }
            .post-content h2 {
                font-size: 1.3rem;
            }
            .post-content h3 {
                font-size: 1.1rem;
            }
            .share-section {
                flex-direction: column;
                align-items: stretch;
            }
            .share-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header class="navbar animate">
        <div class="logo">
            <a href="/">
                <img src="logo.png" alt="كيماتو" width="44" height="44" />
                <span class="logo-text"><span class="blue">كيماتو</span><span class="gray">| سوق الكيماويات</span></span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="all-products.html"><i class="fas fa-flask"></i> المنتجات</a>
            <a href="all-requests.html"><i class="fas fa-clipboard-list"></i> الطلبات</a>
            <a href="chemato-suppliers.html"><i class="fas fa-truck"></i> الموردين</a>
            <a href="blog.html"><i class="fas fa-newspaper"></i> المدونة</a>
            <div class="dropdown">
                <button class="dropdown-btn" id="dropdownToggle"><i class="fas fa-user-circle"></i> القائمة</button>
                <div class="dropdown-content" id="dropdownContent">
                    <a href="auth.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
                    <a href="auth.html"><i class="fas fa-user-plus"></i> حساب جديد</a>
                    <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> للموردين</a>
                    <a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> للعملاء</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="main-container" id="mainContainer">
        <div class="loader">⏳ جاري تحميل المقال...</div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-links">
            <a href="index.html">الرئيسية</a>
            <a href="all-products.html">المنتجات</a>
            <a href="all-requests.html">الطلبات</a>
            <a href="chemato-suppliers.html">الموردين</a>
            <a href="blog.html">المدونة</a>
            <a href="auth.html">تسجيل الدخول</a>
        </div>
        <div class="footer-copy">© 2026 كيماتو - سوق المواد الكيماوية في مصر</div>
    </footer>

    <!-- Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        // ===== Dropdown =====
        function setupDropdown() {
            const toggle = document.getElementById('dropdownToggle')
            const content = document.getElementById('dropdownContent')
            if (toggle && content) {
                toggle.addEventListener('click', (e) => {
                    e.stopPropagation()
                    content.classList.toggle('show')
                })
                document.addEventListener('click', () => content.classList.remove('show'))
            }
        }
        setupDropdown()

        // ===== Get slug from URL =====
        function getSlug() {
            const params = new URLSearchParams(window.location.search)
            return params.get('slug')
        }

        // ===== Load Post =====
        async function loadPost() {
            const slug = getSlug()
            const container = document.getElementById('mainContainer')

            if (!slug) {
                container.innerHTML = `
                    <div class="not-found">
                        <h2>😕 المقال غير موجود</h2>
                        <p>لم يتم العثور على المقال المطلوب</p>
                        <a href="blog.html" class="btn">العودة إلى المدونة</a>
                    </div>
                `
                return
            }

            try {
                const { data: post, error } = await supabase
                    .from('blog_posts')
                    .select('*')
                    .eq('slug', slug)
                    .eq('status', 'published')
                    .single()

                if (error || !post) {
                    container.innerHTML = `
                        <div class="not-found">
                            <h2>😕 المقال غير موجود</h2>
                            <p>لم يتم العثور على المقال المطلوب</p>
                            <a href="blog.html" class="btn">العودة إلى المدونة</a>
                        </div>
                    `
                    return
                }

                // ===== Update Meta Tags =====
                document.title = `${post.title} | كيماتو`
                document.getElementById('pageDescription').content = post.excerpt || post.title
                document.getElementById('pageCanonical').href = `https://chemato.vercel.app/blog-post.html?slug=${post.slug}`

                // ===== Schema =====
                const schemaScript = document.createElement('script')
                schemaScript.type = 'application/ld+json'
                schemaScript.textContent = JSON.stringify({
                    "@context": "https://schema.org",
                    "@type": "Article",
                    "headline": post.title,
                    "description": post.excerpt,
                    "datePublished": post.published_at || post.created_at,
                    "dateModified": post.updated_at || post.created_at,
                    "author": {
                        "@type": "Person",
                        "name": post.author_name || "كيماتو"
                    }
                })
                document.head.appendChild(schemaScript)

                // ===== Render Post =====
                const date = new Date(post.published_at || post.created_at)
                const formattedDate = date.toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                })

                const tagsHtml = post.tags?.length ? 
                    post.tags.map(t => `<span class="tag">#${t}</span>`).join('') :
                    ''

                container.innerHTML = `
                    <a href="blog.html" class="back-btn animate"><i class="fas fa-arrow-right"></i> العودة إلى المدونة</a>
                    
                    <article class="post-header animate">
                        <span class="category">${post.category || 'عام'}</span>
                        <h1>${post.title}</h1>
                        <div class="meta">
                            <span><i class="fas fa-calendar"></i> ${formattedDate}</span>
                            ${post.author_name ? `<span><i class="fas fa-user"></i> ${post.author_name}</span>` : ''}
                            <span><i class="fas fa-eye"></i> ${post.views || 0} مشاهدة</span>
                        </div>
                    </article>

                    <div class="post-content animate">
                        ${post.content || ''}
                        
                        ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}

                        <div class="share-section">
                            <span class="label">📤 شارك المقال:</span>
                            <button class="share-btn facebook" onclick="sharePost('facebook')">
                                <i class="fab fa-facebook-f"></i> فيسبوك
                            </button>
                            <button class="share-btn twitter" onclick="sharePost('twitter')">
                                <i class="fab fa-twitter"></i> تويتر
                            </button>
                            <button class="share-btn whatsapp" onclick="sharePost('whatsapp')">
                                <i class="fab fa-whatsapp"></i> واتساب
                            </button>
                            <button class="share-btn copy" onclick="sharePost('copy')">
                                <i class="fas fa-link"></i> نسخ الرابط
                            </button>
                        </div>
                    </div>
                `

                // ===== Update Views =====
                await supabase
                    .from('blog_posts')
                    .update({ views: (post.views || 0) + 1 })
                    .eq('id', post.id)

            } catch (error) {
                console.error('Error loading post:', error)
                container.innerHTML = `
                    <div class="not-found">
                        <h2>⚠️ حدث خطأ</h2>
                        <p>تعذر تحميل المقال. يرجى المحاولة مرة أخرى.</p>
                        <a href="blog.html" class="btn">العودة إلى المدونة</a>
                    </div>
                `
            }
        }

        // ===== Share Functions =====
        window.sharePost = function(type) {
            const url = window.location.href
            const title = document.title

            switch(type) {
                case 'facebook':
                    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank')
                    break
                case 'twitter':
                    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`, '_blank')
                    break
                case 'whatsapp':
                    window.open(`https://wa.me/?text=${encodeURIComponent(`${title}\n${url}`)}`, '_blank')
                    break
                case 'copy':
                    navigator.clipboard.writeText(url).then(() => {
                        alert('✅ تم نسخ الرابط')
                    }).catch(() => {
                        alert('⚠️ تعذر نسخ الرابط')
                    })
                    break
            }
        }

        // ===== Load =====
        loadPost()
    </script>

</body>
</html>
