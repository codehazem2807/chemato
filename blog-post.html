    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" />

    <style>
        :root {
            --c-primary-50:  #eef6fc;
            --c-primary-100: #d4e7f5;
            --c-primary-500: #2c7ab8;
            --c-primary-600: #1d5b8e;
            --c-primary-700: #144167;
            --c-primary-800: #0d2e4a;
            --c-primary-900: #0a2540;
            --c-accent:      #2ecc71;
            --c-accent-dark: #22a95c;
            --c-warning:     #f39c12;
            --c-danger:      #e74c3c;
            --c-whatsapp:    #25D366;
            --c-purple:      #8b5cf6;
            --c-verified:    #1e88e5;
            --c-facebook:    #1877f2;
            --c-twitter:     #000000;
            --c-linkedin:    #0a66c2;
            --c-bg:          #f6f8fb;
            --c-surface:     #ffffff;
            --c-surface-2:   #f9fbfd;
            --c-border:      #e3eaf2;
            --c-text:        #0a1f33;
            --c-text-muted:  #5a6b7e;
            --c-text-sub:    #8595a8;
            --sh-sm:  0 1px 3px rgba(10, 37, 64, 0.06);
            --sh-md:  0 4px 16px rgba(10, 37, 64, 0.08);
            --sh-lg:  0 12px 32px rgba(10, 37, 64, 0.10);
            --sh-xl:  0 20px 48px rgba(10, 37, 64, 0.14);
            --r-sm: 8px;
            --r-md: 14px;
            --r-lg: 20px;
            --r-xl: 28px;
            --r-full: 999px;
            --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            --container: 1320px;
            --header-h: 68px;
        }

        [data-theme="dark"] {
            --c-bg:         #0a1520;
            --c-surface:    #101e2e;
            --c-surface-2:  #16273a;
            --c-border:     #1f3349;
            --c-text:       #e8eef5;
            --c-text-muted: #9fb1c4;
            --c-text-sub:   #6e8298;
            --sh-sm:  0 1px 3px rgba(0, 0, 0, 0.3);
            --sh-md:  0 4px 16px rgba(0, 0, 0, 0.35);
            --sh-lg:  0 12px 32px rgba(0, 0, 0, 0.45);
            --sh-xl:  0 20px 48px rgba(0, 0, 0, 0.55);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--c-bg);
            color: var(--c-text);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--t-base), color var(--t-base);
        }

        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        a { color: inherit; text-decoration: none; }
        input, select, textarea { font-family: inherit; }

        :focus-visible { outline: 3px solid var(--c-primary-500); outline-offset: 2px; border-radius: var(--r-sm); }

        .skip-link {
            position: absolute; top: -100px; right: 16px;
            background: var(--c-primary-900); color: #fff;
            padding: 12px 20px; border-radius: var(--r-md);
            z-index: 9999; transition: top var(--t-fast);
        }
        .skip-link:focus { top: 16px; }

        .reading-progress {
            position: fixed; top: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--c-verified), var(--c-accent));
            z-index: 9999; width: 0;
            transition: width 0.1s linear;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .animate-in { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

        /* NAVBAR */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 37, 64, 0.88);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 24px;
            height: var(--header-h);
        }
        .navbar-inner {
            max-width: var(--container); width: 100%;
            margin: 0 auto; height: 100%;
            display: flex; justify-content: space-between;
            align-items: center; gap: 16px;
        }
        .logo a { display: flex; align-items: center; gap: 10px; color: #fff; }
        .logo img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(30, 136, 229, 0.5); object-fit: cover; background: #fff; }
        .logo-text { font-weight: 800; font-size: 19px; color: #fff; white-space: nowrap; }
        .logo-text .blue { color: #5eb8ee; }
        .logo-text .gray { color: rgba(255, 255, 255, 0.6); font-weight: 400; font-size: 0.9em; }

        .nav-links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .nav-links a, .dropdown-btn {
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: var(--r-full);
            font-weight: 600; font-size: 0.88rem;
            transition: all var(--t-fast);
            display: inline-flex; align-items: center; gap: 6px;
            background: transparent;
        }
        .nav-links a:hover, .dropdown-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-links a.active { background: rgba(30, 136, 229, 0.18); color: #7ec8e3; }

        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all var(--t-fast);
        }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.15); transform: rotate(15deg); }

        .dropdown { position: relative; }
        .dropdown-content {
            position: absolute; top: calc(100% + 8px); left: 0;
            background: var(--c-surface); min-width: 220px;
            border-radius: var(--r-md); box-shadow: var(--sh-xl);
            border: 1px solid var(--c-border); overflow: hidden;
            opacity: 0; visibility: hidden;
            transform: translateY(-8px);
            transition: all var(--t-base); z-index: 1000;
        }
        .dropdown-content.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-content a {
            color: var(--c-text); padding: 12px 18px;
            display: flex; align-items: center; gap: 10px;
            font-size: 0.9rem; font-weight: 500;
            border-bottom: 1px solid var(--c-border);
            transition: all var(--t-fast);
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background: var(--c-surface-2); color: var(--c-primary-600); padding-right: 24px; }
        .dropdown-content a.logout { color: var(--c-danger); }

        .menu-toggle {
            display: none; width: 42px; height: 42px;
            border-radius: var(--r-md);
            background: rgba(255, 255, 255, 0.08); color: #fff;
            align-items: center; justify-content: center; font-size: 1.1rem;
        }

        /* MAIN */
        .main-container { max-width: var(--container); margin: 0 auto; padding: 20px 24px 60px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--c-text-muted);
            font-weight: 700;
            font-size: 0.88rem;
            padding: 10px 18px;
            border-radius: var(--r-full);
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            margin-bottom: 20px;
            transition: all var(--t-fast);
        }
        .back-btn:hover {
            background: var(--c-primary-600);
            color: #fff;
            border-color: transparent;
            transform: translateX(-3px);
        }

        /* HERO HEADER */
        .post-hero {
            position: relative;
            border-radius: var(--r-xl);
            padding: 48px 40px 40px;
            overflow: hidden;
            background:
                radial-gradient(ellipse at top right, rgba(30, 136, 229, 0.20), transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(46, 204, 113, 0.10), transparent 50%),
                linear-gradient(135deg, #0a1f3a 0%, #1a2942 100%);
            color: #fff;
            box-shadow: var(--sh-xl);
            margin-bottom: 24px;
        }
        .post-hero::before {
            content: '';
            position: absolute; inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle at 80% 60%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px, 60px 60px;
            pointer-events: none;
        }
        .post-hero-bg-icons {
            position: absolute; inset: 0;
            overflow: hidden; pointer-events: none; z-index: 0;
        }
        .post-hero-bg-icons .icon-float {
            position: absolute; font-size: 2.4rem;
            opacity: 0.08; animation: float 6s ease-in-out infinite;
        }
        .post-hero-bg-icons .icon-float.rotate { animation: rotateSlow 30s linear infinite; }
        .post-hero-bg-icons .icon-float:nth-child(1) { top: 12%; left: 6%; font-size: 3rem; animation-delay: 0s; }
        .post-hero-bg-icons .icon-float:nth-child(2) { top: 18%; right: 8%; font-size: 3.6rem; animation-delay: 1s; }
        .post-hero-bg-icons .icon-float:nth-child(3) { bottom: 30%; left: 10%; font-size: 2.6rem; animation-delay: 2s; }
        .post-hero-bg-icons .icon-float:nth-child(4) { bottom: 12%; right: 6%; font-size: 3rem; animation-delay: 0.5s; }

        .post-hero-content { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

        .post-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(30, 136, 229, 0.20);
            border: 1px solid rgba(30, 136, 229, 0.35);
            color: #7ec8e3;
            padding: 6px 16px;
            border-radius: var(--r-full);
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .post-hero h1 {
            font-size: clamp(1.5rem, 3.5vw, 2.4rem);
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 18px;
            letter-spacing: -0.5px;
        }

        .post-hero-meta {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .post-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }
        .post-meta-item i { color: #7ec8e3; font-size: 0.85rem; }
        .post-meta-item strong { color: #fff; font-weight: 800; }

        /* FEATURED IMAGE */
        .post-featured-image {
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: var(--sh-lg);
            aspect-ratio: 16 / 9;
            background: linear-gradient(145deg, var(--c-surface-2), var(--c-border));
        }
        .post-featured-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* LAYOUT */
        .post-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 32px;
            align-items: start;
        }

        .post-main { min-width: 0; }

        .post-sidebar {
            position: sticky;
            top: calc(var(--header-h) + 24px);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ARTICLE CONTENT */
        .post-content {
            background: var(--c-surface);
            border-radius: var(--r-lg);
            padding: 40px 44px;
            border: 1px solid var(--c-border);
            box-shadow: var(--sh-sm);
            font-size: 1.05rem;
            line-height: 2;
            color: var(--c-text-muted);
        }

        .post-content > *:first-child { margin-top: 0; }
        .post-content > *:last-child { margin-bottom: 0; }

        .post-content h1,
        .post-content h2,
        .post-content h3,
        .post-content h4 {
            color: var(--c-text);
            font-weight: 900;
            line-height: 1.35;
            scroll-margin-top: calc(var(--header-h) + 20px);
        }

        .post-content h1 { font-size: 1.9rem; margin: 32px 0 16px; }
        .post-content h2 {
            font-size: 1.55rem;
            margin: 36px 0 16px;
            padding-right: 16px;
            border-right: 5px solid var(--c-accent);
        }
        .post-content h3 {
            font-size: 1.25rem;
            margin: 28px 0 12px;
            color: var(--c-primary-700);
        }
        [data-theme="dark"] .post-content h3 { color: #7ec8e3; }
        .post-content h4 {
            font-size: 1.1rem;
            margin: 22px 0 10px;
        }

        .post-content p {
            margin-bottom: 18px;
            color: var(--c-text-muted);
        }

        .post-content strong { color: var(--c-text); font-weight: 800; }
        .post-content em { font-style: italic; color: var(--c-primary-600); }
        .post-content a {
            color: var(--c-primary-600);
            font-weight: 700;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            transition: color var(--t-fast);
        }
        .post-content a:hover { color: var(--c-accent-dark); }

        .post-content ul,
        .post-content ol {
            margin: 14px 0 20px;
            padding-right: 28px;
        }
        .post-content li {
            margin-bottom: 10px;
            line-height: 1.9;
            color: var(--c-text-muted);
        }
        .post-content li::marker { color: var(--c-accent); font-weight: 900; }

        .post-content img {
            max-width: 100%;
            border-radius: var(--r-md);
            margin: 20px 0;
            box-shadow: var(--sh-md);
        }

        .post-content blockquote {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.06), rgba(46, 204, 113, 0.02));
            border-right: 4px solid var(--c-accent);
            padding: 18px 22px;
            border-radius: var(--r-md);
            margin: 24px 0;
            font-style: italic;
            color: var(--c-text);
        }

        .post-content code {
            background: var(--c-surface-2);
            color: var(--c-primary-700);
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border: 1px solid var(--c-border);
        }
        [data-theme="dark"] .post-content code { color: #7ec8e3; }

        .post-content pre {
            background: var(--c-primary-900);
            color: #e8eef5;
            padding: 20px;
            border-radius: var(--r-md);
            overflow-x: auto;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .post-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            border: none;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            border-radius: var(--r-md);
            overflow: hidden;
            box-shadow: var(--sh-sm);
        }
        .post-content table th,
        .post-content table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--c-border);
            text-align: right;
        }
        .post-content table th {
            background: var(--c-surface-2);
            font-weight: 800;
            color: var(--c-text);
        }
        .post-content table td { color: var(--c-text-muted); }
        .post-content table tr:last-child td { border-bottom: none; }

        .post-content hr {
            border: none;
            height: 1px;
            background: var(--c-border);
            margin: 32px 0;
        }

        /* TAGS */
        .post-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--c-border);
            align-items: center;
        }
        .post-tags .tags-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }
        .tag {
            background: var(--c-primary-50);
            color: var(--c-primary-700);
            padding: 6px 14px;
            border-radius: var(--r-full);
            font-size: 0.75rem;
            font-weight: 700;
            transition: all var(--t-fast);
            border: 1px solid transparent;
        }
        [data-theme="dark"] .tag {
            background: rgba(44, 122, 184, 0.15);
            color: #7ec8e3;
        }
        .tag:hover {
            background: var(--c-primary-600);
            color: #fff;
            transform: translateY(-2px);
        }

        /* SHARE SECTION */
        .share-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding: 20px 0 0;
            border-top: 1px solid var(--c-border);
        }
        .share-section .share-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
        }
        .share-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            transition: all var(--t-fast);
            border: none;
            cursor: pointer;
            box-shadow: var(--sh-sm);
        }
        .share-btn:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: var(--sh-md);
        }
        .share-btn.facebook { background: var(--c-facebook); }
        .share-btn.twitter { background: var(--c-twitter); }
        .share-btn.whatsapp { background: var(--c-whatsapp); }
        .share-btn.linkedin { background: var(--c-linkedin); }
        .share-btn.copy { background: var(--c-text-muted); }

        /* AUTHOR CARD */
        .author-card {
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.04), rgba(46, 204, 113, 0.02));
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 20px;
        }
        .author-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .author-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--c-primary-600), var(--c-primary-900));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .author-info { flex: 1; min-width: 0; }
        .author-name {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 2px;
        }
        .author-role {
            font-size: 0.72rem;
            color: var(--c-text-sub);
            font-weight: 600;
        }
        .author-bio {
            font-size: 0.82rem;
            color: var(--c-text-muted);
            line-height: 1.6;
        }

        /* TOC */
        .toc-card {
            background: var(--c-surface);
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 18px 20px;
        }
        .toc-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--c-border);

        .toc-title i { color: var(--c-accent); }

            border-radius: var(--r-sm);

        .toc-link:hover {

        [data-theme="dark"] .toc-link.active { color: #6ee7a0; }
        .toc-link.h3 {
            padding-right: 24px;
            font-size: 0.78rem;
            font-weight: 500;

        /* SIDEBAR SHARE */
        .sidebar-share {

            border-radius: var(--r-lg);
            padding: 18px 20px;

        .sidebar-share-title {

        /* RELATED POSTS */
        .related-section {

        .related-header {

            margin-bottom: 20px;

        .related-header i { color: var(--c-accent); font-size: 1.3rem; }

        }
        .related-grid {
            display: grid;

            gap: 18px;

        .related-card {
            background: var(--c-surface);

        /* LOADER */
        .page-loader {

            position: fixed;

        /* TOAST */

            transition: opacity var(--t-base), transform var(--t-base);

        .toast.removing { opacity: 0; transform: translateX(20px); }
        .toast .toast-icon { font-size: 1.5rem; flex-shrink: 0; line-height: 1; }
        .toast .toast-content { flex: 1; min-width: 0; }
        .toast .toast-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
        .toast .toast-desc { font-size: 0.8rem; color: var(--c-text-muted); line-height: 1.4; }
        .toast .toast-close {
            width: 26px;
            height: 26px;
            border-radius: 50%;

        .toast.success { border-right-color: var(--c-accent); }
        .toast.warning { border-right-color: var(--c-warning); }
        .toast.error { border-right-color: var(--c-danger); }

        .footer-links a {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.88rem;
            font-weight: 500;
            transition: color var(--t-fast);
        }
        .footer-links a:hover { color: #7ec8e3; }
        .footer-copy {
            text-align: center;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .post-layout {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .post-sidebar {
                position: static;
                order: -1;
            }
            .toc-card { display: none; }
        }

        @media (max-width: 860px) {
            .menu-toggle { display: inline-flex; }
            .nav-links {
                position: fixed;
                top: var(--header-h);
                left: 0; right: 0;
                background: rgba(10, 37, 64, 0.98);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 16px;
                gap: 4px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);

                transition: transform var(--t-base);

                overflow-y: auto;

            }
            .nav-links.open { transform: translateY(0); }
            .nav-links a, .dropdown-btn {
                width: 100%;
                justify-content: flex-start;
                padding: 12px 16px;
            }
            .dropdown { width: 100%; }
            .dropdown-content {
                position: static;
                transform: none;
                box-shadow: none;
                background: rgba(255, 255, 255, 0.05);
                border: none;
                max-height: 0;
                overflow: hidden;
                transition: max-height var(--t-base);
                opacity: 1;
                visibility: visible;
            }
            .dropdown-content.show { max-height: 400px; }
            .dropdown-content a {
                color: rgba(255, 255, 255, 0.85);
                border-bottom-color: rgba(255, 255, 255, 0.05);

        @media (max-width: 640px) {

            .footer-links a { font-size: 0.78rem; }

            .scroll-top { bottom: 20px; right: 16px; width: 42px; height: 42px; }

            .related-grid { grid-template-columns: 1fr; gap: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });

        // ============================================================
        // STATE
        // ============================================================
        const state = {
            slug: null,
            post: null,
            relatedPosts: [],
            user: null,
            tocItems: [],
        };

        const THEME_KEY = 'chemato-theme';

        // ============================================================
        // UTILS
        // ============================================================
        const escapeHtml = (str) => {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            try {
                return new Date(dateStr).toLocaleDateString('ar-EG', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
            } catch { return ''; }
        };

        const readingTime = (content) => {
            if (!content) return '1 دقيقة';
            const words = String(content).replace(/<[^>]*>/g, '').split(/\s+/).length;
            const minutes = Math.max(1, Math.ceil(words / 200));
            return `${minutes} دقيقة`;
        };

        // ============================================================
        // THEME
        // ============================================================
        const updateThemeIcon = (theme) => {
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        };

        const initTheme = () => {
            const saved = localStorage.getItem(THEME_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);

            document.getElementById('themeToggle')?.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem(THEME_KEY, next);
                updateThemeIcon(next);
            });
        };

        // ============================================================
        // TOAST
        // ============================================================
        const removeToast = (toast) => {
            if (!toast || !toast.parentNode) return;
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 300);
        };

        const showToast = (icon, title, desc, type = '') => {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const iconEl = document.createElement('div');
            iconEl.className = 'toast-icon';
            iconEl.textContent = icon;

            const content = document.createElement('div');
            content.className = 'toast-content';

            const titleEl = document.createElement('div');
            titleEl.className = 'toast-title';
            titleEl.textContent = title;

            const descEl = document.createElement('div');
            descEl.className = 'toast-desc';
            descEl.textContent = desc;

            content.appendChild(titleEl);
            content.appendChild(descEl);

            const closeBtn = document.createElement('button');
            closeBtn.className = 'toast-close';
            closeBtn.setAttribute('aria-label', 'إغلاق');
            closeBtn.innerHTML = '<i class="fas fa-times"></i>';
            closeBtn.onclick = () => removeToast(toast);

            toast.appendChild(iconEl);
            toast.appendChild(content);
            toast.appendChild(closeBtn);
            container.appendChild(toast);

            setTimeout(() => removeToast(toast), 5000);
        };

        // ============================================================
        // NAVBAR
        // ============================================================
        const initNavbar = () => {
            const menuToggle = document.getElementById('menuToggle');
            const navLinks = document.getElementById('navLinks');

            menuToggle?.addEventListener('click', () => {
                const isOpen = navLinks.classList.toggle('open');
                menuToggle.setAttribute('aria-expanded', isOpen);
                menuToggle.innerHTML = isOpen
                    ? '<i class="fas fa-times"></i>'
                    : '<i class="fas fa-bars"></i>';
            });

            const dropdownToggle = document.getElementById('dropdownToggle');
            const dropdownContent = document.getElementById('dropdownContent');

            dropdownToggle?.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = dropdownContent.classList.toggle('show');
                dropdownToggle.setAttribute('aria-expanded', isOpen);
            });

            document.addEventListener('click', () => {
                dropdownContent?.classList.remove('show');
                dropdownToggle?.setAttribute('aria-expanded', 'false');
            });
        };

        // ============================================================
        // AUTH
        // ============================================================
        const checkUser = async () => {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                state.user = user || null;

                const dropdownContent = document.getElementById('dropdownContent');
                if (!dropdownContent) return;

                if (user) {
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('user_type')
                        .eq('id', user.id)
                        .single();

                    const dashboardUrl = profile?.user_type === 'supplier'
                        ? 'supplier-dashboard.html'
                        : 'buyer-dashboard.html';

                    dropdownContent.innerHTML = `
                        <a href="${dashboardUrl}"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
                        <a href="profile.html"><i class="fas fa-user"></i> الملف الشخصي</a>
                        <a href="#" id="logoutLink" class="logout"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
                    `;

                    document.getElementById('logoutLink')?.addEventListener('click', async (e) => {
                        e.preventDefault();
                        await supabase.auth.signOut();
                        window.location.reload();
                    });
                } else {
                    dropdownContent.innerHTML = `
                        <a href="auth.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
                        <a href="auth.html"><i class="fas fa-user-plus"></i> حساب جديد</a>
                        <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> للموردين</a>
                        <a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> للعملاء</a>
                    `;
                }
            } catch (e) {
                console.warn('Auth check failed:', e.message);
            }
        };

        // ============================================================
        // READING PROGRESS
        // ============================================================
        const initReadingProgress = () => {
            const bar = document.getElementById('readingProgress');
            if (!bar) return;
            const update = () => {
                const winScroll = document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - window.innerHeight;
                const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
                bar.style.width = scrolled + '%';
            };
            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', update, { passive: true });
            update();
        };

        // ============================================================
        // SCROLL TOP
        // ============================================================
        const initScrollTop = () => {
            const btn = document.getElementById('scrollTopBtn');
            if (!btn) return;
            const onScroll = () => btn.classList.toggle('visible', window.scrollY > 400);
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
            btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        };

        // ============================================================
        // BUILD TOC FROM CONTENT
        // ============================================================
        const buildTOC = (content) => {
            const container = document.getElementById('tocList');
            if (!container) return;

            const temp = document.createElement('div');
            temp.innerHTML = content;

            const headings = temp.querySelectorAll('h2, h3');
            if (!headings.length) {
                const card = document.getElementById('tocCard');
                if (card) card.style.display = 'none';
                return;
            }

            const items = [];
            headings.forEach((h, i) => {
                const id = `heading-${i}`;
                h.setAttribute('id', id);
                items.push({
                    id,
                    text: h.textContent.trim().substring(0, 60),
                    level: h.tagName === 'H2' ? 2 : 3,
                });
            });

            // Update actual content with IDs
            const contentEl = document.querySelector('.post-content');
            if (contentEl) {
                const realHeadings = contentEl.querySelectorAll('h2, h3');
                realHeadings.forEach((h, i) => {
                    h.setAttribute('id', `heading-${i}`);
                });
            }

            state.tocItems = items;

            container.innerHTML = items.map(item => `
                <a href="#${item.id}" class="toc-link ${item.level === 3 ? 'h3' : ''}" data-target="${item.id}">
                    <i class="fas fa-${item.level === 2 ? 'circle' : 'circle-notch'}" style="font-size: 0.4rem; opacity: 0.6;"></i>
                    ${escapeHtml(item.text)}
                </a>
            `).join('');

            // Smooth scroll to headings
            container.querySelectorAll('.toc-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetId = link.dataset.target;
                    const target = document.getElementById(targetId);
                    if (target) {
                        const top = target.getBoundingClientRect().top + window.scrollY - 90;
                        window.scrollTo({ top, behavior: 'smooth' });
                    }
                });
            });

            // IntersectionObserver for active state
            setupTOCActiveState();
        };

        const setupTOCActiveState = () => {
            if (!('IntersectionObserver' in window)) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        document.querySelectorAll('.toc-link').forEach(link => {
                            link.classList.toggle('active', link.dataset.target === id);
                        });
                    }
                });
            }, {
                rootMargin: '-100px 0px -70% 0px',
                threshold: 0,
            });

            document.querySelectorAll('.post-content h2, .post-content h3').forEach(h => {
                observer.observe(h);
            });
        };

        // ============================================================
        // LOAD POST
        // ============================================================
        const loadPost = async () => {
            const container = document.getElementById('pageContent');
            if (!container) return;

            if (!state.slug) {
                renderError('رابط غير صحيح', 'لم يتم تحديد المقال المطلوب.');
                return;
            }

            try {
                console.log('🔄 Loading post:', state.slug);

                const { data: post, error } = await supabase
                    .from('blog_posts')
                    .select('*')
                    .eq('slug', state.slug)
                    .eq('status', 'published')
                    .single();

                if (error || !post) {
                    console.error('Post fetch error:', error);
                    renderError('المقال غير موجود', 'ربما تم حذفه أو لم يتم نشره بعد.');
                    return;
                }

                console.log('✅ Post loaded:', post.title);
                state.post = post;

                // Update meta
                updateMetaTags(post);

                // Render
                renderPost(post);

                // Update views
                supabase
                    .from('blog_posts')
                    .update({ views: (post.views || 0) + 1 })
                    .eq('id', post.id)
                    .then(() => {});

                // Load related posts
                loadRelatedPosts(post);

            } catch (e) {
                console.error('Load post error:', e);
                renderError('حدث خطأ', 'تعذر تحميل المقال. حاول تحديث الصفحة.');
            }
        };

        const updateMetaTags = (post) => {
            document.title = `${post.title} | كيماتو`;
            const desc = post.excerpt || post.title;

            const setMeta = (id, content) => {
                const el = document.getElementById(id);
                if (el) el.content = content;
            };

            setMeta('pageDescription', desc);
            setMeta('ogTitle', post.title);
            setMeta('ogDescription', desc);
            setMeta('twTitle', post.title);
            setMeta('twDescription', desc);

            const canonical = document.getElementById('pageCanonical');
            if (canonical) canonical.href = `https://chemato.vercel.app/blog-post.html?slug=${post.slug || post.id}`;

            const ogUrl = document.getElementById('ogUrl');
            if (ogUrl) ogUrl.content = `https://chemato.vercel.app/blog-post.html?slug=${post.slug || post.id}`;

            if (post.image_url) {
                setMeta('ogImage', post.image_url);
                setMeta('twImage', post.image_url);
            }

            // Schema
            try {
                const schema = document.createElement('script');
                schema.type = 'application/ld+json';
                schema.textContent = JSON.stringify({
                    "@context": "https://schema.org",
                    "@type": "Article",
                    "headline": post.title,
                    "description": desc,
                    "image": post.image_url || undefined,
                    "datePublished": post.published_at || post.created_at,
                    "dateModified": post.updated_at || post.created_at,
                    "author": {
                        "@type": "Person",
                        "name": post.author_name || "كيماتو"
                    }
                });
                document.head.appendChild(schema);
            } catch (e) { /* silent */ }
        };

        const renderPost = (post) => {
            const container = document.getElementById('pageContent');
            if (!container) return;

            const authorName = post.author_name || 'كيماتو';
            const authorInitial = (authorName || 'ك').charAt(0).toUpperCase();
            const hasImage = post.image_url && /^https?:\/\//i.test(post.image_url);
            const tags = Array.isArray(post.tags) ? post.tags : [];
            const readTime = readingTime(post.content);

            container.innerHTML = `
                <a href="blog.html" class="back-btn animate-in">
                    <i class="fas fa-arrow-right"></i> العودة إلى المدونة
                </a>

                <!-- HERO -->
                <section class="post-hero animate-in">
                    <div class="post-hero-bg-icons" aria-hidden="true">
                        <span class="icon-float">📰</span>
                        <span class="icon-float rotate">📖</span>
                        <span class="icon-float">✍️</span>
                        <span class="icon-float rotate">💡</span>
                    </div>

                    <div class="post-hero-content">
                        ${post.category ? `
                            <span class="post-category">
                                <i class="fas fa-tag"></i> ${escapeHtml(post.category)}
                            </span>
                        ` : ''}

                        <h1>${escapeHtml(post.title)}</h1>

                        <div class="post-hero-meta">
                            <span class="post-meta-item">
                                <i class="fas fa-calendar"></i>
                                ${formatDate(post.published_at || post.created_at)}
                            </span>
                            ${authorName ? `
                                <span class="post-meta-item">
                                    <i class="fas fa-user"></i>
                                    <strong>${escapeHtml(authorName)}</strong>
                                </span>
                            ` : ''}
                            <span class="post-meta-item">
                                <i class="fas fa-clock"></i>
                                ${readTime} قراءة
                            </span>
                            <span class="post-meta-item">
                                <i class="fas fa-eye"></i>
                                <strong id="viewsCount">${Number(post.views || 0).toLocaleString('ar-EG')}</strong> مشاهدة
                            </span>
                        </div>
                    </div>
                </section>

                <!-- FEATURED IMAGE -->
                ${hasImage ? `
                    <div class="post-featured-image animate-in" style="animation-delay: 0.05s;">
                        <img src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.title)}" loading="eager" />
                    </div>
                ` : ''}

                <!-- LAYOUT -->
                <div class="post-layout">
                    <div class="post-main">
                        <article class="post-content animate-in" style="animation-delay: 0.1s;">
                            ${post.content || post.excerpt || '<p>لا يوجد محتوى متاح.</p>'}

                            ${tags.length > 0 ? `
                                <div class="post-tags">
                                    <span class="tags-label"><i class="fas fa-tags"></i> الوسوم:</span>
                                    ${tags.map(t => `<a href="blog.html?tag=${encodeURIComponent(t)}" class="tag">#${escapeHtml(t)}</a>`).join('')}
                                </div>
                            ` : ''}

                            <div class="share-section">
                                <span class="share-label"><i class="fas fa-share-alt"></i> شارك المقال:</span>
                                <button class="share-btn facebook" data-share="facebook" type="button" aria-label="فيسبوك">
                                    <i class="fab fa-facebook-f"></i>
                                </button>
                                <button class="share-btn twitter" data-share="twitter" type="button" aria-label="تويتر">
                                    <i class="fab fa-twitter"></i>
                                </button>
                                <button class="share-btn whatsapp" data-share="whatsapp" type="button" aria-label="واتساب">
                                    <i class="fab fa-whatsapp"></i>
                                </button>
                                <button class="share-btn linkedin" data-share="linkedin" type="button" aria-label="لينكد إن">
                                    <i class="fab fa-linkedin-in"></i>
                                </button>
                                <button class="share-btn copy" data-share="copy" type="button" aria-label="نسخ الرابط">
                                    <i class="fas fa-link"></i>
                                </button>
                            </div>
                        </article>
                    </div>

                    <aside class="post-sidebar">
                        <!-- AUTHOR -->
                        <div class="author-card animate-in" style="animation-delay: 0.15s;">
                            <div class="author-card-header">
                                <div class="author-avatar">${authorInitial}</div>
                                <div class="author-info">
                                    <div class="author-name">${escapeHtml(authorName)}</div>
                                    <div class="author-role">محرر في كيماتو</div>
                                </div>
                            </div>
                            <p class="author-bio">
                                ننشر مقالات متخصصة عن سوق المواد الكيميائية في مصر والشرق الأوسط.
                            </p>
                        </div>

                        <!-- TOC -->
                        <div class="toc-card animate-in" id="tocCard" style="animation-delay: 0.2s;">
                            <div class="toc-title">
                                <i class="fas fa-list-ul"></i>
                                محتويات المقال
                            </div>
                            <div class="toc-list" id="tocList"></div>
                        </div>

                        <!-- SIDEBAR SHARE -->
                        <div class="sidebar-share animate-in" style="animation-delay: 0.25s;">
                            <div class="sidebar-share-title">
                                <i class="fas fa-share-alt"></i>
                                شارك المقال
                            </div>
                            <div class="sidebar-share-buttons">
                                <button class="share-btn facebook" data-share="facebook" type="button" aria-label="فيسبوك">
                                    <i class="fab fa-facebook-f"></i>
                                </button>
                                <button class="share-btn twitter" data-share="twitter" type="button" aria-label="تويتر">
                                    <i class="fab fa-twitter"></i>
                                </button>
                                <button class="share-btn whatsapp" data-share="whatsapp" type="button" aria-label="واتساب">
                                    <i class="fab fa-whatsapp"></i>
                                </button>
                                <button class="share-btn copy" data-share="copy" type="button" aria-label="نسخ الرابط">
                                    <i class="fas fa-link"></i>
                                </button>
                            </div>
                        </div>
                    </aside>
                </div>

                <!-- RELATED POSTS -->
                <section class="related-section animate-in" id="relatedSection" style="display: none; animation-delay: 0.3s;">
                    <div class="related-header">
                        <i class="fas fa-newspaper"></i>
                        <h2>مقالات ذات صلة</h2>
                    </div>
                    <div class="related-grid" id="relatedGrid"></div>
                </section>
            `;

            // Build TOC from actual content
            buildTOC(post.content || '');

            // Bind share buttons
            bindShareButtons();
        };

        const renderError = (title, desc) => {
            const container = document.getElementById('pageContent');
            if (!container) return;

            container.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-newspaper"></i>
                    <h2>${escapeHtml(title)}</h2>
                    <p>${escapeHtml(desc)}</p>
                    <a href="blog.html" class="btn-back-home">
                        <i class="fas fa-arrow-right"></i> العودة للمدونة
                    </a>
                </div>
            `;
        };

        // ============================================================
        // RELATED POSTS
        // ============================================================
        const loadRelatedPosts = async (post) => {
            try {
                let query = supabase
                    .from('blog_posts')
                    .select('id, title, slug, excerpt, image_url, category, published_at, created_at')
                    .eq('status', 'published')
                    .neq('id', post.id)
                    .order('published_at', { ascending: false, nullsFirst: false })
                    .limit(3);

                if (post.category) {
                    query = query.eq('category', post.category);
                }

                let { data } = await query;

                // If no posts in same category, fetch any recent
                if (!data || data.length === 0) {
                    const fallback = await supabase
                        .from('blog_posts')
                        .select('id, title, slug, excerpt, image_url, category, published_at, created_at')
                        .eq('status', 'published')
                        .neq('id', post.id)
                        .order('published_at', { ascending: false, nullsFirst: false })
                        .limit(3);
                    data = fallback.data;
                }

                if (!data || data.length === 0) {
                    const section = document.getElementById('relatedSection');
                    if (section) section.style.display = 'none';
                    return;
                }

                state.relatedPosts = data;

                const section = document.getElementById('relatedSection');
                const grid = document.getElementById('relatedGrid');
                if (!section || !grid) return;

                section.style.display = 'block';

                grid.innerHTML = data.map(p => {
                    const hasImg = p.image_url && /^https?:\/\//i.test(p.image_url);
                    return `
                        <a href="blog-post.html?slug=${encodeURIComponent(p.slug || p.id)}" class="related-card">
                            <div class="related-card-media">
                                ${hasImg
                                    ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.title)}" loading="lazy" />`
                                    : `<div class="related-card-placeholder">📰</div>`}
                            </div>
                            <div class="related-card-body">
                                ${p.category ? `
                                    <span class="related-card-category">
                                        <i class="fas fa-tag"></i> ${escapeHtml(p.category)}
                                    </span>
                                ` : ''}
                                <h3 class="related-card-title">${escapeHtml(p.title)}</h3>
                                <div class="related-card-meta">
                                    <span><i class="fas fa-calendar"></i> ${formatDate(p.published_at || p.created_at)}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (e) {
                console.warn('Related posts error:', e.message);
            }
        };

        // ============================================================
        // SHARE
        // ============================================================
        const bindShareButtons = () => {
            document.querySelectorAll('[data-share]').forEach(btn => {
                btn.addEventListener('click', () => {
                    handleShare(btn.dataset.share);
                });
            });
        };

        const handleShare = async (type) => {
            const url = window.location.href;
            const title = state.post?.title || document.title;

            try {
                switch (type) {
                    case 'facebook':
                        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank', 'noopener,noreferrer');
                        break;
                    case 'twitter':
                        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`, '_blank', 'noopener,noreferrer');
                        break;
                    case 'whatsapp':
                        window.open(`https://wa.me/?text=${encodeURIComponent(`${title}\n${url}`)}`, '_blank', 'noopener,noreferrer');
                        break;
                    case 'linkedin':
                        window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`, '_blank', 'noopener,noreferrer');
                        break;
                    case 'copy':
                        await navigator.clipboard.writeText(url);
                        showToast('📋', 'تم النسخ!', 'تم نسخ رابط المقال', 'success');
                        break;
                }
            } catch (e) {
                console.warn('Share error:', e.message);
            }
        };

        // ============================================================
        // INIT
        // ============================================================
        const init = async () => {
            console.log('🚀 كيماتو | المقال');

            const urlParams = new URLSearchParams(window.location.search);
            state.slug = urlParams.get('slug');

            initTheme();
            initNavbar();
            initReadingProgress();
            initScrollTop();

            await checkUser();
            await loadPost();

            console.log('✅ جاهز');
        };

        supabase.auth.onAuthStateChange(() => {
            checkUser();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
