                                        <span><i class="fas fa-eye"></i> ${formatNumber(p.views || 0)}</span>
                                        <span><i class="fas fa-comments"></i> ${formatNumber(p.contact_count || 0)}</span>
                                        <span><i class="fas fa-star"></i> ${p.avg_rating ? Number(p.avg_rating).toFixed(1) : '—'}</span>
                                    </div>
                                </div>
                                <div class="item-price-block">
                                    <div class="item-price">${p.price ? formatPrice(p.price) : '—'} <span class="currency">ج.م</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : `
                    <div class="empty-state">
                        <i class="fas fa-chart-line empty-icon"></i>
                        <h4>لا توجد بيانات بعد</h4>
                        <p>ابدأ بإضافة منتجات وشوف أدائها هنا</p>
                    </div>
                `}
            </div>
        </div>
    `;
};

// ============================================================
// RENDER: PROFILE
// ============================================================
const renderProfile = () => {
    const main = document.getElementById('dashboardMain');
    if (!main) return;
    const p = state.userProfile || {};

    main.innerHTML = `
        <div class="page-header-bar animate-in">
            <div>
                <h1 class="page-title"><i class="fas fa-user-circle"></i> الملف الشخصي</h1>
                <p class="page-subtitle">بياناتك كمورد على كيماتو</p>
            </div>
            <a href="profile.html" class="btn btn-secondary"><i class="fas fa-external-link-alt"></i> صفحة الملف الكاملة</a>
        </div>

        <div class="section-card animate-in" style="animation-delay:0.05s;">
            <div class="section-card-header">
                <h2 class="section-card-title"><i class="fas fa-user-edit"></i> البيانات الأساسية</h2>
            </div>
            <div class="section-card-body">
                <form id="profileForm" class="profile-form" novalidate>
                    <div class="form-group full">
                        <label for="profFullName">الاسم الكامل</label>
                        <input type="text" id="profFullName" value="${escapeHtml(p.full_name || '')}" disabled />
                    </div>
                    <div class="form-group full">
                        <label for="profCompany">اسم الشركة <span class="req">*</span></label>
                        <input type="text" id="profCompany" value="${escapeHtml(p.company_name || '')}" placeholder="اسم شركتك" />
                    </div>
                    <div class="form-group">
                        <label for="profPhone">رقم الهاتف</label>
                        <input type="tel" id="profPhone" dir="ltr" value="${escapeHtml(p.phone || '')}" placeholder="+20 1XX XXX XXXX" />
                    </div>
                    <div class="form-group">
                        <label for="profWhatsapp">واتساب</label>
                        <input type="tel" id="profWhatsapp" dir="ltr" value="${escapeHtml(p.whatsapp || '')}" placeholder="+20 1XX XXX XXXX" />
                    </div>
                    <div class="form-group">
                        <label for="profCity">المدينة</label>
                        <input type="text" id="profCity" value="${escapeHtml(p.city || '')}" placeholder="مثل: القاهرة" />
                    </div>
                    <div class="form-group">
                        <label for="profAddress">العنوان</label>
                        <input type="text" id="profAddress" value="${escapeHtml(p.address || '')}" />
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="saveProfileBtn">
                            <i class="fas fa-save"></i> حفظ التعديلات
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="section-card animate-in" style="animation-delay:0.1s;">
            <div class="section-card-header">
                <h2 class="section-card-title"><i class="fas fa-info-circle"></i> معلومات الحساب</h2>
            </div>
            <div class="section-card-body">
                <div style="display:grid;gap:12px;font-size:0.88rem;">
                    <div style="display:flex;justify-content:space-between;padding:10px;background:var(--c-surface-2);border-radius:var(--r-md);flex-wrap:wrap;gap:6px;">
                        <span style="color:var(--c-text-muted);font-weight:700;">نوع الحساب</span>
                        <span style="font-weight:800;">🏭 مورد</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:10px;background:var(--c-surface-2);border-radius:var(--r-md);flex-wrap:wrap;gap:6px;">
                        <span style="color:var(--c-text-muted);font-weight:700;">حالة التحقق</span>
                        <span style="font-weight:800;">${p.is_verified ? '✅ موثّق' : '⏳ قيد التحقق'}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:10px;background:var(--c-surface-2);border-radius:var(--r-md);flex-wrap:wrap;gap:6px;">
                        <span style="color:var(--c-text-muted);font-weight:700;">تاريخ التسجيل</span>
                        <span style="font-weight:800;">${formatDate(p.created_at)}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
    document.getElementById('profileForm')?.addEventListener('submit', saveProfile);
};

const saveProfile = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveProfileBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';
    try {
        const updates = {
            company_name: document.getElementById('profCompany').value.trim() || null,
            phone: document.getElementById('profPhone').value.trim() || null,
            whatsapp: document.getElementById('profWhatsapp').value.trim() || null,
            city: document.getElementById('profCity').value.trim() || null,
            address: document.getElementById('profAddress').value.trim() || null,
        };
        const { error } = await supabase.from('profiles').update(updates).eq('id', state.user.id);
        if (error) throw error;
        state.userProfile = { ...state.userProfile, ...updates };
        updateUserUI();
        renderVerifBanner();
        showToast('✅', 'تم الحفظ', 'تم تحديث بياناتك بنجاح', null, null, 'success');
    } catch (err) {
        showToast('⚠️', 'خطأ', err.message || 'تعذر حفظ التعديلات', null, null, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
};

// ============================================================
// MODALS
// ============================================================
const initModals = () => {
    document.getElementById('closeOfferModal')?.addEventListener('click', closeOfferModal);
    document.getElementById('cancelOfferModal')?.addEventListener('click', closeOfferModal);
    document.getElementById('submitOfferBtn')?.addEventListener('click', submitOffer);
    document.getElementById('offerModal')?.addEventListener('click', (e) => {
        if (e.target.id === 'offerModal') closeOfferModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeOfferModal();
            document.getElementById('notifPanel')?.classList.remove('show');
            document.getElementById('userDropdown')?.classList.remove('show');
        }
    });
};

// ============================================================
// REALTIME
// ============================================================
const setupRealtime = () => {
    if (state.channel) supabase.removeChannel(state.channel);
    try {
        state.channel = supabase
            .channel('supplier_dashboard_realtime')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'purchase_requests' }, (payload) => {
                const req = payload.new;
                if (req.status === 'open') {
                    showToast('📢', 'طلب شراء جديد!', `مطلوب: ${req.product_name}`, 'قدّم عرض', 'all-requests.html', 'success');
                    loadSection(state.activeSection);
                }
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'offers', filter: `supplier_id=eq.${state.user?.id}` }, (payload) => {
                const oldStatus = payload.old?.status;
                const newStatus = payload.new?.status;
                if (oldStatus !== newStatus && newStatus === 'accepted') {
                    showToast('🎉', 'مبروك!', 'تم قبول عرضك — ابدأ المحادثة الآن', 'راسل العميل', 'messages.html', 'success');
                }
                loadSection(state.activeSection);
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `to_user_id=eq.${state.user?.id}` }, (payload) => {
                const msg = payload.new;
                showToast('💬', 'رسالة جديدة!', msg.message?.substring(0, 60) || 'وصلك رسالة', 'افتح الرسائل', 'messages.html', 'info');
                state.stats.unreadMessages = (state.stats.unreadMessages || 0) + 1;
                updateNavBadges();
                updateSidebarCounts();
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'supplier_contacts', filter: `supplier_id=eq.${state.user?.id}` }, (payload) => {
                const contact = payload.new;
                if (contact.contact_type === 'whatsapp' || contact.contact_type === 'phone' || contact.contact_type === 'inquiry') {
                    showToast('👤', 'عميل مهتم!', 'عميل جديد تواصل معك', 'افتح الرسائل', 'messages.html', 'success');
                }
                loadSection(state.activeSection);
            })
            .subscribe();
    } catch (e) { /* silent */ }
};

// ============================================================
// INIT
// ============================================================
const init = async () => {
    console.log('🚀 كيماتو | لوحة المورد 4.0');
    initTheme();
    initNavbar();
    initSidebar();
    initModals();

    const isAuthed = await checkAuthAndLoad();
    if (!isAuthed) return;

    await fetchCategories();
    await loadSection('overview');
    setupRealtime();

    console.log('✅ جاهز');
};

supabase.auth.onAuthStateChange(async (event) => {
    if (event === 'SIGNED_OUT') window.location.href = 'index.html';
    else if (event === 'SIGNED_IN') {
        const ok = await checkAuthAndLoad();
        if (ok) await loadSection('overview');
    }
});

window.switchSection = switchSection;

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
