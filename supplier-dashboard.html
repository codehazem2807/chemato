<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>كيماتو | لوحة المورد</title>
<meta name="description" content="لوحة تحكم المورد على كيماتو — إدارة منتجاتك، عروضك، والعملاء المحتملين." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="logo.png" />
<meta name="theme-color" content="#0a2540" />

<link rel="preconnect" href="https://soqvhvqtpgeoxwmkvbih.supabase.co" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<style>
/* ============================================================
   CHEMOTO 4.0 — Design System (Mobile-First)
   ============================================================ */
:root {
    --c-primary-50:#eef6fc; --c-primary-100:#d4e7f5; --c-primary-500:#2c7ab8;
    --c-primary-600:#1d5b8e; --c-primary-700:#144167; --c-primary-800:#0d2e4a; --c-primary-900:#0a2540;
    --c-accent:#2ecc71; --c-accent-dark:#22a95c; --c-warning:#f39c12; --c-danger:#e74c3c;
    --c-whatsapp:#25D366; --c-purple:#8b5cf6; --c-verified:#1e88e5;
    --c-request:#FF6B35; --c-request-dark:#E55A2B;
    --c-bg:#f6f8fb; --c-surface:#ffffff; --c-surface-2:#f9fbfd; --c-border:#e3eaf2;
    --c-text:#0a1f33; --c-text-muted:#5a6b7e; --c-text-sub:#8595a8;
    --sh-sm:0 1px 3px rgba(10,37,64,0.06); --sh-md:0 4px 16px rgba(10,37,64,0.08);
    --sh-lg:0 12px 32px rgba(10,37,64,0.10); --sh-xl:0 20px 48px rgba(10,37,64,0.14);
    --sh-2xl:0 32px 64px rgba(10,37,64,0.18);
    --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;
    --t-fast:150ms cubic-bezier(0.4,0,0.2,1); --t-base:250ms cubic-bezier(0.4,0,0.2,1);
    --t-slow:400ms cubic-bezier(0.4,0,0.2,1); --t-spring:400ms cubic-bezier(0.34,1.56,0.64,1);
    --container:1320px; --header-h:64px; --sidebar-w:280px;
    --safe-area-top: env(safe-area-inset-top, 0px);
    --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-left: env(safe-area-inset-left, 0px);
    --safe-area-right: env(safe-area-inset-right, 0px);
}

@media (min-width: 768px) {
    :root { --header-h: 68px; }
}

[data-theme="dark"] {
    --c-bg:#0a1520; --c-surface:#101e2e; --c-surface-2:#16273a; --c-border:#1f3349;
    --c-text:#e8eef5; --c-text-muted:#9fb1c4; --c-text-sub:#6e8298;
    --sh-sm:0 1px 3px rgba(0,0,0,0.3); --sh-md:0 4px 16px rgba(0,0,0,0.35);
    --sh-lg:0 12px 32px rgba(0,0,0,0.45); --sh-xl:0 20px 48px rgba(0,0,0,0.55);
    --sh-2xl:0 32px 64px rgba(0,0,0,0.65);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overflow-x:hidden;
    width:100%;
}
body{
    font-family:'Cairo',system-ui,-apple-system,sans-serif;
    background:var(--c-bg);
    color:var(--c-text);
    line-height:1.6;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    width:100%;
    max-width:100vw;
    position:relative;
    transition:background-color var(--t-base),color var(--t-base);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit;font-size:16px} /* Prevents iOS zoom */

:focus-visible{outline:3px solid var(--c-primary-500);outline-offset:2px;border-radius:var(--r-sm)}

/* Scrollbar Styling */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--c-text-sub)}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes badgePop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes skeletonWave{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideInUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

.animate-in{animation:fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) backwards}

/* ============================================================
   NAVBAR
   ============================================================ */
.navbar{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(10,37,64,0.92);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:0 max(12px, var(--safe-area-left)) 0 max(12px, var(--safe-area-right));
    padding-top:var(--safe-area-top);
    height:calc(var(--header-h) + var(--safe-area-top));
    width:100%;
}
.navbar-inner{
    max-width:var(--container);
    width:100%;
    margin:0 auto;
    height:var(--header-h);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
.logo a{display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.logo img{width:38px;height:38px;border-radius:50%;border:2px solid rgba(46,204,113,0.5);object-fit:cover;background:#fff;flex-shrink:0}
.logo-text{font-weight:800;font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-text .blue{color:#5eb8ee}
.logo-text .gray{color:rgba(255,255,255,0.6);font-weight:400;font-size:0.85em}
@media (min-width:480px){
    .logo img{width:42px;height:42px}
    .logo-text{font-size:19px}
}

.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
@media (min-width:480px){.nav-right{gap:10px}}

.nav-action-btn{
    width:40px;height:40px;
    min-width:40px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:1rem;
    transition:all var(--t-fast);
    position:relative;
    border:none;cursor:pointer;
    text-decoration:none;
    flex-shrink:0;
}
.nav-action-btn:hover{background:rgba(255,255,255,0.18);transform:translateY(-2px)}
.nav-action-btn:active{transform:scale(0.95)}
.nav-action-btn.rotate:hover{transform:rotate(15deg)}

.count-badge{
    position:absolute;top:-4px;right:-4px;
    background:var(--c-danger);color:#fff;
    min-width:18px;height:18px;
    padding:0 5px;
    border-radius:9px;
    font-size:0.62rem;font-weight:800;
    display:none;align-items:center;justify-content:center;
    border:2px solid rgba(10,37,64,0.9);
    animation:badgePop 0.4s ease;
}
.count-badge.show{display:flex}
.count-badge.green{background:var(--c-accent)}

.nav-user-menu{position:relative}
.nav-user-btn{
    display:flex;align-items:center;gap:8px;
    padding:4px 10px 4px 4px;
    border-radius:var(--r-full);
    background:rgba(255,255,255,0.08);
    color:#fff;
    transition:all var(--t-fast);
    font-family:inherit;cursor:pointer;border:none;
    min-width:0;
}
.nav-user-btn:hover{background:rgba(255,255,255,0.15)}
.nav-user-avatar{
    width:32px;height:32px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--c-accent),var(--c-accent-dark));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:0.82rem;
    overflow:hidden;flex-shrink:0;
}
.nav-user-avatar img{width:100%;height:100%;object-fit:cover}
.nav-user-name{
    font-size:0.82rem;font-weight:700;
    max-width:120px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:none;
}
@media (min-width:640px){.nav-user-name{display:inline-block}}

.nav-dropdown{
    position:absolute;top:calc(100% + 10px);left:0;
    background:var(--c-surface);
    border-radius:var(--r-md);
    box-shadow:var(--sh-xl);
    border:1px solid var(--c-border);
    min-width:220px;
    overflow:hidden;
    opacity:0;visibility:hidden;
    transform:translateY(-8px);
    transition:all var(--t-base);
    z-index:1000;
}
.nav-dropdown.show{opacity:1;visibility:visible;transform:translateY(0)}
.nav-dropdown a{
    display:flex;align-items:center;gap:10px;
    padding:12px 18px;
    color:var(--c-text);
    font-size:0.9rem;font-weight:500;
    border-bottom:1px solid var(--c-border);
    transition:all var(--t-fast);
}
.nav-dropdown a:last-child{border-bottom:none}
.nav-dropdown a:hover{background:var(--c-surface-2);color:var(--c-primary-600);padding-right:24px}
.nav-dropdown a.logout{color:var(--c-danger)}

.menu-toggle{
    display:inline-flex;
    width:40px;height:40px;
    border-radius:var(--r-md);
    background:rgba(255,255,255,0.08);
    color:#fff;
    align-items:center;justify-content:center;
    font-size:1.1rem;
    border:none;cursor:pointer;
    flex-shrink:0;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.dashboard-layout{
    max-width:var(--container);
    margin:0 auto;
    padding:16px max(12px, var(--safe-area-left)) 90px max(12px, var(--safe-area-right));
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
    align-items:start;
    width:100%;
    overflow-x:hidden;
}

@media (min-width:1024px){
    .dashboard-layout{
        padding:24px;
        padding-bottom:24px;
        grid-template-columns:1fr var(--sidebar-w);
        gap:24px;
    }
}

/* ============================================================
   SIDEBAR — Desktop Sticky / Mobile Drawer
   ============================================================ */
.sidebar{
    background:var(--c-surface);
    border:1px solid var(--c-border);
    border-radius:var(--r-lg);
    padding:16px;
    box-shadow:var(--sh-sm);
    display:flex;
    flex-direction:column;
    gap:16px;
    width:100%;
}

/* Mobile: Drawer */
@media (max-width:1023px){
    .sidebar{
        position:fixed;
        top:calc(var(--header-h) + var(--safe-area-top));
        right:0;
        bottom:0;
        width:min(85vw, 320px);
        max-width:320px;
        border-radius:0;
        border-right:none;
        border-left:none;
        border-top:none;
        z-index:200;
        transform:translateX(100%);
        transition:transform var(--t-slow) cubic-bezier(0.22,1,0.36,1);
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
        padding:20px 16px calc(20px + var(--safe-area-bottom)) 16px;
    }
    .sidebar.mobile-open{
        transform:translateX(0);
        box-shadow:-8px 0 40px rgba(0,0,0,0.2);
    }
    .sidebar::before{
        content:'';
        position:fixed;
        inset:0;
        background:rgba(10,20,30,0.5);
        backdrop-filter:blur(4px);
        z-index:-1;
        opacity:0;
        visibility:hidden;
        transition:all var(--t-base);
        pointer-events:none;
    }
    .sidebar.mobile-open::before{
        opacity:1;
        visibility:visible;
        pointer-events:auto;
    }
}

/* Desktop: Sticky */
@media (min-width:1024px){
    .sidebar{
        position:sticky;
        top:calc(var(--header-h) + 24px);
        max-height:calc(100vh - var(--header-h) - 48px);
        overflow-y:auto;
    }
}

.sidebar-section-title{
    font-size:0.7rem;
    font-weight:800;
    color:var(--c-text-sub);
    text-transform:uppercase;
    letter-spacing:1px;
    padding:0 12px;
}

.sidebar-nav{display:flex;flex-direction:column;gap:4px}

.sidebar-link{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    min-height:48px;
    border-radius:var(--r-md);
    color:var(--c-text-muted);
    font-weight:700;font-size:0.88rem;
    transition:all var(--t-fast);
    text-align:right;
    width:100%;
    position:relative;
    background:transparent;border:none;cursor:pointer;
    text-decoration:none;
}
.sidebar-link:hover{background:var(--c-surface-2);color:var(--c-text)}
.sidebar-link.active{
    background:linear-gradient(135deg,var(--c-request),var(--c-request-dark));
    color:#fff;
    box-shadow:0 6px 20px rgba(255,107,53,0.3);
}
.sidebar-link i{width:20px;text-align:center;font-size:1rem;flex-shrink:0}
.sidebar-link .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-link .count-pill{
    margin-right:auto;
    background:var(--c-danger);color:#fff;
    padding:1px 8px;
    border-radius:var(--r-full);
    font-size:0.68rem;font-weight:800;
    min-width:22px;text-align:center;
    flex-shrink:0;
}
.sidebar-link.active .count-pill{background:rgba(255,255,255,0.25)}
.sidebar-link:not(.active) .count-pill{background:var(--c-surface-2);color:var(--c-text-muted)}

.sidebar-link.messages-link{
    background:linear-gradient(135deg,rgba(46,204,113,0.08),rgba(94,184,238,0.06));
    border:1.5px solid rgba(46,204,113,0.2);
    color:var(--c-text);
}
.sidebar-link.messages-link:hover{
    border-color:var(--c-accent);
    background:linear-gradient(135deg,rgba(46,204,113,0.15),rgba(94,184,238,0.1));
}
.sidebar-link.messages-link i{color:var(--c-accent)}

/* Verification Banner */
.verif-banner{
    background:linear-gradient(135deg,rgba(30,136,229,0.08),rgba(30,136,229,0.02));
    border:1.5px solid rgba(30,136,229,0.25);
    border-radius:var(--r-md);
    padding:12px 14px;
    font-size:0.78rem;
    color:var(--c-text);
    line-height:1.5;
    display:flex;
    flex-direction:column;
    gap:8px;
}
.verif-banner .icon-row{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--c-verified)}
.verif-banner .icon-row i{font-size:1rem}
.verif-banner a{color:var(--c-verified);font-weight:800;text-decoration:underline;font-size:0.78rem}
.verif-banner.verif-done{
    background:linear-gradient(135deg,rgba(46,204,113,0.08),rgba(46,204,113,0.02));
    border-color:rgba(46,204,113,0.25);
}
.verif-banner.verif-done .icon-row{color:var(--c-accent-dark)}
.verif-progress{height:6px;background:var(--c-border);border-radius:3px;overflow:hidden;margin-top:4px}
.verif-progress-bar{height:100%;background:linear-gradient(90deg,var(--c-accent),var(--c-verified));border-radius:3px;transition:width var(--t-slow)}

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.dashboard-main{
    display:flex;
    flex-direction:column;
    gap:16px;
    min-width:0;
    width:100%;
    overflow-x:hidden;
}
@media (min-width:640px){.dashboard-main{gap:20px}}

/* ============================================================
   PAGE HEADER
   ============================================================ */
.page-header-bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
}
.page-title{
    font-size:clamp(1.15rem, 4vw, 1.7rem);
    font-weight:900;
    color:var(--c-text);
    display:flex;
    align-items:center;
    gap:8px;
    line-height:1.3;
}
.page-title i{color:var(--c-request);font-size:0.9em}
.page-subtitle{font-size:0.82rem;color:var(--c-text-muted);margin-top:4px;line-height:1.5}
@media (min-width:640px){.page-subtitle{font-size:0.88rem}}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
    display:inline-flex;align-items:center;justify-content:center;
    gap:8px;
    padding:11px 20px;
    min-height:44px;
    border-radius:var(--r-full);
    font-weight:700;font-size:0.85rem;
    transition:all var(--t-base);
    border:2px solid transparent;
    font-family:inherit;cursor:pointer;
    white-space:nowrap;
    text-decoration:none;
}
@media (min-width:640px){.btn{padding:11px 24px;font-size:0.88rem}}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none !important}
.btn-primary{background:linear-gradient(135deg,var(--c-request),var(--c-request-dark));color:#fff;box-shadow:0 6px 20px rgba(255,107,53,0.3)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,107,53,0.45)}
.btn-secondary{background:var(--c-surface-2);color:var(--c-text-muted);border:1px solid var(--c-border)}
.btn-secondary:hover:not(:disabled){background:var(--c-border);color:var(--c-text)}
.btn-block{width:100%}

/* ============================================================
   STATS GRID
   ============================================================ */
.stats-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
}
@media (min-width:640px){.stats-grid{grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:14px}}
@media (min-width:1024px){.stats-grid{gap:16px}}

.stat-card{
    background:var(--c-surface);
    border:1px solid var(--c-border);
    border-radius:var(--r-lg);
    padding:14px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    transition:all var(--t-base);
    position:relative;
    overflow:hidden;
    min-width:0;
}
@media (min-width:640px){.stat-card{padding:18px;gap:14px}}
.stat-card:hover{transform:translateY(-4px);box-shadow:var(--sh-md);border-color:var(--stat-color,var(--c-request))}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--stat-color,var(--c-request))}
.stat-icon{
    width:40px;height:40px;
    border-radius:var(--r-md);
    background:var(--stat-bg,rgba(255,107,53,0.12));
    color:var(--stat-color,var(--c-request));
    display:flex;align-items:center;justify-content:center;
    font-size:1.05rem;flex-shrink:0;
}
@media (min-width:640px){.stat-icon{width:48px;height:48px;font-size:1.3rem}}
.stat-content{flex:1;min-width:0}
.stat-label{font-size:0.68rem;color:var(--c-text-muted);font-weight:700;margin-bottom:3px;line-height:1.3}
@media (min-width:640px){.stat-label{font-size:0.78rem;margin-bottom:4px}}
.stat-value{
    font-size:1.3rem;font-weight:900;
    color:var(--c-text);
    line-height:1;
    font-variant-numeric:tabular-nums;
}
@media (min-width:640px){.stat-value{font-size:1.7rem}}
.stat-trend{font-size:0.68rem;color:var(--c-text-sub);margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}

/* ============================================================
   SECTION CARD
   ============================================================ */
.section-card{
    background:var(--c-surface);
    border:1px solid var(--c-border);
    border-radius:var(--r-lg);
    overflow:hidden;
    box-shadow:var(--sh-sm);
}
.section-card-header{
    padding:14px 16px;
    border-bottom:1px solid var(--c-border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}
@media (min-width:640px){.section-card-header{padding:18px 22px}}
.section-card-title{
    font-size:0.92rem;font-weight:800;
    color:var(--c-text);
    display:flex;align-items:center;gap:8px;
    min-width:0;
}
@media (min-width:640px){.section-card-title{font-size:1.05rem}}
.section-card-title i{color:var(--c-request);font-size:0.9em}
.section-card-title .count-badge-static{
    background:var(--c-surface-2);
    color:var(--c-text-muted);
    padding:2px 10px;
    border-radius:var(--r-full);
    font-size:0.68rem;font-weight:800;
}
.section-card-title .count-badge-static.accent{
    background:linear-gradient(135deg,var(--c-request),var(--c-request-dark));
    color:#fff;
}
.section-card-body{padding:14px}
@media (min-width:640px){.section-card-body{padding:20px 22px}}

.view-all-link{
    font-size:0.76rem;
    color:var(--c-primary-600);
    background:var(--c-surface-2);
    padding:6px 14px;
    min-height:36px;
    border-radius:var(--r-full);
    font-weight:700;
    display:inline-flex;align-items:center;gap:6px;
    transition:all var(--t-fast);
    border:1px solid var(--c-border);
    cursor:pointer;text-decoration:none;
}
@media (min-width:640px){.view-all-link{font-size:0.82rem;padding:7px 16px}}
.view-all-link:hover{background:var(--c-primary-600);color:#fff;border-color:transparent;transform:translateX(-3px)}

/* ============================================================
   ITEM ROW
   ============================================================ */
.item-list{display:flex;flex-direction:column;gap:10px}
@media (min-width:640px){.item-list{gap:12px}}

.item-row{
    background:var(--c-surface-2);
    border:1.5px solid var(--c-border);
    border-radius:var(--r-md);
    padding:12px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    transition:all var(--t-base);
    flex-wrap:wrap;
    position:relative;
    min-width:0;
}
@media (min-width:640px){.item-row{padding:14px 16px;gap:14px}}
.item-row:hover{border-color:var(--c-request);background:var(--c-surface);box-shadow:var(--sh-sm)}

.item-icon-wrapper{
    width:40px;height:40px;
    border-radius:var(--r-md);
    background:linear-gradient(135deg,rgba(255,107,53,0.15),rgba(255,107,53,0.05));
    color:var(--c-request-dark);
    display:flex;align-items:center;justify-content:center;
    font-size:1.05rem;flex-shrink:0;
    overflow:hidden;
}
@media (min-width:640px){.item-icon-wrapper{width:44px;height:44px;font-size:1.2rem}}
.item-icon-wrapper img{width:100%;height:100%;object-fit:cover}
.item-icon-wrapper.accent{
    background:linear-gradient(135deg,rgba(46,204,113,0.15),rgba(46,204,113,0.05));
    color:var(--c-accent-dark);
}

.item-info{flex:1;min-width:0;width:100%}
@media (min-width:640px){.item-info{min-width:200px;width:auto}}
.item-title{
    font-size:0.85rem;font-weight:800;
    color:var(--c-text);
    margin-bottom:4px;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
}
@media (min-width:640px){.item-title{font-size:0.92rem}}

.item-meta{
    display:flex;
    gap:8px;
    font-size:0.7rem;
    color:var(--c-text-sub);
    flex-wrap:wrap;
    align-items:center;
    line-height:1.4;
}
@media (min-width:640px){.item-meta{gap:12px;font-size:0.75rem}}
.item-meta span{display:inline-flex;align-items:center;gap:4px;min-width:0}
.item-meta i{font-size:0.7rem;flex-shrink:0}

.item-price-block{text-align:left;flex-shrink:0}
.item-price{
    font-size:1rem;font-weight:900;
    color:var(--c-accent-dark);
    font-variant-numeric:tabular-nums;
    line-height:1;
}
@media (min-width:640px){.item-price{font-size:1.15rem}}
[data-theme="dark"] .item-price{color:#6ee7a0}
.item-price .currency{font-size:0.68rem;font-weight:700;color:var(--c-text-sub)}
.item-price-label{font-size:0.65rem;color:var(--c-text-sub);margin-top:3px;font-weight:700}

.item-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
    width:100%;
    padding-top:10px;
    border-top:1px dashed var(--c-border);
    justify-content:flex-start;
}
@media (min-width:640px){
    .item-actions{
        width:auto;
        padding-top:0;
        border-top:none;
        justify-content:flex-end;
        margin-right:auto;
    }
}

.item-action-btn{
    padding:8px 12px;
    min-height:38px;
    border-radius:var(--r-md);
    font-weight:700;font-size:0.72rem;
    display:inline-flex;align-items:center;justify-content:center;
    gap:5px;
    transition:all var(--t-fast);
    border:none;white-space:nowrap;cursor:pointer;
    text-decoration:none;
    flex-shrink:0;
}
@media (min-width:640px){
    .item-action-btn{padding:8px 14px;font-size:0.78rem;min-height:40px}
}
.item-action-btn:active{transform:scale(0.96)}
.item-action-btn.primary{background:linear-gradient(135deg,var(--c-request),var(--c-request-dark));color:#fff;box-shadow:0 2px 8px rgba(255,107,53,0.25)}
.item-action-btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,107,53,0.4)}
.item-action-btn.secondary{background:var(--c-surface);color:var(--c-text-muted);border:1px solid var(--c-border)}
.item-action-btn.secondary:hover{background:var(--c-primary-50);color:var(--c-primary-600);border-color:var(--c-primary-500)}
[data-theme="dark"] .item-action-btn.secondary:hover{background:rgba(44,122,184,0.15);color:#7ec8e3}
.item-action-btn.danger{background:var(--c-surface);color:var(--c-danger);border:1px solid rgba(231,76,60,0.25)}
.item-action-btn.danger:hover{background:var(--c-danger);color:#fff;border-color:var(--c-danger)}
.item-action-btn.icon-only{width:38px;height:38px;padding:0;min-height:38px}
@media (min-width:640px){.item-action-btn.icon-only{width:40px;height:40px;min-height:40px}}
.item-action-btn.messaging{background:linear-gradient(135deg,var(--c-accent),var(--c-accent-dark));color:#fff;box-shadow:0 2px 8px rgba(46,204,113,0.25)}
.item-action-btn.messaging:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(46,204,113,0.4)}
.item-action-btn.whatsapp-secondary{background:transparent;color:var(--c-whatsapp);border:1px solid rgba(37,211,102,0.25)}
.item-action-btn.whatsapp-secondary:hover{background:rgba(37,211,102,0.08);border-color:var(--c-whatsapp)}
.item-action-btn.edit-btn{background:rgba(44,122,184,0.08);color:var(--c-primary-600);border:1px solid rgba(44,122,184,0.2)}
.item-action-btn.edit-btn:hover{background:var(--c-primary-600);color:#fff;border-color:var(--c-primary-600);transform:translateY(-1px)}

/* Status badges */
.status-badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 9px;
    border-radius:var(--r-full);
    font-size:0.65rem;font-weight:800;
    white-space:nowrap;
}
@media (min-width:640px){.status-badge{font-size:0.68rem;padding:3px 10px}}
.status-open{background:rgba(46,204,113,0.12);color:var(--c-accent-dark)}
.status-matched{background:rgba(44,122,184,0.12);color:var(--c-primary-600)}
.status-closed{background:rgba(0,0,0,0.06);color:var(--c-text-muted)}
.status-expired{background:rgba(231,76,60,0.12);color:var(--c-danger)}
.status-pending{background:rgba(243,156,18,0.12);color:var(--c-warning)}
.status-accepted{background:rgba(46,204,113,0.15);color:var(--c-accent-dark)}
.status-rejected{background:rgba(0,0,0,0.06);color:var(--c-text-sub)}
[data-theme="dark"] .status-open{background:rgba(46,204,113,0.18);color:#6ee7a0}
[data-theme="dark"] .status-matched{background:rgba(44,122,184,0.2);color:#7ec8e3}
[data-theme="dark"] .status-closed{background:rgba(255,255,255,0.06)}
[data-theme="dark"] .status-expired{background:rgba(231,76,60,0.2);color:#ff9588}
[data-theme="dark"] .status-pending{background:rgba(243,156,18,0.2);color:#f4b860}
[data-theme="dark"] .status-accepted{background:rgba(46,204,113,0.2);color:#6ee7a0}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state{text-align:center;padding:40px 16px;color:var(--c-text-muted)}
@media (min-width:640px){.empty-state{padding:48px 24px}}
.empty-state i.empty-icon{font-size:2.5rem;color:var(--c-request);opacity:0.35;margin-bottom:12px;display:block}
@media (min-width:640px){.empty-state i.empty-icon{font-size:3rem}}
.empty-state h4{font-size:0.95rem;font-weight:800;color:var(--c-text);margin-bottom:6px}
@media (min-width:640px){.empty-state h4{font-size:1rem}}
.empty-state p{font-size:0.82rem;margin-bottom:16px;line-height:1.5}

/* ============================================================
   PRODUCTS GRID (Mini)
   ============================================================ */
.products-grid-mini{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}
@media (min-width:480px){.products-grid-mini{grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:14px}}
@media (min-width:1024px){.products-grid-mini{grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:16px}}

.mini-product{
    background:var(--c-surface);
    border:1.5px solid var(--c-border);
    border-radius:var(--r-lg);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:all var(--t-base);
    position:relative;
}
.mini-product:hover{transform:translateY(-4px);box-shadow:var(--sh-md);border-color:var(--c-request)}
.mini-product-media{
    aspect-ratio:16/10;
    background:linear-gradient(145deg,var(--c-surface-2),var(--c-border));
    overflow:hidden;
    position:relative;
}
.mini-product-media img{width:100%;height:100%;object-fit:cover}
.mini-product-placeholder{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
    background:linear-gradient(145deg,var(--c-primary-50),var(--c-primary-100));
    color:var(--c-primary-700);
}
[data-theme="dark"] .mini-product-placeholder{background:linear-gradient(145deg,var(--c-surface-2),var(--c-primary-900));color:#7ec8e3}
.mini-product-placeholder .emoji{font-size:2.5rem}
.mini-product-status-badge{
    position:absolute;top:8px;right:8px;
    padding:3px 10px;
    border-radius:var(--r-full);
    font-size:0.65rem;font-weight:800;
    backdrop-filter:blur(6px);
    z-index:2;
}
.mini-product-status-badge.active{background:rgba(46,204,113,0.95);color:#fff}
.mini-product-status-badge.inactive{background:rgba(0,0,0,0.7);color:#fff}
.mini-product-status-badge.featured{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;top:auto;bottom:8px}
.mini-product-body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.mini-product-title{
    font-size:0.85rem;font-weight:800;
    color:var(--c-text);
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:2.5em;
    word-break:break-word;
}
@media (min-width:640px){.mini-product-title{font-size:0.88rem}}
.mini-product-specs{display:flex;gap:6px;flex-wrap:wrap;font-size:0.68rem}
.mini-product-specs span{
    background:var(--c-surface-2);
    padding:2px 8px;
    border-radius:var(--r-sm);
    font-weight:700;
    color:var(--c-text-muted);
    border:1px solid var(--c-border);
}
.mini-product-price{
    font-size:1rem;font-weight:900;
    color:var(--c-accent-dark);
    font-variant-numeric:tabular-nums;
    margin-top:auto;
}
@media (min-width:640px){.mini-product-price{font-size:1.05rem}}
[data-theme="dark"] .mini-product-price{color:#6ee7a0}
.mini-product-price .currency{font-size:0.7rem;color:var(--c-text-sub)}
.mini-product-price.no-price{font-size:0.8rem;color:var(--c-text-sub)}
.mini-product-actions{display:flex;gap:4px;padding:0 14px 14px}

/* ============================================================
   CONTACTS TABLE — Responsive Wrapper
   ============================================================ */
.contacts-table-wrapper{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    margin:0 -14px -14px;
    padding:0 14px;
}
@media (min-width:640px){.contacts-table-wrapper{margin:0 -22px -20px;padding:0}}

.contacts-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    font-size:0.8rem;
    min-width:640px;
}
@media (min-width:640px){.contacts-table{font-size:0.85rem;min-width:700px}}
.contacts-table th{
    background:var(--c-surface-2);
    padding:10px 12px;
    text-align:right;
    font-weight:800;
    color:var(--c-text);
    font-size:0.72rem;
    border-bottom:1px solid var(--c-border);
    white-space:nowrap;
    position:sticky;
    top:0;
    z-index:1;
}
@media (min-width:640px){.contacts-table th{padding:12px 16px;font-size:0.78rem}}
.contacts-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--c-border);
    color:var(--c-text-muted);
    vertical-align:middle;
}
@media (min-width:640px){.contacts-table td{padding:12px 16px}}
.contacts-table tr:hover td{background:var(--c-surface-2)}
.contacts-table tr:last-child td{border-bottom:none}

.contact-type-pill{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px;
    border-radius:var(--r-full);
    font-size:0.68rem;font-weight:800;
    white-space:nowrap;
}
.contact-type-whatsapp{background:rgba(37,211,102,0.12);color:var(--c-whatsapp)}
.contact-type-view{background:rgba(44,122,184,0.12);color:var(--c-primary-600)}
.contact-type-phone{background:rgba(243,156,18,0.12);color:var(--c-warning)}
.contact-type-inquiry{background:rgba(139,92,246,0.12);color:var(--c-purple)}
.contact-type-request_quote{background:rgba(255,107,53,0.12);color:var(--c-request-dark)}

/* ============================================================
   PROFILE FORM
   ============================================================ */
.profile-form{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    max-width:720px;
}
@media (min-width:640px){.profile-form{grid-template-columns:repeat(2,1fr);gap:16px}}
.form-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:0.82rem;font-weight:700;color:var(--c-text);line-height:1.4}
.form-group label .req{color:var(--c-danger)}
.form-group label .hint{font-size:0.72rem;color:var(--c-text-sub);font-weight:500;margin-right:4px}
.form-group input,
.form-group textarea,
.form-group select{
    padding:11px 14px;
    min-height:44px;
    border-radius:var(--r-md);
    border:1.5px solid var(--c-border);
    background:var(--c-surface-2);
    color:var(--c-text);
    font-size:16px;
    transition:all var(--t-fast);
    width:100%;
    max-width:100%;
    font-family:inherit;
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--c-request);
    outline:none;
    background:var(--c-surface);
    box-shadow:0 0 0 3px rgba(255,107,53,0.12);
}
.form-group input:disabled{opacity:0.6;cursor:not-allowed}
.form-group textarea{min-height:90px;resize:vertical}
.form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
@media (max-width:480px){.form-actions{flex-direction:column-reverse}}
.form-actions .btn{flex:1;min-width:120px}
@media (min-width:640px){.form-actions .btn{flex:0 1 auto}}

/* ============================================================
   NOTIFICATIONS PANEL
   ============================================================ */
.notif-panel{
    position:fixed;
    top:calc(var(--header-h) + var(--safe-area-top) + 8px);
    left:12px;
    right:12px;
    width:auto;
    max-width:400px;
    background:var(--c-surface);
    border-radius:var(--r-lg);
    box-shadow:var(--sh-xl);
    border:1px solid var(--c-border);
    overflow:hidden;
    z-index:200;
    opacity:0;visibility:hidden;
    transform:translateY(-10px);
    transition:all var(--t-base);
    max-height:calc(100vh - var(--header-h) - 40px);
    display:flex;flex-direction:column;
}
@media (min-width:640px){
    .notif-panel{left:24px;right:auto;width:380px}
}
.notif-panel.show{opacity:1;visibility:visible;transform:translateY(0)}
.notif-header{
    padding:14px 18px;
    border-bottom:1px solid var(--c-border);
    display:flex;justify-content:space-between;align-items:center;
    background:var(--c-surface-2);
}
.notif-header h4{font-size:0.9rem;font-weight:800;color:var(--c-text);display:flex;align-items:center;gap:8px}
.notif-header h4 i{color:var(--c-request)}
.notif-mark-read{
    background:none;color:var(--c-primary-600);
    font-size:0.72rem;font-weight:700;
    cursor:pointer;padding:4px 10px;
    border-radius:var(--r-sm);
    transition:all var(--t-fast);border:none;
}
.notif-mark-read:hover{background:var(--c-primary-50)}
.notif-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.notif-item{
    display:flex;gap:12px;
    padding:12px 16px;
    border-bottom:1px solid var(--c-border);
    transition:background var(--t-fast);
    cursor:pointer;
}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--c-surface-2)}
.notif-item.unread{background:linear-gradient(90deg,rgba(255,107,53,0.04),transparent)}
.notif-item.unread::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c-request);flex-shrink:0;margin-top:8px}
.notif-item:not(.unread)::before{content:'';width:8px;height:8px;border-radius:50%;background:transparent;flex-shrink:0}
.notif-content{flex:1;min-width:0}
.notif-title{font-size:0.82rem;font-weight:800;color:var(--c-text);margin-bottom:3px}
.notif-desc{font-size:0.76rem;color:var(--c-text-muted);line-height:1.4}
.notif-time{font-size:0.68rem;color:var(--c-text-sub);margin-top:4px}

/* ============================================================
   MODAL — Bottom Sheet on Mobile
   ============================================================ */
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,20,30,0.7);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:1000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:0;
    opacity:0;
    visibility:hidden;
    transition:all var(--t-base);
}
@media (min-width:640px){
    .modal-overlay{align-items:center;padding:20px}
}
.modal-overlay.show{opacity:1;visibility:visible}

.modal{
    background:var(--c-surface);
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    box-shadow:var(--sh-xl);
    max-width:700px;
    width:100%;
    max-height:90vh;
    max-height:90dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform var(--t-slow) cubic-bezier(0.22,1,0.36,1);
    padding-bottom:var(--safe-area-bottom);
}
@media (min-width:640px){
    .modal{border-radius:var(--r-xl);transform:scale(0.95) translateY(20px);max-width:700px}
}
.modal-overlay.show .modal{transform:translateY(0)}
@media (min-width:640px){.modal-overlay.show .modal{transform:scale(1) translateY(0)}}

/* Drag handle for mobile bottom sheet */
.modal::before{
    content:'';
    display:block;
    width:40px;height:4px;
    background:var(--c-border);
    border-radius:2px;
    margin:8px auto 0;
}
@media (min-width:640px){.modal::before{display:none}}

.modal-header{
    padding:16px 20px;
    border-bottom:1px solid var(--c-border);
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
}
@media (min-width:640px){.modal-header{padding:20px 24px}}
.modal-header h3{
    font-size:1rem;font-weight:800;
    color:var(--c-text);
    display:flex;align-items:center;gap:10px;
    min-width:0;
}
@media (min-width:640px){.modal-header h3{font-size:1.1rem}}
.modal-header h3 i{color:var(--c-request);flex-shrink:0}
.modal-close{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--c-surface-2);
    color:var(--c-text-muted);
    display:flex;align-items:center;justify-content:center;
    transition:all var(--t-fast);
    font-size:0.9rem;border:none;cursor:pointer;
    flex-shrink:0;
}
.modal-close:hover{background:var(--c-danger);color:#fff}

.modal-body{
    padding:16px 20px;
    overflow-y:auto;
    flex:1;
    -webkit-overflow-scrolling:touch;
}
@media (min-width:640px){.modal-body{padding:24px}}

.modal-footer{
    padding:12px 16px;
    border-top:1px solid var(--c-border);
    display:flex;
    gap:10px;
    justify-content:flex-end;
    background:var(--c-surface-2);
    flex-wrap:wrap;
}
@media (min-width:640px){.modal-footer{padding:16px 24px}}
.modal-footer .btn{flex:1;min-width:120px}
@media (min-width:640px){.modal-footer .btn{flex:0 1 auto}}

/* Offer details box */
.offer-details-box{
    background:var(--c-surface-2);
    border:1px solid var(--c-border);
    border-radius:var(--r-md);
    padding:14px;
    margin-bottom:16px;
    font-size:0.85rem;
}
.offer-details-box strong{color:var(--c-text);font-weight:800}

/* ============================================================
   SKELETON
   ============================================================ */
.skeleton{
    background:linear-gradient(90deg,var(--c-border) 0%,var(--c-surface-2) 50%,var(--c-border) 100%);
    background-size:200% 100%;
    animation:skeletonWave 1.5s infinite;
    border-radius:var(--r-md);
}
.skeleton-row{height:76px;border-radius:var(--r-md);margin-bottom:12px}
.skeleton-stat{height:110px;border-radius:var(--r-lg)}

/* Spinner */
.spinner{
    width:14px;height:14px;
    border:2px solid currentColor;
    border-right-color:transparent;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    display:inline-block;
    vertical-align:middle;
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-container{
    position:fixed;
    bottom:calc(16px + var(--safe-area-bottom));
    left:12px;
    right:12px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    gap:10px;
    pointer-events:none;
}
@media (min-width:640px){
    .toast-container{left:50%;right:auto;transform:translateX(-50%);width:min(420px, calc(100% - 32px))}
}
.toast{
    background:var(--c-surface);
    border:1px solid var(--c-border);
    color:var(--c-text);
    padding:12px 14px;
    border-radius:var(--r-md);
    box-shadow:var(--sh-xl);
    display:flex;
    align-items:center;
    gap:10px;
    animation:slideInUp 0.4s cubic-bezier(0.22,1,0.36,1);
    border-right:4px solid var(--c-request);
    pointer-events:auto;
    transition:opacity var(--t-base),transform var(--t-base);
}
@media (min-width:640px){.toast{padding:14px 18px;gap:12px}}
.toast.removing{opacity:0;transform:translateX(20px)}
.toast .toast-icon{font-size:1.3rem;flex-shrink:0;line-height:1}
@media (min-width:640px){.toast .toast-icon{font-size:1.5rem}}
.toast .toast-content{flex:1;min-width:0}
.toast .toast-title{font-weight:700;font-size:0.85rem;margin-bottom:2px}
@media (min-width:640px){.toast .toast-title{font-size:0.9rem}}
.toast .toast-desc{font-size:0.76rem;color:var(--c-text-muted);line-height:1.4}
.toast .toast-desc a{color:var(--c-primary-600);font-weight:700;text-decoration:underline}
.toast .toast-close{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--c-surface-2);
    color:var(--c-text-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:0.75rem;flex-shrink:0;
    transition:all var(--t-fast);border:none;cursor:pointer;
}
.toast .toast-close:hover{background:var(--c-danger);color:#fff}
.toast.success{border-right-color:var(--c-accent)}
.toast.warning{border-right-color:var(--c-warning)}
.toast.error{border-right-color:var(--c-danger)}
.toast.info{border-right-color:var(--c-purple)}

/* ============================================================
   MOBILE NAV (Bottom)
   ============================================================ */
.mobile-nav{
    display:none;
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--c-surface);
    border-top:1px solid var(--c-border);
    box-shadow:0 -6px 20px rgba(10,37,64,0.08);
    z-index:90;
    padding:6px max(6px, var(--safe-area-left)) calc(6px + var(--safe-area-bottom)) max(6px, var(--safe-area-right));
    grid-template-columns:repeat(5, 1fr);
    gap:2px;
    width:100%;
}
@media (max-width:1023px){.mobile-nav{display:grid}}

.mobile-nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:6px 2px;
    min-height:52px;
    border-radius:var(--r-md);
    color:var(--c-text-sub);
    font-size:0.62rem;
    font-weight:700;
    transition:all var(--t-fast);
    position:relative;
    background:transparent;border:none;cursor:pointer;
    text-decoration:none;
    min-width:0;
}
.mobile-nav-item i{font-size:1.1rem}
.mobile-nav-item.active{color:var(--c-request-dark);background:rgba(255,107,53,0.08)}
[data-theme="dark"] .mobile-nav-item.active{color:#ffb877;background:rgba(255,107,53,0.15)}
.mobile-nav-item .count-pill{
    position:absolute;top:2px;right:10px;
    background:var(--c-danger);color:#fff;
    padding:0 5px;
    border-radius:var(--r-full);
    font-size:0.58rem;font-weight:800;
    min-width:16px;height:16px;
    display:none;align-items:center;justify-content:center;
}
.mobile-nav-item .count-pill.show{display:flex}
.mobile-nav-item.messages-link i{color:var(--c-accent)}

/* ============================================================
   LOGIN REQUIRED
   ============================================================ */
.login-required-state{
    min-height:70vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:40px 20px;
    grid-column:1/-1;
}
.login-required-state .big-icon{
    width:90px;height:90px;
    border-radius:50%;
    background:linear-gradient(135deg,rgba(255,107,53,0.12),rgba(255,107,53,0.04));
    color:var(--c-request-dark);
    display:flex;align-items:center;justify-content:center;
    font-size:2.2rem;
    margin-bottom:20px;
}
@media (min-width:640px){.login-required-state .big-icon{width:100px;height:100px;font-size:2.5rem}}
.login-required-state h2{font-size:1.3rem;font-weight:900;color:var(--c-text);margin-bottom:10px}
@media (min-width:640px){.login-required-state h2{font-size:1.5rem}}
.login-required-state p{font-size:0.9rem;color:var(--c-text-muted);max-width:460px;margin-bottom:24px;line-height:1.6}
.login-required-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:420px}
.login-required-actions .btn{flex:1;min-width:140px}

/* ============================================================
   CHART
   ============================================================ */
.chart-container{
    background:var(--c-surface-2);
    border:1px solid var(--c-border);
    border-radius:var(--r-md);
    padding:14px;
    height:220px;
    display:flex;flex-direction:column;
}
@media (min-width:640px){.chart-container{padding:20px;height:260px}}
.chart-bars{
    flex:1;
    display:flex;
    align-items:flex-end;
    gap:4px;
    padding-top:24px;
    padding-bottom:20px;
    min-height:0;
}
@media (min-width:640px){.chart-bars{gap:8px}}
.chart-bar{
    flex:1;
    background:linear-gradient(180deg,var(--c-request),var(--c-request-dark));
    border-radius:4px 4px 0 0;
    min-height:4px;
    position:relative;
    transition:all var(--t-slow);
    cursor:pointer;
    min-width:0;
}
.chart-bar:hover{opacity:0.8;transform:translateY(-4px)}
.chart-bar-label{
    position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
    font-size:0.6rem;color:var(--c-text-sub);font-weight:700;
    white-space:nowrap;
}
@media (min-width:640px){.chart-bar-label{font-size:0.7rem}}
.chart-bar-value{
    position:absolute;top:-20px;left:50%;transform:translateX(-50%);
    font-size:0.62rem;color:var(--c-text);font-weight:800;
    white-space:nowrap;
}
@media (min-width:640px){.chart-bar-value{font-size:0.72rem}}

/* ============================================================
   MESSAGING BANNER
   ============================================================ */
.messaging-banner{
    background:linear-gradient(135deg,rgba(46,204,113,0.08),rgba(94,184,238,0.06));
    border:1.5px solid rgba(46,204,113,0.2);
    border-radius:var(--r-lg);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:12px;
}
@media (min-width:640px){
    .messaging-banner{
        flex-direction:row;
        align-items:center;
        text-align:right;
        padding:16px 20px;
        gap:14px;
    }
}
.messaging-banner .banner-icon{
    width:44px;height:44px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--c-accent),var(--c-accent-dark));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:1.15rem;flex-shrink:0;
    box-shadow:0 6px 16px rgba(46,204,113,0.3);
}
@media (min-width:640px){.messaging-banner .banner-icon{width:48px;height:48px;font-size:1.3rem}}
.messaging-banner .banner-content{flex:1;min-width:0}

@media (min-width:640px){.messaging-banner h4{font-size:0.95rem}}

.messaging-banner .banner-action{
    background:linear-gradient(135deg,var(--c-accent),var(--c-accent-dark));

/* ============================================================

@media (min-width:640px){.quick-action-card .qa-title{font-size:0.9rem}}

}

const escapeHtml = (str) => {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
};
const sanitizePhone = (p) => p ? String(p).replace(/\D/g, '') : '';
const isValidUUID = (id) => id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
const formatNumber = (n) => Number(n || 0).toLocaleString('ar-EG');
const formatPrice = (p) => Number(p || 0).toLocaleString('ar-EG');
const formatDate = (dateStr) => !dateStr ? '—' : new Date(dateStr).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
const formatDateTime = (dateStr) => {
    if (!dateStr) return '';
    const diffMin = Math.floor((Date.now() - new Date(dateStr)) / 60000);
    if (diffMin < 1) return 'الآن';
    if (diffMin < 60) return `منذ ${diffMin} د`;
    if (diffMin < 1440) return `منذ ${Math.floor(diffMin/60)} س`;
    if (diffMin < 10080) return `منذ ${Math.floor(diffMin/1440)} يوم`;
    return formatDate(dateStr);
};

const initTheme = () => {
    const saved = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    const icon = document.getElementById('themeIcon');
    if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

    document.getElementById('themeToggle')?.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    });
};

const removeToast = (toast) => {
    if (!toast || !toast.parentNode) return;
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
};
const showToast = (icon, title, desc, linkText = null, linkUrl = null, type = '') => {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const iconEl = document.createElement('div');
    iconEl.className = 'toast-icon';
    iconEl.textContent = icon;
    const content = document.createElement('div');
    content.className = 'toast-content';
    const titleEl = document.createElement('div');
    titleEl.className = 'toast-title';
    titleEl.textContent = title;
    const descEl = document.createElement('div');
    descEl.className = 'toast-desc';
    descEl.textContent = desc + (linkText ? ' ' : '');
    if (linkText && linkUrl) {
        const link = document.createElement('a');
        link.href = linkUrl;
        link.textContent = linkText;
        descEl.appendChild(link);
    }
    content.appendChild(titleEl);
    content.appendChild(descEl);
    const closeBtn = document.createElement('button');
    closeBtn.className = 'toast-close';
    closeBtn.setAttribute('aria-label', 'إغلاق');
    closeBtn.innerHTML = '<i class="fas fa-times"></i>';
    closeBtn.onclick = () => removeToast(toast);
    toast.appendChild(iconEl);
    toast.appendChild(content);
    toast.appendChild(closeBtn);
    container.appendChild(toast);
    setTimeout(() => removeToast(toast), 6000);
};

const openDrawer = () => {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;
    sidebar.classList.add('mobile-open');
    document.body.classList.add('no-scroll');
    state.isMobileDrawerOpen = true;
    document.getElementById('menuToggle')?.setAttribute('aria-expanded', 'true');
};

const closeDrawer = () => {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;
    sidebar.classList.remove('mobile-open');
    document.body.classList.remove('no-scroll');
    state.isMobileDrawerOpen = false;
    document.getElementById('menuToggle')?.setAttribute('aria-expanded', 'false');
};

const initNavbar = () => {
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');

    menuToggle?.addEventListener('click', () => {
        if (state.isMobileDrawerOpen) {
            closeDrawer();
        } else {
            openDrawer();
        }
    });

    // Close drawer on outside click
    sidebar?.addEventListener('click', (e) => {
        if (e.target === sidebar) closeDrawer();
    });

    // Close drawer on link click (mobile)
    sidebar?.querySelectorAll('.sidebar-link').forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth < 1024) {
                setTimeout(closeDrawer, 150);
            }
        });
    });

    const userBtn = document.getElementById('userMenuBtn');
    const userDropdown = document.getElementById('userDropdown');
    userBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdown?.classList.toggle('show');
        userBtn.setAttribute('aria-expanded', userDropdown?.classList.contains('show'));
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.nav-user-menu')) {
            userDropdown?.classList.remove('show');
        }
        if (!e.target.closest('#notifPanel') && !e.target.closest('#notifBtn')) {
            document.getElementById('notifPanel')?.classList.remove('show');
        }
    });

    document.getElementById('dropdownLogout')?.addEventListener('click', async (e) => {
        e.preventDefault();
        await supabase.auth.signOut();
        window.location.href = 'index.html';
    });

    document.getElementById('notifBtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('notifPanel')?.classList.toggle('show');
    });
    document.getElementById('notifMarkRead')?.addEventListener('click', markAllNotificationsRead);

    // Close drawer on ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.isMobileDrawerOpen) closeDrawer();
    });

    // Handle resize
    window.addEventListener('resize', () => {
        if (window.innerWidth >= 1024 && state.isMobileDrawerOpen) {
            closeDrawer();
        }
    });
};

const loadSection = async (section) => {
    const main = document.getElementById('dashboardMain');
    if (!main) return;

    if (!state.loadedSections[section]) {
        main.innerHTML = `
            <div class="skeleton skeleton-row" style="height:60px;"></div>
            <div class="stats-grid">
                <div class="skeleton skeleton-stat"></div>
                <div class="skeleton skeleton-stat"></div>

                <div class="skeleton skeleton-stat"></div>
            </div>
            <div class="skeleton skeleton-row"></div>
            <div class="skeleton skeleton-row"></div>
        `;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });

    switch (section) {
        case 'overview': await renderOverview(); break;
        case 'products': await renderProducts(); break;
        case 'my-offers': await renderMyOffers(); break;
        case 'available-requests': await renderAvailableRequests(); break;
        case 'contacts': await renderContacts(); break;
        case 'analytics': renderAnalytics(); break;
        case 'profile': renderProfile(); break;
        default: renderOverview();
    }
    state.loadedSections[section] = true;
};

const fetchMyProducts = async () => {
    if (!state.user) return [];
    try {
        const { data, error } = await supabase
            .from('products').select('*')
            .eq('supplier_id', state.user.id)
            .order('created_at', { ascending: false });
        if (error) throw error;
        return data || [];
    } catch (e) { console.error('Fetch products:', e); return []; }
};

const fetchMyOffers = async () => {
    if (!state.user) return [];
    try {
        const { data, error } = await supabase
            .from('offers').select('*')
            .eq('supplier_id', state.user.id)
            .order('created_at', { ascending: false });
        if (error) throw error;
        const offers = data || [];

        const requestIds = [...new Set(offers.map(o => o.request_id).filter(Boolean))];
        if (!requestIds.length) return offers;

        const { data: requests } = await supabase
            .from('purchase_requests')
            .select('id, product_name, quantity_needed, buyer_id, status, location, budget_min, budget_max, created_at')
            .in('id', requestIds);
        const requestsMap = {};
        (requests || []).forEach(r => { requestsMap[r.id] = r; });

        const buyerIds = [...new Set((requests || []).map(r => r.buyer_id).filter(Boolean))];
        const buyersMap = {};
        if (buyerIds.length) {
            const { data: buyers } = await supabase
                .from('profiles')
                .select('id, full_name, company_name, city, is_verified, phone, whatsapp')
                .in('id', buyerIds);
            (buyers || []).forEach(b => { buyersMap[b.id] = b; });
        }

        return offers.map(o => ({
            ...o,
            request: requestsMap[o.request_id] || null,
            buyer: requestsMap[o.request_id] ? (buyersMap[requestsMap[o.request_id].buyer_id] || null) : null,
        }));
    } catch (e) { console.error('Fetch offers:', e); return []; }
};

const fetchAvailableRequests = async () => {
    if (!state.user) return [];
    try {
        const { data: requests, error } = await supabase
            .from('purchase_requests')
            .select('id, product_name, quantity_needed, category, location, budget_min, budget_max, deadline, description, buyer_id, status, views_count, created_at')
            .eq('status', 'open')
            .order('created_at', { ascending: false })
            .limit(50);
        if (error) throw error;
        if (!requests?.length) return [];

        const buyerIds = [...new Set(requests.map(r => r.buyer_id).filter(Boolean))];
        const buyersMap = {};
        if (buyerIds.length) {
            const { data: buyers } = await supabase
                .from('profiles')
                .select('id, full_name, company_name, city, is_verified')
                .in('id', buyerIds);
            (buyers || []).forEach(b => { buyersMap[b.id] = b; });
        }

        const myOffers = await fetchMyOffers();
        const myOffersByRequest = {};
        myOffers.forEach(o => { myOffersByRequest[o.request_id] = o; });

        return requests.map(r => ({
            ...r,
            buyer: buyersMap[r.buyer_id] || null,
            myOffer: myOffersByRequest[r.id] || null,
        }));
    } catch (e) { console.error('Fetch requests:', e); return []; }
};

const fetchContacts = async () => {
    if (!state.user) return [];
    try {
        const { data: contacts, error } = await supabase
            .from('supplier_contacts').select('*')
            .eq('supplier_id', state.user.id)
            .order('contact_date', { ascending: false })
            .limit(100);
        if (error) throw error;
        if (!contacts?.length) return [];

        const productIds = [...new Set(contacts.map(c => c.product_id).filter(Boolean))];
        const productsMap = {};
        if (productIds.length) {
            const { data: products } = await supabase
                .from('products').select('id, name').in('id', productIds);
            (products || []).forEach(p => { productsMap[p.id] = p; });
        }

        const buyerIds = [...new Set(contacts.map(c => c.buyer_id).filter(Boolean))];
        const buyersMap = {};
        if (buyerIds.length) {
            const { data: buyers } = await supabase
                .from('profiles')
                .select('id, full_name, company_name, phone, whatsapp, city, is_verified')
                .in('id', buyerIds);
            (buyers || []).forEach(b => { buyersMap[b.id] = b; });
        }

        return contacts.map(c => ({
            ...c,
            product: productsMap[c.product_id] || null,
            buyer: buyersMap[c.buyer_id] || null,
        }));
    } catch (e) { console.error('Fetch contacts:', e); return []; }
};

const fetchConversationsStats = async () => {
    if (!state.user) return { total: 0, unread: 0 };
    try {
        const { data: messages, error } = await supabase
            .from('messages')
            .select('from_user_id, to_user_id, is_read, created_at')
            .or(`from_user_id.eq.${state.user.id},to_user_id.eq.${state.user.id}`)
            .order('created_at', { ascending: false })
            .limit(500);

        if (error) throw error;
        if (!messages?.length) return { total: 0, unread: 0 };

        const conversationsMap = new Map();
        messages.forEach(msg => {
            const otherId = msg.from_user_id === state.user.id ? msg.to_user_id : msg.from_user_id;
            if (!otherId) return;

            if (!conversationsMap.has(otherId)) {
                conversationsMap.set(otherId, { unreadCount: 0 });
            }

            if (msg.to_user_id === state.user.id && !msg.is_read) {
                conversationsMap.get(otherId).unreadCount++;
            }
        });

        const total = conversationsMap.size;
        const unread = Array.from(conversationsMap.values()).reduce((sum, c) => sum + c.unreadCount, 0);

        return { total, unread };
    } catch (e) {
        console.error('Fetch conversations stats:', e);
        return { total: 0, unread: 0 };
    }
};

const fetchCategories = async () => {
    try {
        const { data } = await supabase
            .from('categories')
            .select('id, name, icon')
            .order('display_order');
        state.categories = data || [];
    } catch (e) { state.categories = []; }
};

const fetchAllData = async () => {
    if (!state.user) return;
    const [products, myOffers, availableRequests, contacts, convStats] = await Promise.all([
        fetchMyProducts(),
        fetchMyOffers(),
        fetchAvailableRequests(),
        fetchContacts(),
        fetchConversationsStats(),
    ]);
    state.products = products;
    state.myOffers = myOffers;
    state.availableRequests = availableRequests;
    state.contacts = contacts;

    const totalViews = products.reduce((sum, p) => sum + (p.views || 0), 0);
    const totalContacts = contacts.length;
    const totalWhatsapp = contacts.filter(c => c.contact_type === 'whatsapp').length;
    const acceptedOffers = myOffers.filter(o => o.status === 'accepted').length;

    const weeklyViews = [0, 0, 0, 0, 0, 0, 0];
    products.forEach(p => {
        const dayIndex = new Date(p.created_at).getDay();
        weeklyViews[dayIndex] += (p.views || 0);
    });

    state.stats = {
        totalProducts: products.length,
        activeProducts: products.filter(p => p.status === 'active').length,
        totalOffers: myOffers.length,
        acceptedOffers,
        totalViews,
        totalContacts,
        totalWhatsapp,
        totalMessages: convStats.total,
        unreadMessages: convStats.unread,
        weeklyViews,
    };

    updateSidebarCounts();
    updateNavBadges();
    buildNotifications();
};

const updateSidebarCounts = () => {
    const els = {
        sidebarProductsCount: state.stats.totalProducts,
        sidebarOffersCount: state.stats.totalOffers,
        sidebarAvailableCount: state.availableRequests.filter(r => !r.myOffer).length,
    };
    Object.entries(els).forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el) {
            el.textContent = val > 99 ? '99+' : val;
            el.style.display = val > 0 ? 'inline-flex' : 'none';
        }
    });

    const msgCount = document.getElementById('sidebarMessagesCount');
    if (msgCount) {
        const unread = state.stats.unreadMessages;
        if (unread > 0) {
            msgCount.textContent = unread > 99 ? '99+' : unread;
            msgCount.style.display = 'inline-flex';
        } else {
            msgCount.style.display = 'none';
        }
    }
};

const buildNotifications = () => {
    const notifs = [];

    state.availableRequests.filter(r => !r.myOffer).slice(0, 5).forEach(r => {
        notifs.push({
            id: `req-${r.id}`, type: 'request',
            title: '📢 طلب شراء جديد',
            desc: `مطلوب: ${r.product_name} — ${r.quantity_needed || 'كمية غير محددة'}`,
            time: r.created_at, unread: true,
            link: `request-details.html?id=${r.id}`,
        });
    });

    state.contacts.filter(c => c.contact_type === 'whatsapp' || c.contact_type === 'phone').slice(0, 3).forEach(c => {
        const typeInfo = getContactTypeInfo(c.contact_type);
        const buyerName = c.buyer?.company_name || c.buyer?.full_name || 'عميل';
        notifs.push({
            id: `contact-${c.id}`, type: 'contact',
            title: `${typeInfo.icon.includes('whatsapp') ? '💬' : '📞'} ${typeInfo.text}`,
            desc: `${buyerName} — ${c.product?.name || 'منتج'}`,
            time: c.contact_date, unread: false,
            link: `product-details.html?id=${c.product_id}`,
        });
    });

    state.myOffers.filter(o => o.status === 'accepted').slice(0, 3).forEach(o => {
        notifs.push({
            id: `offer-${o.id}`, type: 'offer',
            title: '✅ عرضك مقبول!',
            desc: `تم قبول عرضك على "${o.request?.product_name || 'طلب'}"`,
            time: o.created_at, unread: false,
            link: `request-details.html?id=${o.request_id}`,
        });
    });

    notifs.sort((a, b) => new Date(b.time) - new Date(a.time));
    state.notifications = notifs;
    renderNotifications();
    updateNavBadges();
};

const renderNotifications = () => {
    const list = document.getElementById('notifList');
    if (!list) return;
    if (!state.notifications.length) {
        list.innerHTML = `<div class="empty-state" style="padding:40px 20px;"><i class="fas fa-bell-slash empty-icon" style="font-size:2rem;"></i><p>لا توجد إشعارات جديدة</p></div>`;
        return;
    }
    list.innerHTML = state.notifications.map(n => `
        <div class="notif-item ${n.unread ? 'unread' : ''}" data-notif-id="${escapeHtml(n.id)}" data-link="${escapeHtml(n.link || '')}">
            <div class="notif-content">
                <div class="notif-title">${escapeHtml(n.title)}</div>
                <div class="notif-desc">${escapeHtml(n.desc)}</div>
                <div class="notif-time">${formatDateTime(n.time)}</div>
            </div>
        </div>
    `).join('');
    list.querySelectorAll('.notif-item').forEach(item => {
        item.addEventListener('click', () => {
            const link = item.dataset.link;
            if (link) window.location.href = link;
        });
    });
};

const markAllNotificationsRead = () => {
    state.notifications = state.notifications.map(n => ({ ...n, unread: false }));
    renderNotifications();
    updateNavBadges();
    showToast('✅', 'تم التعليم', 'كل الإشعارات اتعلّمت كمقروءة', null, null, 'success');
};

const buildMessageUrl = (userId, { productId = null, requestId = null } = {}) => {
    const params = new URLSearchParams({ to: userId });
    if (productId) params.set('product', productId);
    if (requestId) params.set('request', requestId);
    return `messages.html?${params.toString()}`;
};

    const stockLabels = { 'available': { text: 'متوفر', cls: 'active' }, 'low': { text: 'محدود', cls: 'inactive' }, 'out': { text: 'غير متوفر', cls: 'inactive' } };
    const stock = stockLabels[p.stock_status] || stockLabels['available'];
    return `
        <div class="mini-product" data-product-id="${escapeHtml(p.id)}">
            <div class="mini-product-media">
                ${hasImage ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'mini-product-placeholder\\'><span class=\\'emoji\\'>🧪</span></div>';" />` : `<div class="mini-product-placeholder"><span class="emoji">🧪</span></div>`}
                <span class="mini-product-status-badge ${stock.cls}">${stock.text}</span>
                ${p.is_featured ? `<span class="mini-product-status-badge featured">⭐ مميز</span>` : ''}
            </div>
            <div class="mini-product-body">
                <h3 class="mini-product-title">${escapeHtml(p.name)}</h3>
                <div class="mini-product-specs">
                    ${p.cas_number ? `<span style="color:var(--c-purple);">CAS ${escapeHtml(p.cas_number)}</span>` : ''}
                    ${p.purity ? `<span>${escapeHtml(p.purity)}</span>` : ''}
                    ${p.packaging ? `<span>${escapeHtml(p.packaging)}</span>` : ''}
                </div>
                <div class="mini-product-price ${p.price ? '' : 'no-price'}">
                    ${p.price ? `${formatPrice(p.price)} <span class="currency">ج.م</span>` : 'السعر عند الطلب'}
                </div>
            </div>
            <div class="mini-product-actions">
                <a href="edit-product.html?id=${encodeURIComponent(p.id)}" class="item-action-btn edit-btn" style="flex:1;">
                    <i class="fas fa-edit"></i> تعديل
                </a>
                <a href="product-details.html?id=${encodeURIComponent(p.id)}" class="item-action-btn secondary icon-only" target="_blank" rel="noopener" title="عرض"><i class="fas fa-external-link-alt"></i></a>
                <button class="item-action-btn danger icon-only delete-product-btn" type="button" data-product-id="${escapeHtml(p.id)}" data-product-name="${escapeHtml(p.name)}" title="حذف"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `;
};

const bindProductEvents = () => {
    document.querySelectorAll('.delete-product-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteProduct(btn.dataset.productId, btn.dataset.productName));
    });
};

const deleteProduct = async (productId, productName) => {
    if (!confirm(`هل أنت متأكد من حذف "${productName}"؟`)) return;
    try {
        const { error } = await supabase.from('products').delete().eq('id', productId).eq('supplier_id', state.user.id);
        if (error) throw error;
        showToast('🗑️', 'تم الحذف', `حُذف "${productName}"`, null, null, 'success');
        await fetchAllData();
        loadSection('products');
    } catch (err) {
        showToast('⚠️', 'خطأ', err.message || 'تعذر الحذف', null, null, 'error');
    }
};

const openOfferModal = (requestId) => {
    const request = state.availableRequests.find(r => r.id === requestId);
    if (!request) return;
    state.currentOfferRequestId = requestId;

    const detailsBox = document.getElementById('offerRequestDetails');
    if (detailsBox) {
        let budgetText = '';
        if (request.budget_min || request.budget_max) {
            const min = request.budget_min ? formatPrice(request.budget_min) : '';
            const max = request.budget_max ? formatPrice(request.budget_max) : '';
            if (min && max) budgetText = `${min} - ${max} ج.م`;
            else if (min) budgetText = `من ${min} ج.م`;
            else budgetText = `حتى ${max} ج.م`;
        }
        detailsBox.innerHTML = `
            <div style="display:grid;gap:6px;">
                <div><strong>المنتج:</strong> ${escapeHtml(request.product_name)}</div>
                ${request.quantity_needed ? `<div><strong>الكمية:</strong> ${escapeHtml(request.quantity_needed)}</div>` : ''}
                ${budgetText ? `<div><strong>الميزانية:</strong> ${budgetText}</div>` : ''}
                ${request.location ? `<div><strong>الموقع:</strong> ${escapeHtml(request.location)}</div>` : ''}
                ${request.deadline ? `<div><strong>الموعد النهائي:</strong> ${formatDate(request.deadline)}</div>` : ''}
            </div>
        `;
    }

    document.getElementById('offerForm')?.reset();
    document.getElementById('offerModal')?.classList.add('show');
    document.body.classList.add('no-scroll');
    setTimeout(() => document.getElementById('offerPrice')?.focus(), 300);
};

const closeOfferModal = () => {
    document.getElementById('offerModal')?.classList.remove('show');
    document.body.classList.remove('no-scroll');
    state.currentOfferRequestId = null;
    document.getElementById('offerForm')?.reset();
};

const submitOffer = async () => {
    if (!state.user || !state.currentOfferRequestId) return;
    const btn = document.getElementById('submitOfferBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري الإرسال...';

    try {
        const price = parseFloat(document.getElementById('offerPrice').value);
        if (!price || price <= 0) throw new Error('السعر مطلوب وأكبر من صفر');

        const offerData = {
            request_id: state.currentOfferRequestId,
            supplier_id: state.user.id,
            price: price,
            quantity_offered: document.getElementById('offerQuantity').value.trim() || null,
            delivery_time: document.getElementById('offerDelivery').value.trim() || null,
            message: document.getElementById('offerMessage').value.trim() || null,
            status: 'pending',
        };

        const { error } = await supabase.from('offers').insert(offerData);
        if (error) throw error;

        showToast('✅', 'تم الإرسال!', 'عرضك وصل للعميل — تقدر تتابع الرد في الرسائل', 'افتح الرسائل', 'messages.html', 'success');
        closeOfferModal();
        await fetchAllData();
        loadSection(state.activeSection);

    } catch (err) {
        console.error('Submit offer error:', err);
        showToast('⚠️', 'خطأ', err.message || 'تعذر إرسال العرض', null, null, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
};

const exportContactsCsv = () => {
    if (!state.contacts.length) {
        showToast('⚠️', 'مفيش بيانات', 'لا توجد تواصلات للتصدير', null, null, 'warning');
        return;
    }
    const rows = [['العميل','الشركة','المنتج','نوع التواصل','المدينة','الهاتف','التاريخ']];
    state.contacts.forEach(c => {
        rows.push([
            c.buyer?.full_name || '',
            c.buyer?.company_name || '',
            c.product?.name || '',
            getContactTypeInfo(c.contact_type).text,
            c.buyer?.city || '',
            c.buyer?.phone || c.buyer?.whatsapp || '',
            formatDate(c.contact_date),
        ]);
    });
    const csv = '\uFEFF' + rows.map(r => r.map(f => `"${String(f).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `contacts-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅', 'تم التصدير', 'تم تحميل ملف CSV', null, null, 'success');
};
