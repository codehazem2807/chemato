<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيماتو | لوحة المورد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Tahoma', sans-serif;
        }
        body {
            background: #f0f4f8;
        }
        .navbar {
            background: linear-gradient(135deg, #0a2f2f, #1b6b6b);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            color: white;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 30px;
        }
        .nav-links a:hover {
            background: #ffb347;
            color: #1e2a3e;
        }
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn-add {
            background: #ffb347;
            color: #1e2a3e;
            padding: 12px 25px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 20px;
        }
        .card h3 {
            color: #0a2f2f;
            margin-bottom: 10px;
        }
        .price {
            color: #ffb347;
            font-size: 20px;
            font-weight: bold;
        }
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-edit, .btn-delete {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        .btn-edit {
            background: #1b6b6b;
            color: white;
        }
        .btn-delete {
            background: #e53e3e;
            color: white;
        }
        .footer {
            background: #0a2f2f;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }
        .user-info {
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logout-btn {
            background: #e53e3e;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">🧪 كيماتو - المورد</div>
    <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="add-product.html">➕ إضافة منتج</a>
    </div>
</div>

<div class="container">
    <div class="user-info" id="userInfo">
        <span>جاري التحميل...</span>
        <button class="logout-btn" id="logoutBtn">تسجيل خروج</button>
    </div>
    
    <div class="header-section">
        <h2>📦 منتجاتي</h2>
        <a href="add-product.html" class="btn-add">+ إضافة منتج جديد</a>
    </div>
    
    <div id="productsList" class="product-grid">جاري التحميل...</div>
</div>

<div class="footer">
    © جميع الحقوق محفوظة Hazem Mohamady 2026 | كيماتو - سوق المواد الكيماوية
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    
    let currentUser = null
    let currentProfile = null
    
    // التحقق من تسجيل الدخول
    async function checkAuth() {
        const { data: { user } } = await supabase.auth.getUser()
        if (!user) {
            window.location.href = 'auth.html'
            return
        }
        currentUser = user
        
        const { data: profile } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single()
        
        currentProfile = profile
        
        if (profile?.user_type !== 'supplier') {
            alert('هذه الصفحة مخصصة للموردين فقط')
            window.location.href = 'index.html'
            return
        }
        
        document.getElementById('userInfo').innerHTML = `
            <span>👋 مرحباً ${profile.full_name || profile.company_name || 'مورد'} | ${profile.company_name ? profile.company_name : ''}</span>
            <button class="logout-btn" id="logoutBtn">تسجيل خروج</button>
        `
        
        document.getElementById('logoutBtn').addEventListener('click', logout)
        
        loadProducts()
    }
    
    async function logout() {
        await supabase.auth.signOut()
        window.location.href = 'index.html'
    }
    
    async function loadProducts() {
        const { data, error } = await supabase
            .from('products')
            .select('*')
            .eq('supplier_id', currentUser.id)
            .order('created_at', { ascending: false })
        
        const container = document.getElementById('productsList')
        if (error) {
            container.innerHTML = `<p style="color:red;">خطأ: ${error.message}</p>`
            return
        }
        if (!data || data.length === 0) {
            container.innerHTML = '<p>⚠️ لا توجد منتجات. أضف منتجك الأول! 🚀</p>'
            return
        }
        
        container.innerHTML = data.map(p => `
            <div class="card">
                <img class="card-img" src="${p.image_url || 'https://placehold.co/400x200?text=كيماتو'}" alt="${p.name}">
                <div class="card-content">
                    <h3>🧪 ${p.name}</h3>
                    <p>${p.category || 'مواد كيماوية'}</p>
                    <div class="price">${p.price ? p.price + ' جنيه / ' + p.unit : 'سعر عند الطلب'}</div>
                    <div class="card-actions">
                        <button class="btn-edit" onclick="editProduct('${p.id}')">تعديل</button>
                        <button class="btn-delete" onclick="deleteProduct('${p.id}')">حذف</button>
                    </div>
                </div>
            </div>
        `).join('')
    }
    
    window.editProduct = function(id) {
        window.location.href = `add-product.html?id=${id}`
    }
    
    window.deleteProduct = async function(id) {
        if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
            const { error } = await supabase.from('products').delete().eq('id', id)
            if (error) {
                alert('خطأ: ' + error.message)
            } else {
                alert('تم الحذف بنجاح')
                loadProducts()
            }
        }
    }
    
    checkAuth()
</script>
</body>
</html>
