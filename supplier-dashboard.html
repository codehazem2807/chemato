<style>
/* ============================================================
   CHEMOTO 3.1 — Design System
   ============================================================ */
:root {
    --c-primary-50:#eef6fc; --c-primary-100:#d4e7f5; --c-primary-500:#2c7ab8;
    --c-primary-600:#1d5b8e; --c-primary-700:#144167; --c-primary-800:#0d2e4a; --c-primary-900:#0a2540;
    --c-accent:#2ecc71; --c-accent-dark:#22a95c; --c-warning:#f39c12; --c-danger:#e74c3c;
    --c-whatsapp:#25D366; --c-purple:#8b5cf6; --c-verified:#1e88e5;
    --c-lab-green:#00A86B; --c-safety-orange:#FF6B35;
    --c-bg:#f6f8fb; --c-surface:#ffffff; --c-surface-2:#f9fbfd; --c-border:#e3eaf2;
    --c-text:#0a1f33; --c-text-muted:#5a6b7e; --c-text-sub:#8595a8;
    --sh-sm:0 1px 3px rgba(10,37,64,0.06); --sh-md:0 4px 16px rgba(10,37,64,0.08);
    --sh-lg:0 12px 32px rgba(10,37,64,0.10); --sh-xl:0 20px 48px rgba(10,37,64,0.14);
    --sh-2xl:0 32px 64px rgba(10,37,64,0.18);
    --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;
    --t-fast:150ms cubic-bezier(0.4,0,0.2,1); --t-base:250ms cubic-bezier(0.4,0,0.2,1);
    --t-slow:400ms cubic-bezier(0.4,0,0.2,1); --t-spring:400ms cubic-bezier(0.34,1.56,0.64,1);
    --container:1320px; --header-h:68px;
    --chat-sidebar-w: 360px;
}
[data-theme="dark"] {
    --c-bg:#0a1520; --c-surface:#101e2e; --c-surface-2:#16273a; --c-border:#1f3349;
    --c-text:#e8eef5; --c-text-muted:#9fb1c4; --c-text-sub:#6e8298;
    --sh-sm:0 1px 3px rgba(0,0,0,0.3); --sh-md:0 4px 16px rgba(0,0,0,0.35);
    --sh-lg:0 12px 32px rgba(0,0,0,0.45); --sh-xl:0 20px 48px rgba(0,0,0,0.55);
    --sh-2xl:0 32px 64px rgba(0,0,0,0.65);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;min-height:100vh;overflow-x:hidden;transition:background-color var(--t-base),color var(--t-base)}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--c-primary-500);outline-offset:2px;border-radius:var(--r-sm)}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes badgePop{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes skeletonWave{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes messageIn{from{opacity:0;transform:translateY(10px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes typingDots{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-6px);opacity:1}}
@keyframes slideInSidebar{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadeInOverlay{from{opacity:0}to{opacity:1}}

.animate-in{animation:fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) backwards}

/* NAVBAR */
.navbar{position:sticky;top:0;z-index:100;background:rgba(10,37,64,0.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 20px;height:var(--header-h)}
.navbar-inner{max-width:var(--container);width:100%;margin:0 auto;height:100%;display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo a{display:flex;align-items:center;gap:10px;color:#fff}
.logo img{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,107,53,0.5);object-fit:cover;background:#fff}
.logo-text{font-weight:800;font-size:19px;color:#fff;white-space:nowrap}
.logo-text .blue{color:#5eb8ee}
.logo-text .gray{color:rgba(255,255,255,0.6);font-weight:400;font-size:0.9em}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-action-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;transition:all var(--t-fast);position:relative;border:none;cursor:pointer}
.nav-action-btn:hover{background:rgba(255,255,255,0.18);transform:translateY(-2px)}
.nav-action-btn.rotate:hover{transform:rotate(15deg)}
.count-badge{position:absolute;top:-4px;right:-4px;background:var(--c-danger);color:#fff;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:0.65rem;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid rgba(10,37,64,0.9);animation:badgePop 0.4s ease}
.count-badge.show{display:flex}
.nav-user-menu{position:relative}
.nav-user-btn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:var(--r-full);background:rgba(255,255,255,0.08);color:#fff;transition:all var(--t-fast);font-family:inherit;cursor:pointer;border:none}
.nav-user-btn:hover{background:rgba(255,255,255,0.15)}
.nav-user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--c-request),var(--c-request-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.85rem;overflow:hidden;flex-shrink:0}
.nav-user-avatar img{width:100%;height:100%;object-fit:cover}
.nav-user-name{font-size:0.82rem;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-dropdown{position:absolute;top:calc(100% + 10px);left:0;background:var(--c-surface);border-radius:var(--r-md);box-shadow:var(--sh-xl);border:1px solid var(--c-border);min-width:220px;overflow:hidden;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all var(--t-base);z-index:1000}
.nav-dropdown.show{opacity:1;visibility:visible;transform:translateY(0)}
.nav-dropdown a{display:flex;align-items:center;gap:10px;padding:12px 18px;color:var(--c-text);font-size:0.9rem;font-weight:500;border-bottom:1px solid var(--c-border);transition:all var(--t-fast)}
.nav-dropdown a:last-child{border-bottom:none}
.nav-dropdown a:hover{background:var(--c-surface-2);color:var(--c-primary-600);padding-right:24px}
.nav-dropdown a.logout{color:var(--c-danger)}

/* MAIN LAYOUT - CHAT */
.chat-layout {
    max-width: var(--container);
    margin: 0 auto;
    height: calc(100vh - var(--header-h));
    display: grid;
    grid-template-columns: var(--chat-sidebar-w) 1fr;
    gap: 0;
    background: var(--c-surface);
    border-radius: 0;
    overflow: hidden;
    position: relative;
}
@media (min-width: 1025px) {
    .chat-layout {
        height: calc(100vh - var(--header-h) - 32px);
        margin: 16px auto;
        border-radius: var(--r-xl);
        box-shadow: var(--sh-lg);
        border: 1px solid var(--c-border);
    }
}

/* SIDEBAR */
.chat-sidebar {
    background: var(--c-surface);
    border-left: 1px solid var(--c-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.chat-sidebar-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--c-border);
    background: var(--c-surface);
}
.chat-sidebar-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}
.chat-sidebar-title h2 {
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--c-text);
    display: flex;
    align-items: center;
    gap: 10px;
}
.chat-sidebar-title h2 i { color: var(--c-accent); }
.chat-sidebar-title .total-unread {
    background: var(--c-danger);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: var(--r-full);
}

.chat-search {
    position: relative;
    margin-bottom: 12px;
}
.chat-search i {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--c-text-sub);
    font-size: 0.9rem;
    pointer-events: none;
}
.chat-search input {
    width: 100%;
    padding: 11px 40px 11px 14px;
    border-radius: var(--r-full);
    border: 1.5px solid var(--c-border);
    background: var(--c-surface-2);
    color: var(--c-text);
    font-size: 0.88rem;
    transition: all var(--t-fast);
}
.chat-search input:focus {
    outline: none;
    border-color: var(--c-accent);
    background: var(--c-surface);
    box-shadow: 0 0 0 3px rgba(46,204,113,0.1);
}

.chat-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}
.chat-filter-btn {
    padding: 6px 14px;
    border-radius: var(--r-full);
    background: var(--c-surface-2);
    color: var(--c-text-muted);
    font-size: 0.75rem;
    font-weight: 700;
    border: 1px solid var(--c-border);
    transition: all var(--t-fast);
    white-space: nowrap;
}
.chat-filter-btn:hover {
    border-color: var(--c-accent);
    color: var(--c-accent-dark);
}
.chat-filter-btn.active {
    background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(46,204,113,0.3);
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
}
.chat-list::-webkit-scrollbar { width: 6px; }
.chat-list::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }
.chat-list::-webkit-scrollbar-thumb:hover { background: var(--c-text-sub); }

.chat-item {
    padding: 14px 18px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    cursor: pointer;
    border-bottom: 1px solid var(--c-border);
    transition: all var(--t-fast);
    position: relative;
}
.chat-item:hover {
    background: var(--c-surface-2);
}
.chat-item.active {
    background: linear-gradient(90deg, rgba(46,204,113,0.08), transparent);
    border-right: 3px solid var(--c-accent);
}
.chat-item.unread {
    background: linear-gradient(90deg, rgba(46,204,113,0.04), transparent);
}
.chat-item.unread .chat-item-name {
    font-weight: 900;
    color: var(--c-text);
}
.chat-item.unread .chat-item-preview {
    color: var(--c-text);
    font-weight: 700;
}

.chat-item-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c-primary-500), var(--c-primary-700));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.1rem;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    border: 2px solid var(--c-surface);
    box-shadow: 0 2px 8px rgba(10,37,64,0.1);
}
.chat-item-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-item-avatar.online::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    background: var(--c-accent);
    border-radius: 50%;
    border: 2px solid var(--c-surface);
    animation: pulse 2s ease-in-out infinite;
}

.chat-item-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.chat-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}
.chat-item-name {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--c-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
}
.chat-item-name .verified-dot {
    color: var(--c-verified);
    font-size: 0.75rem;
    flex-shrink: 0;
}
.chat-item-time {
    font-size: 0.7rem;
    color: var(--c-text-sub);
    font-weight: 700;
    flex-shrink: 0;
}
.chat-item-preview {
    font-size: 0.82rem;
    color: var(--c-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
}
.chat-item-preview .attachment-icon {
    color: var(--c-accent);
    margin-left: 4px;
}

.chat-item-badge {
    background: var(--c-accent);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 800;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
    align-self: flex-start;
}

.chat-empty-sidebar {
    padding: 60px 24px;
    text-align: center;
    color: var(--c-text-muted);
}
.chat-empty-sidebar i {
    font-size: 3rem;
    opacity: 0.3;
    color: var(--c-accent);
    margin-bottom: 14px;
    display: block;
}

/* CHAT VIEW */
.chat-view {
    background: var(--c-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* Chat Header */
.chat-view-header {
    padding: 14px 20px;
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-border);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 5;
}
.chat-back-btn {
    display: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--c-surface-2);
    color: var(--c-text);
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all var(--t-fast);
}
.chat-back-btn:hover { background: var(--c-border); }

.chat-header-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c-primary-500), var(--c-primary-700));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1rem;
    flex-shrink: 0;
    overflow: hidden;
}
.chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; }

.chat-header-info {
    flex: 1;
    min-width: 0;
}
.chat-header-name {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--c-text);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.chat-header-name .verified-dot { color: var(--c-verified); font-size: 0.8rem; }
.chat-header-status {
    font-size: 0.75rem;
    color: var(--c-text-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
}
.chat-header-status .online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--c-accent);
    box-shadow: 0 0 0 3px rgba(46,204,113,0.2);
}

.chat-header-actions {
    display: flex;
    gap: 6px;
}
.chat-header-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--c-surface-2);
    color: var(--c-text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    transition: all var(--t-fast);
}
.chat-header-btn:hover {
    background: var(--c-accent);
    color: #fff;
    transform: scale(1.08);
}
.chat-header-btn.whatsapp:hover {
    background: var(--c-whatsapp);
}

/* Context Bar (product/request link) */
.chat-context-bar {
    padding: 10px 20px;
    background: linear-gradient(135deg, rgba(46,204,113,0.06), rgba(94,184,238,0.04));
    border-bottom: 1px solid var(--c-border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all var(--t-fast);
}
.chat-context-bar:hover { background: linear-gradient(135deg, rgba(46,204,113,0.12), rgba(94,184,238,0.08)); }
.chat-context-bar i.context-icon { color: var(--c-accent); font-size: 1rem; }
.chat-context-bar .context-text { flex: 1; min-width: 0; color: var(--c-text); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-context-bar .context-action { color: var(--c-accent-dark); font-weight: 800; font-size: 0.78rem; }

/* Messages Area */
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
    background-image:
        radial-gradient(circle at 20% 20%, rgba(46,204,113,0.02) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(44,122,184,0.02) 0%, transparent 50%);
}
.chat-messages::-webkit-scrollbar { width: 8px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 4px; }
.chat-messages::-webkit-scrollbar-thumb:hover { background: var(--c-text-sub); }

.load-more-btn {
    align-self: center;
    padding: 8px 20px;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--r-full);
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--c-text-muted);
    margin-bottom: 16px;
    transition: all var(--t-fast);
    box-shadow: var(--sh-sm);
}
.load-more-btn:hover {
    background: var(--c-accent);
    color: #fff;
    border-color: transparent;
}

.date-separator {
    align-self: center;
    padding: 4px 14px;
    background: rgba(10,37,64,0.08);
    color: var(--c-text-muted);
    border-radius: var(--r-full);
    font-size: 0.7rem;
    font-weight: 700;
    margin: 12px 0;
}
[data-theme="dark"] .date-separator {
    background: rgba(255,255,255,0.08);
}

.msg-wrapper {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    margin-bottom: 4px;
    animation: messageIn 0.3s cubic-bezier(0.22,1,0.36,1);
    max-width: 75%;
}
.msg-wrapper.sent {
    align-self: flex-start;
    flex-direction: row;
}
.msg-wrapper.received {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c-primary-500), var(--c-primary-700));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.75rem;
    flex-shrink: 0;
    overflow: hidden;
}
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

.msg-bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 0.88rem;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    position: relative;
    box-shadow: 0 1px 2px rgba(10,37,64,0.04);
}
.msg-wrapper.sent .msg-bubble {
    background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
    color: #fff;
    border-bottom-right-radius: 4px;
}
.msg-wrapper.received .msg-bubble {
    background: var(--c-surface);
    color: var(--c-text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--c-border);
}

.msg-bubble .msg-image {
    max-width: 240px;
    border-radius: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: transform var(--t-fast);
}
.msg-bubble .msg-image:hover { transform: scale(1.02); }

.msg-bubble .msg-file {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.06);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 0.8rem;
    font-weight: 700;
}
[data-theme="dark"] .msg-bubble.sent .msg-file { background: rgba(255,255,255,0.12); }

.msg-meta {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 4px;
    font-size: 0.68rem;
    opacity: 0.8;
}
.msg-wrapper.sent .msg-meta { color: rgba(255,255,255,0.9); }
.msg-wrapper.received .msg-meta { color: var(--c-text-sub); }
.msg-meta .status-icon { font-size: 0.72rem; }
.msg-meta .status-icon.read { color: #fff; }
.msg-wrapper.received .msg-meta .status-icon.read { color: var(--c-accent); }

.msg-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity var(--t-fast);
    align-self: center;
    flex-shrink: 0;
}
.msg-wrapper:hover .msg-actions { opacity: 1; }
.msg-action-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    color: var(--c-text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    transition: all var(--t-fast);
}
.msg-action-btn:hover {
    background: var(--c-accent);
    color: #fff;
    border-color: transparent;
}

/* Typing Indicator */
.typing-indicator {
    display: none;
    align-self: flex-end;
    flex-direction: row-reverse;
    gap: 8px;
    align-items: flex-end;
    max-width: 75%;
    margin-bottom: 8px;
}
.typing-indicator.show { display: flex; }
.typing-indicator .msg-bubble {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    display: flex;
    gap: 4px;
    padding: 12px 16px;
}
.typing-indicator .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--c-accent);
    animation: typingDots 1.4s infinite;
}
.typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

/* Composer */
.chat-composer {
    padding: 14px 20px;
    background: var(--c-surface);
    border-top: 1px solid var(--c-border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.attach-menu {
    position: relative;
}
.attach-menu-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--c-surface-2);
    color: var(--c-text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    transition: all var(--t-fast);
    border: 1px solid var(--c-border);
}
.attach-menu-btn:hover {
    background: var(--c-accent);
    color: #fff;
    border-color: transparent;
    transform: scale(1.05);
}

.attach-dropdown {
    position: absolute;
    bottom: calc(100% + 10px);
    right: 0;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--r-md);
    box-shadow: var(--sh-xl);
    min-width: 180px;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: all var(--t-base);
    z-index: 50;
}
.attach-dropdown.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}
.attach-dropdown button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    color: var(--c-text);
    font-size: 0.88rem;
    font-weight: 600;
    transition: background var(--t-fast);
    text-align: right;
}
.attach-dropdown button:hover {
    background: var(--c-surface-2);
    color: var(--c-accent-dark);
}
.attach-dropdown button i {
    color: var(--c-accent);
    width: 20px;
    text-align: center;
}

.chat-input-wrapper {
    flex: 1;
    position: relative;
}
.chat-input {
    width: 100%;
    padding: 12px 46px 12px 16px;
    border-radius: 22px;
    border: 1.5px solid var(--c-border);
    background: var(--c-surface-2);
    color: var(--c-text);
    font-size: 0.92rem;
    font-family: inherit;
    resize: none;
    max-height: 140px;
    min-height: 44px;
    line-height: 1.5;
    transition: all var(--t-fast);
}
.chat-input:focus {
    outline: none;
    border-color: var(--c-accent);
    background: var(--c-surface);
    box-shadow: 0 0 0 3px rgba(46,204,113,0.1);
}
.chat-emoji-btn {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--c-text-sub);
    font-size: 1.15rem;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--t-fast);
}
.chat-emoji-btn:hover {
    color: var(--c-accent);
    background: rgba(46,204,113,0.08);
}

.chat-send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all var(--t-base);
    box-shadow: 0 4px 14px rgba(46,204,113,0.35);
    flex-shrink: 0;
}
.chat-send-btn:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 20px rgba(46,204,113,0.5);
}
.chat-send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

/* Empty Chat State */
.chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    color: var(--c-text-muted);
}
.chat-empty-icon {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(46,204,113,0.1), rgba(46,204,113,0.03));
    color: var(--c-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    margin-bottom: 20px;
}
.chat-empty h3 {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--c-text);
    margin-bottom: 8px;
}
.chat-empty p {
    font-size: 0.88rem;
    max-width: 400px;
    line-height: 1.6;
}

/* SKELETON */
.skeleton {
    background: linear-gradient(90deg, var(--c-border) 0%, var(--c-surface-2) 50%, var(--c-border) 100%);
    background-size: 200% 100%;
    animation: skeletonWave 1.5s infinite;
    border-radius: var(--r-md);
}
.chat-skeleton-item {
    padding: 14px 18px;
    display: flex;
    gap: 12px;
    border-bottom: 1px solid var(--c-border);
}
.chat-skeleton-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
}
.chat-skeleton-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.chat-skeleton-line {
    height: 12px;
    border-radius: 6px;
}

/* TOAST */
.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;width:min(420px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--c-surface);border:1px solid var(--c-border);color:var(--c-text);padding:14px 18px;border-radius:var(--r-md);box-shadow:var(--sh-xl);display:flex;align-items:center;gap:12px;animation:fadeUp 0.4s cubic-bezier(0.22,1,0.36,1);border-right:4px solid var(--c-accent);pointer-events:auto;transition:opacity var(--t-base),transform var(--t-base)}
.toast.removing{opacity:0;transform:translateX(20px)}
.toast .toast-icon{font-size:1.5rem;flex-shrink:0}
.toast .toast-content{flex:1;min-width:0}
.toast .toast-title{font-weight:700;font-size:0.9rem;margin-bottom:2px}
.toast .toast-desc{font-size:0.8rem;color:var(--c-text-muted);line-height:1.4}
.toast .toast-close{width:26px;height:26px;border-radius:50%;background:var(--c-surface-2);color:var(--c-text-muted);display:flex;align-items:center;justify-content:center;font-size:0.75rem;flex-shrink:0;transition:all var(--t-fast);border:none;cursor:pointer}
.toast .toast-close:hover{background:var(--c-danger);color:#fff}
.toast.success{border-right-color:var(--c-accent)}
.toast.warning{border-right-color:var(--c-warning)}
.toast.error{border-right-color:var(--c-danger)}
.toast.info{border-right-color:var(--c-purple)}

/* LOGIN REQUIRED */
.login-required-state {
    min-height: calc(100vh - var(--header-h));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
}
.login-required-state .big-icon {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(46,204,113,0.12), rgba(46,204,113,0.04));
    color: var(--c-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    margin-bottom: 24px;
}
.login-required-state h2 {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--c-text);
    margin-bottom: 10px;
}
.login-required-state p {
    font-size: 0.95rem;
    color: var(--c-text-muted);
    max-width: 460px;
    margin-bottom: 28px;
}
.login-required-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
}
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: var(--r-full);
    font-weight: 700;
    font-size: 0.9rem;
    transition: all var(--t-base);
    border: 2px solid transparent;
    cursor: pointer;
    text-decoration: none;
}
.btn-primary {
    background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
    color: #fff;
    box-shadow: 0 6px 20px rgba(46,204,113,0.3);
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(46,204,113,0.45);
}
.btn-secondary {
    background: var(--c-surface-2);
    color: var(--c-text-muted);
    border: 1px solid var(--c-border);
}
.btn-secondary:hover {
    background: var(--c-border);
    color: var(--c-text);
}

/* RESPONSIVE */
@media (max-width: 1024px) {
    .chat-layout {
        grid-template-columns: 1fr;
        height: calc(100vh - var(--header-h));
        margin: 0;
        border-radius: 0;
    }
    .chat-sidebar {
        border-left: none;
        border-bottom: none;
    }
    .chat-view {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 10;
        animation: slideInSidebar 0.3s ease;
    }
    .chat-layout.chat-open .chat-sidebar {
        display: none;
    }
    .chat-layout.chat-open .chat-view {
        display: flex;
    }
    .chat-back-btn { display: flex !important; }
}

@media (max-width: 640px) {
    .navbar { padding: 0 12px; }
    .logo-text { font-size: 16px; }
    .logo-text .gray { display: none; }
    .nav-user-name { display: none; }
    .nav-user-btn { padding: 4px; }
    .chat-sidebar-header { padding: 14px 14px; }
    .chat-sidebar-title h2 { font-size: 1rem; }
    .chat-item { padding: 12px 14px; }
    .chat-item-avatar { width: 44px; height: 44px; font-size: 1rem; }
    .chat-item-name { font-size: 0.88rem; }
    .chat-item-preview { font-size: 0.78rem; }
    .chat-messages { padding: 16px 12px 8px; }
    .chat-composer { padding: 10px 12px; gap: 8px; }
    .msg-wrapper { max-width: 88%; }
    .msg-bubble { font-size: 0.85rem; padding: 9px 12px; }
    .attach-menu-btn, .chat-send-btn { width: 40px; height: 40px; font-size: 0.95rem; }
    .chat-input { font-size: 0.88rem; padding: 10px 40px 10px 14px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NlY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'.replace('MjA5NlY3', 'MjA5NTY3');

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

// ============================================================
// STATE
// ============================================================
const state = {
    user: null,
    userProfile: null,
    conversations: [],
    activeConversationId: null,
    activeMessages: [],
    activeOtherUser: null,
    activeContext: null,
    filter: 'all',
    search: '',
    channel: null,
    typingTimeout: null,
    isLoadingMessages: false,
    hasMoreMessages: false,
    offset: 0,
    pageSize: 50,
};

const THEME_KEY = 'chemato-theme';

// ============================================================
// UTILS
// ============================================================
const escapeHtml = (str) => {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
};
const sanitizePhone = (p) => p ? String(p).replace(/\D/g, '') : '';
const isValidUUID = (id) => id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

const formatTime = (dateStr) => {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
};

const formatDateSeparator = (dateStr) => {
    const date = new Date(dateStr);
    const now = new Date();
    const diffDays = Math.floor((now - date) / 86400000);
    if (diffDays === 0) return 'اليوم';
    if (diffDays === 1) return 'أمس';
    if (diffDays < 7) return date.toLocaleDateString('ar-EG', { weekday: 'long' });
    return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
};

const formatListTime = (dateStr) => {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    const now = new Date();
    const diffMs = now - date;
    const diffMin = Math.floor(diffMs / 60000);
    const diffHrs = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    if (diffMin < 1) return 'الآن';
    if (diffMin < 60) return `${diffMin} د`;
    if (diffHrs < 24) return `${diffHrs} س`;
    if (diffDays < 7) return `${diffDays} يوم`;
    return date.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric' });
};

const getInitials = (name) => {
    if (!name) return '؟';
    return String(name).trim().charAt(0).toUpperCase();
};

// ============================================================
// THEME
// ============================================================
const initTheme = () => {
    const saved = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    const icon = document.getElementById('themeIcon');
    if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

    document.getElementById('themeToggle')?.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem(THEME_KEY, next);
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    });
};

// ============================================================
// TOAST
// ============================================================
const removeToast = (toast) => {
    if (!toast || !toast.parentNode) return;
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
};
const showToast = (icon, title, desc, type = '') => {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-content">
            <div class="toast-title">${escapeHtml(title)}</div>
            <div class="toast-desc">${escapeHtml(desc)}</div>
        </div>
        <button class="toast-close" aria-label="إغلاق"><i class="fas fa-times"></i></button>
    `;
    toast.querySelector('.toast-close').onclick = () => removeToast(toast);
    container.appendChild(toast);
    setTimeout(() => removeToast(toast), 5000);
};

// ============================================================
// AUTH
// ============================================================
const checkAuth = async () => {
    try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            renderLoginRequired();
            return false;
        }
        state.user = user;

        const { data: profile } = await supabase
            .from('profiles')
            .select('id, full_name, company_name, avatar_url, user_type, is_verified, phone, whatsapp')
            .eq('id', user.id)
            .single();

        state.userProfile = profile;
        updateUserUI();
        return true;
    } catch (e) {
        console.error('Auth error:', e);
        return false;
    }
};

// ============================================================
// FETCH CONVERSATIONS
// ============================================================
const fetchConversations = async () => {
    if (!state.user) return;

    try {
        // Fetch all messages involving the user
        const { data: messages, error } = await supabase
            .from('messages')
            .select('*')
            .or(`from_user_id.eq.${state.user.id},to_user_id.eq.${state.user.id}`)
            .order('created_at', { ascending: false })
            .limit(500);

        if (error) throw error;
        if (!messages?.length) {
            state.conversations = [];
            renderChatList();
            return;
        }

        // Group by conversation partner
        const conversationsMap = new Map();

        messages.forEach(msg => {
            const otherId = msg.from_user_id === state.user.id ? msg.to_user_id : msg.from_user_id;
            if (!otherId) return;

            if (!conversationsMap.has(otherId)) {
                conversationsMap.set(otherId, {
                    otherUserId: otherId,
                    lastMessage: msg,
                    messages: [msg],
                    unreadCount: 0,
                    hasProduct: !!msg.product_id,
                    hasRequest: !!msg.request_id,
                });
            } else {
                const conv = conversationsMap.get(otherId);
                conv.messages.push(msg);
                // Since sorted by created_at desc, first message is the latest
            }

            // Count unread (messages to me that are not read)
            if (msg.to_user_id === state.user.id && !msg.is_read) {
                conversationsMap.get(otherId).unreadCount++;
            }
        });

        // Fetch profiles of all conversation partners
        const otherUserIds = Array.from(conversationsMap.keys()).filter(isValidUUID);
        const profilesMap = {};
        if (otherUserIds.length) {
            const { data: profiles } = await supabase
                .from('profiles')
                .select('id, full_name, company_name, avatar_url, user_type, is_verified, city')
                .in('id', otherUserIds);
            (profiles || []).forEach(p => { profilesMap[p.id] = p; });
        }

        // Fetch products referenced in messages
        const productIds = [...new Set(
            messages.map(m => m.product_id).filter(id => id && isValidUUID(id))
        )];
        const productsMap = {};
        if (productIds.length) {
            const { data: products } = await supabase
                .from('products')
                .select('id, name, image_url, price, unit')
                .in('id', productIds);
            (products || []).forEach(p => { productsMap[p.id] = p; });
        }

        // Fetch requests referenced in messages
        const requestIds = [...new Set(
            messages.map(m => m.request_id).filter(id => id && isValidUUID(id))
        )];
        const requestsMap = {};
        if (requestIds.length) {
            const { data: requests } = await supabase
                .from('purchase_requests')
                .select('id, product_name, quantity_needed')
                .in('id', requestIds);
            (requests || []).forEach(r => { requestsMap[r.id] = r; });
        }

        // Build final conversations array
        state.conversations = Array.from(conversationsMap.values())
            .map(conv => ({
                ...conv,
                otherUser: profilesMap[conv.otherUserId] || { id: conv.otherUserId, full_name: 'مستخدم' },
                product: conv.lastMessage.product_id ? (productsMap[conv.lastMessage.product_id] || null) : null,
                request: conv.lastMessage.request_id ? (requestsMap[conv.lastMessage.request_id] || null) : null,
            }))
            .sort((a, b) => new Date(b.lastMessage.created_at) - new Date(a.lastMessage.created_at));

        renderChatList();
        updateTotalUnread();

    } catch (e) {
        console.error('Fetch conversations error:', e);
        showToast('⚠️', 'خطأ', 'تعذر تحميل المحادثات', 'error');
    }
};

// ============================================================
// RENDER CHAT LIST
// ============================================================
const renderChatList = () => {
    const list = document.getElementById('chatList');
    if (!list) return;

    let conversations = [...state.conversations];

    // Apply filter
    if (state.filter === 'unread') {
        conversations = conversations.filter(c => c.unreadCount > 0);
    } else if (state.filter === 'products') {
        conversations = conversations.filter(c => c.hasProduct);
    } else if (state.filter === 'requests') {
        conversations = conversations.filter(c => c.hasRequest);
    }

    // Apply search
    if (state.search) {
        const q = state.search.toLowerCase();
        conversations = conversations.filter(c => {
            const name = (c.otherUser?.company_name || c.otherUser?.full_name || '').toLowerCase();
            const lastMsg = (c.lastMessage?.message || '').toLowerCase();
            return name.includes(q) || lastMsg.includes(q);
        });
    }

    if (!conversations.length) {
        list.innerHTML = `
            <div class="chat-empty-sidebar">
                <i class="fas fa-inbox"></i>
                <p style="font-weight:700;color:var(--c-text);margin-bottom:6px;">لا توجد محادثات</p>
                <p style="font-size:0.82rem;">${state.search ? 'جرب البحث بكلمة مختلفة' : 'ابدأ بمراسلة مورد أو مشتري'}</p>
            </div>
        `;
        return;
    }

    list.innerHTML = conversations.map(conv => {
        const otherUser = conv.otherUser;
        const name = otherUser?.company_name || otherUser?.full_name || 'مستخدم';
        const lastMsg = conv.lastMessage;
        const isActive = state.activeConversationId === conv.otherUserId;
        const isUnread = conv.unreadCount > 0;

        // Message preview
        let preview = lastMsg?.message || '📎 مرفق';
        if (preview.length > 60) preview = preview.substring(0, 60) + '...';
        const isFromMe = lastMsg?.from_user_id === state.user.id;

        return `
            <div class="chat-item ${isActive ? 'active' : ''} ${isUnread ? 'unread' : ''}"
                 data-other-user-id="${escapeHtml(conv.otherUserId)}"
                 role="button" tabindex="0">
                <div class="chat-item-avatar">
                    ${otherUser?.avatar_url
                        ? `<img src="${escapeHtml(otherUser.avatar_url)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${escapeHtml(getInitials(name))}';" />`
                        : escapeHtml(getInitials(name))}
                </div>
                <div class="chat-item-body">
                    <div class="chat-item-top">
                        <div class="chat-item-name">
                            <span>${escapeHtml(name)}</span>
                            ${otherUser?.is_verified ? '<i class="fas fa-check-circle verified-dot"></i>' : ''}
                        </div>
                        <div class="chat-item-time">${formatListTime(lastMsg?.created_at)}</div>
                    </div>
                    <div class="chat-item-preview">
                        ${isFromMe ? '<i class="fas fa-reply attachment-icon"></i>' : ''}
                        ${escapeHtml(preview)}
                    </div>
                    ${isUnread ? `<span class="chat-item-badge">${conv.unreadCount}</span>` : ''}
                </div>
            </div>
        `;
    }).join('');

    // Bind click events
    list.querySelectorAll('.chat-item').forEach(item => {
        item.addEventListener('click', () => {
            openConversation(item.dataset.otherUserId);
        });
    });
};

const updateTotalUnread = () => {
    const totalUnread = state.conversations.reduce((sum, c) => sum + c.unreadCount, 0);
    const badge = document.getElementById('totalUnread');
    if (badge) {
        badge.textContent = totalUnread > 99 ? '99+' : totalUnread;
        badge.style.display = totalUnread > 0 ? 'inline-flex' : 'none';
    }
};

// ============================================================
// OPEN CONVERSATION
// ============================================================
const openConversation = async (otherUserId) => {
    if (!isValidUUID(otherUserId)) return;

    state.activeConversationId = otherUserId;
    state.offset = 0;
    state.activeMessages = [];

    // Find conversation to get other user details
    const conv = state.conversations.find(c => c.otherUserId === otherUserId);
    state.activeOtherUser = conv?.otherUser || { id: otherUserId, full_name: 'مستخدم' };
    state.activeContext = conv?.product || conv?.request || null;

    // Update UI
    document.getElementById('chatLayout')?.classList.add('chat-open');

    // Render chat view with skeleton
    renderChatView();
    renderChatList(); // to update active state

    // Mark messages as read
    await markConversationRead(otherUserId);

    // Fetch messages
    await loadMessages(otherUserId, true);

    // Setup realtime for this conversation
    setupConversationRealtime(otherUserId);
};

// ============================================================
// LOAD MESSAGES
// ============================================================
const loadMessages = async (otherUserId, reset = false) => {
    if (!state.user) return;
    if (state.isLoadingMessages) return;
    state.isLoadingMessages = true;

    try {
        const from = reset ? 0 : state.activeMessages.length;
        const to = from + state.pageSize - 1;

        const { data: messages, error } = await supabase
            .from('messages')
            .select('*')
            .or(`and(from_user_id.eq.${state.user.id},to_user_id.eq.${otherUserId}),and(from_user_id.eq.${otherUserId},to_user_id.eq.${state.user.id})`)
            .order('created_at', { ascending: false })
            .range(from, to);

        if (error) throw error;

        const fetchedMessages = (messages || []).reverse(); // oldest first

        if (reset) {
            state.activeMessages = fetchedMessages;
        } else {
            state.activeMessages = [...fetchedMessages, ...state.activeMessages];
        }

        state.hasMoreMessages = (messages || []).length === state.pageSize;

        renderMessages();
    } catch (e) {
        console.error('Load messages error:', e);
        const container = document.getElementById('chatMessages');
        if (container) {
            container.innerHTML = `<div class="empty-state" style="padding:40px 20px;">
                <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:var(--c-danger);opacity:0.5;display:block;margin-bottom:12px;"></i>
                <p>تعذر تحميل الرسائل</p>
            </div>`;
        }
    } finally {
        state.isLoadingMessages = false;
    }
};

const renderMessages = () => {
    const container = document.getElementById('chatMessages');
    if (!container) return;

    if (!state.activeMessages.length) {
        container.innerHTML = `
            <div class="chat-empty" style="padding:40px 20px;">
                <div class="chat-empty-icon" style="width:70px;height:70px;font-size:1.8rem;">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h3>ابدأ المحادثة</h3>
                <p>اكتب أول رسالة لبدء التواصل</p>
            </div>
        `;
        return;
    }

    let html = '';
    let lastDate = '';

    // Load more button
    if (state.hasMoreMessages) {
        html += `<button class="load-more-btn" id="loadMoreBtn" type="button">
            <i class="fas fa-arrow-up"></i> تحميل رسائل أقدم
        </button>`;
    }

    state.activeMessages.forEach(msg => {
        // Date separator
        const msgDate = new Date(msg.created_at).toDateString();
        if (msgDate !== lastDate) {
            html += `<div class="date-separator">${formatDateSeparator(msg.created_at)}</div>`;
            lastDate = msgDate;
        }

        const isSent = msg.from_user_id === state.user.id;
        const otherInitial = getInitials(state.activeOtherUser?.company_name || state.activeOtherUser?.full_name);
        const myInitial = getInitials(state.userProfile?.company_name || state.userProfile?.full_name);

        html += `
            <div class="msg-wrapper ${isSent ? 'sent' : 'received'}" data-message-id="${escapeHtml(msg.id)}">
                <div class="msg-avatar">
                    ${isSent
                        ? (state.userProfile?.avatar_url
                            ? `<img src="${escapeHtml(state.userProfile.avatar_url)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${escapeHtml(myInitial)}';" />`
                            : escapeHtml(myInitial))
                        : (state.activeOtherUser?.avatar_url
                            ? `<img src="${escapeHtml(state.activeOtherUser.avatar_url)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${escapeHtml(otherInitial)}';" />`
                            : escapeHtml(otherInitial))}
                </div>
                <div class="msg-bubble">
                    ${msg.message ? escapeHtml(msg.message) : ''}
                    <div class="msg-meta">
                        <span>${formatTime(msg.created_at)}</span>
                        ${isSent ? `<i class="fas fa-${msg.is_read ? 'check-double' : 'check'} status-icon ${msg.is_read ? 'read' : ''}"></i>` : ''}
                    </div>
                </div>
                <div class="msg-actions">
                    <button class="msg-action-btn" data-action="copy" data-message="${escapeHtml(msg.message || '')}" title="نسخ">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
            </div>
        `;
    });

    // Typing indicator at bottom
    html += `<div class="typing-indicator" id="typingIndicator">
        <div class="msg-bubble">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
    </div>`;

    container.innerHTML = html;

    // Bind events
    document.getElementById('loadMoreBtn')?.addEventListener('click', () => {
        loadMessages(state.activeConversationId, false);
    });

    container.querySelectorAll('[data-action="copy"]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const text = btn.dataset.message;
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                showToast('📋', 'تم النسخ', '', 'success');
            } catch (err) {
                showToast('⚠️', 'خطأ', 'تعذر النسخ', 'error');
            }
        });
    });

    // Scroll to bottom
    scrollToBottom(false);
};

const scrollToBottom = (smooth = true) => {
    const container = document.getElementById('chatMessages');
    if (!container) return;
    setTimeout(() => {
        container.scrollTo({
            top: container.scrollHeight,
            behavior: smooth ? 'smooth' : 'auto',
        });
    }, 50);
};

// ============================================================
// MARK AS READ
// ============================================================
const markConversationRead = async (otherUserId) => {
    if (!state.user) return;
    try {
        await supabase
            .from('messages')
            .update({ is_read: true })
            .eq('to_user_id', state.user.id)
            .eq('from_user_id', otherUserId)
            .eq('is_read', false);

        // Update local state
        const conv = state.conversations.find(c => c.otherUserId === otherUserId);
        if (conv) {
            conv.unreadCount = 0;
            conv.messages.forEach(m => {
                if (m.to_user_id === state.user.id) m.is_read = true;
            });
        }
        updateTotalUnread();
        renderChatList();
    } catch (e) {
        console.error('Mark read error:', e);
    }
};

// ============================================================
// SEND MESSAGE
// ============================================================
const sendMessage = async () => {
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    if (!input || !state.activeConversationId || !state.user) return;

    const text = input.value.trim();
    if (!text) return;

    sendBtn.disabled = true;
    const originalHtml = sendBtn.innerHTML;
    sendBtn.innerHTML = '<span class="spinner" style="width:16px;height:16px;"></span>';

    try {
        const messageData = {
            from_user_id: state.user.id,
            to_user_id: state.activeConversationId,
            message: text,
            is_read: false,
            product_id: state.activeContext?.name ? state.activeContext.id : (state.activeContext?.product_name ? null : null),
            request_id: !state.activeContext?.name && state.activeContext?.product_name ? state.activeContext.id : null,
        };

        const { data, error } = await supabase
            .from('messages')
            .insert(messageData)
            .select()
            .single();

        if (error) throw error;

        // Clear input
        input.value = '';
        input.style.height = 'auto';

        // Add to local state
        state.activeMessages.push(data);
        renderMessages();

        // Update conversation list
        const conv = state.conversations.find(c => c.otherUserId === state.activeConversationId);
        if (conv) {
            conv.lastMessage = data;
        } else {
            // Refresh conversations
            await fetchConversations();
        }

        showToast('✅', 'تم الإرسال', '', 'success');

    } catch (e) {
        console.error('Send message error:', e);
        showToast('⚠️', 'خطأ', 'تعذر إرسال الرسالة', 'error');
    } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = originalHtml;
    }
};

// ============================================================
// TYPING INDICATOR (Broadcast)
// ============================================================
const broadcastTyping = () => {
    if (!state.channel || !state.activeConversationId) return;
    try {
        state.channel.send({
            type: 'broadcast',
            event: 'typing',
            payload: {
                from: state.user.id,
                to: state.activeConversationId,
                at: Date.now(),
            }
        });
    } catch (e) {}
};

// ============================================================
// ATTACHMENTS
// ============================================================
const handleAttach = async (type) => {
    document.getElementById('attachDropdown')?.classList.remove('show');

    if (type === 'product') {
        // Insert product link
        const url = prompt('الصق رابط المنتج من كيماتو:');
        if (url) {
            const input = document.getElementById('chatInput');
            if (input) {
                input.value += (input.value ? ' ' : '') + url;
                input.focus();
                document.getElementById('sendBtn').disabled = false;
            }
        }
        return;
    }

    // File/Image upload
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = type === 'image' ? 'image/*' : 'application/pdf';

    input.onchange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (file.size > 10 * 1024 * 1024) {
            showToast('⚠️', 'حجم كبير', 'الحد الأقصى 10 ميجابايت', 'warning');
            return;
        }

        showToast('📎', 'جاري الرفع', 'يتم رفع الملف...', 'info');

        try {
            const ext = file.name.split('.').pop().toLowerCase();
            const fileName = `messages/${state.user.id}/${Date.now()}.${ext}`;

            const { error: uploadError } = await supabase.storage
                .from('product-images')
                .upload(fileName, file, { cacheControl: '3600', upsert: false });

            if (uploadError) throw uploadError;

            const { data: urlData } = supabase.storage
                .from('product-images')
                .getPublicUrl(fileName);

            const fileUrl = urlData.publicUrl;

            const messageData = {
                from_user_id: state.user.id,
                to_user_id: state.activeConversationId,
                message: type === 'image'
                    ? `📷 صورة: ${fileUrl}`
                    : `📄 ملف: ${fileUrl}`,
                is_read: false,
            };

            const { data, error } = await supabase
                .from('messages')
                .insert(messageData)
                .select()
                .single();

            if (error) throw error;

            state.activeMessages.push(data);
            renderMessages();
            showToast('✅', 'تم الرفع', 'تم إرسال الملف', 'success');

        } catch (e) {
            console.error('Upload error:', e);
            showToast('⚠️', 'خطأ', 'تعذر رفع الملف', 'error');
        }
    };

    input.click();
};

// ============================================================
// REALTIME
// ============================================================
const setupGlobalRealtime = () => {
    if (!state.user) return;

    if (state.channel) supabase.removeChannel(state.channel);

    try {
        state.channel = supabase
            .channel('messages_realtime')
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages',
                filter: `to_user_id=eq.${state.user.id}`,
            }, (payload) => {
                const newMsg = payload.new;
                const isActive = state.activeConversationId === newMsg.from_user_id;

                if (isActive) {
                    // Add to active messages
                    state.activeMessages.push(newMsg);
                    renderMessages();
                    // Mark as read
                    markConversationRead(newMsg.from_user_id);
                } else {
                    // Show notification
                    showToast('💬', 'رسالة جديدة!', newMsg.message?.substring(0, 60) || 'وصلك رسالة', 'info');
                }

                // Update conversation list
                const conv = state.conversations.find(c => c.otherUserId === newMsg.from_user_id);
                if (conv) {
                    conv.lastMessage = newMsg;
                    if (!isActive) conv.unreadCount++;
                } else {
                    fetchConversations();
                }

                renderChatList();
                updateTotalUnread();
            })
            .on('broadcast', { event: 'typing' }, (payload) => {
                const typing = payload.payload;
                if (typing.to === state.user.id && typing.from === state.activeConversationId) {
                    showTypingIndicator();
                }
            })
            .subscribe();
    } catch (e) {
        console.error('Realtime setup error:', e);
    }
};

const setupConversationRealtime = (otherUserId) => {
    // Just ensure we're subscribed
    if (!state.channel) setupGlobalRealtime();
};

const showTypingIndicator = () => {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) {
        indicator.classList.add('show');
        scrollToBottom();
    }
    clearTimeout(state.typingTimeout);
    state.typingTimeout = setTimeout(() => {
        indicator?.classList.remove('show');
    }, 3000);
};

// ============================================================
// FILTERS & SEARCH
// ============================================================
const initFilters = () => {
    document.querySelectorAll('.chat-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.chat-filter-btn').forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });
            btn.classList.add('active');
            btn.setAttribute('aria-selected', 'true');
            state.filter = btn.dataset.filter;
            renderChatList();
        });
    });

    const searchInput = document.getElementById('chatSearch');
    let searchTimer;
    searchInput?.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            state.search = e.target.value.trim();
            renderChatList();
        }, 250);
    });
};

// ============================================================
// INIT
// ============================================================
const init = async () => {
    console.info('🚀 كيماتو | الرسائل');

    initTheme();
    initNavbar();
    initFilters();

    const authed = await checkAuth();
    if (!authed) return;

    await fetchConversations();
    setupGlobalRealtime();

    console.info('✅ جاهز');
};

supabase.auth.onAuthStateChange(async (event) => {
    if (event === 'SIGNED_OUT') window.location.href = 'index.html';
    else if (event === 'SIGNED_IN') {
        const ok = await checkAuth();
        if (ok) {
            await fetchConversations();
            setupGlobalRealtime();
        }
    }
});

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
