<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />

    <title>كيماتو | لوحة المشتري</title>
    <meta name="description" content="لوحة تحكم المشتري على كيماتو" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" href="logo.png" />
    <meta name="theme-color" content="#0a2540" />

    <link rel="preconnect" href="https://soqvhvqtpgeoxwmkvbih.supabase.co" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ============================================================
           CHEMOTO 5.0 — Design System
           ============================================================ */
        :root {
            --c-primary-50:#eef6fc; --c-primary-100:#d4e7f5;
            --c-primary-500:#2c7ab8; --c-primary-600:#1d5b8e;
            --c-primary-700:#144167; --c-primary-800:#0d2e4a; --c-primary-900:#0a2540;
            --c-accent:#2ecc71; --c-accent-dark:#22a95c;
            --c-warning:#f39c12; --c-danger:#e74c3c;
            --c-whatsapp:#25D366; --c-chat:#8b5cf6; --c-chat-dark:#7c3aed;
            --c-request:#e67e22; --c-request-dark:#d35400;
            --c-bg:#f6f8fb; --c-surface:#ffffff; --c-surface-2:#f9fbfd;
            --c-border:#e3eaf2; --c-text:#0a1f33; --c-text-muted:#5a6b7e; --c-text-sub:#8595a8;
            --sh-sm:0 1px 3px rgba(10,37,64,0.06);
            --sh-md:0 4px 16px rgba(10,37,64,0.08);
            --sh-lg:0 12px 32px rgba(10,37,64,0.10);
            --sh-xl:0 20px 48px rgba(10,37,64,0.14);
            --r-sm:8px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-full:999px;
            --t-fast:150ms cubic-bezier(0.4,0,0.2,1);
            --t-base:250ms cubic-bezier(0.4,0,0.2,1);
            --t-slow:400ms cubic-bezier(0.4,0,0.2,1);
            --header-h:56px;
            --container:1320px;
        }

        @media (min-width: 640px) { :root { --header-h: 64px; } }
        @media (min-width: 1024px) { :root { --header-h: 68px; } }

        [data-theme="dark"] {
            --c-bg:#0a1520; --c-surface:#101e2e; --c-surface-2:#16273a;
            --c-border:#1f3349; --c-text:#e8eef5; --c-text-muted:#9fb1c4; --c-text-sub:#6e8298;
            --sh-sm:0 1px 3px rgba(0,0,0,0.3);
            --sh-md:0 4px 16px rgba(0,0,0,0.35);
            --sh-lg:0 12px 32px rgba(0,0,0,0.45);
            --sh-xl:0 20px 48px rgba(0,0,0,0.55);
        }

        /* ============================================================
           RESET — Anti-Overflow
           ============================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--c-bg);
            color: var(--c-text);
            line-height: 1.6;
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
            transition: background-color var(--t-base), color var(--t-base);
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        /* Critical: make all elements max out at container */
        * { min-width: 0; }

        img { max-width: 100%; height: auto; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        a { color: inherit; text-decoration: none; }

        input, select, textarea {
            font-family: inherit;
            font-size: 16px;
            max-width: 100%;
            width: 100%;
        }

        :focus-visible {
            outline: 2px solid var(--c-primary-500);
            outline-offset: 2px;
            border-radius: var(--r-sm);
        }

        /* ============================================================
           KEYFRAMES
           ============================================================ */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes badgePop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInDown { from { transform: translateY(-16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .animate-in { animation: fadeUp 0.4s ease-out backwards; }

        /* ============================================================
           NAVBAR — Compact on Mobile
           ============================================================ */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 37, 64, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: calc(var(--header-h) + env(safe-area-inset-top, 0));
            padding-top: env(safe-area-inset-top, 0);
            width: 100%;
        }

        .navbar-inner {
            width: 100%;
            height: var(--header-h);
            max-width: var(--container);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 12px;
        }

        @media (min-width: 640px) {
            .navbar-inner { padding: 0 20px; gap: 12px; }
        }

        .logo a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            min-width: 0;
            flex-shrink: 1;
        }

        .logo img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(46, 204, 113, 0.5);
            background: #fff;
            flex-shrink: 0;
        }

        @media (min-width: 640px) { .logo img { width: 38px; height: 38px; } }

        .logo-text {
            font-weight: 800;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        @media (min-width: 640px) { .logo-text { font-size: 17px; } }

        .logo-text .blue { color: #5eb8ee; }
        .logo-text .gray {
            color: rgba(255, 255, 255, 0.55);
            font-weight: 400;
            font-size: 0.85em;
        }
        @media (max-width: 400px) { .logo-text .gray { display: none; } }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        @media (min-width: 640px) { .nav-right { gap: 8px; } }

        .nav-action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all var(--t-fast);
            position: relative;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .nav-action-btn { width: 40px; height: 40px; font-size: 1rem; }
        }

        .nav-action-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .nav-action-btn:active { transform: scale(0.94); }

        .notif-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--c-danger);
            color: #fff;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(10, 37, 64, 0.95);
        }
        .notif-badge.show { display: flex; }

        .nav-user-menu { position: relative; flex-shrink: 0; }

        .nav-user-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px;
            border-radius: var(--r-full);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transition: all var(--t-fast);
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .nav-user-btn { padding: 4px 10px 4px 4px; gap: 8px; }
        }

        .nav-user-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .nav-user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.78rem;
            flex-shrink: 0;
        }

        .nav-user-name {
            display: none;
            font-size: 0.8rem;
            font-weight: 700;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        @media (min-width: 768px) { .nav-user-name { display: inline-block; } }

        .nav-user-btn > i.fa-chevron-down {
            display: none;
        }
        @media (min-width: 640px) { .nav-user-btn > i.fa-chevron-down { display: inline; } }

        .nav-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: var(--c-surface);
            border-radius: var(--r-md);
            box-shadow: var(--sh-xl);
            border: 1px solid var(--c-border);
            min-width: 230px;
            max-width: calc(100vw - 24px);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all var(--t-base);
            z-index: 1000;
        }
        .nav-dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }

        .nav-dropdown a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            color: var(--c-text);
            font-size: 0.88rem;
            font-weight: 500;
            border-bottom: 1px solid var(--c-border);
            transition: all var(--t-fast);
        }

        .nav-dropdown a:last-child { border-bottom: none; }
        .nav-dropdown a:hover { background: var(--c-surface-2); color: var(--c-primary-600); }
        .nav-dropdown a.logout { color: var(--c-danger); }
        .nav-dropdown a.highlight {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0.03));
            color: var(--c-chat);
            font-weight: 700;
        }
        .nav-dropdown a.highlight i { color: var(--c-chat); }

        /* ============================================================
           MAIN LAYOUT
           ============================================================ */
        .dashboard-layout {
            width: 100%;
            max-width: var(--container);
            margin: 0 auto;
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 640px) {
            .dashboard-layout { padding: 16px; gap: 16px; }
        }

        @media (min-width: 1024px) {
            .dashboard-layout {
                padding: 24px;
                grid-template-columns: 1fr 270px;
                gap: 24px;
                align-items: start;
            }
        }

        /* ============================================================
           SIDEBAR — COMPLETELY HIDDEN on Mobile
           ============================================================ */
        .sidebar {
            display: none;
        }

        @media (min-width: 1024px) {
            .sidebar {
                display: flex;
                flex-direction: column;
                gap: 16px;
                background: var(--c-surface);
                border: 1px solid var(--c-border);
                border-radius: var(--r-lg);
                padding: 16px;
                box-shadow: var(--sh-sm);
                position: sticky;
                top: calc(var(--header-h) + 24px);
                max-height: calc(100vh - var(--header-h) - 48px);
                overflow-y: auto;
                width: 270px;
            }
        }

        .sidebar-title {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--c-text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 12px 8px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            min-height: 44px;
            border-radius: var(--r-md);
            color: var(--c-text-muted);
            font-weight: 700;
            font-size: 0.86rem;
            transition: all var(--t-fast);
            text-align: right;
            width: 100%;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .sidebar-link:hover { background: var(--c-surface-2); color: var(--c-text); }
        .sidebar-link.active {
            background: linear-gradient(135deg, var(--c-primary-700), var(--c-primary-900));
            color: #fff;
            box-shadow: 0 6px 20px rgba(10, 37, 64, 0.25);
        }

        .sidebar-link i {
            width: 20px;
            text-align: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .sidebar-link .label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-link .count-pill {
            margin-right: auto;
            background: var(--c-danger);
            color: #fff;
            padding: 1px 7px;
            border-radius: var(--r-full);
            font-size: 0.65rem;
            font-weight: 800;
            min-width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-link.active .count-pill { background: rgba(255, 255, 255, 0.25); }
        .sidebar-link:not(.active) .count-pill { background: var(--c-surface-2); color: var(--c-text-muted); }

        .sidebar-link.special-link {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0.03));
            color: var(--c-chat);
            border: 1px solid rgba(139, 92, 246, 0.15);
        }

        .sidebar-link.special-link i { color: var(--c-chat); }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .dashboard-main {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 640px) { .dashboard-main { gap: 16px; } }
        @media (min-width: 1024px) { .dashboard-main { gap: 20px; } }

        /* ============================================================
           PAGE HEADER
           ============================================================ */
        .page-header-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .page-header-bar {
                flex-direction: row;
                align-items: flex-start;
                justify-content: space-between;
                gap: 16px;
                flex-wrap: wrap;
            }
        }

        .page-header-bar > div:first-child {
            min-width: 0;
            width: 100%;
        }

        @media (min-width: 640px) {
            .page-header-bar > div:first-child { width: auto; flex: 1; }
        }

        .page-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.3;
            word-break: break-word;
        }

        @media (min-width: 480px) { .page-title { font-size: 1.35rem; } }
        @media (min-width: 768px) { .page-title { font-size: 1.6rem; } }

        .page-title i {
            color: var(--c-accent);
            font-size: 0.9em;
            flex-shrink: 0;
        }

        .page-subtitle {
            font-size: 0.78rem;
            color: var(--c-text-muted);
            margin-top: 4px;
            line-height: 1.5;
            word-break: break-word;
        }

        @media (min-width: 640px) { .page-subtitle { font-size: 0.85rem; } }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-primary,
        .btn-secondary,
        .btn-profile-public,
        .btn-share-profile {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            min-height: 42px;
            border-radius: var(--r-full);
            font-weight: 700;
            font-size: 0.82rem;
            transition: all var(--t-base);
            border: none;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
            color: #fff;
            box-shadow: 0 4px 14px rgba(46, 204, 113, 0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4); }
        .btn-primary:active { transform: scale(0.97); }

        .btn-secondary {
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            border: 1px solid var(--c-border);
        }
        .btn-secondary:hover { background: var(--c-border); color: var(--c-text); }

        .btn-profile-public {
            background: linear-gradient(135deg, var(--c-chat), var(--c-chat-dark));
            color: #fff;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
        }
        .btn-profile-public:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4); }

        .btn-share-profile {
            background: linear-gradient(135deg, #3498db, #2c81ba);
            color: #fff;
            box-shadow: 0 4px 14px rgba(52, 152, 219, 0.3);
        }
        .btn-share-profile:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4); }

        .action-buttons-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
        }

        @media (min-width: 640px) {
            .action-buttons-group { width: auto; gap: 8px; }
        }

        @media (max-width: 639px) {
            .action-buttons-group > * {
                flex: 1 1 calc(50% - 3px);
                min-width: 0;
            }
            .action-buttons-group > *:last-child {
                flex: 1 1 100%;
            }
        }

        /* ============================================================
           STATS GRID
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .stats-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        }

        @media (min-width: 1024px) { .stats-grid { gap: 14px; } }

        .stat-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: all var(--t-base);
            position: relative;
            overflow: hidden;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 640px) { .stat-card { padding: 16px; gap: 12px; } }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--sh-md);
            border-color: var(--stat-color, var(--c-accent));
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 3px;
            height: 100%;
            background: var(--stat-color, var(--c-accent));
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--r-md);
            background: var(--stat-bg, rgba(46, 204, 113, 0.12));
            color: var(--stat-color, var(--c-accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        @media (min-width: 640px) { .stat-icon { width: 42px; height: 42px; font-size: 1.1rem; } }

        .stat-content { flex: 1; min-width: 0; }

        .stat-label {
            font-size: 0.65rem;
            color: var(--c-text-muted);
            font-weight: 700;
            margin-bottom: 3px;
            line-height: 1.3;
            word-break: break-word;
        }

        @media (min-width: 640px) { .stat-label { font-size: 0.75rem; } }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--c-text);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        @media (min-width: 640px) { .stat-value { font-size: 1.5rem; } }

        .stat-trend {
            font-size: 0.62rem;
            color: var(--c-text-sub);
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 3px;
            flex-wrap: wrap;
            line-height: 1.3;
            word-break: break-word;
        }

        @media (min-width: 640px) { .stat-trend { font-size: 0.7rem; } }

        /* ============================================================
           SECTION CARDS
           ============================================================ */
        .section-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            overflow: hidden;
            box-shadow: var(--sh-sm);
            width: 100%;
            min-width: 0;
        }

        .section-card-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 640px) { .section-card-header { padding: 16px 20px; gap: 12px; } }

        .section-card-title {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex-wrap: wrap;
            word-break: break-word;
        }

        @media (min-width: 640px) { .section-card-title { font-size: 1rem; } }

        .section-card-title i { color: var(--c-accent); font-size: 0.9em; flex-shrink: 0; }

        .section-card-title .count-badge {
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            padding: 2px 8px;
            border-radius: var(--r-full);
            font-size: 0.65rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .section-card-title .count-badge.accent {
            background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
            color: #fff;
        }

        .section-card-body { padding: 12px; width: 100%; min-width: 0; }
        @media (min-width: 640px) { .section-card-body { padding: 16px 20px; } }

        .view-all-link,
        .view-share-link,
        .view-public-link {
            font-size: 0.72rem;
            padding: 6px 12px;
            min-height: 34px;
            border-radius: var(--r-full);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all var(--t-fast);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .view-all-link,
            .view-share-link,
            .view-public-link { font-size: 0.78rem; padding: 7px 14px; }
        }

        .view-all-link {
            color: var(--c-primary-600);
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
        }
        .view-all-link:hover { background: var(--c-primary-600); color: #fff; border-color: transparent; }

        .view-share-link {
            color: #fff;
            background: linear-gradient(135deg, #3498db, #2c81ba);
            border: none;
        }

        .view-public-link {
            color: #fff;
            background: linear-gradient(135deg, var(--c-chat), var(--c-chat-dark));
            border: none;
        }

        /* ============================================================
           ITEM LIST
           ============================================================ */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 640px) { .item-list { gap: 10px; } }

        .item-row {
            background: var(--c-surface-2);
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all var(--t-base);
            position: relative;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 640px) {
            .item-row {
                padding: 12px 14px;
                flex-direction: row;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
            }
        }

        .item-row:hover { border-color: var(--c-primary-500); background: var(--c-surface); }
        .item-row.is-new {
            border-color: var(--c-accent);
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.04), var(--c-surface-2));
        }
        .item-row.is-new::before {
            content: 'جديد';
            position: absolute;
            top: -8px;
            right: 12px;
            background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
            color: #fff;
            padding: 2px 8px;
            border-radius: var(--r-full);
            font-size: 0.6rem;
            font-weight: 800;
        }

        /* Row Header on mobile: icon + info together */
        .item-row > .item-icon-wrapper,
        .item-row > .item-info {
            /* no special case */
        }

        @media (max-width: 639px) {
            .item-row > .item-icon-wrapper {
                position: absolute;
                top: 10px;
                right: 10px;
            }
            .item-row > .item-info {
                padding-right: 48px;
            }
        }

        .item-icon-wrapper {
            width: 38px;
            height: 38px;
            border-radius: var(--r-md);
            background: linear-gradient(135deg, rgba(230, 126, 34, 0.15), rgba(230, 126, 34, 0.05));
            color: var(--c-request-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        @media (min-width: 640px) { .item-icon-wrapper { width: 42px; height: 42px; font-size: 1.1rem; } }

        .item-icon-wrapper.accent {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.15), rgba(46, 204, 113, 0.05));
            color: var(--c-accent-dark);
        }
        .item-icon-wrapper.supplier {
            background: linear-gradient(135deg, rgba(44, 122, 184, 0.15), rgba(44, 122, 184, 0.05));
            color: var(--c-primary-600);
        }
        .item-icon-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .item-info {
            flex: 1;
            min-width: 0;
            width: 100%;
        }

        @media (min-width: 640px) { .item-info { width: auto; } }

        .item-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 4px;
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        @media (min-width: 640px) { .item-title { font-size: 0.9rem; } }

        .item-meta {
            display: flex;
            gap: 6px;
            font-size: 0.68rem;
            color: var(--c-text-sub);
            flex-wrap: wrap;
            align-items: center;
            line-height: 1.4;
        }

        @media (min-width: 640px) { .item-meta { gap: 10px; font-size: 0.72rem; } }

        .item-meta span {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .item-meta i { font-size: 0.68rem; flex-shrink: 0; }
        .item-meta .highlight { color: var(--c-accent-dark); font-weight: 700; }

        .item-price-block {
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-shrink: 0;
            text-align: left;
        }

        @media (max-width: 639px) {
            .item-price-block {
                justify-content: flex-end;
                padding-top: 6px;
                border-top: 1px dashed var(--c-border);
            }
        }

        .item-price {
            font-size: 1rem;
            font-weight: 900;
            color: var(--c-accent-dark);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            white-space: nowrap;
        }

        @media (min-width: 640px) { .item-price { font-size: 1.1rem; } }

        [data-theme="dark"] .item-price { color: #6ee7a0; }

        .item-price .currency {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--c-text-sub);
        }

        .item-price-label {
            font-size: 0.62rem;
            color: var(--c-text-sub);
            font-weight: 700;
            white-space: nowrap;
        }

        .item-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
            width: 100%;
        }

        @media (min-width: 640px) {
            .item-actions {
                width: auto;
                justify-content: flex-end;
                flex-wrap: nowrap;
            }
        }

        .item-action-btn {
            padding: 7px 11px;
            min-height: 36px;
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all var(--t-fast);
            border: none;
            white-space: nowrap;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .item-action-btn { padding: 7px 12px; font-size: 0.74rem; min-height: 36px; }
        }

        .item-action-btn:active { transform: scale(0.94); }

        .item-action-btn.primary {
            background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
            color: #fff;
            box-shadow: 0 2px 6px rgba(46, 204, 113, 0.25);
        }
        .item-action-btn.primary:hover { transform: translateY(-1px); }

        .item-action-btn.secondary {
            background: var(--c-surface);
            color: var(--c-text-muted);
            border: 1px solid var(--c-border);
        }
        .item-action-btn.secondary:hover { color: var(--c-primary-600); border-color: var(--c-primary-500); }

        .item-action-btn.danger {
            background: var(--c-surface);
            color: var(--c-danger);
            border: 1px solid rgba(231, 76, 60, 0.25);
        }
        .item-action-btn.danger:hover { background: var(--c-danger); color: #fff; }

        .item-action-btn.icon-only {
            width: 36px;
            height: 36px;
            padding: 0;
            min-height: 36px;
        }

        .item-action-btn.chat-btn {
            background: linear-gradient(135deg, var(--c-chat), var(--c-chat-dark));
            color: #fff;
        }
        .item-action-btn.wa-btn { background: var(--c-whatsapp); color: #fff; }

        /* ============================================================
           STATUS BADGES
           ============================================================ */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: var(--r-full);
            font-size: 0.62rem;
            font-weight: 800;
            white-space: nowrap;
        }

        @media (min-width: 640px) { .status-badge { font-size: 0.66rem; padding: 3px 9px; } }

        .status-open { background: rgba(46, 204, 113, 0.12); color: var(--c-accent-dark); }
        .status-matched { background: rgba(44, 122, 184, 0.12); color: var(--c-primary-600); }
        .status-closed { background: rgba(0, 0, 0, 0.06); color: var(--c-text-muted); }
        .status-expired { background: rgba(231, 76, 60, 0.12); color: var(--c-danger); }
        .status-pending { background: rgba(243, 156, 18, 0.12); color: var(--c-warning); }
        .status-accepted { background: rgba(46, 204, 113, 0.15); color: var(--c-accent-dark); }
        .status-rejected { background: rgba(0, 0, 0, 0.06); color: var(--c-text-sub); }

        [data-theme="dark"] .status-open { background: rgba(46, 204, 113, 0.18); color: #6ee7a0; }
        [data-theme="dark"] .status-matched { background: rgba(44, 122, 184, 0.2); color: #7ec8e3; }
        [data-theme="dark"] .status-closed { background: rgba(255, 255, 255, 0.06); }
        [data-theme="dark"] .status-expired { background: rgba(231, 76, 60, 0.2); color: #ff9588; }
        [data-theme="dark"] .status-pending { background: rgba(243, 156, 18, 0.2); color: #f4b860; }
        [data-theme="dark"] .status-accepted { background: rgba(46, 204, 113, 0.2); color: #6ee7a0; }

        /* ============================================================
           EMPTY STATES
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--c-text-muted);
            width: 100%;
        }

        @media (min-width: 640px) { .empty-state { padding: 40px 24px; } }

        .empty-state i.empty-icon {
            font-size: 2.2rem;
            color: var(--c-primary-500);
            opacity: 0.35;
            margin-bottom: 12px;
            display: block;
        }

        @media (min-width: 640px) { .empty-state i.empty-icon { font-size: 2.8rem; } }

        .empty-state h4 {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 0.78rem;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        /* ============================================================
           OFFERS ACCORDION
           ============================================================ */
        .offers-accordion {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            width: 100%;
        }

        .offers-accordion.open {
            max-height: 3000px;
            margin-top: 10px;
        }

        .offers-accordion-inner {
            background: var(--c-surface);
            border: 1.5px dashed var(--c-border);
            border-radius: var(--r-md);
            padding: 10px;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 640px) { .offers-accordion-inner { padding: 12px; } }

        .offer-mini {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
            transition: all var(--t-fast);
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 640px) {
            .offer-mini {
                flex-direction: row;
                align-items: center;
                gap: 10px;
                padding: 10px 12px;
            }
        }

        .offer-mini:last-child { margin-bottom: 0; }
        .offer-mini.is-best { border-color: var(--c-accent); }

        .offer-mini-supplier {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .offer-mini-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--c-primary-600), var(--c-primary-900));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .offer-mini-info { flex: 1; min-width: 0; }

        .offer-mini-name {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            word-break: break-word;
        }

        .offer-mini-meta {
            font-size: 0.66rem;
            color: var(--c-text-sub);
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .offer-mini-price {
            font-size: 1rem;
            font-weight: 900;
            color: var(--c-accent-dark);
            white-space: nowrap;
            flex-shrink: 0;
        }

        [data-theme="dark"] .offer-mini-price { color: #6ee7a0; }

        .offer-mini-price .currency {
            font-size: 0.65rem;
            color: var(--c-text-sub);
        }

        .offer-mini-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            width: 100%;
        }

        @media (min-width: 640px) {
            .offer-mini-actions {
                width: auto;
                flex-wrap: nowrap;
                justify-content: flex-end;
            }
        }

        /* ============================================================
           PROFILE FORM
           ============================================================ */
        .profile-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            max-width: 720px;
        }

        @media (min-width: 640px) {
            .profile-form { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .form-group.full { grid-column: 1 / -1; }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--c-text);
            line-height: 1.4;
        }

        .form-group label .req { color: var(--c-danger); }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 10px 12px;
            min-height: 44px;
            border-radius: var(--r-md);
            border: 1.5px solid var(--c-border);
            background: var(--c-surface-2);
            color: var(--c-text);
            font-size: 16px;
            transition: all var(--t-fast);
            width: 100%;
            max-width: 100%;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--c-accent);
            outline: none;
            background: var(--c-surface);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.12);
        }

        .form-group input:disabled { opacity: 0.6; cursor: not-allowed; }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            .form-actions { flex-direction: column-reverse; }
            .form-actions > button { width: 100%; }
        }

        /* ============================================================
           SHARE PROFILE BANNER
           ============================================================ */
        .share-profile-banner {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(52, 152, 219, 0.05));
            border: 2px dashed rgba(139, 92, 246, 0.25);
            border-radius: var(--r-lg);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 640px) {
            .share-profile-banner {
                padding: 18px 20px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 14px;
                flex-wrap: wrap;
            }
        }

        .share-profile-banner-info {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex: 1;
            min-width: 0;
            width: 100%;
        }

        @media (min-width: 640px) { .share-profile-banner-info { width: auto; align-items: center; } }

        .share-profile-banner-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--c-chat), var(--c-chat-dark));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.3);
        }

        @media (min-width: 640px) { .share-profile-banner-icon { width: 48px; height: 48px; font-size: 1.2rem; } }

        .share-profile-banner-text { min-width: 0; flex: 1; }
        .share-profile-banner-text h4 {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 3px;
            line-height: 1.4;
            word-break: break-word;
        }

        @media (min-width: 640px) { .share-profile-banner-text h4 { font-size: 0.95rem; } }

        .share-profile-banner-text p {
            font-size: 0.74rem;
            color: var(--c-text-muted);
            line-height: 1.5;
            word-break: break-word;
        }

        @media (min-width: 640px) { .share-profile-banner-text p { font-size: 0.8rem; } }

        .share-profile-banner-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
        }

        @media (min-width: 640px) { .share-profile-banner-actions { width: auto; flex-wrap: nowrap; } }

        .share-profile-banner-actions .btn {
            padding: 9px 14px;
            min-height: 40px;
            border-radius: var(--r-full);
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.76rem;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s;
            text-decoration: none;
            white-space: nowrap;
            color: #fff;
            flex: 1 1 calc(50% - 3px);
            min-width: 0;
        }

        @media (min-width: 480px) {
            .share-profile-banner-actions .btn { flex: 1 1 auto; }
        }

        @media (min-width: 640px) {
            .share-profile-banner-actions .btn { flex: 0 1 auto; padding: 9px 16px; font-size: 0.8rem; }
        }

        .btn-view {
            background: linear-gradient(135deg, var(--c-chat), var(--c-chat-dark));
        }

        .btn-copy {
            background: linear-gradient(135deg, #3498db, #2c81ba);
        }

        .btn-share-social {
            background: linear-gradient(135deg, var(--c-whatsapp), #128C7E);
        }

        /* ============================================================
           MODALS
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            opacity: 0;
            visibility: hidden;
            transition: all var(--t-base);
        }

        @media (min-width: 640px) {
            .modal-overlay { align-items: center; padding: 16px; }
        }

        .modal-overlay.show { opacity: 1; visibility: visible; }

        .modal {
            background: var(--c-surface);
            border-radius: var(--r-xl) var(--r-xl) 0 0;
            box-shadow: var(--sh-xl);
            width: 100%;
            max-width: 100%;
            max-height: 92vh;
            max-height: 92dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform var(--t-slow) cubic-bezier(0.22, 1, 0.36, 1);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        @media (min-width: 640px) {
            .modal {
                max-width: 580px;
                border-radius: var(--r-xl);
                transform: scale(0.95) translateY(20px);
                padding-bottom: 0;
            }
        }

        .modal-overlay.show .modal { transform: translateY(0); }
        @media (min-width: 640px) {
            .modal-overlay.show .modal { transform: scale(1) translateY(0); }
        }

        .modal::before {
            content: '';
            display: block;
            width: 36px;
            height: 4px;
            background: var(--c-border);
            border-radius: 2px;
            margin: 8px auto 0;
            flex-shrink: 0;
        }

        @media (min-width: 640px) { .modal::before { display: none; } }

        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
        }

        @media (min-width: 640px) { .modal-header { padding: 18px 22px; } }

        .modal-header h3 {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        @media (min-width: 640px) { .modal-header h3 { font-size: 1.05rem; } }

        .modal-header h3 i { color: var(--c-accent); flex-shrink: 0; }

        .modal-close {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--t-fast);
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .modal-close:hover { background: var(--c-danger); color: #fff; }

        .modal-body {
            padding: 14px 16px;
            overflow-y: auto;
            flex: 1;
            -webkit-overflow-scrolling: touch;
            min-width: 0;
        }

        @media (min-width: 640px) { .modal-body { padding: 20px 22px; } }

        .modal-footer {
            padding: 10px 14px;
            border-top: 1px solid var(--c-border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            background: var(--c-surface-2);
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        @media (min-width: 640px) { .modal-footer { padding: 14px 22px; } }

        @media (max-width: 480px) {
            .modal-footer { flex-direction: column-reverse; }
            .modal-footer > button { width: 100%; }
        }

        /* ============================================================
           SHARE MODAL
           ============================================================ */
        .share-modal-content { text-align: center; width: 100%; }

        .share-modal-preview {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 16px;
            margin-bottom: 16px;
        }

        .share-modal-preview-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--c-accent), var(--c-accent-dark));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 auto 10px;
            text-transform: uppercase;
        }

        @media (min-width: 640px) { .share-modal-preview-avatar { width: 72px; height: 72px; font-size: 1.8rem; } }

        .share-modal-preview h3 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .share-modal-preview p {
            font-size: 0.78rem;
            color: var(--c-text-muted);
            word-break: break-word;
        }

        .share-url-input {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
            width: 100%;
        }

        @media (min-width: 480px) {
            .share-url-input { flex-direction: row; }
        }

        .share-url-input input {
            flex: 1;
            padding: 11px 14px;
            min-height: 44px;
            border-radius: var(--r-md);
            border: 1.5px solid var(--c-border);
            background: var(--c-surface-2);
            color: var(--c-text);
            font-size: 0.78rem;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            width: 100%;
            min-width: 0;
        }

        .share-url-input input:focus {
            border-color: var(--c-chat);
            outline: none;
        }

        .share-url-input button {
            padding: 11px 18px;
            min-height: 44px;
            border-radius: var(--r-md);
            background: linear-gradient(135deg, var(--c-chat), var(--c-chat-dark));
            color: #fff;
            font-weight: 700;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
        }

        .share-social-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 16px;
        }

        .share-social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            color: white;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        @media (min-width: 640px) { .share-social-btn { width: 48px; height: 48px; font-size: 1.15rem; } }

        .share-social-btn:hover { transform: translateY(-3px) scale(1.05); }

        .share-social-btn.whatsapp { background: #25D366; }
        .share-social-btn.facebook { background: #1877F2; }
        .share-social-btn.twitter { background: #1DA1F2; }
        .share-social-btn.linkedin { background: #0A66C2; }
        .share-social-btn.telegram { background: #0088cc; }
        .share-social-btn.qr { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

        .qr-container-share {
            text-align: center;
            padding: 12px;
            background: var(--c-surface-2);
            border-radius: var(--r-md);
            margin-top: 12px;
        }

        .qr-container-share img {
            max-width: 180px;
            border-radius: 10px;
            background: #fff;
            padding: 6px;
            margin: 0 auto;
        }

        /* ============================================================
           SKELETON / SPINNER
           ============================================================ */
        .skeleton {
            background: linear-gradient(90deg, var(--c-border) 0%, var(--c-surface-2) 50%, var(--c-border) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--r-md);
        }

        .skeleton-row { height: 70px; border-radius: var(--r-md); margin-bottom: 10px; }
        .skeleton-stat { height: 90px; border-radius: var(--r-lg); }

        .spinner {
            width: 13px;
            height: 13px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom, 0));
            left: 12px;
            right: 12px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .toast-container {
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                width: min(400px, calc(100% - 32px));
            }
        }

        .toast {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            color: var(--c-text);
            padding: 11px 13px;
            border-radius: var(--r-md);
            box-shadow: var(--sh-xl);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInUp 0.35s ease;
            border-right: 4px solid var(--c-primary-500);
            pointer-events: auto;
        }

        .toast.removing { opacity: 0; transform: translateX(20px); transition: all 0.3s ease; }
        .toast .toast-icon { font-size: 1.2rem; flex-shrink: 0; line-height: 1; }
        .toast .toast-content { flex: 1; min-width: 0; }
        .toast .toast-title { font-weight: 700; font-size: 0.82rem; margin-bottom: 2px; }
        .toast .toast-desc { font-size: 0.72rem; color: var(--c-text-muted); line-height: 1.4; }

        .toast .toast-close {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .toast.success { border-right-color: var(--c-accent); }
        .toast.warning { border-right-color: var(--c-warning); }
        .toast.error { border-right-color: var(--c-danger); }
        .toast.info { border-right-color: var(--c-chat); }

        /* ============================================================
           MOBILE BOTTOM NAV
           ============================================================ */
        .mobile-nav {
            display: grid;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--c-surface);
            border-top: 1px solid var(--c-border);
            box-shadow: 0 -4px 16px rgba(10, 37, 64, 0.08);
            z-index: 90;
            padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0)) 4px;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            width: 100%;
        }

        @media (min-width: 1024px) { .mobile-nav { display: none; } }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 2px;
            min-height: 48px;
            border-radius: var(--r-md);
            color: var(--c-text-sub);
            font-size: 0.6rem;
            font-weight: 700;
            transition: all var(--t-fast);
            position: relative;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            min-width: 0;
            overflow: hidden;
        }

        .mobile-nav-item i { font-size: 1rem; }
        .mobile-nav-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        .mobile-nav-item.active {
            color: var(--c-accent-dark);
            background: rgba(46, 204, 113, 0.08);
        }

        [data-theme="dark"] .mobile-nav-item.active {
            color: #6ee7a0;
            background: rgba(46, 204, 113, 0.15);
        }

        .mobile-nav-item .count-pill {
            position: absolute;
            top: 2px;
            right: 50%;
            transform: translateX(calc(50% + 12px));
            background: var(--c-danger);
            color: #fff;
            padding: 0 4px;
            border-radius: var(--r-full);
            font-size: 0.55rem;
            font-weight: 800;
            min-width: 14px;
            height: 14px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .mobile-nav-item .count-pill.show { display: flex; }

        /* Add padding to body for bottom nav */
        body { padding-bottom: calc(60px + env(safe-area-inset-bottom, 0)); }
        @media (min-width: 1024px) { body { padding-bottom: 0; } }

        /* ============================================================
           LOGIN REQUIRED
           ============================================================ */
        .login-required-state {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 16px;
            grid-column: 1 / -1;
            width: 100%;
        }

        .login-required-state .big-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(44, 122, 184, 0.12), rgba(44, 122, 184, 0.04));
            color: var(--c-primary-600);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        @media (min-width: 640px) {
            .login-required-state .big-icon { width: 90px; height: 90px; font-size: 2.2rem; }
        }

        .login-required-state h2 {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--c-text);
            margin-bottom: 10px;
        }

        @media (min-width: 640px) { .login-required-state h2 { font-size: 1.4rem; } }

        .login-required-state p {
            font-size: 0.85rem;
            color: var(--c-text-muted);
            max-width: 400px;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .login-required-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 380px;
        }

        .login-required-actions > a {
            flex: 1 1 calc(50% - 4px);
            min-width: 0;
        }

        @media (max-width: 380px) {
            .login-required-actions { flex-direction: column; }
            .login-required-actions > a { flex: 1 1 100%; }
        }

        /* ============================================================
           HIDDEN / UTILITIES
           ============================================================ */
        .hidden { display: none !important; }

        .no-scroll {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* ============================================================
           PRINT
           ============================================================ */
        @media print {
            .navbar, .sidebar, .mobile-nav, .toast-container,
            .modal-overlay, .item-actions, .btn,
            .share-profile-banner, .action-buttons-group { display: none !important; }
            body { background: #fff !important; padding: 0 !important; }
            .dashboard-layout { grid-template-columns: 1fr; padding: 0; }
            .item-row { break-inside: avoid; }
        }

        /* ============================================================
           REDUCED MOTION
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<!-- MODAL: Edit Request -->
<div class="modal-overlay" id="editRequestModal" role="dialog" aria-modal="true">
    <div class="modal">
        <div class="modal-header">
            <h3><i class="fas fa-edit"></i> تعديل الطلب</h3>
            <button class="modal-close" id="closeEditModal" type="button" aria-label="إغلاق">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="editRequestForm" class="profile-form" novalidate>
                <div class="form-group full">
                    <label for="editProductName">اسم المنتج <span class="req">*</span></label>
                    <input type="text" id="editProductName" name="product_name" required />
                </div>
                <div class="form-group">
                    <label for="editCasNumber">رقم CAS</label>
                    <input type="text" id="editCasNumber" name="cas_number" dir="ltr" />
                </div>
                <div class="form-group">
                    <label for="editQuantity">الكمية <span class="req">*</span></label>
                    <input type="text" id="editQuantity" name="quantity_needed" required placeholder="500 كجم" />
                </div>
                <div class="form-group">
                    <label for="editBudgetMin">الميزانية من (ج.م)</label>
                    <input type="number" id="editBudgetMin" name="budget_min" min="0" step="0.01" />
                </div>
                <div class="form-group">
                    <label for="editBudgetMax">الميزانية إلى (ج.م)</label>
                    <input type="number" id="editBudgetMax" name="budget_max" min="0" step="0.01" />
                </div>
                <div class="form-group">
                    <label for="editDeadline">الموعد النهائي</label>
                    <input type="date" id="editDeadline" name="deadline" />
                </div>
                <div class="form-group">
                    <label for="editLocation">موقع التسليم</label>
                    <input type="text" id="editLocation" name="location" />
                </div>
                <div class="form-group full">
                    <label for="editDescription">وصف إضافي</label>
                    <textarea id="editDescription" name="description"></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="cancelEditModal" type="button">إلغاء</button>
            <button class="btn-primary" id="saveEditModal" type="button">
                <i class="fas fa-save"></i> حفظ التعديلات
            </button>
        </div>
    </div>
</div>

                    </button>

                <div class="share-social-buttons">

                        <i class="fab fa-whatsapp"></i>
                    </a>
                    <a class="share-social-btn facebook" id="shareProfileFacebook" target="_blank" rel="noopener" title="فيسبوك">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a class="share-social-btn twitter" id="shareProfileTwitter" target="_blank" rel="noopener" title="تويتر">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a class="share-social-btn linkedin" id="shareProfileLinkedin" target="_blank" rel="noopener" title="لينكدإن">
