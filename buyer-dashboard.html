<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });

    // ============================================================
    // STATE
    // ============================================================
    const state = {
        user: null,
        userProfile: null,
        activeSection: 'overview',
        requests: [],
        offersMap: {},
        favoritesProducts: [],
        notifications: [],
        stats: {
            totalRequests: 0,
            openRequests: 0,
            totalOffers: 0,
            newOffers: 0,
            favoritesCount: 0,
        },
        editingRequestId: null,
        channel: null,
        loadedSections: {},
        isDrawerOpen: false,
    };

    const THEME_KEY = 'chemato-theme';

    // ============================================================
    // UTILS
    // ============================================================
    const escapeHtml = (str) => {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    };

    const sanitizePhone = (p) => p ? String(p).replace(/\D/g, '') : '';

    const buildMessageUrl = (userId, { requestId = null } = {}) => {
        const params = new URLSearchParams({ to: userId });
        if (requestId) params.set('request', requestId);
        return `messages.html?${params.toString()}`;
    };

    const getPublicProfileUrl = (userId) => {
        if (!userId) return '#';
        const base = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
        return `${base}buyer-requests-profile.html?id=${userId}`;
    };

    const isValidUUID = (id) =>
        id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

    const formatNumber = (n) => Number(n || 0).toLocaleString('ar-EG');
    const formatPrice = (p) => Number(p || 0).toLocaleString('ar-EG');

    const formatDate = (dateStr) => {
        if (!dateStr) return '—';
        return new Date(dateStr).toLocaleDateString('ar-EG', {
            year: 'numeric', month: 'short', day: 'numeric',
        });
    };

    const formatDateTime = (dateStr) => {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const now = new Date();
        const diffMs = now - date;
        const diffMin = Math.floor(diffMs / 60000);
        const diffHrs = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);

        if (diffMin < 1) return 'الآن';
        if (diffMin < 60) return `منذ ${diffMin} د`;
        if (diffHrs < 24) return `منذ ${diffHrs} س`;
        if (diffDays < 7) return `منذ ${diffDays} يوم`;
        return formatDate(dateStr);
    };

    const getStatusInfo = (status) => {
        const map = {
            'open':     { text: 'مفتوح',   cls: 'status-open',     icon: 'circle' },
            'matched':  { text: 'تمت المطابقة', cls: 'status-matched',  icon: 'check-circle' },
            'closed':   { text: 'مغلق',    cls: 'status-closed',   icon: 'lock' },
            'expired':  { text: 'منتهي',   cls: 'status-expired',  icon: 'clock' },
        };
        return map[status] || map['open'];
    };

    const getOfferStatusInfo = (status) => {
        const map = {
            'pending':  { text: 'قيد المراجعة', cls: 'status-pending',  icon: 'clock' },
            'accepted': { text: 'مقبول',       cls: 'status-accepted', icon: 'check-circle' },
            'rejected': { text: 'مرفوض',       cls: 'status-rejected', icon: 'times-circle' },
        };
        return map[status] || map['pending'];
    };

    // ============================================================
    // THEME
    // ============================================================
    const updateThemeIcon = (theme) => {
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    };

    const initTheme = () => {
        const saved = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        updateThemeIcon(theme);

        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem(THEME_KEY, next);
            updateThemeIcon(next);
        });
    };

    // ============================================================
    // TOAST
    // ============================================================
    const removeToast = (toast) => {
        if (!toast || !toast.parentNode) return;
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
    };

    const showToast = (icon, title, desc, linkText = null, linkUrl = null, type = '') => {
        const container = document.getElementById('toastContainer');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast ${type}`;

        const iconEl = document.createElement('div');
        iconEl.className = 'toast-icon';
        iconEl.textContent = icon;

        const content = document.createElement('div');
        content.className = 'toast-content';

        const titleEl = document.createElement('div');
        titleEl.className = 'toast-title';
        titleEl.textContent = title;

        const descEl = document.createElement('div');
        descEl.className = 'toast-desc';
        descEl.textContent = desc + (linkText ? ' ' : '');

        if (linkText && linkUrl) {
            const link = document.createElement('a');
            link.href = linkUrl;
            link.textContent = linkText;
            descEl.appendChild(link);
        }

        content.appendChild(titleEl);
        content.appendChild(descEl);

        const closeBtn = document.createElement('button');
        closeBtn.className = 'toast-close';
        closeBtn.setAttribute('aria-label', 'إغلاق');
        closeBtn.innerHTML = '<i class="fas fa-times"></i>';
        closeBtn.onclick = () => removeToast(toast);

        toast.appendChild(iconEl);
        toast.appendChild(content);
        toast.appendChild(closeBtn);
        container.appendChild(toast);

        setTimeout(() => removeToast(toast), 6000);
    };

    // ============================================================
    // AUTH GUARD
    // ============================================================
    const checkAuthAndLoad = async () => {
        const { data: { user } } = await supabase.auth.getUser();

        if (!user) {
            renderLoginRequired();
            return false;
        }

        state.user = user;

        const { data: profile } = await supabase
            .from('profiles')
            .select('id, full_name, company_name, phone, whatsapp, city, address, user_type, is_verified, avatar_url, created_at')
            .eq('id', user.id)
            .single();

        state.userProfile = profile;

        if (profile?.user_type === 'supplier') {
            showToast('⚠️', 'تنبيه', 'هذه اللوحة للمشترين. جاري تحويلك...', null, null, 'warning');
            setTimeout(() => window.location.href = 'supplier-dashboard.html', 1500);
            return false;
        }

        updateUserUI();
        return true;
    };

    const renderLoginRequired = () => {
        const main = document.getElementById('dashboardMain');
        if (main) {
            main.innerHTML = `
                <div class="login-required-state">
                    <div class="big-icon"><i class="fas fa-lock"></i></div>
                    <h2>سجّل دخولك أولاً</h2>
                    <p>عشان تقدر تشوف لوحة التحكم، الطلبات، العروض، والمفضلة، لازم تسجّل دخولك.</p>
                    <div class="login-required-actions">
                        <a href="auth.html?redirect=buyer-dashboard" class="btn-primary">
                            <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                        </a>
                        <a href="auth.html?type=buyer" class="btn-secondary">
                            <i class="fas fa-user-plus"></i> حساب جديد
                        </a>
                    </div>
                </div>
            `;
        }
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.style.display = 'none';
        const mobileNav = document.getElementById('mobileNav');
        if (mobileNav) mobileNav.style.display = 'none';
    };

    const updateUserUI = () => {
        const p = state.userProfile;
        if (!p) return;

        const name = p.company_name || p.full_name || 'مستخدم';
        const initial = name.charAt(0).toUpperCase();

        const avatarEl = document.getElementById('userAvatar');
        const nameEl = document.getElementById('userName');
        if (avatarEl) avatarEl.textContent = initial;
        if (nameEl) nameEl.textContent = name;

        const publicUrl = getPublicProfileUrl(state.user.id);

        const sidebarLink = document.getElementById('sidebarMyPublicProfile');
        if (sidebarLink) sidebarLink.href = publicUrl;

        const dropdownLink = document.getElementById('dropdownMyPublicProfile');
        if (dropdownLink) dropdownLink.href = publicUrl;

        const sharePreviewAvatar = document.getElementById('sharePreviewAvatar');
        const sharePreviewName = document.getElementById('sharePreviewName');
        const shareProfileUrl = document.getElementById('shareProfileUrl');

        if (sharePreviewAvatar) sharePreviewAvatar.textContent = initial;
        if (sharePreviewName) sharePreviewName.textContent = name;
        if (shareProfileUrl) shareProfileUrl.value = publicUrl;
    };

    // ============================================================
    // SHARE PROFILE
    // ============================================================
    const openShareModal = () => {
        if (!state.user) return;

        const publicUrl = getPublicProfileUrl(state.user.id);
        const name = state.userProfile?.company_name || state.userProfile?.full_name || 'مستخدم';
        const initial = name.charAt(0).toUpperCase();

        const sharePreviewAvatar = document.getElementById('sharePreviewAvatar');
        const sharePreviewName = document.getElementById('sharePreviewName');
        const sharePreviewDesc = document.getElementById('sharePreviewDesc');
        const shareProfileUrl = document.getElementById('shareProfileUrl');

        if (sharePreviewAvatar) sharePreviewAvatar.textContent = initial;
        if (sharePreviewName) sharePreviewName.textContent = name;
        if (sharePreviewDesc) sharePreviewDesc.textContent = `${name} على كيماتو — تعرف على طلباتي ومنتجاتي`;
        if (shareProfileUrl) shareProfileUrl.value = publicUrl;

        const text = `تعرف على ${name} على منصة كيماتو - سوق الكيماويات B2B`;

        const setHref = (id, href) => {
            const el = document.getElementById(id);
            if (el) el.href = href;
        };

        setHref('shareProfileWhatsapp', `https://wa.me/?text=${encodeURIComponent(text + '\n' + publicUrl)}`);
        setHref('shareProfileFacebook', `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(publicUrl)}`);
        setHref('shareProfileTwitter', `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(publicUrl)}`);
        setHref('shareProfileLinkedin', `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(publicUrl)}`);
        setHref('shareProfileTelegram', `https://t.me/share/url?url=${encodeURIComponent(publicUrl)}&text=${encodeURIComponent(text)}`);

        const qrContainer = document.getElementById('qrContainer');
        if (qrContainer) qrContainer.style.display = 'none';

        document.getElementById('shareProfileModal').classList.add('show');
        document.body.classList.add('no-scroll');
    };

    const closeShareModal = () => {
        document.getElementById('shareProfileModal')?.classList.remove('show');
        document.body.classList.remove('no-scroll');
    };

    const copyProfileUrl = () => {
        const url = document.getElementById('shareProfileUrl')?.value;
        if (!url) return;

        if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('📋', 'تم النسخ!', 'تم نسخ رابط ملفك العام', null, null, 'success');
            }).catch(() => fallbackCopy(url));
        } else {
            fallbackCopy(url);
        }
    };

    const fallbackCopy = (text) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showToast('📋', 'تم النسخ!', 'تم نسخ رابط ملفك العام', null, null, 'success');
        } catch (e) {
            showToast('⚠️', 'خطأ', 'تعذر نسخ الرابط', null, null, 'error');
        }
        document.body.removeChild(ta);
    };

    const toggleQRCode = () => {
        const container = document.getElementById('qrContainer');
        const img = document.getElementById('qrImage');
        const url = document.getElementById('shareProfileUrl')?.value;

        if (!container || !img || !url) return;

        if (container.style.display === 'none') {
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}&bgcolor=ffffff&color=0a2540&margin=10`;
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    };

    window.copyProfileUrl = copyProfileUrl;
    window.toggleQRCode = toggleQRCode;
    window.openShareModal = openShareModal;

    // ============================================================
    // DRAWER (Mobile Sidebar)
    // ============================================================
    const openDrawer = () => {
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        if (!sidebar) return;
        sidebar.classList.add('mobile-open');
        backdrop?.classList.add('show');
        document.body.classList.add('no-scroll');
        state.isDrawerOpen = true;
        document.getElementById('menuToggle')?.setAttribute('aria-expanded', 'true');
    };

    const closeDrawer = () => {
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        if (!sidebar) return;
        sidebar.classList.remove('mobile-open');
        backdrop?.classList.remove('show');
        document.body.classList.remove('no-scroll');
        state.isDrawerOpen = false;
        document.getElementById('menuToggle')?.setAttribute('aria-expanded', 'false');
    };

    // ============================================================
    // NAVBAR
    // ============================================================
    const initNavbar = () => {
        const menuToggle = document.getElementById('menuToggle');
        const backdrop = document.getElementById('sidebarBackdrop');

        menuToggle?.addEventListener('click', () => {
            if (state.isDrawerOpen) closeDrawer();
            else openDrawer();
        });

        backdrop?.addEventListener('click', closeDrawer);

        const userBtn = document.getElementById('userMenuBtn');
        const userDropdown = document.getElementById('userDropdown');
        userBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown?.classList.toggle('show');
            userBtn.setAttribute('aria-expanded', userDropdown?.classList.contains('show'));
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.nav-user-menu')) {
                userDropdown?.classList.remove('show');
                userBtn?.setAttribute('aria-expanded', 'false');
            }
            if (!e.target.closest('#notifPanel') && !e.target.closest('#notifBtn')) {
                document.getElementById('notifPanel')?.classList.remove('show');
            }
        });

        document.getElementById('dropdownProfile')?.addEventListener('click', (e) => {
            e.preventDefault();
            switchSection('profile');
            userDropdown?.classList.remove('show');
        });

        document.getElementById('dropdownShareProfile')?.addEventListener('click', (e) => {
            e.preventDefault();
            userDropdown?.classList.remove('show');
            openShareModal();
        });

        document.getElementById('dropdownLogout')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        document.getElementById('notifBtn')?.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('notifPanel')?.classList.toggle('show');
        });
        document.getElementById('notifMarkRead')?.addEventListener('click', () => {
            markAllNotificationsRead();
        });

        // ESC to close everything
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDrawer();
                document.getElementById('notifPanel')?.classList.remove('show');
                document.getElementById('userDropdown')?.classList.remove('show');
                closeShareModal();
                closeEditModal();
            }
        });

        // Resize: close drawer on desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024 && state.isDrawerOpen) closeDrawer();
        });
    };

    // ============================================================
    // SECTIONS NAVIGATION
    // ============================================================
    const switchSection = (section) => {
        state.activeSection = section;

        document.querySelectorAll('.sidebar-link[data-section]').forEach(link => {
            const isActive = link.dataset.section === section;
            link.classList.toggle('active', isActive);
            link.setAttribute('aria-selected', isActive);
        });

        document.querySelectorAll('.mobile-nav-item[data-section]').forEach(item => {
            item.classList.toggle('active', item.dataset.section === section);
        });

        if (window.innerWidth < 1024) closeDrawer();

        loadSection(section);
    };

    const initSidebar = () => {
        document.querySelectorAll('.sidebar-link[data-section]').forEach(link => {
            link.addEventListener('click', () => switchSection(link.dataset.section));
        });
        document.querySelectorAll('.mobile-nav-item[data-section]').forEach(item => {
            item.addEventListener('click', () => switchSection(item.dataset.section));
        });
    };

    const loadSection = async (section) => {
        const main = document.getElementById('dashboardMain');
        if (!main) return;

        if (!state.loadedSections[section]) {
            main.innerHTML = `
                <div class="skeleton skeleton-row" style="height: 60px;"></div>
                <div class="stats-grid">
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                </div>
                <div class="skeleton skeleton-row"></div>
                <div class="skeleton skeleton-row"></div>
            `;
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });

        switch (section) {
            case 'overview':  await renderOverview(); break;
            case 'requests':  await renderRequests(); break;
            case 'offers':    await renderOffers(); break;
            case 'favorites': await renderFavorites(); break;
            case 'profile':   renderProfile(); break;
            default:          renderOverview();
        }
        state.loadedSections[section] = true;
    };

    // ============================================================
    // FETCH DATA
    // ============================================================
    const fetchMyRequests = async () => {
        if (!state.user) return [];
        try {
            const { data, error } = await supabase
                .from('purchase_requests')
                .select('*')
                .eq('buyer_id', state.user.id)
                .order('created_at', { ascending: false });

            if (error) throw error;
            return data || [];
        } catch (e) {
            console.error('Fetch requests error:', e);
            return [];
        }
    };

    const fetchOffersForRequests = async (requestIds) => {
        if (!requestIds.length) return {};
        try {
            const { data, error } = await supabase
                .from('offers')
                .select('*')
                .in('request_id', requestIds)
                .order('price', { ascending: true });

            if (error) throw error;

            const map = {};
            (data || []).forEach(offer => {
                if (!map[offer.request_id]) map[offer.request_id] = [];
                map[offer.request_id].push(offer);
            });

            const supplierIds = [...new Set((data || []).map(o => o.supplier_id).filter(Boolean))];
            if (supplierIds.length) {
                const { data: suppliers } = await supabase
                    .from('profiles')
                    .select('id, full_name, company_name, phone, whatsapp, city, is_verified')
                    .in('id', supplierIds);

                const suppliersMap = {};
                (suppliers || []).forEach(s => { suppliersMap[s.id] = s; });

                Object.keys(map).forEach(rid => {
                    map[rid] = map[rid].map(o => ({
                        ...o,
                        supplier: suppliersMap[o.supplier_id] || null,
                    }));
                });
            }

            return map;
        } catch (e) {
            console.error('Fetch offers error:', e);
            return {};
        }
    };

    const fetchFavorites = async () => {
        if (!state.user) return [];
        try {
            const { data, error } = await supabase
                .from('favorites')
                .select('product_id, created_at')
                .eq('user_id', state.user.id)
                .not('product_id', 'is', null)
                .order('created_at', { ascending: false });

            if (error) throw error;

            const productIds = (data || []).map(f => f.product_id).filter(isValidUUID);
            if (!productIds.length) return [];

            const { data: products } = await supabase
                .from('products')
                .select('id, name, price, image_url, cas_number, purity, unit, category, stock_status, status')
                .in('id', productIds);

            const productsMap = {};
            (products || []).forEach(p => { productsMap[p.id] = p; });

            return productIds.map(pid => productsMap[pid]).filter(Boolean);
        } catch (e) {
            console.error('Fetch favorites error:', e);
            return [];
        }
    };

    const fetchAllData = async () => {
        if (!state.user) return;

        const requests = await fetchMyRequests();
        state.requests = requests;

        const requestIds = requests.map(r => r.id);
        state.offersMap = await fetchOffersForRequests(requestIds);

        state.favoritesProducts = await fetchFavorites();

        const allOffers = Object.values(state.offersMap).flat();
        const newOffers = allOffers.filter(o => o.status === 'pending');

        state.stats = {
            totalRequests: requests.length,
            openRequests: requests.filter(r => r.status === 'open').length,
            totalOffers: allOffers.length,
            newOffers: newOffers.length,
            favoritesCount: state.favoritesProducts.length,
        };

        updateSidebarCounts();
        buildNotifications(allOffers);
    };

    const updateSidebarCounts = () => {
        const updateEl = (id, value) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = value > 99 ? '99+' : value;
            el.style.display = value > 0 ? 'inline-flex' : 'none';
        };

        updateEl('sidebarRequestsCount', state.stats.totalRequests);
        updateEl('sidebarOffersCount', state.stats.totalOffers);
        updateEl('sidebarFavoritesCount', state.stats.favoritesCount);

        updateEl('mobileRequestsCount', state.stats.totalRequests);
        updateEl('mobileOffersCount', state.stats.totalOffers);

        const notifCount = document.getElementById('notifCount');
        if (notifCount) {
            notifCount.textContent = state.stats.newOffers > 99 ? '99+' : state.stats.newOffers;
            notifCount.classList.toggle('show', state.stats.newOffers > 0);
        }
    };

    // ============================================================
    // NOTIFICATIONS
    // ============================================================
    const buildNotifications = (offers) => {
        const recent = offers
            .filter(o => o.status === 'pending')
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
            .slice(0, 20);

        state.notifications = recent.map(o => {
            const request = state.requests.find(r => r.id === o.request_id);
            const supplier = o.supplier;
            const supplierName = supplier?.company_name || supplier?.full_name || 'مورد';
            return {
                id: o.id,
                type: 'offer',
                title: '💰 عرض جديد',
                desc: `${supplierName} قدّم عرضاً بقيمة ${formatPrice(o.price)} ج.م على "${request?.product_name || 'طلبك'}"`,
                time: o.created_at,
                unread: true,
                requestId: o.request_id,
            };
        });

        renderNotifications();
    };

    const renderNotifications = () => {
        const list = document.getElementById('notifList');
        if (!list) return;

        if (!state.notifications.length) {
            list.innerHTML = `
                <div class="empty-state" style="padding: 40px 20px;">
                    <i class="fas fa-bell-slash empty-icon" style="font-size: 2rem;"></i>
                    <p>لا توجد إشعارات جديدة</p>
                </div>

            return;
        }

        list.innerHTML = state.notifications.map(n => `
            <div class="notif-item ${n.unread ? 'unread' : ''}" data-notif-id="${n.id}" data-request-id="${n.requestId}">
                <div class="notif-content">
                    <div class="notif-title">${escapeHtml(n.title)}</div>
                    <div class="notif-desc">${escapeHtml(n.desc)}</div>
                    <div class="notif-time">${formatDateTime(n.time)}</div>
                </div>
            </div>
        `).join('');

        list.querySelectorAll('.notif-item').forEach(item => {
            item.addEventListener('click', () => {
                const requestId = item.dataset.requestId;
                if (requestId) {
                    document.getElementById('notifPanel')?.classList.remove('show');
                    window.location.href = `request-details.html?id=${requestId}`;
                }
            });
        });
    };

    const markAllNotificationsRead = () => {
        state.notifications = state.notifications.map(n => ({ ...n, unread: false }));
        renderNotifications();
        const notifCount = document.getElementById('notifCount');
        if (notifCount) notifCount.classList.remove('show');
        showToast('✅', 'تم التعليم', 'كل الإشعارات اتعلّمت كمقروءة', null, null, 'success');
    };

    // ============================================================
    // RENDER: OVERVIEW
    // ============================================================
    const renderOverview = async () => {
        const main = document.getElementById('dashboardMain');
        if (!main) return;

        await fetchAllData();

        const publicUrl = getPublicProfileUrl(state.user.id);
        const recentRequests = state.requests.slice(0, 3);
        const recentOffers = Object.values(state.offersMap).flat()
            .filter(o => o.status === 'pending')
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
            .slice(0, 3);

        main.innerHTML = `
            <div class="page-header-bar animate-in">
                <div style="min-width:0;">
                    <h1 class="page-title">
                        <i class="fas fa-th-large"></i>
                        نظرة عامة
                    </h1>

                </div>
                <div class="action-buttons-group">
                    <a href="${publicUrl}" class="btn-profile-public">
                        <i class="fas fa-user-tag"></i> ملفي العام
                    </a>

                        <i class="fas fa-share-alt"></i> شارك ملفي
                    </button>
                    <button class="btn-primary" onclick="window.location.href='index.html?action=rfq'">
                        <i class="fas fa-plus-circle"></i> طلب جديد
                    </button>
                </div>
            </div>

            <div class="share-profile-banner animate-in" style="animation-delay: 0.03s;">
                <div class="share-profile-banner-info">
                    <div class="share-profile-banner-icon">
                        <i class="fas fa-share-nodes"></i>
                    </div>
                    <div class="share-profile-banner-text">
                        <h4>شارك ملفك العام مع الموردين 📢</h4>
                        <p>خلي الموردين يشوفوا طلباتك ومنتجاتك المفضلة — وده هيساعدك تلاقي عروض أفضل</p>
                    </div>
                </div>
                <div class="share-profile-banner-actions">
                    <a href="${publicUrl}" class="btn btn-view" target="_blank" rel="noopener">

                    <button class="btn btn-copy" onclick="openShareModal()" type="button">

                    </button>

            <div class="stats-grid animate-in" style="animation-delay: 0.05s;">

                        <div class="stat-trend">عرض لكل طلب</div>

            </div>

            <div class="section-card animate-in" style="animation-delay: 0.1s;">

                    <h2 class="section-card-title">
                        <i class="fas fa-clipboard-list"></i>

                <div style="min-width:0;">
                    <h1 class="page-title">

    // ============================================================
    // RENDER: OFFERS
    // ============================================================
    const renderOffers = async () => {
        const main = document.getElementById('dashboardMain');
        if (!main) return;

        await fetchAllData();

        const allOffers = Object.values(state.offersMap).flat()
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        main.innerHTML = `

    const renderProfile = () => {

                        <div class="form-group">
                            <label for="profWhatsapp">واتساب</label>
                            <input type="tel" id="profWhatsapp" dir="ltr" value="${escapeHtml(p.whatsapp || '')}" placeholder="+20 1XX XXX XXXX" />
                        </div>
                        <div class="form-group">

                    <div style="display: grid; gap: 12px; font-size: 0.88rem;">
                        <div style="display: flex; justify-content: space-between; padding: 10px; background: var(--c-surface-2); border-radius: var(--r-md); flex-wrap: wrap; gap: 6px;">

                        <div style="display: flex; justify-content: space-between; padding: 10px; background: var(--c-surface-2); border-radius: var(--r-md); flex-wrap: wrap; gap: 6px;">
                            <span style="color: var(--c-text-muted); font-weight: 700;">حالة التحقق</span>
                            <span style="font-weight: 800;">${p.is_verified ? '✅ موثّق' : '⏳ قيد التحقق'}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 10px; background: var(--c-surface-2); border-radius: var(--r-md); flex-wrap: wrap; gap: 6px;">
                            <span style="color: var(--c-text-muted); font-weight: 700;">تاريخ التسجيل</span>
                            <span style="font-weight: 800;">${formatDate(p.created_at)}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 10px; background: var(--c-surface-2); border-radius: var(--r-md); flex-wrap: wrap; gap: 6px; align-items: center;">
                            <span style="color: var(--c-text-muted); font-weight: 700;">رابط ملفي العام</span>

                </div>

        document.getElementById('profileForm')?.addEventListener('submit', saveProfile);
    };

    const saveProfile = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveProfileBtn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';

        try {
            const updates = {
                company_name: document.getElementById('profCompany').value.trim() || null,
                phone: document.getElementById('profPhone').value.trim() || null,
                whatsapp: document.getElementById('profWhatsapp').value.trim() || null,
                city: document.getElementById('profCity').value.trim() || null,
                address: document.getElementById('profAddress').value.trim() || null,
            };

            const { error } = await supabase
                .from('profiles')
                .update(updates)
                .eq('id', state.user.id);

            if (error) throw error;

            state.userProfile = { ...state.userProfile, ...updates };
            updateUserUI();
            showToast('✅', 'تم الحفظ', 'تم تحديث بياناتك بنجاح', null, null, 'success');
        } catch (err) {
            console.error('Save profile error:', err);
            showToast('⚠️', 'خطأ', err.message || 'تعذر حفظ التعديلات', null, null, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    };

    // ============================================================
    // RENDER: REQUEST ROW
    // ============================================================
    const renderRequestRow = (r, offers = [], showActions = false) => {
        const status = getStatusInfo(r.status);
        const offersCount = offers.length;
        const pendingOffers = offers.filter(o => o.status === 'pending').length;
        const bestPrice = offers.length
            ? Math.min(...offers.filter(o => o.status !== 'rejected').map(o => Number(o.price)).filter(p => p > 0))
            : null;

        let budgetText = '';
        if (r.budget_min || r.budget_max) {
            const min = r.budget_min ? formatPrice(r.budget_min) : '';
            const max = r.budget_max ? formatPrice(r.budget_max) : '';
            if (min && max) budgetText = `${min} - ${max} ج.م`;
            else if (min) budgetText = `من ${min} ج.م`;
            else budgetText = `حتى ${max} ج.م`;
        }

        const hasNewOffers = pendingOffers > 0;

        return `
            <div class="item-row ${hasNewOffers ? 'is-new' : ''}" data-request-id="${escapeHtml(r.id)}">
                <div class="item-icon-wrapper">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <div class="item-info">
                    <div class="item-title">📦 ${escapeHtml(r.product_name)}</div>
                    <div class="item-meta">
                        <span class="status-badge ${status.cls}">
                            <i class="fas fa-${status.icon}"></i> ${status.text}
                        </span>
                        ${r.quantity_needed ? `<span><i class="fas fa-balance-scale"></i> ${escapeHtml(r.quantity_needed)}</span>` : ''}
                        ${budgetText ? `<span><i class="fas fa-money-bill-wave"></i> ${budgetText}</span>` : ''}
                        ${offersCount > 0 ? `<span class="highlight"><i class="fas fa-comments"></i> ${offersCount} عرض</span>` : ''}
                        <span><i class="fas fa-clock"></i> ${formatDateTime(r.created_at)}</span>
                    </div>
                </div>
                ${bestPrice ? `
                    <div class="item-price-block">
                        <div class="item-price">
                            ${formatPrice(bestPrice)}
                            <span class="currency">ج.م</span>
                        </div>
                        <div class="item-price-label">أقل سعر</div>
                    </div>
                ` : ''}
                <div class="item-actions">
                    ${offersCount > 0 ? `
                        <button class="item-action-btn primary toggle-offers-btn"
                                type="button"
                                data-request-id="${escapeHtml(r.id)}">
                            <i class="fas fa-eye"></i> عرض العروض (${offersCount})
                        </button>
                    ` : ''}
                    <a href="request-details.html?id=${encodeURIComponent(r.id)}" class="item-action-btn secondary">
                        <i class="fas fa-info-circle"></i> تفاصيل
                    </a>
                    ${showActions ? `
                        <button class="item-action-btn secondary icon-only edit-request-btn"
                                type="button"
                                data-request-id="${escapeHtml(r.id)}"
                                title="تعديل">
                            <i class="fas fa-edit"></i>
                        </button>
                        ${r.status === 'open' ? `
                            <button class="item-action-btn danger icon-only delete-request-btn"
                                    type="button"
                                    data-request-id="${escapeHtml(r.id)}"
                                    data-request-name="${escapeHtml(r.product_name)}"
                                    title="حذف">
                                <i class="fas fa-trash"></i>
                            </button>
                        ` : ''}
                    ` : ''}
                </div>

                ${offersCount > 0 ? `
                    <div class="offers-accordion" id="offers-${escapeHtml(r.id)}">
                        <div class="offers-accordion-inner">
                            ${offers.map(o => renderOfferMini(o, bestPrice)).join('')}
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
    };

    // ============================================================
    // RENDER: OFFER MINI
    // ============================================================
    const renderOfferMini = (offer, bestPrice) => {
        const supplier = offer.supplier || {};
        const supplierName = supplier.company_name || supplier.full_name || 'مورد';
        const supplierInitial = (supplierName || 'م').charAt(0).toUpperCase();
        const isVerified = supplier.is_verified === true;
        const isBest = bestPrice && Number(offer.price) === Number(bestPrice) && offer.status !== 'rejected';
        const statusInfo = getOfferStatusInfo(offer.status);
        const offerStatus = offer.status || 'pending';

        const rawPhone = supplier.phone || supplier.whatsapp || '';
        const cleanPhone = sanitizePhone(rawPhone);
        const phoneWithCountry = cleanPhone
            ? (cleanPhone.startsWith('20') ? cleanPhone : '20' + cleanPhone)
            : '';
        const waMsg = encodeURIComponent(`مرحباً، بخصوص عرضكم بقيمة ${formatPrice(offer.price)} ج.م على كيماتو`);
        const waLink = phoneWithCountry ? `https://wa.me/${phoneWithCountry}?text=${waMsg}` : '';

        const chatUrl = supplier.id ? buildMessageUrl(supplier.id, { requestId: offer.request_id }) : '';

        return `
            <div class="offer-mini ${isBest ? 'is-best' : ''}" data-offer-id="${escapeHtml(offer.id)}">
                <div class="offer-mini-supplier">
                    <div class="offer-mini-avatar">${supplierInitial}</div>
                    <div class="offer-mini-info">
                        <div class="offer-mini-name">
                            ${escapeHtml(supplierName)}
                            ${isVerified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i></span>' : ''}
                        </div>
                        <div class="offer-mini-meta">
                            <span class="status-badge ${statusInfo.cls}" style="font-size: 0.6rem; padding: 1px 6px;">
                                <i class="fas fa-${statusInfo.icon}"></i> ${statusInfo.text}
                            </span>
                            ${offer.delivery_time ? `<span><i class="fas fa-truck"></i> ${escapeHtml(offer.delivery_time)}</span>` : ''}
                            ${offer.created_at ? `<span><i class="fas fa-clock"></i> ${formatDateTime(offer.created_at)}</span>` : ''}
                        </div>
                        ${offer.message ? `
                            <div style="font-size: 0.72rem; color: var(--c-text-muted); margin-top: 6px; padding: 6px 10px; background: var(--c-surface); border-radius: var(--r-sm); border-right: 2px solid var(--c-accent); word-break: break-word;">
                                <i class="fas fa-comment-dots"></i> ${escapeHtml(offer.message).substring(0, 80)}${offer.message.length > 80 ? '...' : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>
                <div class="offer-mini-price">
                    ${formatPrice(offer.price)}
                    <span class="currency">ج.م</span>
                </div>
                <div class="offer-mini-actions">
                    ${offerStatus === 'pending' ? `
                        <button class="item-action-btn primary accept-offer-btn"
                                type="button"
                                data-offer-id="${escapeHtml(offer.id)}"
                                data-request-id="${escapeHtml(offer.request_id)}"
                                title="قبول العرض">
                            <i class="fas fa-check"></i> قبول
                        </button>
                        <button class="item-action-btn danger icon-only reject-offer-btn"
                                type="button"
                                data-offer-id="${escapeHtml(offer.id)}"
                                title="رفض">
                            <i class="fas fa-times"></i>
                        </button>
                    ` : ''}
                    ${chatUrl && offerStatus !== 'rejected' ? `
                        <a href="${chatUrl}"
                           class="item-action-btn chat-btn icon-only"
                           data-action="chat-supplier"
                           title="تواصل عبر الموقع">
                            <i class="fas fa-comments"></i>
                        </a>
                    ` : ''}
                    ${waLink && offerStatus !== 'rejected' ? `
                        <a href="${waLink}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="item-action-btn wa-btn icon-only"
                           title="واتساب">
                            <i class="fab fa-whatsapp"></i>
                        </a>
                    ` : ''}
                    <a href="request-details.html?id=${encodeURIComponent(offer.request_id)}"
                       class="item-action-btn secondary icon-only"
                       title="تفاصيل الطلب">
                        <i class="fas fa-info-circle"></i>
                    </a>
                </div>
            </div>
        `;
    };

    // ============================================================
    // RENDER: OFFER ROW
    // ============================================================
    const renderOfferRow = (offer, request, showDetails = false) => {
        const supplier = offer.supplier || {};
        const supplierName = supplier.company_name || supplier.full_name || 'مورد';
        const isVerified = supplier.is_verified === true;
        const statusInfo = getOfferStatusInfo(offer.status);
        const offerStatus = offer.status || 'pending';

        const rawPhone = supplier.phone || supplier.whatsapp || '';
        const cleanPhone = sanitizePhone(rawPhone);
        const phoneWithCountry = cleanPhone
            ? (cleanPhone.startsWith('20') ? cleanPhone : '20' + cleanPhone)
            : '';
        const waMsg = encodeURIComponent(`مرحباً، بخصوص عرضكم على كيماتو`);
        const waLink = phoneWithCountry ? `https://wa.me/${phoneWithCountry}?text=${waMsg}` : '';

        const chatUrl = supplier.id ? buildMessageUrl(supplier.id, { requestId: offer.request_id }) : '';

        return `
            <div class="item-row" data-offer-id="${escapeHtml(offer.id)}">
                <div class="item-icon-wrapper supplier">
                    <i class="fas fa-hand-holding-usd"></i>
                </div>
                <div class="item-info">
                    <div class="item-title">
                        ${escapeHtml(supplierName)}
                        ${isVerified ? '<span class="verified-badge"><i class="fas fa-check-circle"></i> موثّق</span>' : ''}
                    </div>
                    <div class="item-meta">
                        <span class="status-badge ${statusInfo.cls}">
                            <i class="fas fa-${statusInfo.icon}"></i> ${statusInfo.text}
                        </span>
                        ${request ? `<span><i class="fas fa-box"></i> ${escapeHtml(request.product_name)}</span>` : ''}
                        ${offer.quantity_offered ? `<span><i class="fas fa-balance-scale"></i> ${escapeHtml(offer.quantity_offered)}</span>` : ''}
                        ${offer.delivery_time ? `<span><i class="fas fa-truck"></i> ${escapeHtml(offer.delivery_time)}</span>` : ''}
                        <span><i class="fas fa-clock"></i> ${formatDateTime(offer.created_at)}</span>
                    </div>
                    ${offer.message ? `
                        <div style="font-size: 0.78rem; color: var(--c-text-muted); margin-top: 6px; padding: 8px 10px; background: var(--c-surface); border-radius: var(--r-sm); border-right: 3px solid var(--c-accent); word-break: break-word;">
                            <i class="fas fa-comment-dots"></i> ${escapeHtml(offer.message).substring(0, 120)}${offer.message.length > 120 ? '...' : ''}
                        </div>
                    ` : ''}
                </div>
                <div class="item-price-block">
                    <div class="item-price">
                        ${formatPrice(offer.price)}
                        <span class="currency">ج.م</span>
                    </div>
                    <div class="item-price-label">السعر المعروض</div>
                </div>
                <div class="item-actions">
                    ${offerStatus === 'pending' ? `
                        <button class="item-action-btn primary accept-offer-btn"
                                type="button"
                                data-offer-id="${escapeHtml(offer.id)}"
                                data-request-id="${escapeHtml(offer.request_id)}">
                            <i class="fas fa-check"></i> قبول
                        </button>
                        <button class="item-action-btn danger reject-offer-btn"
                                type="button"
                                data-offer-id="${escapeHtml(offer.id)}">
                            <i class="fas fa-times"></i> رفض
                        </button>
                    ` : ''}
                    ${chatUrl && offerStatus !== 'rejected' ? `
                        <a href="${chatUrl}"
                           class="item-action-btn chat-btn"
                           data-action="chat-supplier"
                           title="تواصل عبر الموقع">
                            <i class="fas fa-comments"></i> تواصل
                        </a>
                    ` : ''}
                    ${waLink && offerStatus !== 'rejected' ? `
                        <a href="${waLink}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="item-action-btn wa-btn"
                           title="واتساب">
                            <i class="fab fa-whatsapp"></i>
                        </a>
                    ` : ''}
                    ${request ? `
                        <a href="request-details.html?id=${encodeURIComponent(request.id)}"
                           class="item-action-btn secondary">
                            <i class="fas fa-info-circle"></i>
                        </a>
                    ` : ''}
                </div>
            </div>
        `;
    };

    // ============================================================
    // RENDER: FAVORITE ROW
    // ============================================================
    const renderFavoriteRow = (p) => {
        const hasImage = p.image_url && /^https?:\/\//i.test(p.image_url);
        const isOutOfStock = p.stock_status === 'out';
        const isInactive = p.status !== 'active';

        return `
            <div class="item-row" data-product-id="${escapeHtml(p.id)}">
                <div class="item-icon-wrapper accent" style="overflow: hidden; padding: 0;">
                    ${hasImage ? `
                        <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}"
                             onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\\'fas fa-flask\\' style=\\'font-size: 1.2rem;\\'></i>';" />
                    ` : `
                        <i class="fas fa-flask"></i>
                    `}
                </div>
                <div class="item-info">
                    <div class="item-title">${escapeHtml(p.name)}</div>
                    <div class="item-meta">
                        ${p.cas_number ? `<span style="font-family: monospace; direction: ltr;"><i class="fas fa-hashtag"></i> ${escapeHtml(p.cas_number)}</span>` : ''}
                        ${p.purity ? `<span><i class="fas fa-percentage"></i> ${escapeHtml(p.purity)}</span>` : ''}
                        ${p.category ? `<span><i class="fas fa-tag"></i> ${escapeHtml(p.category)}</span>` : ''}
                        ${isOutOfStock ? `<span class="status-badge status-expired"><i class="fas fa-times-circle"></i> غير متوفر</span>` : ''}
                        ${isInactive ? `<span class="status-badge status-closed"><i class="fas fa-lock"></i> غير نشط</span>` : ''}
                    </div>
                </div>
                <div class="item-price-block">
                    ${p.price ? `
                        <div class="item-price">
                            ${formatPrice(p.price)}
                            <span class="currency">ج.م</span>
                        </div>
                        ${p.unit ? `<div class="item-price-label">/ ${escapeHtml(p.unit)}</div>` : ''}
                    ` : `
                        <div class="item-price" style="font-size: 0.85rem; color: var(--c-text-sub);">عند الطلب</div>
                    `}
                </div>
                <div class="item-actions">
                    <a href="product-details.html?id=${encodeURIComponent(p.id)}" class="item-action-btn primary">
                        <i class="fas fa-info-circle"></i> تفاصيل
                    </a>
                    <button class="item-action-btn danger icon-only remove-favorite-btn"
                            type="button"
                            data-product-id="${escapeHtml(p.id)}"
                            data-product-name="${escapeHtml(p.name)}"
                            title="إزالة من المفضلة">
                        <i class="fas fa-heart-broken"></i>
                    </button>
                </div>
            </div>
        `;
    };

    // ============================================================
    // BIND: Request Row Events
    // ============================================================
    const bindRequestRowEvents = () => {
        document.querySelectorAll('.toggle-offers-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const rid = btn.dataset.requestId;
                const acc = document.getElementById(`offers-${rid}`);
                if (acc) {
                    const isOpen = acc.classList.toggle('open');
                    const icon = btn.querySelector('i');
                    if (icon) {
                        icon.className = isOpen ? 'fas fa-eye-slash' : 'fas fa-eye';
                    }
                }
            });
        });

        document.querySelectorAll('.edit-request-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const rid = btn.dataset.requestId;
                openEditRequestModal(rid);
            });
        });

        document.querySelectorAll('.delete-request-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const rid = btn.dataset.requestId;
                const name = btn.dataset.requestName;
                deleteRequest(rid, name);
            });
        });
    };

    // ============================================================
    // BIND: Favorite Events
    // ============================================================
    const bindFavoriteEvents = () => {
        document.querySelectorAll('.remove-favorite-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const pid = btn.dataset.productId;
                const name = btn.dataset.productName;
                if (!confirm(`هل تريد إزالة "${name}" من المفضلة؟`)) return;

                try {
                    const { error } = await supabase
                        .from('favorites')
                        .delete()
                        .eq('user_id', state.user.id)
                        .eq('product_id', pid);

                    if (error) throw error;

                    showToast('💔', 'تم الحذف', `أُزيل "${name}" من المفضلة`, null, null, 'info');
                    renderFavorites();
                } catch (err) {
                    showToast('⚠️', 'خطأ', 'تعذر الحذف', null, null, 'error');
                }
            });
        });
    };

    // ============================================================
    // ACCEPT / REJECT OFFER
    // ============================================================
    const handleOfferAction = async (offerId, action) => {
        const actionText = action === 'accepted' ? 'قبول' : 'رفض';
        if (!confirm(`هل أنت متأكد من ${actionText} هذا العرض؟`)) return;

        try {
            const { error } = await supabase
                .from('offers')
                .update({ status: action })
                .eq('id', offerId);

            if (error) throw error;

            showToast(
                action === 'accepted' ? '✅' : '❌',
                action === 'accepted' ? 'تم القبول' : 'تم الرفض',
                'تم تحديث حالة العرض بنجاح',
                null, null,
                action === 'accepted' ? 'success' : 'info'
            );

            await fetchAllData();
            loadSection(state.activeSection);

            if (action === 'accepted') {
                const offer = Object.values(state.offersMap).flat().find(o => o.id === offerId);
                const request = offer ? state.requests.find(r => r.id === offer.request_id) : null;
                if (request && request.status === 'open') {
                    setTimeout(() => {
                        if (confirm('هل تريد تغيير حالة الطلب إلى "تمت المطابقة"؟')) {
                            supabase
                                .from('purchase_requests')
                                .update({ status: 'matched' })
                                .eq('id', request.id)
                                .then(() => {
                                    showToast('🤝', 'تم التحديث', 'حالة الطلب أصبحت "تمت المطابقة"', null, null, 'success');
                                    fetchAllData().then(() => loadSection(state.activeSection));
                                });
                        }
                    }, 800);
                }
            }
        } catch (err) {
            console.error('Offer action error:', err);
            showToast('⚠️', 'خطأ', err.message || `تعذر ${actionText} العرض`, null, null, 'error');
        }
    };

    const initOfferActions = () => {
        document.addEventListener('click', (e) => {
            const acceptBtn = e.target.closest('.accept-offer-btn');
            if (acceptBtn) {
                e.preventDefault();
                handleOfferAction(acceptBtn.dataset.offerId, 'accepted');
                return;
            }

            const rejectBtn = e.target.closest('.reject-offer-btn');
            if (rejectBtn) {
                e.preventDefault();
                handleOfferAction(rejectBtn.dataset.offerId, 'rejected');
                return;
            }

            const chatBtn = e.target.closest('[data-action="chat-supplier"]');
            if (chatBtn) {
                if (!state.user) {
                    e.preventDefault();
                    showToast('🔐', 'سجّل دخولك', 'لازم تسجل دخول للتواصل', null, null, 'warning');
                    const url = chatBtn.getAttribute('href');
                    setTimeout(() => {
                        window.location.href = `auth.html?redirect=${encodeURIComponent(url)}`;
                    }, 1200);
                    return;
                }
                showToast('💬', 'جاري فتح المحادثة', 'يتم تحويلك لصفحة المحادثات...', null, null, 'info');
            }
        });
    };

    // ============================================================
    // EDIT REQUEST MODAL
    // ============================================================
    const openEditRequestModal = (requestId) => {
        const request = state.requests.find(r => r.id === requestId);
        if (!request) return;

        state.editingRequestId = requestId;

        document.getElementById('editProductName').value = request.product_name || '';
        document.getElementById('editCasNumber').value = request.cas_number || '';
        document.getElementById('editQuantity').value = request.quantity_needed || '';
        document.getElementById('editBudgetMin').value = request.budget_min || '';
        document.getElementById('editBudgetMax').value = request.budget_max || '';
        document.getElementById('editDeadline').value = request.deadline || '';
        document.getElementById('editLocation').value = request.location || '';
        document.getElementById('editDescription').value = request.description || '';

        document.getElementById('editRequestModal').classList.add('show');
        document.body.classList.add('no-scroll');
    };

    const closeEditModal = () => {
        document.getElementById('editRequestModal')?.classList.remove('show');
        document.body.classList.remove('no-scroll');
        state.editingRequestId = null;
    };

    const saveEditRequest = async () => {
        if (!state.editingRequestId) return;
        const btn = document.getElementById('saveEditModal');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';

        try {
            const productName = document.getElementById('editProductName').value.trim();
            const quantity = document.getElementById('editQuantity').value.trim();

            if (!productName) throw new Error('اسم المنتج مطلوب');
            if (!quantity) throw new Error('الكمية مطلوبة');

            const updates = {
                product_name: productName,
                cas_number: document.getElementById('editCasNumber').value.trim() || null,
                quantity_needed: quantity,
                budget_min: document.getElementById('editBudgetMin').value ? Number(document.getElementById('editBudgetMin').value) : null,
                budget_max: document.getElementById('editBudgetMax').value ? Number(document.getElementById('editBudgetMax').value) : null,
                deadline: document.getElementById('editDeadline').value || null,
                location: document.getElementById('editLocation').value.trim() || null,
                description: document.getElementById('editDescription').value.trim() || null,
            };

            const { error } = await supabase
                .from('purchase_requests')
                .update(updates)
                .eq('id', state.editingRequestId)
                .eq('buyer_id', state.user.id);

            if (error) throw error;

            showToast('✅', 'تم الحفظ', 'تم تحديث الطلب بنجاح', null, null, 'success');
            closeEditModal();
            await fetchAllData();
            loadSection(state.activeSection);
        } catch (err) {
            console.error('Edit request error:', err);
            showToast('⚠️', 'خطأ', err.message || 'تعذر حفظ التعديلات', null, null, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    };

    // ============================================================
    // DELETE REQUEST
    // ============================================================
    const deleteRequest = async (requestId, name) => {
        if (!confirm(`هل أنت متأكد من حذف طلب "${name}"؟ لا يمكن التراجع.`)) return;

        try {
            const { error } = await supabase
                .from('purchase_requests')
                .delete()
                .eq('id', requestId)
                .eq('buyer_id', state.user.id);

            if (error) throw error;

            showToast('🗑️', 'تم الحذف', `حُذف طلب "${name}" بنجاح`, null, null, 'success');
            await fetchAllData();
            loadSection(state.activeSection);
        } catch (err) {
            console.error('Delete request error:', err);
            showToast('⚠️', 'خطأ', err.message || 'تعذر حذف الطلب', null, null, 'error');
        }
    };

    // ============================================================
    // QUICK SHARE WHATSAPP
    // ============================================================
    window.quickShareWhatsapp = () => {
        if (!state.user) return;
        const publicUrl = getPublicProfileUrl(state.user.id);
        const name = state.userProfile?.company_name || state.userProfile?.full_name || 'مستخدم';
        const text = `تعرف على ${name} على منصة كيماتو - سوق الكيماويات B2B\n${publicUrl}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');
    };

    // ============================================================
    // REALTIME
    // ============================================================
    const setupRealtime = () => {
        if (state.channel) supabase.removeChannel(state.channel);
        try {
            state.channel = supabase
                .channel('buyer_dashboard_realtime')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'offers',
                }, (payload) => {
                    const offer = payload.new;
                    const myRequest = state.requests.find(r => r.id === offer.request_id);
                    if (myRequest) {
                        showToast('💰', 'عرض جديد!', `عرض بقيمة ${formatPrice(offer.price)} ج.م على "${myRequest.product_name}"`,
                            'عرض التفاصيل', `request-details.html?id=${offer.request_id}`, 'success');
                        loadSection(state.activeSection);
                    }
                })
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'offers',
                }, () => {
                    loadSection(state.activeSection);
                })
                .subscribe();
        } catch (e) { /* silent */ }
    };

    // ============================================================
    // MODAL BINDINGS
    // ============================================================
    const initModals = () => {
        document.getElementById('closeEditModal')?.addEventListener('click', closeEditModal);
        document.getElementById('cancelEditModal')?.addEventListener('click', closeEditModal);
        document.getElementById('saveEditModal')?.addEventListener('click', saveEditRequest);

        document.getElementById('editRequestModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'editRequestModal') closeEditModal();
        });

        document.getElementById('shareProfileModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'shareProfileModal') {
                closeShareModal();
            }
        });
    };

    // ============================================================
    // EXPOSE GLOBALLY
    // ============================================================
    window.switchSection = switchSection;

    // ============================================================
    // INIT
    // ============================================================
    const init = async () => {
        console.log('🚀 كيماتو | لوحة المشتري 4.0');

        initTheme();
        initNavbar();
        initSidebar();
        initModals();
        initOfferActions();

        const isAuthed = await checkAuthAndLoad();
        if (!isAuthed) return;

        await loadSection('overview');
        setupRealtime();

        console.log('✅ جاهز');
    };

    supabase.auth.onAuthStateChange(async (event) => {
        if (event === 'SIGNED_OUT') {
            window.location.href = 'index.html';
        } else if (event === 'SIGNED_IN') {
            const ok = await checkAuthAndLoad();
            if (ok) await loadSection('overview');
        }
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
</body>
</html>
