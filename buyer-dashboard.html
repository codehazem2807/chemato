                sidebarAvailableCount: state.availableRequests.filter(r => !r.myOffer).length,
                mobileProductsCount: state.stats.totalProducts,
                mobileOffersCount: state.stats.totalOffers,
                mobileAvailableCount: state.availableRequests.filter(r => !r.myOffer).length,
            };

            Object.entries(els).forEach(([id, val]) => {
                const el = document.getElementById(id);
                if (el) {
                    el.textContent = val > 99 ? '99+' : val;
                    el.classList.toggle('show', val > 0);
                }
            });

            // Notifications badge
            const notifCount = document.getElementById('notifCount');
            const unread = state.notifications.filter(n => n.unread).length;
            if (notifCount) {
                notifCount.textContent = unread > 99 ? '99+' : unread;
                notifCount.classList.toggle('show', unread > 0);
            }
        };

        // ============================================================
        // NOTIFICATIONS
        // ============================================================
        const buildNotifications = () => {
            const notifs = [];

            // New available requests
            const newRequests = state.availableRequests
                .filter(r => !r.myOffer)
                .slice(0, 5);

            newRequests.forEach(r => {
                notifs.push({
                    id: `req-${r.id}`,
                    type: 'request',
                    title: '📢 طلب شراء جديد',
                    desc: `مطلوب: ${r.product_name} — ${r.quantity_needed || 'كمية غير محددة'}`,
                    time: r.created_at,
                    unread: true,
                    link: `request-details.html?id=${r.id}`,
                });
            });

            // New contacts
            const newContacts = state.contacts
                .filter(c => c.contact_type === 'whatsapp' || c.contact_type === 'phone')
                .slice(0, 3);

            newContacts.forEach(c => {
                const typeInfo = getContactTypeInfo(c.contact_type);
                const buyerName = c.buyer?.company_name || c.buyer?.full_name || 'عميل';
                notifs.push({
                    id: `contact-${c.id}`,
                    type: 'contact',
                    title: `${typeInfo.icon.includes('whatsapp') ? '💬' : '📞'} ${typeInfo.text}`,
                    desc: `${buyerName} — ${c.product?.name || 'منتج'}`,
                    time: c.contact_date,
                    unread: false,
                    link: `product-details.html?id=${c.product_id}`,
                });
            });

            // Accepted offers
            const acceptedOffers = state.myOffers
                .filter(o => o.status === 'accepted')
                .slice(0, 3);

            acceptedOffers.forEach(o => {
                notifs.push({
                    id: `offer-${o.id}`,
                    type: 'offer',
                    title: '✅ عرضك مقبول!',
                    desc: `تم قبول عرضك على "${o.request?.product_name || 'طلب'}"`,
                    time: o.created_at,
                    unread: false,
                    link: `request-details.html?id=${o.request_id}`,
                });
            });

            // Sort by time desc
            notifs.sort((a, b) => new Date(b.time) - new Date(a.time));

            state.notifications = notifs;
            renderNotifications();
            updateNotifBadge();
        };

        const updateNotifBadge = () => {
            const badge = document.getElementById('notifCount');
            const unread = state.notifications.filter(n => n.unread).length;
            if (badge) {
                badge.textContent = unread > 99 ? '99+' : unread;
                badge.classList.toggle('show', unread > 0);
            }
        };

        const renderNotifications = () => {
            const list = document.getElementById('notifList');
            if (!list) return;

            if (!state.notifications.length) {
                list.innerHTML = `
                    <div class="empty-state" style="padding: 40px 20px;">
                        <i class="fas fa-bell-slash empty-icon" style="font-size: 2rem;"></i>
                        <p>لا توجد إشعارات جديدة</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = state.notifications.map(n => `
                <div class="notif-item ${n.unread ? 'unread' : ''}" data-notif-id="${escapeHtml(n.id)}" data-link="${escapeHtml(n.link || '')}">
                    <div class="notif-content">
                        <div class="notif-title">${escapeHtml(n.title)}</div>
                        <div class="notif-desc">${escapeHtml(n.desc)}</div>
                        <div class="notif-time">${formatDateTime(n.time)}</div>
                    </div>
                </div>
            `).join('');

            list.querySelectorAll('.notif-item').forEach(item => {
                item.addEventListener('click', () => {
                    const link = item.dataset.link;
                    if (link) {
                        window.location.href = link;
                    }
                });
            });
        };

        const markAllNotificationsRead = () => {
            state.notifications = state.notifications.map(n => ({ ...n, unread: false }));
            renderNotifications();
            updateNotifBadge();
            showToast('✅', 'تم التعليم', 'كل الإشعارات اتعلّمت كمقروءة', null, null, 'success');
        };
        // ============================================================
        // RENDER: OVERVIEW
        // ============================================================
        const renderOverview = async () => {
            const main = document.getElementById('dashboardMain');
            if (!main) return;

            await fetchAllData();

            const recentOffers = state.myOffers.slice(0, 4);
            const recentRequests = state.availableRequests
                .filter(r => !r.myOffer)
                .slice(0, 4);

            main.innerHTML = `
                <div class="page-header-bar animate-in">
                    <div>
                        <h1 class="page-title">
                            <i class="fas fa-th-large"></i>
                            نظرة عامة
                        </h1>
                        <p class="page-subtitle">مرحباً ${escapeHtml(state.userProfile?.company_name || state.userProfile?.full_name || 'بك')} — دي ملخص نشاطك على كيماتو</p>
                    </div>
                    <button class="btn-primary" id="addProductQuickBtn" type="button">
                        <i class="fas fa-plus-circle"></i> أضف منتج جديد
                    </button>
                </div>

                <!-- STATS -->
                <div class="stats-grid animate-in" style="animation-delay: 0.05s;">
                    <div class="stat-card" style="--stat-color: var(--c-request); --stat-bg: rgba(230, 126, 34, 0.12);">
                        <div class="stat-icon"><i class="fas fa-flask"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">إجمالي منتجاتي</div>
                            <div class="stat-value">${formatNumber(state.stats.totalProducts)}</div>
                            <div class="stat-trend"><i class="fas fa-circle" style="color: var(--c-accent); font-size: 0.5rem;"></i> ${formatNumber(state.stats.activeProducts)} نشط</div>
                        </div>
                    </div>

                    <div class="stat-card" style="--stat-color: var(--c-accent); --stat-bg: rgba(46, 204, 113, 0.12);">
                        <div class="stat-icon"><i class="fas fa-hand-holding-usd"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">عروضي</div>
                            <div class="stat-value">${formatNumber(state.stats.totalOffers)}</div>
                            <div class="stat-trend"><i class="fas fa-check-circle" style="color: var(--c-accent); font-size: 0.6rem;"></i> ${formatNumber(state.stats.acceptedOffers)} مقبول</div>
                        </div>
                    </div>

                    <div class="stat-card" style="--stat-color: var(--c-primary-600); --stat-bg: rgba(44, 122, 184, 0.12);">
                        <div class="stat-icon"><i class="fas fa-eye"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">مشاهدات المنتجات</div>
                            <div class="stat-value">${formatNumber(state.stats.totalViews)}</div>
                            <div class="stat-trend">إجمالي الزيارات</div>
                        </div>
                    </div>

                    <div class="stat-card" style="--stat-color: var(--c-whatsapp); --stat-bg: rgba(37, 211, 102, 0.12);">
                        <div class="stat-icon"><i class="fab fa-whatsapp"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">تواصلات العملاء</div>
                            <div class="stat-value">${formatNumber(state.stats.totalContacts)}</div>
                            <div class="stat-trend"><i class="fab fa-whatsapp" style="font-size: 0.6rem;"></i> ${formatNumber(state.stats.totalWhatsapp)} واتساب</div>
                        </div>
                    </div>
                </div>

                <!-- LATEST OFFERS -->
                <div class="section-card animate-in" style="animation-delay: 0.1s;">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            <i class="fas fa-hand-holding-usd"></i>
                            آخر عروضي
                            <span class="count-badge">${state.myOffers.length}</span>
                        </h2>
                        <button class="view-all-link" onclick="window.switchSection('my-offers')">
                            عرض الكل <i class="fas fa-arrow-left"></i>
                        </button>
                    </div>
                    <div class="section-card-body">
                        ${recentOffers.length ? `
                            <div class="item-list">
                                ${recentOffers.map(o => renderMyOfferRow(o)).join('')}
                            </div>
                        ` : `
                            <div class="empty-state">
                                <i class="fas fa-hand-holding-usd empty-icon"></i>
                                <h4>لسه مفيش عروض</h4>
                                <p>قدّم عرضك الأول على طلب شراء متاح</p>
                                <button class="btn-primary" onclick="window.switchSection('available-requests')">
                                    <i class="fas fa-bullhorn"></i> شوف الطلبات المتاحة
                                </button>
                            </div>
                        `}
                    </div>
                </div>

                <!-- AVAILABLE REQUESTS -->
                <div class="section-card animate-in" style="animation-delay: 0.15s;">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            <i class="fas fa-bullhorn"></i>
                            طلبات جديدة متاحة
                            <span class="count-badge accent">${state.availableRequests.filter(r => !r.myOffer).length}</span>
                        </h2>
                        <button class="view-all-link" onclick="window.switchSection('available-requests')">
                            عرض الكل <i class="fas fa-arrow-left"></i>
                        </button>
                    </div>
                    <div class="section-card-body">
                        ${recentRequests.length ? `
                            <div class="item-list">
                                ${recentRequests.map(r => renderAvailableRequestRow(r)).join('')}
                            </div>
                        ` : `
                            <div class="empty-state">
                                <i class="fas fa-bullhorn empty-icon"></i>
                                <h4>مفيش طلبات جديدة</h4>
                                <p>هتلاقي هنا طلبات الشراء اللي المشترين بيعملوها</p>
                            </div>
                        `}
                    </div>
                </div>
            `;

            document.getElementById('addProductQuickBtn')?.addEventListener('click', () => {
                switchSection('products');
                setTimeout(() => openProductModal(), 300);
            });

            bindOverviewEvents();
        };

        const bindOverviewEvents = () => {
            document.querySelectorAll('.offer-request-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const rid = btn.dataset.requestId;
                    window.location.href = `request-details.html?id=${rid}`;
                });
            });
        };

        // ============================================================
        // RENDER: MY PRODUCTS
        // ============================================================
        const renderProducts = async () => {
            const main = document.getElementById('dashboardMain');
            if (!main) return;

            await fetchAllData();
            await fetchCategories();

            main.innerHTML = `
                <div class="page-header-bar animate-in">
                    <div>
                        <h1 class="page-title">
                            <i class="fas fa-flask"></i>
                            منتجاتي
                        </h1>
                        <p class="page-subtitle">إدارة كل المنتجات اللي بتقدمها</p>
                    </div>
                    <button class="btn-primary" id="addProductBtn" type="button">
                        <i class="fas fa-plus-circle"></i> أضف منتج جديد
                    </button>
                </div>

                ${state.products.length ? `
                    <div class="section-card animate-in" style="animation-delay: 0.05s;">
                        <div class="section-card-header">
                            <h2 class="section-card-title">
                                <i class="fas fa-list"></i>
                                القائمة الكاملة
                                <span class="count-badge">${state.products.length}</span>
                            </h2>
                        </div>
                        <div class="section-card-body">
                            <div class="products-grid-mini">
                                ${state.products.map(p => renderProductMini(p)).join('')}
                            </div>
                        </div>
                    </div>
                ` : `
                    <div class="section-card animate-in" style="animation-delay: 0.05s;">
                        <div class="section-card-body">
                            <div class="empty-state">
                                <i class="fas fa-flask empty-icon"></i>
                                <h4>لسه مفيش منتجات</h4>
                                <p>ابدأ بإضافة أول منتج عشان العملاء يلاقوك</p>
                                <button class="btn-primary" id="addFirstProductBtn" type="button">
                                    <i class="fas fa-plus-circle"></i> أضف أول منتج
                                </button>
                            </div>
                        </div>
                    </div>
                `}

                <!-- Products table (for detailed view) -->
                ${state.products.length > 0 ? `
                    <div class="section-card animate-in" style="animation-delay: 0.1s;">
                        <div class="section-card-header">
                            <h2 class="section-card-title">
                                <i class="fas fa-table"></i>
                                جدول تفصيلي
                            </h2>
                        </div>
                        <div class="section-card-body" style="padding: 0;">
                            <div class="contacts-table-wrapper" style="margin: 0;">
                                <table class="contacts-table">
                                    <thead>
                                        <tr>
                                            <th>المنتج</th>
                                            <th>السعر</th>
                                            <th>المخزون</th>
                                            <th>المشاهدات</th>
                                            <th>التواصلات</th>
                                            <th>الحالة</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${state.products.map(p => `
                                            <tr>
                                                <td>
                                                    <div style="display: flex; align-items: center; gap: 10px;">
                                                        <div style="width: 40px; height: 40px; border-radius: var(--r-md); overflow: hidden; background: var(--c-surface-2); flex-shrink: 0;">
                                                            ${p.image_url ? `
                                                                <img src="${escapeHtml(p.image_url)}" alt="" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none';" />
                                                            ` : `
                                                                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">🧪</div>
                                                            `}
                                                        </div>
                                                        <div>
                                                            <div style="font-weight: 800; color: var(--c-text); font-size: 0.85rem;">${escapeHtml(p.name)}</div>
                                                            ${p.cas_number ? `<div style="font-size: 0.7rem; color: var(--c-purple); direction: ltr; font-family: monospace;">${escapeHtml(p.cas_number)}</div>` : ''}
                                                        </div>
                                                    </div>
                                                </td>
                                                <td>${p.price ? `<strong style="color: var(--c-accent-dark);">${formatPrice(p.price)} ج.م</strong>` : '—'}</td>
                                                <td>
                                                    ${p.stock_status === 'available' ? '<span class="status-badge status-open">متوفر</span>' :
                                                      p.stock_status === 'low' ? '<span class="status-badge status-pending">محدود</span>' :
                                                      '<span class="status-badge status-expired">غير متوفر</span>'}
                                                </td>
                                                <td>${formatNumber(p.views || 0)}</td>
                                                <td>${formatNumber(p.contact_count || 0)}</td>
                                                <td>
                                                    ${p.status === 'active'
                                                        ? '<span class="status-badge status-open">نشط</span>'
                                                        : '<span class="status-badge status-closed">غير نشط</span>'}
                                                </td>
                                                <td>
                                                    <div style="display: flex; gap: 4px; justify-content: flex-end;">
                                                        <button class="item-action-btn secondary icon-only edit-product-btn" type="button" data-product-id="${escapeHtml(p.id)}" title="تعديل">
                                                            <i class="fas fa-edit"></i>
                                                        </button>
                                                        <button class="item-action-btn danger icon-only delete-product-btn" type="button" data-product-id="${escapeHtml(p.id)}" data-product-name="${escapeHtml(p.name)}" title="حذف">
                                                            <i class="fas fa-trash"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                ` : ''}
            `;

            document.getElementById('addProductBtn')?.addEventListener('click', () => openProductModal());
            document.getElementById('addFirstProductBtn')?.addEventListener('click', () => openProductModal());
            bindProductEvents();
        };

        const renderProductMini = (p) => {
            const hasImage = p.image_url && /^https?:\/\//i.test(p.image_url);
            const isActive = p.status === 'active';
            const stockLabels = {
                'available': { text: 'متوفر', cls: 'active' },
                'low': { text: 'محدود', cls: 'inactive' },
                'out': { text: 'غير متوفر', cls: 'inactive' },
            };
            const stock = stockLabels[p.stock_status] || stockLabels['available'];

            return `
                <div class="mini-product" data-product-id="${escapeHtml(p.id)}">
                    <div class="mini-product-media">
                        ${hasImage ? `
                            <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" loading="lazy"
                                 onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'mini-product-placeholder\\'><span class=\\'emoji\\'>🧪</span></div>';" />
                        ` : `
                            <div class="mini-product-placeholder">
                                <span class="emoji">🧪</span>
                            </div>
                        `}
                        <span class="mini-product-status-badge ${stock.cls}">${stock.text}</span>
                        ${p.is_featured ? `<span class="mini-product-status-badge featured">⭐ مميز</span>` : ''}
                    </div>
                    <div class="mini-product-body">
                        <h3 class="mini-product-title">${escapeHtml(p.name)}</h3>
                        <div class="mini-product-specs">
                            ${p.cas_number ? `<span style="color: var(--c-purple);">CAS ${escapeHtml(p.cas_number)}</span>` : ''}
                            ${p.purity ? `<span>${escapeHtml(p.purity)}</span>` : ''}
                            ${p.packaging ? `<span>${escapeHtml(p.packaging)}</span>` : ''}
                        </div>
                        <div class="mini-product-price ${p.price ? '' : 'no-price'}">
                            ${p.price ? `${formatPrice(p.price)} <span class="currency">ج.م</span>` : 'السعر عند الطلب'}
                        </div>
                    </div>
                    <div class="mini-product-actions">
                        <button class="item-action-btn secondary edit-product-btn" type="button" data-product-id="${escapeHtml(p.id)}" style="flex: 1;">
                            <i class="fas fa-edit"></i> تعديل
                        </button>
                        <a href="product-details.html?id=${encodeURIComponent(p.id)}" class="item-action-btn secondary icon-only" target="_blank" title="عرض في الموقع">
                            <i class="fas fa-external-link-alt"></i>
                        </a>
                        <button class="item-action-btn danger icon-only delete-product-btn" type="button" data-product-id="${escapeHtml(p.id)}" data-product-name="${escapeHtml(p.name)}" title="حذف">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        };

        const bindProductEvents = () => {
            document.querySelectorAll('.edit-product-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pid = btn.dataset.productId;
                    openProductModal(pid);
                });
            });

            document.querySelectorAll('.delete-product-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pid = btn.dataset.productId;
                    const name = btn.dataset.productName;
                    deleteProduct(pid, name);
                });
            });
        };

        // ============================================================
        // PRODUCT MODAL
        // ============================================================
        const openProductModal = (productId = null) => {
            state.editingProductId = productId;

            const title = document.getElementById('productModalTitle');
            const form = document.getElementById('productForm');
            const idField = document.getElementById('productIdField');

            // Populate categories
            const catSelect = document.getElementById('pCategory');
            if (catSelect && state.categories.length) {
                catSelect.innerHTML = '<option value="">— اختر فئة —</option>' +
                    state.categories.map(c => `<option value="${escapeHtml(c.id)}">${c.icon || '📁'} ${escapeHtml(c.name)}</option>`).join('');
            }

            if (productId) {
                const product = state.products.find(p => p.id === productId);
                if (!product) return;

                title.innerHTML = '<i class="fas fa-edit"></i> تعديل المنتج';
                idField.value = productId;

                document.getElementById('pName').value = product.name || '';
                document.getElementById('pCas').value = product.cas_number || '';
                document.getElementById('pPurity').value = product.purity || '';
                document.getElementById('pPrice').value = product.price || '';
                document.getElementById('pUnit').value = product.unit || 'كجم';
                document.getElementById('pCategory').value = product.category_id || '';
                document.getElementById('pGrade').value = product.grade || '';
                document.getElementById('pPackaging').value = product.packaging || '';
                document.getElementById('pMoq').value = product.min_order_quantity || '';
                document.getElementById('pOrigin').value = product.origin_country || '';
                document.getElementById('pStock').value = product.stock_status || 'available';
                document.getElementById('pImage').value = product.image_url || '';
                document.getElementById('pDescription').value = product.description || '';
                document.getElementById('pMsds').value = product.msds_url || '';
                document.getElementById('pFeatured').checked = product.is_featured === true;
            } else {
                title.innerHTML = '<i class="fas fa-plus-circle"></i> إضافة منتج جديد';
                form.reset();
                idField.value = '';
            }

            document.getElementById('productModal').classList.add('show');
            setTimeout(() => document.getElementById('pName')?.focus(), 300);
        };

        const closeProductModal = () => {
            document.getElementById('productModal').classList.remove('show');
            state.editingProductId = null;
            document.getElementById('productForm')?.reset();
        };

        const saveProduct = async () => {
            if (!state.user) return;
            const btn = document.getElementById('saveProductBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';

            try {
                const name = document.getElementById('pName').value.trim();
                const price = document.getElementById('pPrice').value;
                const unit = document.getElementById('pUnit').value;

                if (!name) throw new Error('اسم المنتج مطلوب');
                if (!price || Number(price) <= 0) throw new Error('السعر مطلوب وأكبر من صفر');
                if (!unit) throw new Error('الوحدة مطلوبة');

                const categoryId = document.getElementById('pCategory').value || null;
                const categoryName = categoryId ? state.categories.find(c => c.id === categoryId)?.name : null;

                const data = {
                    supplier_id: state.user.id,
                    name: name,
                    cas_number: document.getElementById('pCas').value.trim() || null,
                    purity: document.getElementById('pPurity').value.trim() || null,
                    price: Number(price),
                    unit: unit,
                    category_id: categoryId,
                    category: categoryName,
                    grade: document.getElementById('pGrade').value || null,
                    packaging: document.getElementById('pPackaging').value.trim() || null,
                    min_order_quantity: document.getElementById('pMoq').value.trim() || null,
                    origin_country: document.getElementById('pOrigin').value.trim() || null,
                    stock_status: document.getElementById('pStock').value,
                    image_url: document.getElementById('pImage').value.trim() || null,
                    description: document.getElementById('pDescription').value.trim() || null,
                    msds_url: document.getElementById('pMsds').value.trim() || null,
                    is_featured: document.getElementById('pFeatured').checked,
                    status: 'active',
                };

                let result;
                if (state.editingProductId) {
                    result = await supabase
                        .from('products')
                        .update(data)
                        .eq('id', state.editingProductId)
                        .eq('supplier_id', state.user.id);
                } else {
                    result = await supabase.from('products').insert(data);
                }

                if (result.error) throw result.error;

                showToast('✅', 'تم الحفظ!', state.editingProductId ? 'تم تحديث المنتج' : 'تم إضافة المنتج بنجاح', null, null, 'success');
                closeProductModal();
                await fetchAllData();
                loadSection('products');

            } catch (err) {
                console.error('Save product error:', err);
                showToast('⚠️', 'خطأ', err.message || 'تعذر حفظ المنتج', null, null, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        };

        const deleteProduct = async (productId, productName) => {
            if (!confirm(`هل أنت متأكد من حذف "${productName}"؟`)) return;

            try {
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('id', productId)
                    .eq('supplier_id', state.user.id);

                if (error) throw error;

                showToast('🗑️', 'تم الحذف', `حُذف "${productName}"`, null, null, 'success');
                await fetchAllData();
                loadSection('products');
            } catch (err) {
                console.error('Delete product error:', err);
                showToast('⚠️', 'خطأ', err.message || 'تعذر الحذف', null, null, 'error');
            }
        };

        // ============================================================
        // RENDER: MY OFFERS
        // ============================================================
        const renderMyOffers = async () => {
            const main = document.getElementById('dashboardMain');
            if (!main) return;

            await fetchAllData();

            // Group by status
            const pending = state.myOffers.filter(o => o.status === 'pending' || !o.status);
            const accepted = state.myOffers.filter(o => o.status === 'accepted');
            const rejected = state.myOffers.filter(o => o.status === 'rejected');

            main.innerHTML = `
                <div class="page-header-bar animate-in">
                    <div>
                        <h1 class="page-title">
                            <i class="fas fa-hand-holding-usd"></i>
                            عروضي
                        </h1>
                        <p class="page-subtitle">كل العروض اللي قدّمتها على طلبات الشراء</p>
                    </div>
                </div>

                ${state.myOffers.length ? `
                    <!-- Pending -->
                    ${pending.length ? `
                        <div class="section-card animate-in" style="animation-delay: 0.05s;">
                            <div class="section-card-header">
                                <h2 class="section-card-title">
                                    <i class="fas fa-clock"></i>
                                    قيد المراجعة
                                    <span class="count-badge">${pending.length}</span>
                                </h2>
                            </div>
                            <div class="section-card-body">
                                <div class="item-list">
                                    ${pending.map(o => renderMyOfferRow(o)).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Accepted -->
                    ${accepted.length ? `
                        <div class="section-card animate-in" style="animation-delay: 0.1s;">
                            <div class="section-card-header">
                                <h2 class="section-card-title">
                                    <i class="fas fa-check-circle" style="color: var(--c-accent);"></i>
                                    مقبولة
                                    <span class="count-badge accent">${accepted.length}</span>
                                </h2>
                            </div>
                            <div class="section-card-body">
                                <div class="item-list">
                                    ${accepted.map(o => renderMyOfferRow(o)).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Rejected -->
                    ${rejected.length ? `
                        <div class="section-card animate-in" style="animation-delay: 0.15s;">
                            <div class="section-card-header">
                                <h2 class="section-card-title">
                                    <i class="fas fa-times-circle" style="color: var(--c-text-sub);"></i>
                                    مرفوضة
                                    <span class="count-badge">${rejected.length}</span>
                                </h2>
                            </div>
                            <div class="section-card-body">
                                <div class="item-list">
                                    ${rejected.map(o => renderMyOfferRow(o)).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                ` : `
                    <div class="section-card animate-in">
                        <div class="section-card-body">
                            <div class="empty-state">
                                <i class="fas fa-hand-holding-usd empty-icon"></i>
                                <h4>لسه مفيش عروض</h4>
                                <p>قدّم عرضك الأول على طلب شراء متاح</p>
                                <button class="btn-primary" onclick="window.switchSection('available-requests')">
                                    <i class="fas fa-bullhorn"></i> شوف الطلبات المتاحة
                                </button>
                            </div>
                        </div>
                    </div>
                `}
            `;
        };

        const renderMyOfferRow = (offer) => {
            const statusInfo = getOfferStatusInfo(offer.status);
            const req = offer.request;
            const buyer = offer.buyer;
            const buyerName = buyer?.company_name || buyer?.full_name || 'عميل';

            return `
                <div class="item-row">
                    <div class="item-icon-wrapper accent">
                        <i class="fas fa-hand-holding-usd"></i>
                    </div>
                    <div class="item-info">
                        <div class="item-title">${escapeHtml(req?.product_name || 'طلب شراء')}</div>
                        <div class="item-meta">
                            <span class="status-badge ${statusInfo.cls}">
                                <i class="fas fa-${statusInfo.icon}"></i> ${statusInfo.text}
                            </span>
                            ${req?.quantity_needed ? `<span><i class="fas fa-balance-scale"></i> ${escapeHtml(req.quantity_needed)}</span>` : ''}
                            <span><i class="fas fa-user"></i> ${escapeHtml(buyerName)}</span>
                            ${buyer?.city ? `<span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(buyer.city)}</span>` : ''}
                            <span><i class="fas fa-clock"></i> ${formatDateTime(offer.created_at)}</span>
                        </div>
                        ${offer.message ? `
                            <div style="font-size: 0.78rem; color: var(--c-text-muted); margin-top: 6px; padding: 8px 10px; background: var(--c-surface); border-radius: var(--r-sm); border-right: 3px solid var(--c-accent);">
                                <i class="fas fa-comment-dots"></i> ${escapeHtml(offer.message).substring(0, 120)}${offer.message.length > 120 ? '...' : ''}
                            </div>
                        ` : ''}
                    </div>
                    <div class="item-price-block">
                        <div class="item-price">
                            ${formatPrice(offer.price)}
                            <span class="currency">ج.م</span>
                        </div>
                        <div class="item-price-label">عرضك</div>
                    </div>
                    <div class="item-actions">
                        <a href="request-details.html?id=${encodeURIComponent(offer.request_id)}" class="item-action-btn secondary">
                            <i class="fas fa-info-circle"></i> تفاصيل الطلب
                        </a>
                        ${statusInfo.text === 'مقبول' && (buyer?.phone || buyer?.whatsapp) ? `
                            <a href="https://wa.me/${(buyer.whatsapp || buyer.phone || '').replace(/\\D/g, '').replace(/^(?!20)/, '20')}"
                               target="_blank" rel="noopener noreferrer"
                               class="item-action-btn primary">
                                <i class="fab fa-whatsapp"></i> تواصل
                            </a>
                        ` : ''}
                    </div>
                </div>
            `;
        };

        // ============================================================
        // RENDER: AVAILABLE REQUESTS
        // ============================================================
        const renderAvailableRequests = async () => {
            const main = document.getElementById('dashboardMain');
            if (!main) return;

            await fetchAllData();

            const notOffered = state.availableRequests.filter(r => !r.myOffer);
            const offered = state.availableRequests.filter(r => r.myOffer);

            main.innerHTML = `
                <div class="page-header-bar animate-in">
                    <div>
                        <h1 class="page-title">
                            <i class="fas fa-bullhorn"></i>
                            الطلبات المتاحة
                        </h1>
                        <p class="page-subtitle">طلبات شراء من عملاء — قدّم عرضك الآن</p>
                    </div>
                </div>

                ${state.availableRequests.length ? `
                    ${notOffered.length ? `
                        <div class="section-card animate-in" style="animation-delay: 0.05s;">
                            <div class="section-card-header">
                                <h2 class="section-card-title">
                                    <i class="fas fa-fire"></i>
                                    جديدة لم تقدّم عليها
                                    <span class="count-badge accent">${notOffered.length}</span>
                                </h2>
                            </div>
                            <div class="section-card-body">
                                <div class="item-list">
                                    ${notOffered.map(r => renderAvailableRequestRow(r)).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    ${offered.length ? `
                        <div class="section-card animate-in" style="animation-delay: 0.1s;">
                            <div class="section-card-header">
                                <h2 class="section-card-title">
                                    <i class="fas fa-check-circle"></i>
                                    قدّمت عليها عروض
                                    <span class="count-badge">${offered.length}</span>
                                </h2>
                            </div>
                            <div class="section-card-body">
                                <div class="item-list">
                                    ${offered.map(r => renderAvailableRequestRow(r)).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                ` : `
                    <div class="section-card animate-in">
                        <div class="section-card-body">
                            <div class="empty-state">
                                <i class="fas fa-bullhorn empty-icon"></i>
                                <h4>مفيش طلبات متاحة حالياً</h4>
                                <p>هتلاقي هنا طلبات الشراء اللي المشترين بيعملوها</p>
                                <button class="btn-primary" onclick="window.location.href='all-requests.html'">
                                    <i class="fas fa-clipboard-list"></i> تصفح كل الطلبات
                                </button>
                            </div>
                        </div>
                    </div>
                `}
            `;

            bindOverviewEvents();
        };

        const renderAvailableRequestRow = (r) => {
            const statusInfo = getRequestStatusInfo(r.status);
            const buyer = r.buyer;
            const buyerName = buyer?.company_name || buyer?.full_name || 'عميل';
            const hasOffered = !!r.myOffer;

            let budgetText = '';
            if (r.budget_min || r.budget_max) {
                const min = r.budget_min ? formatPrice(r.budget_min) : '';
                const max = r.budget_max ? formatPrice(r.budget_max) : '';
                if (min && max) budgetText = `${min} - ${max} ج.م`;
                else if (min) budgetText = `من ${min} ج.م`;
                else budgetText = `حتى ${max} ج.م`;
            }

            return `
                <div class="item-row">
                    <div class="item-icon-wrapper">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <div class="item-info">
                        <div class="item-title">📦 ${escapeHtml(r.product_name)}</div>
                        <div class="item-meta">
                            <span class="status-badge ${statusInfo.cls}">
                                <i class="fas fa-${statusInfo.icon}"></i> ${statusInfo.text}
                            </span>
                            ${r.quantity_needed ? `<span><i class="fas fa-balance-scale"></i> ${escapeHtml(r.quantity_needed)}</span>` : ''}
                            ${budgetText ? `<span><i class="fas fa-money-bill-wave"></i> ${budgetText}</span>` : ''}
                            ${r.location ? `<span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(r.location)}</span>` : ''}
                            <span><i class="fas fa-user"></i> ${escapeHtml(buyerName)}</span>
                            <span><i class="fas fa-clock"></i> ${formatDateTime(r.created_at)}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        ${hasOffered ? `
                            <span class="status-badge ${getOfferStatusInfo(r.myOffer.status).cls}">
                                <i class="fas fa-${getOfferStatusInfo(r.myOffer.status).icon}"></i>
                                عرضك: ${formatPrice(r.myOffer.price)} ج.م
                            </span>
                            <a href="request-details.html?id=${encodeURIComponent(r.id)}" class="item-action-btn secondary">
                                <i class="fas fa-info-circle"></i> التفاصيل
                            </a>
                        ` : `
                            <button class="item-action-btn primary offer-request-btn" type="button" data-request-id="${escapeHtml(r.id)}">
                                <i class="fas fa-paper-plane"></i> قدّم عرض
                            </button>
                            <a href="request-details.html?id=${encodeURIComponent(r.id)}" class="item-action-btn secondary">
                                <i class="fas fa-info-circle"></i> التفاصيل
                            </a>
                        `}
                    </div>
                </div>
            `;
        };

        // ============================================================
        // RENDER: CONTACTS
        // ============================================================
        const renderContacts = async () => {
            const main = document.getElementById('dashboardMain');
            if (!main) return;

            await fetchAllData();

            // Group stats
            const whatsappCount = state.contacts.filter(c => c.contact_type === 'whatsapp').length;
            const phoneCount = state.contacts.filter(c => c.contact_type === 'phone').length;
            const viewCount = state.contacts.filter(c => c.contact_type === 'view').length;
            const inquiryCount = state.contacts.filter(c => c.contact_type === 'inquiry' || c.contact_type === 'request_quote').length;

            main.innerHTML = `
                <div class="page-header-bar animate-in">
                    <div>
                        <h1 class="page-title">
                            <i class="fas fa-users"></i>
                            العملاء المحتملون
                        </h1>
                        <p class="page-subtitle">كل اللي تواصلوا أو شافوا منتجاتك</p>
                    </div>
                </div>

                <!-- Contact Stats -->
                <div class="stats-grid animate-in" style="animation-delay: 0.05s;">
                    <div class="stat-card" style="--stat-color: var(--c-whatsapp); --stat-bg: rgba(37, 211, 102, 0.12);">
                        <div class="stat-icon"><i class="fab fa-whatsapp"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">واتساب</div>
                            <div class="stat-value">${formatNumber(whatsappCount)}</div>
                        </div>
                    </div>
                    <div class="stat-card" style="--stat-color: var(--c-warning); --stat-bg: rgba(243, 156, 18, 0.12);">
                        <div class="stat-icon"><i class="fas fa-phone"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">اتصالات</div>
                            <div class="stat-value">${formatNumber(phoneCount)}</div>
                        </div>
                    </div>
                    <div class="stat-card" style="--stat-color: var(--c-primary-600); --stat-bg: rgba(44, 122, 184, 0.12);">
                        <div class="stat-icon"><i class="fas fa-eye"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">مشاهدات</div>
                            <div class="stat-value">${formatNumber(viewCount)}</div>
                        </div>
                    </div>
                    <div class="stat-card" style="--stat-color: var(--c-purple); --stat-bg: rgba(139, 92, 246, 0.12);">
                        <div class="stat-icon"><i class="fas fa-comment-dots"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">استفسارات</div>
                            <div class="stat-value">${formatNumber(inquiryCount)}</div>
                        </div>
                    </div>
                </div>

                <!-- Contacts Table -->
                <div class="section-card animate-in" style="animation-delay: 0.1s;">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            <i class="fas fa-list"></i>
                            آخر 100 تواصل
                            <span class="count-badge">${state.contacts.length}</span>
                        </h2>
                    </div>
                    <div class="section-card-body" style="padding: 0;">
                        ${state.contacts.length ? `
                            <div class="contacts-table-wrapper" style="margin: 0;">
                                <table class="contacts-table">
                                    <thead>
                                        <tr>
                                            <th>العميل</th>
                                            <th>المنتج</th>
                                            <th>نوع التواصل</th>
                                            <th>المدينة</th>
                                            <th>التاريخ</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${state.contacts.map(c => {
                                            const typeInfo = getContactTypeInfo(c.contact_type);
                                            const buyerName = c.buyer?.company_name || c.buyer?.full_name || 'زائر';
                                            const rawPhone = c.buyer?.phone || c.buyer?.whatsapp || '';
                                            const cleanPhone = sanitizePhone(rawPhone);
                                            const phoneWithCountry = cleanPhone
                                                ? (cleanPhone.startsWith('20') ? cleanPhone : '20' + cleanPhone)
                                                : '';

                                            return `
                                                <tr>
                                                    <td>
                                                        <div style="font-weight: 800; color: var(--c-text);">${escapeHtml(buyerName)}</div>
                                                        ${c.buyer?.is_verified ? '<span class="status-badge status-accepted" style="font-size: 0.6rem; padding: 1px 6px;">موثّق</span>' : ''}
                                                    </td>
                                                    <td>
                                                        ${c.product ? `
                                                            <a href="product-details.html?id=${encodeURIComponent(c.product_id)}" style="color: var(--c-primary-600); font-weight: 700;">
                                                                ${escapeHtml(c.product.name)}
                                                            </a>
                                                        ` : '—'}
                                                    </td>
                                                    <td>
                                                        <span class="contact-type-pill ${typeInfo.cls}">
                                                            <i class="${typeInfo.icon}"></i> ${typeInfo.text}
                                                        </span>
                                                    </td>
                                                    <td>${escapeHtml(c.buyer?.city || '—')}</td>
                                                    <td>${formatDateTime(c.contact_date)}</td>
                                                    <td>
                                                        ${phoneWithCountry && c.contact_type !== 'view' ? `
                                                            <a href="https://wa.me/${phoneWithCountry}" target="_blank" rel="noopener noreferrer"
                                                               class="item-action-btn primary" style="padding: 6px 10px; font-size: 0.72rem;">
                                                                <i class="fab fa-whatsapp"></i> تواصل
                                                            </a>
                                                        ` : ''}
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : `
                            <div class="empty-state">
                                <i class="fas fa-users empty-icon"></i>
                                <h4>لسه مفيش تواصلات</h4>
                                <p>لما العملاء يتواصلوا معاك، هتلاقيهم هنا</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        };

        // ============================================================
        // RENDER: PROFILE
        // ============================================================
        const renderProfile = () => {
            const main = document.getElementById('dashboardMain');
            if (!main) return;
            const p = state.userProfile || {};

            main.innerHTML = `
                <div class="page-header-bar animate-in">
                    <div>
                        <h1 class="page-title">
                            <i class="fas fa-user-circle"></i>
                            الملف الشخصي
                        </h1>
                        <p class="page-subtitle">بياناتك كمورد على كيماتو</p>
                    </div>
                </div>

                <div class="section-card animate-in" style="animation-delay: 0.05s;">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            <i class="fas fa-user-edit"></i>
                            البيانات الأساسية
                        </h2>
                    </div>
                    <div class="section-card-body">
                        <form id="profileForm" class="profile-form" novalidate>
                            <div class="form-group full">
                                <label for="profFullName">الاسم الكامل</label>
                                <input type="text" id="profFullName" value="${escapeHtml(p.full_name || '')}" disabled />
                            </div>
                            <div class="form-group full">
                                <label for="profCompany">اسم الشركة <span class="req">*</span></label>
                                <input type="text" id="profCompany" value="${escapeHtml(p.company_name || '')}" placeholder="اسم شركتك" />
                            </div>
                            <div class="form-group">
                                <label for="profPhone">رقم الهاتف</label>
                                <input type="tel" id="profPhone" dir="ltr" value="${escapeHtml(p.phone || '')}" placeholder="+20 1XX XXX XXXX" />
                            </div>
                            <div class="form-group">
                                <label for="profWhatsapp">واتساب</label>
                                <input type="tel" id="profWhatsapp" dir="ltr" value="${escapeHtml(p.whatsapp || '')}" placeholder="+20 1XX XXX XXXX" />
                            </div>
                            <div class="form-group">
                                <label for="profCity">المدينة</label>
                                <input type="text" id="profCity" value="${escapeHtml(p.city || '')}" placeholder="مثل: القاهرة" />
                            </div>
                            <div class="form-group">
                                <label for="profAddress">العنوان</label>
                                <input type="text" id="profAddress" value="${escapeHtml(p.address || '')}" />
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn-primary" id="saveProfileBtn">
                                    <i class="fas fa-save"></i> حفظ التعديلات
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="section-card animate-in" style="animation-delay: 0.1s;">
                    <div class="section-card-header">
                        <h2 class="section-card-title">
                            <i class="fas fa-info-circle"></i>
                            معلومات الحساب
                        </h2>
                    </div>
                    <div class="section-card-body">
                        <div style="display: grid; gap: 12px; font-size: 0.88rem;">
                            <div style="display: flex; justify-content: space-between; padding: 10px; background: var(--c-surface-2); border-radius: var(--r-md);">
                                <span style="color: var(--c-text-muted); font-weight: 700;">نوع الحساب</span>
                                <span style="font-weight: 800;">🏭 مورد</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; padding: 10px; background: var(--c-surface-2); border-radius: var(--r-md);">
                                <span style="color: var(--c-text-muted); font-weight: 700;">حالة التحقق</span>
                                <span style="font-weight: 800;">${p.is_verified ? '✅ موثّق' : '⏳ قيد التحقق'}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; padding: 10px; background: var(--c-surface-2); border-radius: var(--r-md);">
                                <span style="color: var(--c-text-muted); font-weight: 700;">تاريخ التسجيل</span>
                                <span style="font-weight: 800;">${formatDate(p.created_at)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('profileForm')?.addEventListener('submit', saveProfile);
        };

        const saveProfile = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveProfileBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';

            try {
                const updates = {
                    company_name: document.getElementById('profCompany').value.trim() || null,
                    phone: document.getElementById('profPhone').value.trim() || null,
                    whatsapp: document.getElementById('profWhatsapp').value.trim() || null,
                    city: document.getElementById('profCity').value.trim() || null,
                    address: document.getElementById('profAddress').value.trim() || null,
                };

                const { error } = await supabase
                    .from('profiles')
                    .update(updates)
                    .eq('id', state.user.id);

                if (error) throw error;

                state.userProfile = { ...state.userProfile, ...updates };
                updateUserUI();
                showToast('✅', 'تم الحفظ', 'تم تحديث بياناتك بنجاح', null, null, 'success');
            } catch (err) {
                console.error('Save profile error:', err);
                showToast('⚠️', 'خطأ', err.message || 'تعذر حفظ التعديلات', null, null, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        };

        // ============================================================
        // MODAL BINDINGS
        // ============================================================
        const initModals = () => {
            document.getElementById('closeProductModal')?.addEventListener('click', closeProductModal);
            document.getElementById('cancelProductModal')?.addEventListener('click', closeProductModal);
            document.getElementById('saveProductBtn')?.addEventListener('click', saveProduct);

            document.getElementById('productModal')?.addEventListener('click', (e) => {
                if (e.target.id === 'productModal') closeProductModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeProductModal();
                    document.getElementById('notifPanel')?.classList.remove('show');
                    document.getElementById('userDropdown')?.classList.remove('show');
                }
            });
        };

        // ============================================================
        // REALTIME
        // ============================================================
        const setupRealtime = () => {
            if (state.channel) supabase.removeChannel(state.channel);
            try {
                state.channel = supabase
                    .channel('supplier_dashboard_realtime')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'purchase_requests',
                    }, (payload) => {
                        const req = payload.new;
                        if (req.status === 'open') {
                            showToast('📢', 'طلب شراء جديد!', `مطلوب: ${req.product_name}`,
                                'قدّم عرض', 'all-requests.html', 'success');
                            loadSection(state.activeSection);
                        }
                    })
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'offers',
                        filter: `supplier_id=eq.${state.user?.id}`,
                    }, (payload) => {
                        const oldStatus = payload.old?.status;
                        const newStatus = payload.new?.status;
                        if (oldStatus !== newStatus && newStatus === 'accepted') {
                            showToast('🎉', 'مبروك!', 'تم قبول عرضك', null, null, 'success');
                        }
                        loadSection(state.activeSection);
                    })
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'supplier_contacts',
                        filter: `supplier_id=eq.${state.user?.id}`,
                    }, (payload) => {
                        const contact = payload.new;
                        if (contact.contact_type === 'whatsapp' || contact.contact_type === 'phone') {
                            showToast('💬', 'تواصل جديد!', 'عميل جديد تواصل معك', null, null, 'success');
                        }
                        loadSection(state.activeSection);
                    })
                    .subscribe();
            } catch (e) { /* silent */ }
        };

        // ============================================================
        // EXPOSE GLOBALLY
        // ============================================================
        window.switchSection = switchSection;

        // ============================================================
        // INIT
        // ============================================================
        const init = async () => {
            console.log('🚀 كيماتو | لوحة المورد');

            initTheme();
            initNavbar();
            initSidebar();
            initModals();

            const isAuthed = await checkAuthAndLoad();
            if (!isAuthed) return;

            await fetchCategories();
            await loadSection('overview');

            setupRealtime();

            console.log('✅ جاهز');
        };

        supabase.auth.onAuthStateChange(async (event) => {
            if (event === 'SIGNED_OUT') {
                window.location.href = 'index.html';
            } else if (event === 'SIGNED_IN') {
                const ok = await checkAuthAndLoad();
                if (ok) await loadSection('overview');
            }
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
