<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>كيماتو | لوحة المورد</title>
    <meta name="description" content="لوحة تحكم المورد على كيماتو — إدارة منتجاتك، عروضك، والعملاء المحتملين." />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/x-icon" href="logo.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png" />
    <link rel="apple-touch-icon" href="logo-192.png" />
    <meta name="theme-color" content="#0a2540" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://soqvhvqtpgeoxwmkvbih.supabase.co" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --c-primary-50:  #eef6fc;
            --c-primary-100: #d4e7f5;
            --c-primary-500: #2c7ab8;
            --c-primary-600: #1d5b8e;
            --c-primary-700: #144167;
            --c-primary-800: #0d2e4a;
            --c-primary-900: #0a2540;
            --c-accent:      #2ecc71;
            --c-accent-dark: #22a95c;
            --c-warning:     #f39c12;
            --c-danger:      #e74c3c;
            --c-whatsapp:    #25D366;
            --c-purple:      #8b5cf6;
            --c-verified:    #1e88e5;
            --c-request:     #e67e22;
            --c-request-dark:#d35400;
            --c-bg:          #f6f8fb;
            --c-surface:     #ffffff;
            --c-surface-2:   #f9fbfd;
            --c-border:      #e3eaf2;
            --c-text:        #0a1f33;
            --c-text-muted:  #5a6b7e;
            --c-text-sub:    #8595a8;
            --sh-sm:  0 1px 3px rgba(10, 37, 64, 0.06);
            --sh-md:  0 4px 16px rgba(10, 37, 64, 0.08);
            --sh-lg:  0 12px 32px rgba(10, 37, 64, 0.10);
            --sh-xl:  0 20px 48px rgba(10, 37, 64, 0.14);
            --r-sm: 8px;
            --r-md: 14px;
            --r-lg: 20px;
            --r-xl: 28px;
            --r-full: 999px;
            --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            --container: 1320px;
            --header-h: 68px;
            --sidebar-w: 260px;
        }

        [data-theme="dark"] {
            --c-bg:         #0a1520;
            --c-surface:    #101e2e;
            --c-surface-2:  #16273a;
            --c-border:     #1f3349;
            --c-text:       #e8eef5;
            --c-text-muted: #9fb1c4;
            --c-text-sub:   #6e8298;
            --sh-sm:  0 1px 3px rgba(0, 0, 0, 0.3);
            --sh-md:  0 4px 16px rgba(0, 0, 0, 0.35);
            --sh-lg:  0 12px 32px rgba(0, 0, 0, 0.45);
            --sh-xl:  0 20px 48px rgba(0, 0, 0, 0.55);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--c-bg);
            color: var(--c-text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--t-base), color var(--t-base);
        }
        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        a { color: inherit; text-decoration: none; }
        input, select, textarea { font-family: inherit; }

        :focus-visible { outline: 3px solid var(--c-primary-500); outline-offset: 2px; border-radius: var(--r-sm); }

        .skip-link {
            position: absolute; top: -100px; right: 16px;
            background: var(--c-primary-900); color: #fff;
            padding: 12px 20px; border-radius: var(--r-md);
            z-index: 9999; transition: top var(--t-fast);
        }
        .skip-link:focus { top: 16px; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes heartBeat { 0% { transform: scale(1); } 25% { transform: scale(1.3); } 50% { transform: scale(1); } 75% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes badgePop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }

        .animate-in { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 37, 64, 0.9);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 20px;
            height: var(--header-h);
        }
        .navbar-inner {
            max-width: var(--container); width: 100%;
            margin: 0 auto; height: 100%;
            display: flex; justify-content: space-between;
            align-items: center; gap: 16px;
        }
        .logo a { display: flex; align-items: center; gap: 10px; color: #fff; }
        .logo img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(230, 126, 34, 0.5); object-fit: cover; background: #fff; }
        .logo-text { font-weight: 800; font-size: 19px; color: #fff; white-space: nowrap; }
        .logo-text .blue { color: #5eb8ee; }
        .logo-text .gray { color: rgba(255, 255, 255, 0.6); font-weight: 400; font-size: 0.9em; }

        .nav-right { display: flex; align-items: center; gap: 10px; }

        .nav-action-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem;
            transition: all var(--t-fast);
            position: relative;
        }
        .nav-action-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }
        .nav-action-btn .notif-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--c-danger);
            color: #fff;
            min-width: 18px;
            height: 18px;
            border-radius: var(--r-full);
            font-size: 0.65rem;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid rgba(10, 37, 64, 0.9);
        }
        .nav-action-btn .notif-badge.show { display: flex; }

        .nav-user-menu { position: relative; }
        .nav-user-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 12px 5px 5px;
            border-radius: var(--r-full);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transition: all var(--t-fast);
            font-family: inherit;
        }
        .nav-user-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .nav-user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, var(--c-request), var(--c-request-dark));
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.85rem;
            text-transform: uppercase;
        }
        .nav-user-name {
            font-size: 0.82rem;
            font-weight: 700;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            background: var(--c-surface);
            border-radius: var(--r-md);
            box-shadow: var(--sh-xl);
            border: 1px solid var(--c-border);
            min-width: 220px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all var(--t-base);
            z-index: 1000;
        }
        .nav-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .nav-dropdown a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            color: var(--c-text);
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 1px solid var(--c-border);
            transition: all var(--t-fast);
        }
        .nav-dropdown a:last-child { border-bottom: none; }
        .nav-dropdown a:hover {
            background: var(--c-surface-2);
            color: var(--c-primary-600);
            padding-right: 24px;
        }
        .nav-dropdown a.logout { color: var(--c-danger); }

        .menu-toggle {
            display: none;
            width: 42px;
            height: 42px;
            border-radius: var(--r-md);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .dashboard-layout {
            max-width: var(--container);
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr var(--sidebar-w);
            gap: 24px;
            align-items: start;
        }

        /* Sidebar */
        .sidebar {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 16px;
            position: sticky;
            top: calc(var(--header-h) + 24px);
            box-shadow: var(--sh-sm);
        }

        .sidebar-title {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--c-text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 12px 10px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--r-md);
            color: var(--c-text-muted);
            font-weight: 700;
            font-size: 0.88rem;
            transition: all var(--t-fast);
            text-align: right;
            width: 100%;
            position: relative;
        }
        .sidebar-link:hover {
            background: var(--c-surface-2);
            color: var(--c-text);
        }
        .sidebar-link.active {
            background: linear-gradient(135deg, var(--c-request), var(--c-request-dark));
            color: #fff;
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.3);
        }
        .sidebar-link i {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }
        .sidebar-link .count-pill {
            margin-right: auto;
            background: var(--c-danger);
            color: #fff;
            padding: 1px 8px;
            border-radius: var(--r-full);
            font-size: 0.68rem;
            font-weight: 800;
            min-width: 22px;
            text-align: center;
        }
        .sidebar-link.active .count-pill {
            background: rgba(255, 255, 255, 0.25);
        }
        .sidebar-link:not(.active) .count-pill {
            background: var(--c-surface-2);
            color: var(--c-text-muted);
        }

        /* Verification banner */
        .verif-banner {
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.1), rgba(30, 136, 229, 0.03));
            border: 1.5px solid rgba(30, 136, 229, 0.25);
            border-radius: var(--r-md);
            padding: 12px 14px;
            margin-top: 12px;
            font-size: 0.78rem;
            color: var(--c-text);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .verif-banner .icon-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            color: var(--c-verified);
        }
        .verif-banner .icon-row i { font-size: 1rem; }
        .verif-banner a {
            color: var(--c-verified);
            font-weight: 800;
            text-decoration: underline;
            font-size: 0.78rem;
        }

        .verif-done {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1), rgba(46, 204, 113, 0.03));
            border-color: rgba(46, 204, 113, 0.25);
        }
        .verif-done .icon-row { color: var(--c-accent-dark); }

        /* Main Content */
        .dashboard-main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .page-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .page-title {
            font-size: clamp(1.3rem, 2.5vw, 1.8rem);
            font-weight: 900;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title i { color: var(--c-request); }
        .page-subtitle {
            font-size: 0.88rem;
            color: var(--c-text-muted);
            margin-top: 4px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 24px;
            border-radius: var(--r-full);
            font-weight: 700;
            font-size: 0.88rem;
            background: linear-gradient(135deg, var(--c-request), var(--c-request-dark));
            color: #fff;
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.3);
            transition: all var(--t-base);
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(230, 126, 34, 0.45);
        }

        .btn-secondary {
            padding: 11px 24px;
            border-radius: var(--r-full);
            font-weight: 700;
            font-size: 0.88rem;
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            border: 1px solid var(--c-border);
            transition: all var(--t-base);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-secondary:hover {
            background: var(--c-border);
            color: var(--c-text);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            padding: 18px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: all var(--t-base);
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--sh-md);
            border-color: var(--c-request);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--stat-color, var(--c-request));
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--r-md);
            background: var(--stat-bg, rgba(230, 126, 34, 0.12));
            color: var(--stat-color, var(--c-request));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .stat-content { flex: 1; min-width: 0; }
        .stat-label {
            font-size: 0.78rem;
            color: var(--c-text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--c-text);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .stat-value.updated { animation: pulse 0.6s ease; }
        .stat-trend {
            font-size: 0.7rem;
            color: var(--c-text-sub);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================
           SECTION CARDS
           ============================================================ */
        .section-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            overflow: hidden;
            box-shadow: var(--sh-sm);
        }

        .section-card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .section-card-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-card-title i { color: var(--c-request); }
        .section-card-title .count-badge {
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            padding: 2px 10px;
            border-radius: var(--r-full);
            font-size: 0.72rem;
            font-weight: 800;
        }
        .section-card-title .count-badge.accent {
            background: linear-gradient(135deg, var(--c-request), var(--c-request-dark));
            color: #fff;
        }

        .section-card-body { padding: 20px 22px; }

        .view-all-link {
            font-size: 0.82rem;
            color: var(--c-primary-600);
            background: var(--c-surface-2);
            padding: 7px 16px;
            border-radius: var(--r-full);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--t-fast);
            border: 1px solid var(--c-border);
        }
        .view-all-link:hover {
            background: var(--c-primary-600);
            color: #fff;
            border-color: transparent;
            transform: translateX(-3px);
        }
                /* ============================================================
           ITEM LIST / ITEM ROW
           ============================================================ */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-row {
            background: var(--c-surface-2);
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all var(--t-base);
            flex-wrap: wrap;
            position: relative;
        }
        .item-row:hover {
            border-color: var(--c-request);
            background: var(--c-surface);
            box-shadow: var(--sh-sm);
        }
        .item-row.is-new {
            border-color: var(--c-request);
            background: linear-gradient(135deg, rgba(230, 126, 34, 0.04), var(--c-surface-2));
        }
        .item-row.is-new::before {
            content: 'جديد';
            position: absolute;
            top: -8px;
            right: 16px;
            background: linear-gradient(135deg, var(--c-request), var(--c-request-dark));
            color: #fff;
            padding: 2px 10px;
            border-radius: var(--r-full);
            font-size: 0.62rem;
            font-weight: 800;
            box-shadow: 0 2px 8px rgba(230, 126, 34, 0.35);
        }

        .item-icon-wrapper {
            width: 44px;
            height: 44px;
            border-radius: var(--r-md);
            background: linear-gradient(135deg, rgba(230, 126, 34, 0.15), rgba(230, 126, 34, 0.05));
            color: var(--c-request-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            overflow: hidden;
        }
        .item-icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-icon-wrapper.accent {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.15), rgba(46, 204, 113, 0.05));
            color: var(--c-accent-dark);
        }
        .item-icon-wrapper.supplier {
            background: linear-gradient(135deg, rgba(44, 122, 184, 0.15), rgba(44, 122, 184, 0.05));
            color: var(--c-primary-600);
        }

        .item-info { flex: 1; min-width: 200px; }
        .item-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 4px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item-meta {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--c-text-sub);
            flex-wrap: wrap;
            align-items: center;
        }
        .item-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .item-meta i { font-size: 0.7rem; }
        .item-meta .highlight {
            color: var(--c-accent-dark);
            font-weight: 700;
        }

        .item-price-block { text-align: left; flex-shrink: 0; }
        .item-price {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--c-accent-dark);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        [data-theme="dark"] .item-price { color: #6ee7a0; }
        .item-price .currency {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--c-text-sub);
        }
        .item-price-label {
            font-size: 0.68rem;
            color: var(--c-text-sub);
            margin-top: 4px;
            font-weight: 700;
        }

        .item-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .item-action-btn {
            padding: 8px 14px;
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all var(--t-fast);
            border: none;
            white-space: nowrap;
            cursor: pointer;
        }
        .item-action-btn.primary {
            background: linear-gradient(135deg, var(--c-request), var(--c-request-dark));
            color: #fff;
            box-shadow: 0 2px 8px rgba(230, 126, 34, 0.25);
        }
        .item-action-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(230, 126, 34, 0.4);
        }
        .item-action-btn.secondary {
            background: var(--c-surface);
            color: var(--c-text-muted);
            border: 1px solid var(--c-border);
        }
        .item-action-btn.secondary:hover {
            background: var(--c-primary-50);
            color: var(--c-primary-600);
            border-color: var(--c-primary-500);
        }
        [data-theme="dark"] .item-action-btn.secondary:hover {
            background: rgba(44, 122, 184, 0.15);
            color: #7ec8e3;
        }
        .item-action-btn.danger {
            background: var(--c-surface);
            color: var(--c-danger);
            border: 1px solid rgba(231, 76, 60, 0.25);
        }
        .item-action-btn.danger:hover {
            background: var(--c-danger);
            color: #fff;
            border-color: var(--c-danger);
        }
        .item-action-btn.icon-only {
            width: 36px;
            height: 36px;
            padding: 0;
        }

        /* Status badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: 0.68rem;
            font-weight: 800;
        }
        .status-open { background: rgba(46, 204, 113, 0.12); color: var(--c-accent-dark); }
        .status-matched { background: rgba(44, 122, 184, 0.12); color: var(--c-primary-600); }
        .status-closed { background: rgba(0, 0, 0, 0.06); color: var(--c-text-muted); }
        .status-expired { background: rgba(231, 76, 60, 0.12); color: var(--c-danger); }
        .status-pending { background: rgba(243, 156, 18, 0.12); color: var(--c-warning); }
        .status-accepted { background: rgba(46, 204, 113, 0.15); color: var(--c-accent-dark); }
        .status-rejected { background: rgba(0, 0, 0, 0.06); color: var(--c-text-sub); }

        [data-theme="dark"] .status-open { background: rgba(46, 204, 113, 0.18); color: #6ee7a0; }
        [data-theme="dark"] .status-matched { background: rgba(44, 122, 184, 0.2); color: #7ec8e3; }
        [data-theme="dark"] .status-closed { background: rgba(255, 255, 255, 0.06); color: var(--c-text-muted); }
        [data-theme="dark"] .status-expired { background: rgba(231, 76, 60, 0.2); color: #ff9588; }
        [data-theme="dark"] .status-pending { background: rgba(243, 156, 18, 0.2); color: #f4b860; }
        [data-theme="dark"] .status-accepted { background: rgba(46, 204, 113, 0.2); color: #6ee7a0; }
        [data-theme="dark"] .status-rejected { background: rgba(255, 255, 255, 0.06); color: var(--c-text-sub); }

        /* ============================================================
           EMPTY STATES
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--c-text-muted);
        }
        .empty-state i.empty-icon {
            font-size: 3rem;
            color: var(--c-request);
            opacity: 0.35;
            margin-bottom: 14px;
            display: block;
        }
        .empty-state h4 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        .empty-state .btn-primary { margin: 0 auto; }

        /* ============================================================
           PRODUCT GRID (Mini cards)
           ============================================================ */
        .products-grid-mini {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .mini-product {
            background: var(--c-surface);
            border: 1.5px solid var(--c-border);
            border-radius: var(--r-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all var(--t-base);
            position: relative;
        }
        .mini-product:hover {
            transform: translateY(-4px);
            box-shadow: var(--sh-md);
            border-color: var(--c-request);
        }

        .mini-product-media {
            aspect-ratio: 16 / 10;
            background: linear-gradient(145deg, var(--c-surface-2), var(--c-border));
            overflow: hidden;
            position: relative;
        }
        .mini-product-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mini-product-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(145deg, var(--c-primary-50), var(--c-primary-100));
            color: var(--c-primary-700);
        }
        [data-theme="dark"] .mini-product-placeholder {
            background: linear-gradient(145deg, var(--c-surface-2), var(--c-primary-900));
            color: #7ec8e3;
        }
        .mini-product-placeholder .emoji { font-size: 2.5rem; }

        .mini-product-status-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: 0.65rem;
            font-weight: 800;
            backdrop-filter: blur(6px);
            z-index: 2;
        }
        .mini-product-status-badge.active {
            background: rgba(46, 204, 113, 0.95);
            color: #fff;
        }
        .mini-product-status-badge.inactive {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
        }
        .mini-product-status-badge.featured {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
            top: auto;
            bottom: 8px;
        }

        .mini-product-body {
            padding: 12px 14px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .mini-product-title {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--c-text);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.5em;
        }
        .mini-product-specs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 0.68rem;
        }
        .mini-product-specs span {
            background: var(--c-surface-2);
            padding: 2px 8px;
            border-radius: var(--r-sm);
            font-weight: 700;
            color: var(--c-text-muted);
            border: 1px solid var(--c-border);
        }
        .mini-product-price {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--c-accent-dark);
            font-variant-numeric: tabular-nums;
            margin-top: auto;
        }
        [data-theme="dark"] .mini-product-price { color: #6ee7a0; }
        .mini-product-price .currency {
            font-size: 0.7rem;
            color: var(--c-text-sub);
        }
        .mini-product-price.no-price {
            font-size: 0.8rem;
            color: var(--c-text-sub);
        }

        .mini-product-actions {
            display: flex;
            gap: 4px;
            padding: 0 14px 14px;
        }

        /* ============================================================
           OFFERS ACCORDION
           ============================================================ */
        .offers-accordion {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            margin-top: 0;
        }
        .offers-accordion.open {
            max-height: 2000px;
            margin-top: 14px;
        }
        .offers-accordion-inner {
            background: var(--c-surface);
            border: 1.5px dashed var(--c-border);
            border-radius: var(--r-md);
            padding: 14px;
        }

        /* ============================================================
           CONTACTS TABLE
           ============================================================ */
        .contacts-table-wrapper {
            overflow-x: auto;
            margin: 0 -22px -20px;
        }
        .contacts-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85rem;
            min-width: 700px;
        }
        .contacts-table th {
            background: var(--c-surface-2);
            padding: 12px 16px;
            text-align: right;
            font-weight: 800;
            color: var(--c-text);
            font-size: 0.78rem;
            border-bottom: 1px solid var(--c-border);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .contacts-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--c-border);
            color: var(--c-text-muted);
            vertical-align: middle;
        }
        .contacts-table tr:hover td {
            background: var(--c-surface-2);
        }
        .contacts-table tr:last-child td {
            border-bottom: none;
        }
        .contact-type-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: 0.68rem;
            font-weight: 800;
        }
        .contact-type-whatsapp { background: rgba(37, 211, 102, 0.12); color: var(--c-whatsapp); }
        .contact-type-view { background: rgba(44, 122, 184, 0.12); color: var(--c-primary-600); }
        .contact-type-phone { background: rgba(243, 156, 18, 0.12); color: var(--c-warning); }
        .contact-type-inquiry { background: rgba(139, 92, 246, 0.12); color: var(--c-purple); }
        .contact-type-request_quote { background: rgba(230, 126, 34, 0.12); color: var(--c-request-dark); }
        [data-theme="dark"] .contact-type-whatsapp { background: rgba(37, 211, 102, 0.2); }
        [data-theme="dark"] .contact-type-view { background: rgba(44, 122, 184, 0.2); }
        [data-theme="dark"] .contact-type-phone { background: rgba(243, 156, 18, 0.2); }
        [data-theme="dark"] .contact-type-inquiry { background: rgba(139, 92, 246, 0.2); }
        [data-theme="dark"] .contact-type-request_quote { background: rgba(230, 126, 34, 0.2); }

        /* ============================================================
           PROFILE FORM
           ============================================================ */
        .profile-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 720px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--c-text);
        }
        .form-group label .req { color: var(--c-danger); }
        .form-group label .hint {
            font-size: 0.72rem;
            color: var(--c-text-sub);
            font-weight: 500;
            margin-right: 4px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 11px 14px;
            border-radius: var(--r-md);
            border: 1.5px solid var(--c-border);
            background: var(--c-surface-2);
            color: var(--c-text);
            font-size: 0.9rem;
            transition: all var(--t-fast);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--c-request);
            outline: none;
            background: var(--c-surface);
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.12);
        }
        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        /* ============================================================
           NOTIFICATIONS PANEL
           ============================================================ */
        .notif-panel {
            position: fixed;
            top: calc(var(--header-h) + 12px);
            left: 24px;
            width: min(380px, calc(100vw - 32px));
            background: var(--c-surface);
            border-radius: var(--r-lg);
            box-shadow: var(--sh-xl);
            border: 1px solid var(--c-border);
            overflow: hidden;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all var(--t-base);
            max-height: 500px;
            display: flex;
            flex-direction: column;
        }
        .notif-panel.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .notif-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--c-surface-2);
        }
        .notif-header h4 {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .notif-header h4 i { color: var(--c-request); }
        .notif-mark-read {
            background: none;
            color: var(--c-primary-600);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: var(--r-sm);
            transition: all var(--t-fast);
        }
        .notif-mark-read:hover {
            background: var(--c-primary-50);
        }
        [data-theme="dark"] .notif-mark-read:hover {
            background: rgba(44, 122, 184, 0.15);
        }

        .notif-list {
            overflow-y: auto;
            flex: 1;
        }
        .notif-item {
            display: flex;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--c-border);
            transition: background var(--t-fast);
            cursor: pointer;
        }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: var(--c-surface-2); }
        .notif-item.unread {
            background: linear-gradient(90deg, rgba(230, 126, 34, 0.04), transparent);
        }
        .notif-item.unread::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--c-request);
            flex-shrink: 0;
            margin-top: 8px;
        }
        .notif-item:not(.unread)::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: transparent;
            flex-shrink: 0;
        }
        .notif-content { flex: 1; min-width: 0; }
        .notif-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--c-text);
            margin-bottom: 3px;
        }
        .notif-desc {
            font-size: 0.78rem;
            color: var(--c-text-muted);
            line-height: 1.4;
        }
        .notif-time {
            font-size: 0.7rem;
            color: var(--c-text-sub);
            margin-top: 4px;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 30, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all var(--t-base);
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: var(--c-surface);
            border-radius: var(--r-xl);
            box-shadow: var(--sh-xl);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.95) translateY(20px);
            transition: transform var(--t-base);
        }
        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--c-text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-header h3 i { color: var(--c-request); }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--t-fast);
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }
        .modal-close:hover {
            background: var(--c-danger);
            color: #fff;
        }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--c-border);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            background: var(--c-surface-2);
        }

        /* ============================================================
           SKELETON
           ============================================================ */
        .skeleton {
            background: linear-gradient(90deg, var(--c-border) 0%, var(--c-surface-2) 50%, var(--c-border) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--r-md);
        }
        .skeleton-row {
            height: 76px;
            border-radius: var(--r-md);
            margin-bottom: 12px;
        }
        .skeleton-stat {
            height: 110px;
            border-radius: var(--r-lg);
        }

        /* ============================================================
           SPINNER
           ============================================================ */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: min(420px, calc(100% - 32px));
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            color: var(--c-text);
            padding: 14px 18px;
            border-radius: var(--r-md);
            box-shadow: var(--sh-xl);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border-right: 4px solid var(--c-request);
            pointer-events: auto;
            transition: opacity var(--t-base), transform var(--t-base);
        }
        .toast.removing { opacity: 0; transform: translateX(20px); }
        .toast .toast-icon { font-size: 1.5rem; flex-shrink: 0; line-height: 1; }
        .toast .toast-content { flex: 1; min-width: 0; }
        .toast .toast-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
        .toast .toast-desc { font-size: 0.8rem; color: var(--c-text-muted); line-height: 1.4; }
        .toast .toast-close {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--c-surface-2);
            color: var(--c-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            flex-shrink: 0;
            transition: all var(--t-fast);
        }
        .toast .toast-close:hover { background: var(--c-danger); color: #fff; }
        .toast.success { border-right-color: var(--c-accent); }
        .toast.warning { border-right-color: var(--c-warning); }
        .toast.error { border-right-color: var(--c-danger); }
        .toast.info { border-right-color: var(--c-purple); }

        /* ============================================================
           MOBILE NAV
           ============================================================ */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--c-surface);
            border-top: 1px solid var(--c-border);
            box-shadow: 0 -6px 20px rgba(10, 37, 64, 0.08);
            z-index: 90;
            padding: 6px;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }
        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 4px;
            border-radius: var(--r-md);
            color: var(--c-text-sub);
            font-size: 0.65rem;
            font-weight: 700;
            transition: all var(--t-fast);
            position: relative;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .mobile-nav-item i { font-size: 1.15rem; }
        .mobile-nav-item.active {
            color: var(--c-request-dark);
            background: rgba(230, 126, 34, 0.08);
        }
        [data-theme="dark"] .mobile-nav-item.active {
            color: #ffb877;
            background: rgba(230, 126, 34, 0.15);
        }
        .mobile-nav-item .count-pill {
            position: absolute;
            top: 4px;
            right: 12px;
            background: var(--c-danger);
            color: #fff;
            padding: 0 5px;
            border-radius: var(--r-full);
            font-size: 0.6rem;
            font-weight: 800;
            min-width: 16px;
            height: 16px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .mobile-nav-item .count-pill.show { display: flex; }

        /* ============================================================
           LOGIN REQUIRED
           ============================================================ */
        .login-required-state {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            :root { --sidebar-w: 100%; }
            .dashboard-layout {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            .sidebar {
                position: static;
                display: none;
            }
            .sidebar.mobile-open {
                display: block;
                margin-bottom: 16px;
            }
            .profile-form { grid-template-columns: 1fr; }
        }

        @media (max-width: 860px) {
            .menu-toggle { display: inline-flex; }
            .nav-user-name { display: none; }
            .nav-user-btn { padding: 4px; }
            .mobile-nav { display: grid; }
            body { padding-bottom: 72px; }
        }

        @media (max-width: 640px) {
            .navbar { padding: 0 12px; }
            .dashboard-layout { padding: 12px; gap: 16px; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);

            .stat-icon {

            .stat-value { font-size: 1.3rem; }

            .section-card-header { padding: 14px 16px; }

            .item-row { padding: 12px; gap: 10px; }

            .item-title { font-size: 0.85rem; }
            .item-meta { font-size: 0.7rem; gap: 8px; }

            .item-actions {

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });

        // ============================================================
        // STATE
        // ============================================================
        const state = {
            user: null,
            userProfile: null,
            activeSection: 'overview',
            products: [],
            myOffers: [],
            availableRequests: [],
            myOffersMapByRequest: {},
            contacts: [],
            categories: [],
            notifications: [],
            stats: {
                totalProducts: 0,
                activeProducts: 0,
                totalOffers: 0,
                acceptedOffers: 0,
                totalViews: 0,
                totalContacts: 0,
                totalWhatsapp: 0,
            },
            editingProductId: null,
            channel: null,
            loadedSections: {},
        };

        const THEME_KEY = 'chemato-theme';

        // ============================================================
        // UTILS
        // ============================================================
        const escapeHtml = (str) => {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        const sanitizePhone = (p) => p ? String(p).replace(/\D/g, '') : '';
        const isValidUUID = (id) =>
            id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

        const formatNumber = (n) => Number(n || 0).toLocaleString('ar-EG');
        const formatPrice = (p) => Number(p || 0).toLocaleString('ar-EG');

        const formatDate = (dateStr) => {
            if (!dateStr) return '—';
            return new Date(dateStr).toLocaleDateString('ar-EG', {
                year: 'numeric', month: 'short', day: 'numeric',
            });
        };

        const formatDateTime = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffMin = Math.floor(diffMs / 60000);
            const diffHrs = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMin < 1) return 'الآن';
            if (diffMin < 60) return `منذ ${diffMin} د`;
            if (diffHrs < 24) return `منذ ${diffHrs} س`;
            if (diffDays < 7) return `منذ ${diffDays} يوم`;
            return formatDate(dateStr);
        };

        const getRequestStatusInfo = (status) => {
            const map = {
                'open':     { text: 'مفتوح',   cls: 'status-open',     icon: 'circle' },
                'matched':  { text: 'تمت المطابقة', cls: 'status-matched',  icon: 'check-circle' },
                'closed':   { text: 'مغلق',    cls: 'status-closed',   icon: 'lock' },
                'expired':  { text: 'منتهي',   cls: 'status-expired',  icon: 'clock' },
            };
            return map[status] || map['open'];
        };

        const getOfferStatusInfo = (status) => {
            const map = {
                'pending':  { text: 'قيد المراجعة', cls: 'status-pending',  icon: 'clock' },
                'accepted': { text: 'مقبول',       cls: 'status-accepted', icon: 'check-circle' },
                'rejected': { text: 'مرفوض',       cls: 'status-rejected', icon: 'times-circle' },
            };
            return map[status] || map['pending'];
        };

        const getContactTypeInfo = (type) => {
            const map = {
                'whatsapp':      { text: 'واتساب',    cls: 'contact-type-whatsapp',  icon: 'fab fa-whatsapp' },
                'phone':         { text: 'اتصال',      cls: 'contact-type-phone',     icon: 'fas fa-phone' },
                'view':          { text: 'مشاهدة',     cls: 'contact-type-view',      icon: 'fas fa-eye' },
                'inquiry':       { text: 'استفسار',    cls: 'contact-type-inquiry',   icon: 'fas fa-comment' },
                'request_quote': { text: 'طلب عرض',    cls: 'contact-type-request_quote', icon: 'fas fa-file-invoice' },
                'email':         { text: 'إيميل',      cls: 'contact-type-view',      icon: 'fas fa-envelope' },
            };
            return map[type] || map['view'];
        };

        // ============================================================
        // THEME
        // ============================================================
        const updateThemeIcon = (theme) => {
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        };

        const initTheme = () => {
            const saved = localStorage.getItem(THEME_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);

            document.getElementById('themeToggle')?.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem(THEME_KEY, next);
                updateThemeIcon(next);
            });
        };

        // ============================================================
        // TOAST
        // ============================================================
        const removeToast = (toast) => {
            if (!toast || !toast.parentNode) return;
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 300);
        };

        const showToast = (icon, title, desc, linkText = null, linkUrl = null, type = '') => {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const iconEl = document.createElement('div');
            iconEl.className = 'toast-icon';
            iconEl.textContent = icon;

            const content = document.createElement('div');
            content.className = 'toast-content';

            const titleEl = document.createElement('div');
            titleEl.className = 'toast-title';
            titleEl.textContent = title;

            const descEl = document.createElement('div');
            descEl.className = 'toast-desc';
            descEl.textContent = desc + (linkText ? ' ' : '');

            if (linkText && linkUrl) {
                const link = document.createElement('a');
                link.href = linkUrl;
                link.textContent = linkText;
                descEl.appendChild(link);
            }

            content.appendChild(titleEl);
            content.appendChild(descEl);

            const closeBtn = document.createElement('button');
            closeBtn.className = 'toast-close';
            closeBtn.setAttribute('aria-label', 'إغلاق');
            closeBtn.innerHTML = '<i class="fas fa-times"></i>';
            closeBtn.onclick = () => removeToast(toast);

            toast.appendChild(iconEl);
            toast.appendChild(content);
            toast.appendChild(closeBtn);
            container.appendChild(toast);

            setTimeout(() => removeToast(toast), 6000);
        };

        // ============================================================
        // AUTH GUARD
        // ============================================================
        const checkAuthAndLoad = async () => {
            const { data: { user } } = await supabase.auth.getUser();

            if (!user) {
                renderLoginRequired();
                return false;
            }

            state.user = user;

            const { data: profile } = await supabase
                .from('profiles')
                .select('id, full_name, company_name, phone, whatsapp, city, address, user_type, is_verified, avatar_url, created_at, commercial_register, tax_id')
                .eq('id', user.id)
                .single();

            state.userProfile = profile;

            // Verify user is a supplier
            if (profile?.user_type !== 'supplier') {
                showToast('⚠️', 'تنبيه', 'هذه اللوحة للموردين. جاري تحويلك...', null, null, 'warning');
                setTimeout(() => window.location.href = 'buyer-dashboard.html', 1500);
                return false;
            }

            updateUserUI();
            renderVerifBanner();
            return true;
        };

        const renderLoginRequired = () => {
            const main = document.getElementById('dashboardMain');
            if (main) {
                main.innerHTML = `
                    <div class="login-required-state">
                        <div class="big-icon">
                            <i class="fas fa-warehouse"></i>
                        </div>
                        <h2>سجّل دخولك كمورد</h2>
                        <p>عشان تدير منتجاتك، عروضك، والعملاء المحتملين، لازم تسجّل دخولك كمورد.</p>
                        <div class="login-required-actions">
                            <a href="auth.html?redirect=supplier-dashboard" class="btn-primary">
                                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                            </a>
                            <a href="auth.html?type=supplier" class="btn-secondary">
                                <i class="fas fa-user-plus"></i> حساب مورد جديد
                            </a>
                        </div>
                    </div>
                `;
            }
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.style.display = 'none';
            const mobileNav = document.getElementById('mobileNav');
            if (mobileNav) mobileNav.style.display = 'none';
        };

        const updateUserUI = () => {
            const p = state.userProfile;
            if (!p) return;

            const name = p.company_name || p.full_name || 'مورد';
            const initial = name.charAt(0).toUpperCase();

            const avatarEl = document.getElementById('userAvatar');
            const nameEl = document.getElementById('userName');
            if (avatarEl) avatarEl.textContent = initial;
            if (nameEl) nameEl.textContent = name;
        };

        const renderVerifBanner = () => {
            const slot = document.getElementById('verifBannerSlot');
            if (!slot) return;
            const p = state.userProfile;

            if (p?.is_verified) {
                slot.innerHTML = `
                    <div class="verif-banner verif-done">
                        <div class="icon-row">
                            <i class="fas fa-check-circle"></i>
                            حساب موثّق
                        </div>
                        <div>حسابك موثّق، عملاؤك يثقون بك أكثر.</div>
                    </div>
                `;
            } else {
                slot.innerHTML = `
                    <div class="verif-banner">
                        <div class="icon-row">
                            <i class="fas fa-shield-alt"></i>
                            اطلب توثيق حسابك
                        </div>
                        <div>الحسابات الموثّقة تحصل على مشاهدات أكثر بـ 3 أضعاف.</div>
                        <a href="#" id="requestVerifBtn">كيف أتوثّق؟ ←</a>
                    </div>
                `;
                document.getElementById('requestVerifBtn')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    showToast('📞', 'للتوثيق', 'تواصل معنا عبر واتساب لإرسال السجل التجاري',
                        'تواصل', 'https://wa.me/201000000000', 'info');
                });
            }
        };

        // ============================================================
        // NAVBAR
        // ============================================================
        const initNavbar = () => {
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            menuToggle?.addEventListener('click', () => {
                sidebar?.classList.toggle('mobile-open');
            });

            const userBtn = document.getElementById('userMenuBtn');
            const userDropdown = document.getElementById('userDropdown');
            userBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                userDropdown?.classList.toggle('show');
                userBtn.setAttribute('aria-expanded', userDropdown?.classList.contains('show'));
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.nav-user-menu')) {
                    userDropdown?.classList.remove('show');
                    userBtn?.setAttribute('aria-expanded', 'false');
                }
                if (!e.target.closest('#notifPanel') && !e.target.closest('#notifBtn')) {
                    document.getElementById('notifPanel')?.classList.remove('show');
                }
            });

            document.getElementById('dropdownProfile')?.addEventListener('click', (e) => {
                e.preventDefault();
                switchSection('profile');
                userDropdown?.classList.remove('show');
            });

            document.getElementById('dropdownLogout')?.addEventListener('click', async (e) => {
                e.preventDefault();
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            });

            document.getElementById('notifBtn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('notifPanel')?.classList.toggle('show');
            });
            document.getElementById('notifMarkRead')?.addEventListener('click', () => {
                markAllNotificationsRead();
            });
        };

        // ============================================================
        // SECTION NAVIGATION
        // ============================================================
        const switchSection = (section) => {
            state.activeSection = section;

            document.querySelectorAll('.sidebar-link').forEach(link => {
                const isActive = link.dataset.section === section;
                link.classList.toggle('active', isActive);
                link.setAttribute('aria-selected', isActive);
            });

            document.querySelectorAll('.mobile-nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.section === section);
            });

            document.getElementById('sidebar')?.classList.remove('mobile-open');

            loadSection(section);
        };

        const initSidebar = () => {
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.addEventListener('click', () => switchSection(link.dataset.section));
            });
            document.querySelectorAll('.mobile-nav-item').forEach(item => {
                item.addEventListener('click', () => switchSection(item.dataset.section));
            });
        };

        const loadSection = async (section) => {
            const main = document.getElementById('dashboardMain');
            if (!main) return;

            if (!state.loadedSections[section]) {
                main.innerHTML = `
                    <div class="skeleton skeleton-row" style="height: 60px;"></div>
                    <div class="stats-grid">
                        <div class="skeleton skeleton-stat"></div>
                        <div class="skeleton skeleton-stat"></div>
                        <div class="skeleton skeleton-stat"></div>
                        <div class="skeleton skeleton-stat"></div>
                    </div>
                    <div class="skeleton skeleton-row"></div>
                    <div class="skeleton skeleton-row"></div>
                `;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });

            switch (section) {
                case 'overview': await renderOverview(); break;
                case 'products': await renderProducts(); break;
                case 'my-offers': await renderMyOffers(); break;
                case 'available-requests': await renderAvailableRequests(); break;
                case 'contacts': await renderContacts(); break;
                case 'profile': renderProfile(); break;
                default: renderOverview();
            }

            state.loadedSections[section] = true;
        };

        // ============================================================
        // FETCHERS
        // ============================================================
        const fetchMyProducts = async () => {
            if (!state.user) return [];
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .eq('supplier_id', state.user.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                return data || [];
            } catch (e) {
                console.error('Fetch products error:', e);
                return [];
            }
        };

        const fetchMyOffers = async () => {
            if (!state.user) return [];
            try {
                const { data, error } = await supabase
                    .from('offers')
                    .select('*')
                    .eq('supplier_id', state.user.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                const offers = data || [];

                // Fetch related requests
                const requestIds = [...new Set(offers.map(o => o.request_id).filter(Boolean))];
                if (requestIds.length) {
                    const { data: requests } = await supabase
                        .from('purchase_requests')
                        .select('id, product_name, quantity_needed, buyer_id, status, location, budget_min, budget_max, created_at')
                        .in('id', requestIds);

                    const requestsMap = {};
                    (requests || []).forEach(r => { requestsMap[r.id] = r; });

                    // Fetch buyers info
                    const buyerIds = [...new Set((requests || []).map(r => r.buyer_id).filter(Boolean))];
                    const buyersMap = {};
                    if (buyerIds.length) {
                        const { data: buyers } = await supabase
                            .from('profiles')
                            .select('id, full_name, company_name, city, is_verified, phone, whatsapp')
                            .in('id', buyerIds);
                        (buyers || []).forEach(b => { buyersMap[b.id] = b; });
                    }

                    return offers.map(o => ({
                        ...o,
                        request: requestsMap[o.request_id] || null,
                        buyer: requestsMap[o.request_id] ? (buyersMap[requestsMap[o.request_id].buyer_id] || null) : null,
                    }));
                }

                return offers;
            } catch (e) {
                console.error('Fetch offers error:', e);
                return [];
            }
        };

        const fetchAvailableRequests = async () => {
            if (!state.user) return [];
            try {
                const { data: requests, error } = await supabase
                    .from('purchase_requests')
                    .select('id, product_name, quantity_needed, category, location, budget_min, budget_max, deadline, description, buyer_id, status, views_count, created_at')
                    .eq('status', 'open')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;
                if (!requests?.length) return [];

                // Fetch buyers
                const buyerIds = [...new Set(requests.map(r => r.buyer_id).filter(Boolean))];
                const buyersMap = {};
                if (buyerIds.length) {
                    const { data: buyers } = await supabase
                        .from('profiles')
                        .select('id, full_name, company_name, city, is_verified')
                        .in('id', buyerIds);
                    (buyers || []).forEach(b => { buyersMap[b.id] = b; });
                }

                // Check which requests I've already offered on
                const myOffers = await fetchMyOffers();
                const myOffersByRequest = {};
                myOffers.forEach(o => { myOffersByRequest[o.request_id] = o; });

                return requests.map(r => ({
                    ...r,
                    buyer: buyersMap[r.buyer_id] || null,
                    myOffer: myOffersByRequest[r.id] || null,
                }));
            } catch (e) {
                console.error('Fetch available requests error:', e);
                return [];
            }
        };

        const fetchContacts = async () => {
            if (!state.user) return [];
            try {
                const { data: contacts, error } = await supabase
                    .from('supplier_contacts')
                    .select('*')
                    .eq('supplier_id', state.user.id)
                    .order('contact_date', { ascending: false })
                    .limit(100);

                if (error) throw error;
                if (!contacts?.length) return [];

                // Fetch product names
                const productIds = [...new Set(contacts.map(c => c.product_id).filter(Boolean))];
                const productsMap = {};
                if (productIds.length) {
                    const { data: products } = await supabase
                        .from('products')
                        .select('id, name')
                        .in('id', productIds);
                    (products || []).forEach(p => { productsMap[p.id] = p; });
                }

                // Fetch buyers
                const buyerIds = [...new Set(contacts.map(c => c.buyer_id).filter(Boolean))];
                const buyersMap = {};
                if (buyerIds.length) {
                    const { data: buyers } = await supabase
                        .from('profiles')
                        .select('id, full_name, company_name, phone, whatsapp, city, is_verified')
                        .in('id', buyerIds);
                    (buyers || []).forEach(b => { buyersMap[b.id] = b; });
                }

                return contacts.map(c => ({
                    ...c,
                    product: productsMap[c.product_id] || null,
                    buyer: buyersMap[c.buyer_id] || null,
                }));
            } catch (e) {
                console.error('Fetch contacts error:', e);
                return [];
            }
        };

        const fetchCategories = async () => {
            try {
                const { data } = await supabase
                    .from('categories')
                    .select('id, name, icon')
                    .order('display_order');
                state.categories = data || [];
            } catch (e) {
                state.categories = [];
            }
        };

        const fetchAllData = async () => {
            if (!state.user) return;

            const [products, myOffers, availableRequests, contacts] = await Promise.all([
                fetchMyProducts(),
                fetchMyOffers(),
                fetchAvailableRequests(),
                fetchContacts(),
            ]);

            state.products = products;
            state.myOffers = myOffers;
            state.availableRequests = availableRequests;
            state.contacts = contacts;

            // Calculate stats
            const totalViews = products.reduce((sum, p) => sum + (p.views || 0), 0);
            const totalContacts = contacts.length;
            const totalWhatsapp = contacts.filter(c => c.contact_type === 'whatsapp').length;
            const acceptedOffers = myOffers.filter(o => o.status === 'accepted').length;

            state.stats = {
                totalProducts: products.length,
                activeProducts: products.filter(p => p.status === 'active').length,
                totalOffers: myOffers.length,
                acceptedOffers,
                totalViews,
                totalContacts,
                totalWhatsapp,
            };

            updateSidebarCounts();
            buildNotifications();
        };

        const updateSidebarCounts = () => {
            const els = {
                sidebarProductsCount: state.stats.totalProducts,
                sidebarOffersCount: state.stats.totalOffers,
