<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>غير متصل | كيماتو</title>
<style>
body{font-family:'Cairo',system-ui,sans-serif;background:#f6f8fb;color:#0a1f33;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
.card{background:#fff;padding:48px 32px;border-radius:28px;box-shadow:0 20px 48px rgba(10,37,64,0.14);max-width:440px;width:100%}
.icon{font-size:4rem;margin-bottom:20px}
h1{font-size:1.5rem;color:#0a2540;margin-bottom:12px}
p{color:#5a6b7e;line-height:1.7;margin-bottom:24px}
button{background:linear-gradient(135deg,#2ecc71,#22a95c);color:#fff;border:none;padding:14px 32px;border-radius:999px;font-weight:800;font-size:1rem;cursor:pointer;transition:transform 0.2s}
button:active{transform:scale(0.96)}
</style>
</head>
<body>
<div class="card">
<div class="icon">🔌</div>
<h1>أنت غير متصل بالإنترنت</h1>
<p>لا تقلق، يمكنك تصفح الصفحات التي زرتها سابقاً. يرجى التحقق من اتصالك بالإنترنت.</p>
<button onclick="location.reload()">إعادة المحاولة</button>
</div>
</body>
</html>
