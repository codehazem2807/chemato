    <style>
        :root {
            --c-primary-50:  #eef6fc;
            --c-primary-100: #d4e7f5;
            --c-primary-500: #2c7ab8;
            --c-primary-600: #1d5b8e;
            --c-primary-700: #144167;
            --c-primary-800: #0d2e4a;
            --c-primary-900: #0a2540;
            --c-accent:      #2ecc71;
            --c-accent-dark: #22a95c;
            --c-warning:     #f39c12;
            --c-danger:      #e74c3c;
            --c-whatsapp:    #25D366;
            --c-purple:      #8b5cf6;
            --c-verified:    #1e88e5;
            --c-bg:          #f6f8fb;
            --c-surface:     #ffffff;
            --c-surface-2:   #f9fbfd;
            --c-border:      #e3eaf2;
            --c-text:        #0a1f33;
            --c-text-muted:  #5a6b7e;
            --c-text-sub:    #8595a8;
            --sh-sm:  0 1px 3px rgba(10, 37, 64, 0.06);
            --sh-md:  0 4px 16px rgba(10, 37, 64, 0.08);
            --sh-lg:  0 12px 32px rgba(10, 37, 64, 0.10);
            --sh-xl:  0 20px 48px rgba(10, 37, 64, 0.14);
            --r-sm: 8px;
            --r-md: 14px;
            --r-lg: 20px;
            --r-xl: 28px;
            --r-full: 999px;
            --t-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --t-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            --container: 1320px;
            --header-h: 68px;
        }

        [data-theme="dark"] {
            --c-bg:         #0a1520;
            --c-surface:    #101e2e;
            --c-surface-2:  #16273a;
            --c-border:     #1f3349;
            --c-text:       #e8eef5;
            --c-text-muted: #9fb1c4;
            --c-text-sub:   #6e8298;
            --sh-sm:  0 1px 3px rgba(0, 0, 0, 0.3);
            --sh-md:  0 4px 16px rgba(0, 0, 0, 0.35);
            --sh-lg:  0 12px 32px rgba(0, 0, 0, 0.45);
            --sh-xl:  0 20px 48px rgba(0, 0, 0, 0.55);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background: var(--c-bg);
            color: var(--c-text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color var(--t-base), color var(--t-base);
        }

        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        a { color: inherit; text-decoration: none; }
        input, select, textarea { font-family: inherit; }

        :focus-visible {
            outline: 3px solid var(--c-primary-500);
            outline-offset: 2px;
            border-radius: var(--r-sm);
        }

        .skip-link {
            position: absolute; top: -100px; right: 16px;
            background: var(--c-primary-900); color: #fff;
            padding: 12px 20px; border-radius: var(--r-md);
            z-index: 9999; transition: top var(--t-fast);
        }
        .skip-link:focus { top: 16px; }

        .reading-progress {
            position: fixed;
            top: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--c-verified), var(--c-accent));
            z-index: 9999;
            width: 0;
            transition: width 0.1s linear;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .animate-in { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 37, 64, 0.88);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 24px;
            height: var(--header-h);
        }
        .navbar-inner {
            max-width: var(--container); width: 100%;
            margin: 0 auto; height: 100%;
            display: flex; justify-content: space-between;
            align-items: center; gap: 16px;
        }
        .logo a { display: flex; align-items: center; gap: 10px; color: #fff; }
        .logo img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(30, 136, 229, 0.5); object-fit: cover; background: #fff; }
        .logo-text { font-weight: 800; font-size: 19px; color: #fff; white-space: nowrap; }
        .logo-text .blue { color: #5eb8ee; }
        .logo-text .gray { color: rgba(255, 255, 255, 0.6); font-weight: 400; font-size: 0.9em; }

        .nav-links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .nav-links a, .dropdown-btn {
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: var(--r-full);
            font-weight: 600; font-size: 0.88rem;
            transition: all var(--t-fast);
            display: inline-flex; align-items: center; gap: 6px;
            background: transparent;
        }
        .nav-links a:hover, .dropdown-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-links a.active { background: rgba(30, 136, 229, 0.18); color: #7ec8e3; }

        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem; transition: all var(--t-fast);
        }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.15); transform: rotate(15deg); }

        .dropdown { position: relative; }
        .dropdown-content {
            position: absolute; top: calc(100% + 8px); left: 0;
            background: var(--c-surface); min-width: 220px;
            border-radius: var(--r-md); box-shadow: var(--sh-xl);
            border: 1px solid var(--c-border); overflow: hidden;
            opacity: 0; visibility: hidden;
            transform: translateY(-8px);
            transition: all var(--t-base); z-index: 1000;
        }
        .dropdown-content.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-content a {
            color: var(--c-text); padding: 12px 18px;
            display: flex; align-items: center; gap: 10px;
            font-size: 0.9rem; font-weight: 500;
            border-bottom: 1px solid var(--c-border);
            transition: all var(--t-fast);
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background: var(--c-surface-2); color: var(--c-primary-600); padding-right: 24px; }
        .dropdown-content a.logout { color: var(--c-danger); }

        .menu-toggle {
            display: none; width: 42px; height: 42px;
            border-radius: var(--r-md);
            background: rgba(255, 255, 255, 0.08); color: #fff;
            align-items: center; justify-content: center; font-size: 1.1rem;
        }

        /* ============================================================
           MAIN
           ============================================================ */
        .main-container { max-width: var(--container); margin: 0 auto; padding: 20px 24px 60px; }

        /* ============================================================
           HERO
           ============================================================ */
        .hero {
            position: relative;
            border-radius: var(--r-xl);
            padding: 48px 40px 40px;
            overflow: hidden;
            background:
                radial-gradient(ellipse at top right, rgba(30, 136, 229, 0.22), transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(139, 92, 246, 0.12), transparent 50%),
                linear-gradient(135deg, #0a1f3a 0%, #1a2942 100%);
            color: #fff;
            box-shadow: var(--sh-xl);
            text-align: center;
            margin-bottom: 24px;
        }
        .hero::before {
            content: '';
            position: absolute; inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle at 80% 60%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px, 60px 60px;
            pointer-events: none;
        }
        .hero-bg-icons {
            position: absolute; inset: 0;
            overflow: hidden; pointer-events: none; z-index: 0;
        }
        .hero-bg-icons .icon-float {
            position: absolute; font-size: 2.4rem;
            opacity: 0.08; animation: float 6s ease-in-out infinite;
        }
        .hero-bg-icons .icon-float.rotate { animation: rotateSlow 30s linear infinite; }
        .hero-bg-icons .icon-float:nth-child(1) { top: 12%; left: 6%; font-size: 3rem; animation-delay: 0s; }
        .hero-bg-icons .icon-float:nth-child(2) { top: 18%; right: 8%; font-size: 3.6rem; animation-delay: 1s; }
        .hero-bg-icons .icon-float:nth-child(3) { bottom: 30%; left: 10%; font-size: 2.6rem; animation-delay: 2s; }
        .hero-bg-icons .icon-float:nth-child(4) { bottom: 12%; right: 6%; font-size: 3rem; animation-delay: 0.5s; }
        .hero-bg-icons .icon-float:nth-child(5) { top: 50%; left: 50%; font-size: 5rem; animation-delay: 1.5s; opacity: 0.04; }
        .hero-bg-icons .icon-float:nth-child(6) { top: 6%; left: 32%; font-size: 1.8rem; animation-delay: 2.5s; }

        .hero-content { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(30, 136, 229, 0.18);
            border: 1px solid rgba(30, 136, 229, 0.35);
            color: #7ec8e3; padding: 6px 16px;
            border-radius: var(--r-full);
            font-size: 0.78rem; font-weight: 700;
            margin-bottom: 18px;
        }
        .hero-badge .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--c-verified);
            box-shadow: 0 0 0 4px rgba(30, 136, 229, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        .hero h1 {
            font-size: clamp(1.7rem, 4.5vw, 2.6rem);
            font-weight: 900; line-height: 1.15;
            margin-bottom: 14px; letter-spacing: -0.5px;
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, #7ec8e3 0%, #b794f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .hero p.subtitle {
            font-size: clamp(0.95rem, 1.6vw, 1.1rem);
            color: rgba(255, 255, 255, 0.8);
            max-width: 640px; margin: 0 auto 24px; line-height: 1.65;
        }

        /* Search */
        .search-wrapper {
            background: var(--c-surface);
            border-radius: var(--r-full);
            padding: 5px;
            display: flex;
            gap: 6px;
            box-shadow: var(--sh-lg);
            border: 2px solid transparent;
            transition: all var(--t-base);
            max-width: 640px;
            margin: 0 auto;
        }
        .search-wrapper:focus-within {
            border-color: var(--c-verified);
            box-shadow: 0 12px 40px rgba(30, 136, 229, 0.25);
        }
        .search-icon {
            padding: 0 8px 0 20px;
            color: var(--c-text-sub);
            font-size: 1rem;
            align-self: center;
            flex-shrink: 0;
        }
        .search-wrapper input {
            flex: 1;
            padding: 14px 4px;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--c-text);
            outline: none;
            min-width: 0;
        }
        .search-wrapper input::placeholder { color: var(--c-text-sub); }
        .search-clear {
            padding: 0 12px;
            color: var(--c-text-sub);
            font-size: 0.9rem;
            display: none;
            align-items: center;
            transition: color var(--t-fast);
        }
        .search-clear.visible { display: flex; }
        .search-clear:hover { color: var(--c-danger); }
        .search-btn {
            background: linear-gradient(135deg, var(--c-verified), var(--c-primary-700));
            color: #fff;
            padding: 0 26px;
            border-radius: var(--r-full);
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--t-base);
            min-height: 48px;
            flex-shrink: 0;
        }
        .search-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(30, 136, 229, 0.4);
        }

        /* ============================================================
           FILTERS
           ============================================================ */
        .filters-section {
            margin-bottom: 24px;
        }
        .filters-label {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--c-text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-chip {
            background: var(--c-surface);
            padding: 8px 18px;
            border-radius: var(--r-full);
            cursor: pointer;
            transition: all var(--t-fast);
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--c-text-muted);
            border: 1.5px solid var(--c-border);
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .filter-chip:hover {
            border-color: var(--c-verified);
            color: var(--c-verified);
            transform: translateY(-2px);
        }
        .filter-chip.active {
            background: linear-gradient(135deg, var(--c-verified), var(--c-primary-700));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(30, 136, 229, 0.3);
        }

        /* ============================================================
           FEATURED SECTION
           ============================================================ */
        .featured-section {
            position: relative;
            border-radius: var(--r-xl);
            padding: 24px;
            margin-bottom: 28px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.06), rgba(139, 92, 246, 0.02));
            border: 1.5px solid rgba(139, 92, 246, 0.2);
        }
        [data-theme="dark"] .featured-section {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0.02));
        }
        .featured-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding-right: 14px;
            border-right: 4px solid var(--c-purple);
        }
        .featured-header i {
            color: var(--c-purple);
            font-size: 1.3rem;
        }
        .featured-header h2 {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--c-text);
        }
        .featured-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 18px;
        }
        .featured-main {
            background: var(--c-surface);
            border-radius: var(--r-lg);
            overflow: hidden;
            border: 1.5px solid var(--c-border);
            transition: all var(--t-base);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .featured-main:hover {
            transform: translateY(-4px);
            box-shadow: var(--sh-lg);
            border-color: var(--c-purple);
        }
        .featured-main-media {
            aspect-ratio: 16 / 9;
            background: linear-gradient(145deg, var(--c-primary-50), var(--c-primary-100));
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .featured-main-media {
            background: linear-gradient(145deg, var(--c-surface-2), var(--c-primary-900));
        }
        .featured-main-media img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform var(--t-slow);
        }
        .featured-main:hover .featured-main-media img { transform: scale(1.05); }
        .featured-main-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 5rem;
        }
        .featured-main-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: linear-gradient(135deg, var(--c-purple), #7c3aed);
            color: #fff;
            padding: 5px 14px;
            border-radius: var(--r-full);
            font-size: 0.68rem;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .featured-main-body {
            padding: 20px 24px 24px;
        }
        .featured-main-category {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--c-primary-50);
            color: var(--c-primary-700);
            padding: 3px 12px;
            border-radius: var(--r-full);
            font-size: 0.7rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        [data-theme="dark"] .featured-main-category {
            background: rgba(44, 122, 184, 0.15);
            color: #7ec8e3;
        }
        .featured-main-title {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--c-text);
            line-height: 1.3;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .featured-main-excerpt {
            font-size: 0.9rem;
            color: var(--c-text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .featured-side {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .featured-mini {
            background: var(--c-surface);
            border-radius: var(--r-md);
            border: 1.5px solid var(--c-border);
            overflow: hidden;
            transition: all var(--t-fast);
            cursor: pointer;
            display: flex;
            gap: 12px;
            padding: 10px;
            align-items: center;
        }
        .featured-mini:hover {
            border-color: var(--c-purple);
            transform: translateX(-3px);
        }
        .featured-mini-media {
            width: 70px;
            height: 70px;
            border-radius: var(--r-sm);
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(145deg, var(--c-primary-50), var(--c-primary-100));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }
        [data-theme="dark"] .featured-mini-media {
            background: linear-gradient(145deg, var(--c-surface-2), var(--c-primary-900));
        }
        .featured-mini-media img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .featured-mini-body {
            flex: 1;
            min-width: 0;
        }
        .featured-mini-title {
