<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>كيماتو | طلبات العميل</title>
    
    <meta name="description" content="استعرض طلبات الشراء الخاصة بالعميل على منصة كيماتو" />
    <meta name="robots" content="index, follow" />
    
    <link rel="icon" type="image/x-icon" href="logo.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <meta name="theme-color" content="#0c2d4a" />
    
    <meta property="og:title" content="كيماتو | طلبات الشراء" />
    <meta property="og:description" content="استعرض طلبات الشراء على منصة كيماتو" />
    <meta property="og:type" content="website" />
    <meta property="og:url" id="ogUrl" content="" />
    <meta property="og:image" content="https://chemato.vercel.app/logo.png" />
    
    <link rel="canonical" id="canonicalUrl" href="" />
    
    <link rel="preconnect" href="https://soqvhvqtpgeoxwmkvbih.supabase.co" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-dark: #0c2d4a;
            --primary: #1a4a6e;
            --primary-light: #2d7a9e;
            --accent: #3498db;
            --accent-dark: #2c81ba;
            --gray-light: #f8fafc;
            --gray: #e2e8f0;
            --gray-dark: #64748b;
            --text-dark: #0c2d4a;
            --text-light: #475569;
            --white: #ffffff;
            --danger: #e53e3e;
            --success: #2a9d8f;
            --warning: #f4a261;
            --whatsapp: #25D366;
            --chat: #8b5cf6;
            --chat-dark: #7c3aed;
            --verified: #1e88e5;
            --request: #e67e22;
            --request-dark: #d35400;
            --shadow-sm: 0 4px 12px rgba(12,45,74,0.05);
            --shadow-md: 0 10px 25px rgba(12,45,74,0.08);
            --shadow-lg: 0 20px 40px rgba(12,45,74,0.12);
            --shadow-xl: 0 24px 64px rgba(12,45,74,0.18);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
            --r-full: 999px;
        }

        [data-theme="dark"] {
            --gray-light: #101e2e;
            --gray: #1f3349;
            --gray-dark: #9fb1c4;
            --text-dark: #e8eef5;
            --text-light: #a0aec0;
            --white: #16213e;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.5);
            --shadow-xl: 0 24px 64px rgba(0,0,0,0.6);
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2eaf2 100%);
            min-height: 100vh;
            color: var(--text-dark);
            transition: background 0.3s, color 0.3s;
        }
        [data-theme="dark"] body {
            background: linear-gradient(145deg, #0a1520 0%, #0a1a2a 100%);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes dropFade {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes onlinePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
        }

        .skeleton-card {
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            height: 280px;
            border-radius: var(--radius-md);
        }
        [data-theme="dark"] .skeleton-card {
            background: linear-gradient(90deg, #2a2a3e 25%, #3a3a4e 50%, #2a2a3e 75%);
            background-size: 200% 100%;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(12,45,74,0.25);
            border-bottom: 2px solid rgba(52,152,219,0.30);
        }

        .logo a { text-decoration: none; }
        .logo-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 22px;
        }
        .logo-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #3498db;
            object-fit: cover;
            background: #fff;
        }
        .logo-text span:first-child { color: #3498db; }
        .logo-text span:last-child { color: #b0c9d9; font-size: 16px; }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 7px 18px;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-btn {
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 7px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 14px;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .dropdown-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--white);
            min-width: 220px;
            box-shadow: var(--shadow-xl);
            border-radius: 20px;
            z-index: 1000;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid rgba(52,152,219,0.15);
        }
        .dropdown-content.show {
            display: block;
            animation: dropFade 0.25s ease;
        }
        .dropdown-content a {
            color: var(--text-dark);
            padding: 12px 22px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid var(--gray);
            transition: 0.2s;
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover {
            background: #ebf5fb;
            color: var(--primary);
            padding-right: 28px;
        }
        .dropdown-content .logout-item {
            color: var(--danger);
            border-top: 1px solid var(--gray);
        }
        .dropdown-content .logout-item:hover {
            background: #fee2e2;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* PROFILE HEADER */
        .profile-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-radius: var(--radius-lg);
            padding: 38px 42px;
            margin-bottom: 30px;
            color: white;
            display: flex;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s ease;
        }
        .profile-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255,255,255,0.05) 1px, transparent 1px),
                radial-gradient(circle at 85% 70%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px, 60px 60px;
            pointer-events: none;
        }
        .profile-header::after {
            content: "🛒";
            position: absolute;
            font-size: 12rem;
            opacity: 0.04;
            left: -20px;
            bottom: -60px;
            animation: pulse 8s ease-in-out infinite;
        }

        .profile-avatar-wrap {
            position: relative;
            flex-shrink: 0;
            z-index: 2;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 900;
            color: white;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            border: 4px solid rgba(255,255,255,0.22);
            overflow: hidden;
            position: relative;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-online-dot {
            position: absolute;
            bottom: 4px;
            left: 4px;
            width: 20px;
            height: 20px;
            background: #2ecc71;
            border-radius: 50%;
            border: 3px solid var(--primary-dark);
            z-index: 3;
            animation: onlinePulse 2s ease-in-out infinite;
        }

        .profile-info {
            flex: 1;
            min-width: 250px;
            position: relative;
            z-index: 1;
        }

        .profile-info h1 {
            font-size: 1.9rem;
            font-weight: 900;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .verified-badge-inline {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--verified), var(--primary));
            color: #fff;
            padding: 3px 12px;
            border-radius: var(--r-full);
            box-shadow: 0 2px 8px rgba(30,136,229,0.4);
        }

        .profile-info .sub {
            opacity: 0.85;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-info .sub i { opacity: 0.8; }

        .profile-stats {
            display: flex;
            gap: 30px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            color: rgba(255,255,255,0.85);
        }
        .stat-item .number {
            font-size: 1.6rem;
            font-weight: 900;
            color: white;
            display: block;
            font-variant-numeric: tabular-nums;
        }
        .stat-item .label {
            font-size: 0.75rem;
            opacity: 0.75;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            text-decoration: none;
            color: white;
            white-space: nowrap;
        }

        .btn-chat-profile {
            background: linear-gradient(135deg, var(--chat), var(--chat-dark));
            box-shadow: 0 4px 16px rgba(139,92,246,0.4);
        }
        .btn-chat-profile:hover {
            background: linear-gradient(135deg, var(--chat-dark), #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139,92,246,0.55);
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            box-shadow: 0 4px 16px rgba(37,211,102,0.3);
        }
        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }

        .btn-share {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-share:hover {
            background: rgba(255,255,255,0.28);
            transform: translateY(-2px);
        }

        .btn-back {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-2px);
        }

        /* SEARCH & FILTER BAR */
        .search-filter-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            background: var(--white);
            padding: 12px 18px;
            border-radius: 60px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(52,152,219,0.06);
            align-items: center;
        }

        .search-input-wrapper {
            flex: 1;
            display: flex;
            background: var(--gray-light);
            border-radius: 50px;
            overflow: hidden;
            border: 1px solid var(--gray);
            min-width: 200px;
            transition: all var(--t-fast, 0.15s);
        }
        .search-input-wrapper:focus-within {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.12);
        }

        .search-input {
            flex: 1;
            padding: 10px 18px;
            border: none;
            font-size: 0.95rem;
            background: transparent;
            outline: none;
            font-family: inherit;
            color: var(--text-dark);
        }
        .search-input::placeholder { color: var(--gray-dark); opacity: 0.7; }

        .search-btn {
            background: linear-gradient(145deg, #3498db, #2c81ba);
            border: none;
            padding: 0 22px;
            cursor: pointer;
            color: white;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .search-btn:hover {
            background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
        }

        .filter-select {
            padding: 10px 18px;
            border: 1px solid var(--gray);
            border-radius: 50px;
            background: var(--white);
            cursor: pointer;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
            color: var(--text-dark);
            min-width: 160px;
            transition: 0.3s;
        }
        .filter-select:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52,152,219,0.15);
        }

        /* SECTION TITLE */
        .section-title {
            font-size: 1.3rem;
            color: var(--text-dark);
            margin-bottom: 20px;
            border-right: 4px solid #3498db;
            padding-right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }
        .section-title i { color: #3498db; }
        .section-title .count-pill {
            background: var(--gray-light);
            color: var(--gray-dark);
            padding: 2px 12px;
            border-radius: var(--r-full);
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* REQUESTS GRID */
        .requests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .request-card {
            background: var(--white);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.15,0.75,0.45,1);
            border: 1px solid rgba(52,152,219,0.06);
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }
        .request-card.is-own {
            border-color: var(--success);
            border-width: 2px;
            position: relative;
        }
        .request-card.is-own::before {
            content: '✋ طلبك';
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--success);
            color: #fff;
            padding: 3px 12px;
            border-radius: var(--r-full);
            font-size: 0.65rem;
            font-weight: 800;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(42,157,143,0.4);
        }

        .request-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: #3498db;
        }

        .request-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 18px 20px;
            color: white;
            position: relative;
        }

        .request-status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-open { background: #2a9d8f; color: white; }
        .status-matched { background: #f4a261; color: var(--text-dark); }
        .status-closed { background: #64748b; color: white; }
        .status-expired { background: #e53e3e; color: white; }
        .status-pending { background: #f39c12; color: white; }

        .request-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 10px 0 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.35;
        }
        .request-date {
            font-size: 11px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .request-cas {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            color: #c9b8ff;
            background: rgba(139, 92, 246, 0.25);
            padding: 2px 8px;
            border-radius: 8px;
            direction: ltr;
            letter-spacing: 0.3px;
            margin-top: 6px;
        }

        .request-info {
            padding: 18px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .request-detail {
            margin: 6px 0;
            color: var(--text-light);
            display: flex;
            gap: 10px;
            align-items: baseline;
            font-size: 14px;
        }
        .request-detail i {
            width: 22px;
            color: var(--primary);
            flex-shrink: 0;
        }
        .request-detail strong { color: var(--text-dark); font-weight: 700; }

        .request-budget {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(42,157,143,0.1);
            color: #2a9d8f;
            padding: 5px 12px;
            border-radius: var(--r-full);
            font-size: 0.8rem;
            font-weight: 800;
            align-self: flex-start;
            margin-top: 6px;
        }
        [data-theme="dark"] .request-budget {
            background: rgba(42,157,143,0.18);
            color: #6ee7b7;
        }

        .request-description {
            background: var(--gray-light);
            padding: 10px 14px;
            border-radius: 16px;
            margin: 10px 0 12px;
            font-size: 13px;
            color: var(--gray-dark);
            line-height: 1.6;
            border-right: 3px solid #3498db;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* DAYS LEFT */
        .days-left {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 6px;
            align-self: flex-start;
        }
        .days-left.urgent { background: #fee2e2; color: #dc2626; }
        .days-left.normal { background: #fef3c7; color: #d4880f; }
        .days-left.safe { background: #c6f6d5; color: #22543d; }
        [data-theme="dark"] .days-left.urgent { background: rgba(220,38,38,0.2); color: #fca5a5; }
        [data-theme="dark"] .days-left.normal { background: rgba(212,136,15,0.2); color: #fbbf24; }
        [data-theme="dark"] .days-left.safe { background: rgba(34,84,61,0.3); color: #6ee7b7; }

        /* CARD ACTIONS */
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--gray);
            flex-wrap: wrap;
        }

        .btn-action {
            flex: 1;
            min-height: 42px;
            padding: 9px 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s;
            text-decoration: none;
            border: none;
            white-space: nowrap;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-details {
            background: var(--primary-dark);
            color: #fff;
        }
        .btn-details:hover { background: var(--primary); transform: translateY(-2px); }

        /* 🆕 زر تواصل عبر الموقع */
        .btn-chat {
            background: linear-gradient(135deg, var(--chat), var(--chat-dark));
            color: #fff;
            box-shadow: 0 4px 12px rgba(139,92,246,0.25);
        }
        .btn-chat:hover {
            background: linear-gradient(135deg, var(--chat-dark), #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139,92,246,0.45);
        }

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    })

    const urlParams = new URLSearchParams(window.location.search)
    const buyerId = urlParams.get('id')

    let buyerData = null
    let buyerRequests = []
    let currentUser = null
    let currentSearch = ''
    let currentStatus = 'all'

    const THEME_KEY = 'chemato-theme'

    // ============================================================
    // UTILS
    // ============================================================
    const escapeHtml = (str) => {
        if (str === null || str === undefined) return ''
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;')
    }

    const formatNumber = (n) => Number(n || 0).toLocaleString('ar-EG')

    const isValidUUID = (id) => id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)

    const isUserOnline = (lastSeen) => {
        if (!lastSeen) return false
        const diff = Date.now() - new Date(lastSeen).getTime()
        return diff < 15 * 60 * 1000
    }

    const buildMessageUrl = (userId) => {
        const params = new URLSearchParams({ to: userId })
        return `messages.html?${params.toString()}`
    }

    const debounce = (fn, delay = 400) => {
        let timer
        return (...args) => {
            clearTimeout(timer)
            timer = setTimeout(() => fn(...args), delay)
        }
    }

    // ============================================================
    // THEME
    // ============================================================
    const initTheme = () => {
        const saved = localStorage.getItem(THEME_KEY)
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = saved || (prefersDark ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
    }

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(icon, title, desc, type = 'info') {
        const container = document.getElementById('toastContainer')
        if (!container) return
        const toast = document.createElement('div')
        toast.className = `toast ${type}`
        toast.innerHTML = `
            <div class="icon">${icon}</div>
            <div class="content">
                <div class="title">${escapeHtml(title)}</div>
                <div class="desc">${escapeHtml(desc)}</div>
            </div>
            <button class="close" type="button">✕</button>
        `
        toast.querySelector('.close').onclick = () => toast.remove()
        container.appendChild(toast)
        setTimeout(() => toast.remove(), 5000)
    }

    // ============================================================
    // SHARE
    // ============================================================
    window.shareProfile = function() {
        const name = buyerData?.full_name || 'عميل'
        const url = window.location.href
        if (navigator.share) {
            navigator.share({
                title: `طلبات ${name} على كيماتو`,
                text: `استعرض طلبات ${name} على منصة كيماتو`,
                url: url
            }).catch(() => {})
        } else {
            navigator.clipboard.writeText(url).then(() => {
                showToast('📋', 'تم النسخ!', 'تم نسخ رابط البروفايل', 'success')
            }).catch(() => {
                showToast('⚠️', 'خطأ', 'تعذر نسخ الرابط', 'error')
            })
        }
    }

    // ============================================================
    // SCROLL TOP
    // ============================================================
    function setupScrollTop() {
        const btn = document.getElementById('scrollTopBtn')
        if (!btn) return
        const onScroll = () => btn.classList.toggle('visible', window.scrollY > 400)
        window.addEventListener('scroll', onScroll, { passive: true })
        onScroll()
        btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }))
    }

    // ============================================================
    // DROPDOWN
    // ============================================================
    function setupDropdown() {
        const toggle = document.getElementById('dropdownToggle')
        const content = document.getElementById('dropdownContent')
        if (toggle && content) {
            toggle.addEventListener('click', (e) => {
                e.stopPropagation()
                content.classList.toggle('show')
            })
            document.addEventListener('click', () => content.classList.remove('show'))
        }
    }

    async function updateDropdownContent() {
        const { data: { user } } = await supabase.auth.getUser()
        currentUser = user
        const dropdownContent = document.getElementById('dropdownContent')
        if (!dropdownContent) return

        if (user) {
            const { data: profile } = await supabase
                .from('profiles')
                .select('user_type')
                .eq('id', user.id)
                .single()

            dropdownContent.innerHTML = `
                <a href="messages.html"><i class="fas fa-comments"></i> المحادثات</a>
                <a href="profile.html"><i class="fas fa-user"></i> الملف الشخصي</a>
                ${profile?.user_type === 'supplier' ? '<a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> لوحة المورد</a>' : ''}
                ${profile?.user_type === 'buyer' ? '<a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> لوحة العميل</a>' : ''}
                <a href="#" id="logoutLink" class="logout-item"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
            `
            document.getElementById('logoutLink')?.addEventListener('click', async (e) => {
                e.preventDefault()
                await supabase.auth.signOut()
                window.location.href = 'index.html'
            })
        } else {
            dropdownContent.innerHTML = `
                <a href="auth.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
                <a href="auth.html"><i class="fas fa-user-plus"></i> حساب جديد</a>
                <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> للموردين</a>
                <a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> للعملاء</a>
            `
        }
    }

    // ============================================================
    // WHATSAPP
    // ============================================================
    function getWhatsAppLink(phone, name) {
        if (!phone) return ''
        const clean = String(phone).replace(/\D/g, '')
        const formatted = clean.startsWith('20') ? clean : `20${clean}`
        const message = `مرحباً، أنا مهتم بطلباتكم على منصة كيماتو`
        return `https://wa.me/${formatted}?text=${encodeURIComponent(message)}`
    }

    // ============================================================
    // DAYS LEFT
    // ============================================================
    function getDaysLeft(deadline) {
        if (!deadline) return ''
        const now = new Date()
        const end = new Date(deadline)
        const diff = Math.ceil((end - now) / (1000 * 60 * 60 * 24))
        
        if (diff < 0) return `<span class="days-left urgent">⏰ انتهى الموعد</span>`
        if (diff === 0) return `<span class="days-left urgent">⏳ اليوم الأخير</span>`
        if (diff <= 3) return `<span class="days-left urgent">⏳ ${diff} أيام متبقية</span>`
        if (diff <= 7) return `<span class="days-left normal">⏳ ${diff} أيام متبقية</span>`
        return `<span class="days-left safe">⏳ ${diff} يوم متبقي</span>`
    }

    // ============================================================
    // LOAD PROFILE
    // ============================================================
    async function loadProfile() {
        if (!buyerId || !isValidUUID(buyerId)) {
            showToast('⚠️', 'خطأ', 'لم يتم تحديد العميل بشكل صحيح', 'error')
            const el = document.getElementById('profileName')
            if (el) el.textContent = 'لم يتم تحديد العميل'
            return
        }

        try {
            const { data: buyer, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', buyerId)
                .single()

            if (error || !buyer) {
                showToast('❌', 'خطأ', 'لم نتمكن من العثور على العميل', 'error')
                const el = document.getElementById('profileName')
                if (el) el.textContent = 'عميل غير موجود'
                return
            }

            buyerData = buyer

            const colors = ['#1a4a6e', '#2d7a9e', '#3a8aaa', '#1a5f7a', '#4a7a9e', '#6a4a9e']
            const colorIndex = (buyer.full_name?.length || 0) % colors.length
            const avatarColor = colors[colorIndex]
            const initial = buyer.full_name?.charAt(0)?.toUpperCase() || 'م'

            // Avatar
            const avatarEl = document.getElementById('profileAvatar')
            if (avatarEl) {
                if (buyer.avatar_url && /^https?:\/\//i.test(buyer.avatar_url)) {
                    avatarEl.innerHTML = `<img src="${escapeHtml(buyer.avatar_url)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${initial}';" />`
                    avatarEl.style.background = avatarColor
                } else {
                    avatarEl.textContent = initial
                    avatarEl.style.background = avatarColor
                }
            }

            // Online dot
            const onlineDot = document.getElementById('avatarOnlineDot')
            if (onlineDot) {
                onlineDot.style.display = isUserOnline(buyer.last_seen) ? 'block' : 'none'
            }

            // Name + verified badge
            const nameEl = document.getElementById('profileName')
            if (nameEl) {
                const verifiedBadge = buyer.is_verified === true
                    ? '<span class="verified-badge-inline"><i class="fas fa-check-circle"></i> موثّق</span>'
                    : ''
                nameEl.innerHTML = `${escapeHtml(buyer.full_name || 'عميل')} ${verifiedBadge}`
            }

            // Chat button
            const chatBtn = document.getElementById('chatBtn')
            if (chatBtn) {
                const isSelf = currentUser && currentUser.id === buyerId
                if (isSelf) {
                    chatBtn.style.display = 'none'
                } else {
                    chatBtn.href = buildMessageUrl(buyerId)
                    chatBtn.style.display = 'inline-flex'
                }
            }

            // WhatsApp button
            const whatsappBtn = document.getElementById('whatsappBtn')
            if (whatsappBtn) {
                const link = getWhatsAppLink(buyer.phone || buyer.whatsapp, buyer.full_name)
                if (link) {
                    whatsappBtn.href = link
                    whatsappBtn.style.display = 'inline-flex'
                } else {
                    whatsappBtn.style.display = 'none'
                }
            }

            document.title = `${buyer.full_name || 'عميل'} | طلبات العميل - كيماتو`

            await loadRequests()
        } catch (e) {
            console.error('Error loading profile:', e)
            showToast('❌', 'خطأ', 'حدث خطأ أثناء تحميل البيانات', 'error')
        }
    }

    // ============================================================
    // LOAD REQUESTS
    // ============================================================
    async function loadRequests() {
        const container = document.getElementById('requestsContainer')
        if (!container) return
        
        // Show skeleton
        container.innerHTML = `
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        `

        try {
            let query = supabase
                .from('purchase_requests')
                .select('*')
                .eq('buyer_id', buyerId)
                .order('created_at', { ascending: false })

            if (currentSearch) {
                query = query.ilike('product_name', `%${currentSearch}%`)
            }

            if (currentStatus !== 'all') {
                query = query.eq('status', currentStatus)
            }

            const { data: requests, error } = await query

            if (error) {
                console.error('Load requests error:', error)
                showToast('❌', 'خطأ', 'تعذر تحميل الطلبات', 'error')
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:#e74c3c;"></i>
                        <h3>حدث خطأ</h3>
                        <p>لم نتمكن من تحميل الطلبات</p>
                    </div>
                `
                return
            }

            buyerRequests = requests || []

            // Update stats (always show total counts regardless of filter)
            if (!currentSearch && currentStatus === 'all') {
                const total = buyerRequests.length
                const open = buyerRequests.filter(r => r.status === 'open').length
                const matched = buyerRequests.filter(r => r.status === 'matched').length

                document.getElementById('totalRequests').textContent = formatNumber(total)
                document.getElementById('openRequests').textContent = formatNumber(open)
                document.getElementById('matchedRequests').textContent = formatNumber(matched)
            }

            // Update count pill
            const countPill = document.getElementById('requestsCountPill')
            if (countPill) countPill.textContent = formatNumber(buyerRequests.length)

            if (buyerRequests.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>لا توجد طلبات شراء</h3>
                        <p>${currentSearch || currentStatus !== 'all' 
                            ? 'لا توجد نتائج تطابق معايير البحث' 
                            : 'هذا العميل لم يضف أي طلبات حتى الآن'}</p>
                        ${(currentUser && currentUser.id === buyerId) ? `
                            <a href="index.html?action=rfq" class="btn-create">
                                <i class="fas fa-plus-circle"></i> أنشئ طلب شراء جديد
                            </a>
                        ` : ''}
                    </div>
                `
                return
            }

            const statusMap = {
                'open': { class: 'status-open', text: '🟢 مفتوح' },
                'pending': { class: 'status-pending', text: '🟡 قيد المراجعة' },
                'matched': { class: 'status-matched', text: '🟠 تم التوفيق' },
                'closed': { class: 'status-closed', text: '🔴 مغلق' },
                'expired': { class: 'status-expired', text: '⏰ منتهي' }
            }

            const isSelf = currentUser && currentUser.id === buyerId
            const whatsappLink = getWhatsAppLink(buyerData?.phone, buyerData?.full_name)
            const chatUrl = buildMessageUrl(buyerId)

            container.innerHTML = buyerRequests.map((r, index) => {
                // Budget display
                let budgetHtml = ''
                if (r.budget_min || r.budget_max) {
                    const min = r.budget_min ? formatNumber(r.budget_min) : ''
                    const max = r.budget_max ? formatNumber(r.budget_max) : ''
                    const display = min && max ? `${min} - ${max} ج.م` : min ? `من ${min} ج.م` : `حتى ${max} ج.م`
                    budgetHtml = `<div class="request-budget"><i class="fas fa-money-bill-wave"></i> ${display}</div>`
                }

                // CAS number
                const casHtml = r.cas_number
                    ? `<span class="request-cas"><i class="fas fa-hashtag"></i> CAS ${escapeHtml(r.cas_number)}</span>`
                    : ''

                return `
                    <div class="request-card ${isSelf ? 'is-own' : ''}" style="animation-delay:${(index % 6) * 0.05}s;">
                        <div class="request-header">
                            <span class="request-status ${statusMap[r.status]?.class || 'status-open'}">${statusMap[r.status]?.text || '🟢 مفتوح'}</span>
                            <div class="request-title">📦 ${escapeHtml(r.product_name || 'طلب')}</div>
                            <div class="request-date"><i class="fas fa-calendar-alt"></i> ${new Date(r.created_at).toLocaleDateString('ar-EG')}</div>
                            ${casHtml}
                        </div>
                        <div class="request-info">
                            <div class="request-detail">
                                <i class="fas fa-balance-scale"></i>
                                <span><strong>الكمية:</strong> ${escapeHtml(r.quantity_needed || 'غير محدد')}</span>
                            </div>
                            ${r.deadline ? `
                                <div class="request-detail">
                                    <i class="fas fa-calendar-times"></i>
                                    <span><strong>آخر موعد:</strong> ${new Date(r.deadline).toLocaleDateString('ar-EG')}</span>
                                </div>
                                ${getDaysLeft(r.deadline)}
                            ` : ''}
                            ${budgetHtml}
                            ${r.description ? `
                                <div class="request-description">
                                    <i class="fas fa-align-right" style="margin-left:6px;"></i>
                                    ${escapeHtml(r.description)}
                                </div>
                            ` : ''}
                            
                            <div class="card-actions">
                                <a href="request-details.html?id=${encodeURIComponent(r.id)}" class="btn-action btn-details">
                                    <i class="fas fa-info-circle"></i> تفاصيل
                                </a>
                                
                                ${!isSelf ? `
                                    <a href="${chatUrl}" class="btn-action btn-chat" data-action="chat" title="تواصل عبر الموقع">
                                        <i class="fas fa-comments"></i> تواصل
                                    </a>
                                ` : ''}
                                
                                ${whatsappLink && !isSelf ? `
                                    <a href="${whatsappLink}" target="_blank" rel="noopener noreferrer" class="btn-action btn-wa">
                                        <i class="fab fa-whatsapp"></i> واتساب
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `
            }).join('')

        } catch (e) {
            console.error('Error loading requests:', e)
            container.innerHTML = `
                <div class="empty-state" style="border:2px solid #e74c3c;">
                    <i class="fas fa-exclamation-triangle" style="color:#e74c3c;"></i>
                    <h3>حدث خطأ</h3>
                    <p>لم نتمكن من تحميل الطلبات</p>
                </div>
            `
        }
    }

    // ============================================================
    // CHAT BUTTON HANDLER
    // ============================================================
    function initChatHandler() {
        document.addEventListener('click', (e) => {
            const chatBtn = e.target.closest('[data-action="chat"]')
            if (!chatBtn) return

            if (!currentUser) {
                e.preventDefault()
                showToast('🔐', 'سجّل دخولك', 'لازم تسجل دخول للتواصل عبر الموقع', 'warning')
                const chatUrl = chatBtn.getAttribute('href')
                setTimeout(() => {
                    window.location.href = `auth.html?redirect=${encodeURIComponent(chatUrl)}`
                }, 1200)
                return
            }

            showToast('💬', 'جاري فتح المحادثة', 'يتم تحويلك لصفحة المحادثات...', 'info')
        })
    }

    // ============================================================
    // SEARCH EVENTS
    // ============================================================
    function initSearch() {
        const input = document.getElementById('searchInput')
        
        const performSearch = () => {
            currentSearch = (input?.value || '').trim().slice(0, 100)
            loadRequests()
        }
        
        const debouncedSearch = debounce(performSearch, 500)
        
        document.getElementById('searchBtn')?.addEventListener('click', performSearch)
        
        input?.addEventListener('input', debouncedSearch)
        
        input?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault()
                performSearch()
            }
        })

        document.getElementById('statusFilter')?.addEventListener('change', (e) => {
            currentStatus = e.target.value
            loadRequests()
        })
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
        console.log('🚀 كيماتو | طلبات العميل')

        initTheme()
        setupDropdown()
        setupScrollTop()
        initSearch()
        initChatHandler()

        await updateDropdownContent()
        await loadProfile()

        console.log('✅ جاهز')
    }

    supabase.auth.onAuthStateChange(() => {
        updateDropdownContent().then(() => {
            // Re-render requests to update is-self flag & chat buttons
            if (buyerData) {
                const chatBtn = document.getElementById('chatBtn')
                if (chatBtn && currentUser) {
                    const isSelf = currentUser.id === buyerId
                    chatBtn.style.display = isSelf ? 'none' : 'inline-flex'
                }
            }
        })
    })

    init()
</script>
</body>
</html>
