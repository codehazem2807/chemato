<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيماتو | جميع طلبات الشراء</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Tahoma', sans-serif;
        }

        body {
            background: #f0f4f8;
        }

        .navbar {
            background: linear-gradient(135deg, #0a2f2f, #1b6b6b);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: #ffb347;
            color: #1e2a3e;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-header {
            background: white;
            border-radius: 32px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .page-header h1 {
            color: #0a2f2f;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .search-filter-bar {
            background: white;
            border-radius: 60px;
            padding: 10px 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input-wrapper {
            flex: 2;
            display: flex;
            background: #f8fafc;
            border-radius: 50px;
            overflow: hidden;
        }

        .search-input {
            flex: 1;
            padding: 16px 20px;
            border: none;
            font-size: 1rem;
            background: transparent;
            outline: none;
        }

        .search-btn {
            background: #ffb347;
            border: none;
            padding: 0 25px;
            cursor: pointer;
        }

        .requests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .request-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .request-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 35px rgba(0,0,0,0.15);
        }

        .request-info {
            padding: 22px;
        }

        .request-badge {
            display: inline-block;
            background: #c6f6d5;
            color: #22543d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-bottom: 10px;
        }

        .request-title {
            color: #0a2f2f;
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        .request-detail {
            margin: 10px 0;
            color: #475569;
            display: flex;
            gap: 10px;
            align-items: baseline;
        }

        .request-detail i {
            width: 25px;
            color: #1a5f5f;
        }

        .btn-offer {
            width: 100%;
            background: #ffb347;
            color: #1e2a3e;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-offer:hover {
            background: #1a5f5f;
            color: white;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 10px 18px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            cursor: pointer;
        }

        .pagination button.active {
            background: #ffb347;
            border-color: #ffb347;
        }

        .footer {
            background: #0a2f2f;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .search-filter-bar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/" style="text-decoration:none;">
    <div style="display:flex;align-items:center;gap:12px;font-family:'Cairo',sans-serif;font-weight:700;font-size:22px;color:#0f172a;cursor:pointer;transition:all .3s ease;">
        <img src="https://scontent.fcai19-5.fna.fbcdn.net/v/t39.30808-6/709548215_2209434319875128_7640925248715427952_n.jpg?_nc_cat=101&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=hhCEJVn_ItwQ7kNvwE1RoKX&_nc_oc=AdoFrDGRfx8kM33l7aB2X-xe-cpIlVPSBffMzDpuuaaNY0IK_xSxp2kH4A7bRMUC030&_nc_zt=23&_nc_ht=scontent.fcai19-5.fna&_nc_gid=eVsIN6W69tJnSD81wCmsAA&_nc_ss=7b2a8&oh=00_Af6F7JJvo7lXyrTp6fVmFtTxAbbtNjjryJ5K5MfYjzFuaQ&oe=6A206BBC"
             alt="Chemato"
             style="width:55px;height:55px;border-radius:50%;border:3px solid #2563eb;box-shadow:0 4px 12px rgba(37,99,235,.25);object-fit:cover;">
        <span>
            <span style="color:#2563eb;">كيماتو</span>
            <span style="color:#64748b;">| سوق المواد الكيماوية</span>
        </span>
    </div>
</a>

    <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="all-products.html">جميع المنتجات</a>
        <a href="all-requests.html">جميع الطلبات</a>
        <a href="auth.html">دخول</a>
    </div>
</div>

<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-clipboard-list"></i> جميع طلبات الشراء</h1>
        <p>استعرض أحدث طلبات شراء المواد الكيماوية من العملاء في مصر</p>
        <div id="resultsCount" style="color: #1a5f5f; margin-top: 10px;"></div>
    </div>

    <div class="search-filter-bar">
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث باسم المادة المطلوبة...">
            <button id="searchBtn" class="search-btn"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <div id="requestsContainer" class="requests-grid">
        <div class="loader" style="text-align: center; padding: 60px;">⏳ جاري تحميل الطلبات...</div>
    </div>

    <div id="pagination" class="pagination"></div>
</div>

<div class="footer">
    <p>© جميع الحقوق محفوظة Hazem Mohamady 2026 | كيماتو - سوق المواد الكيماوية في مصر</p>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    
    let currentPage = 1
    const itemsPerPage = 12
    let totalCount = 0
    let currentSearch = ''
    
    async function loadRequests() {
        let query = supabase
            .from('purchase_requests')
            .select('*, profiles(full_name, company_name, phone)', { count: 'exact' })
            .eq('status', 'open')
        
        if (currentSearch) {
            query = query.ilike('product_name', `%${currentSearch}%`)
        }
        
        const from = (currentPage - 1) * itemsPerPage
        const to = from + itemsPerPage - 1
        
        const { data, error, count } = await query
            .order('created_at', { ascending: false })
            .range(from, to)
        
        if (error) {
            document.getElementById('requestsContainer').innerHTML = `<div class="no-results">❌ خطأ: ${error.message}</div>`
            return
        }
        
        totalCount = count || 0
        document.getElementById('resultsCount').innerHTML = `📊 عرض ${data.length} من ${totalCount} طلب شراء`
        
        if (!data || data.length === 0) {
            document.getElementById('requestsContainer').innerHTML = `
                <div class="no-results" style="text-align: center; padding: 80px; background: white; border-radius: 32px;">
                    <i class="fas fa-inbox" style="font-size: 50px; color: #cbd5e1;"></i>
                    <h3>لا توجد طلبات شراء</h3>
                    <p>لم نجد أي طلبات شراء تطابق معايير البحث</p>
                </div>
            `
            document.getElementById('pagination').innerHTML = ''
            return
        }
        
        document.getElementById('requestsContainer').innerHTML = data.map(r => `
            <div class="request-card" onclick="window.location.href='request-details.html?id=${r.id}'">
                <div class="request-info">
                    <span class="request-badge"><i class="fas fa-clock"></i> ${new Date(r.created_at).toLocaleDateString('ar-EG')}</span>
                    <h3 class="request-title">📦 مطلوب: ${r.product_name}</h3>
                    <div class="request-detail"><i class="fas fa-balance-scale"></i> الكمية: ${r.quantity_needed || 'غير محدد'}</div>
                    <div class="request-detail"><i class="fas fa-align-right"></i> ${r.description?.substring(0, 80) || 'لا توجد مواصفات'}${r.description?.length > 80 ? '...' : ''}</div>
                    <div class="request-detail"><i class="fas fa-building"></i> عميل: ${r.profiles?.company_name || r.profiles?.full_name || 'عميل'}</div>
                    <button class="btn-offer" onclick="event.stopPropagation(); window.location.href='request-details.html?id=${r.id}'">
                        <i class="fas fa-tag"></i> تقديم عرض لهذا الطلب
                    </button>
                </div>
            </div>
        `).join('')
        
        // ترقيم الصفحات
        const totalPages = Math.ceil(totalCount / itemsPerPage)
        let paginationHtml = ''
        paginationHtml += `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>« الأول</button>`
        paginationHtml += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ السابق</button>`
        
        let startPage = Math.max(1, currentPage - 2)
        let endPage = Math.min(totalPages, currentPage + 2)
        
        for (let i = startPage; i <= endPage; i++) {
            paginationHtml += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`
        }
        
        paginationHtml += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}>التالي ›</button>`
        paginationHtml += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}>الأخير »</button>`
        
        document.getElementById('pagination').innerHTML = paginationHtml
    }
    
    window.goToPage = function(page) {
        if (page < 1) return
        const totalPages = Math.ceil(totalCount / itemsPerPage)
        if (page > totalPages) return
        currentPage = page
        loadRequests()
        window.scrollTo({ top: 0, behavior: 'smooth' })
    }
    
    document.getElementById('searchBtn').addEventListener('click', () => {
        currentSearch = document.getElementById('searchInput').value.trim()
        currentPage = 1
        loadRequests()
    })
    
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            currentSearch = document.getElementById('searchInput').value.trim()
            currentPage = 1
            loadRequests()
        }
    })
    
    loadRequests()
</script>
</body>
</html>
