<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>كيماتو | تفاصيل الطلب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0c2d4a;
            --primary: #1a4a6e;
            --primary-light: #2d7a9e;
            --accent: #3498db;
            --accent-dark: #2c81ba;
            --gray-light: #f8fafc;
            --gray: #e2e8f0;
            --gray-dark: #64748b;
            --text-dark: #0c2d4a;
            --text-light: #475569;
            --white: #ffffff;
            --danger: #e53e3e;
            --success: #2a9d8f;
            --warning: #f4a261;
            --whatsapp: #25D366;
            --whatsapp-dark: #128C7E;
            --shadow-sm: 0 4px 12px rgba(12,45,74,0.05);
            --shadow-md: 0 10px 25px rgba(12,45,74,0.08);
            --shadow-lg: 0 20px 40px rgba(12,45,74,0.12);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #e2eaf2 100%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* ========== الهيدر ========== */
        .navbar {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(12,45,74,0.25);
            border-bottom: 2px solid rgba(52,152,219,0.30);
        }

        .logo a {
            text-decoration: none;
        }

        .logo-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 22px;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #3498db;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(52,152,219,0.35);
        }

        .logo-text span:first-child { color: #3498db; }
        .logo-text span:last-child { color: #b0c9d9; font-size: 16px; }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
        }

        .nav-links a:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        /* ========== القائمة المنسدلة ========== */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 14px;
            font-family: inherit;
        }

        .dropdown-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.35);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            min-width: 200px;
            box-shadow: 0 24px 56px rgba(0,0,0,0.12);
            border-radius: 20px;
            z-index: 1000;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid rgba(52,152,219,0.15);
        }

        .dropdown-content.show {
            display: block;
            animation: dropFade 0.25s ease;
        }

        @keyframes dropFade {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .dropdown-content a {
            color: var(--text-dark);
            padding: 14px 22px;
            text-decoration: none;
            display: block;
            transition: 0.2s;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid var(--gray);
        }

        .dropdown-content a:hover {
            background: #ebf5fb;
            color: var(--primary);
        }

        .dropdown-content .logout-item {
            color: var(--danger);
            border-top: 1px solid var(--gray);
        }

        .dropdown-content .logout-item:hover {
            background: #fee2e2;
        }

        /* ========== المحتوى الرئيسي ========== */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* بطاقة الطلب */
        .request-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(12,45,74,0.06);
            border: 1px solid rgba(52,152,219,0.06);
        }

        /* رأس الطلب */
        .request-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 24px 28px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .request-header::after {
            content: "📋";
            position: absolute;
            font-size: 8rem;
            opacity: 0.06;
            left: -10px;
            bottom: -30px;
        }

        @media (min-width: 768px) {
            .request-header {
                padding: 30px 35px;
            }
        }

        .request-status {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 768px) {
            .request-status {
                font-size: 14px;
                padding: 8px 22px;
            }
        }

        .status-open {
            background: var(--success);
            color: white;
        }

        .status-matched {
            background: var(--warning);
            color: var(--text-dark);
        }

        .status-closed {
            background: var(--gray-dark);
            color: white;
        }

        .request-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 768px) {
            .request-title {
                font-size: 1.8rem;
            }
        }

        .request-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 12px;
            font-size: 12px;
            opacity: 0.85;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 768px) {
            .request-meta {
                font-size: 14px;
                gap: 25px;
            }
        }

        .request-meta i {
            margin-left: 5px;
        }

        /* محتوى الطلب */
        .request-content {
            padding: 24px;
        }

        @media (min-width: 768px) {
            .request-content {
                padding: 35px;
            }
        }

        /* أقسام المعلومات */
        .info-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        @media (min-width: 768px) {
            .section-title {
                font-size: 1.3rem;
            }
        }

        .section-title i {
            color: #3498db;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 640px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .info-item {
            background: var(--gray-light);
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(52,152,219,0.06);
            transition: all 0.3s ease;
        }

        .info-item:hover {
            border-color: #3498db;
            box-shadow: var(--shadow-sm);
        }

        .info-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(145deg, #e6edf4, #f0f6fb);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.3s;
        }

        .info-item:hover .info-icon {
            background: linear-gradient(145deg, #3498db, #2c81ba);
        }

        .info-item:hover .info-icon i {
            color: white;
        }

        @media (min-width: 768px) {
            .info-icon {
                width: 50px;
                height: 50px;
            }
        }

        .info-icon i {
            font-size: 20px;
            color: var(--primary);
            transition: 0.3s;
        }

        @media (min-width: 768px) {
            .info-icon i {
                font-size: 24px;
            }
        }

        .info-label {
            font-size: 12px;
            color: var(--gray-dark);
        }

        @media (min-width: 768px) {
            .info-label {
                font-size: 13px;
            }
        }

        .info-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
        }

        @media (min-width: 768px) {
            .info-value {
                font-size: 16px;
            }
        }

        /* وصف الطلب */
        .description-box {
            background: var(--gray-light);
            padding: 18px 20px;
            border-radius: var(--radius-sm);
            margin-top: 15px;
            border-right: 4px solid #3498db;
        }

        .description-box .label {
            font-size: 12px;
            color: var(--gray-dark);
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .description-box p {
            line-height: 1.8;
            color: var(--text-light);
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .description-box p {
                font-size: 15px;
            }
        }

        /* معلومات العميل */
        .buyer-section {
            background: linear-gradient(145deg, #eef2f7, #e6edf4);
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 25px 0;
            border: 1px solid rgba(52,152,219,0.08);
        }

        @media (min-width: 768px) {
            .buyer-section {
                padding: 25px;
            }
        }

        .buyer-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .buyer-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: 800;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(26,74,110,0.15);
        }

        @media (min-width: 768px) {
            .buyer-avatar {
                width: 65px;
                height: 65px;
                font-size: 26px;
            }
        }

        .buyer-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        @media (min-width: 768px) {
            .buyer-name {
                font-size: 1.3rem;
            }
        }

        .buyer-type {
            font-size: 12px;
            color: var(--gray-dark);
        }

        .buyer-info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 640px) {
            .buyer-info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .buyer-info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--white);
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
            border: 1px solid rgba(52,152,219,0.06);
        }

        .buyer-info-item:hover {
            border-color: #3498db;
            transform: translateX(-3px);
        }

        .buyer-info-item i {
            width: 35px;
            height: 35px;
            background: linear-gradient(145deg, #1a4a6e, #0c2d4a);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .buyer-info-item i {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
        }

        .buyer-info-item .info-text {
            font-size: 14px;
            color: var(--text-light);
            word-break: break-word;
        }

        .buyer-info-item .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            margin-right: auto;
            color: var(--primary);
            font-size: 14px;
            transition: 0.3s;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .buyer-info-item .copy-btn:hover {
            background: var(--gray-light);
            color: #3498db;
        }

        /* ===== أزرار التواصل ===== */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        @media (min-width: 640px) {
            .action-buttons {
                flex-direction: row;
                gap: 15px;
            }
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-family: inherit;
            min-height: 54px;
        }

        @media (min-width: 768px) {
            .btn {
                padding: 16px 24px;
                font-size: 1.05rem;
                min-height: 60px;
            }
        }

        .btn-whatsapp {
            background: linear-gradient(145deg, #25D366, #128C7E);
            color: white;
            box-shadow: 0 4px 16px rgba(37,211,102,0.25);
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(37,211,102,0.35);
        }

        .btn-whatsapp i {
            font-size: 1.4rem;
        }

        .btn-call {
            background: linear-gradient(145deg, #3498db, #2c81ba);
            color: white;
            box-shadow: 0 4px 16px rgba(52,152,219,0.25);
        }

        .btn-call:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(52,152,219,0.35);
        }

        .btn-call i {
            font-size: 1.2rem;
        }

        .btn-copy {
            background: linear-gradient(145deg, #64748b, #475569);
            color: white;
            box-shadow: 0 4px 16px rgba(100,116,139,0.2);
        }

        .btn-copy:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(100,116,139,0.3);
        }

        /* ===== زر العودة ===== */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            color: var(--primary);
            text-decoration: none;
            padding: 10px 24px;
            background: var(--white);
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(52,152,219,0.06);
        }

        @media (min-width: 768px) {
            .back-link {
                margin-top: 30px;
                padding: 12px 30px;
                font-size: 16px;
            }
        }

        .back-link:hover {
            background: linear-gradient(145deg, #3498db, #2c81ba);
            color: white;
            transform: translateX(-5px);
            box-shadow: 0 8px 24px rgba(52,152,219,0.25);
        }

        .back-link i {
            transition: 0.3s;
        }

        .back-link:hover i {
            transform: translateX(-5px);
        }

        .text-center {
            text-align: center;
        }

        /* ===== رسالة منبثقة ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-dark);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 700;
            z-index: 1000;
            font-size: 14px;
            animation: slideUp 0.4s ease, fadeOut 2s ease 1s forwards;
            box-shadow: var(--shadow-lg);
        }

        @media (min-width: 768px) {
            .toast {
                bottom: 30px;
                padding: 14px 30px;
                font-size: 16px;
            }
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* ===== حالة التحميل والخطأ ===== */
        .loader {
            text-align: center;
            padding: 60px 20px;
            background: var(--white);
            border-radius: var(--radius-lg);
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(52,152,219,0.06);
        }

        @media (min-width: 768px) {
            .loader {
                padding: 80px;
                font-size: 1.3rem;
            }
        }

        .loader .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--gray);
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            text-align: center;
            padding: 50px 20px;
            background: var(--white);
            border-radius: var(--radius-lg);
            color: var(--danger);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(229,62,62,0.10);
        }

        @media (min-width: 768px) {
            .error-box {
                padding: 70px;
            }
        }

        .error-box i {
            font-size: 4rem;
            margin-bottom: 15px;
            color: #fee2e2;
        }

        .error-box h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        @media (min-width: 768px) {
            .error-box h2 {
                font-size: 2rem;
            }
        }

        .error-box p {
            color: var(--text-light);
        }

        /* ===== الفوتر ===== */
        .footer {
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            color: white;
            text-align: center;
            padding: 35px 20px;
            margin-top: 60px;
            border-top: 4px solid #3498db;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            font-size: 14px;
        }

        .footer-links a:hover {
            color: white;
            transform: translateY(-3px);
        }

        /* ===== استجابة ===== */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 14px 20px;
            }
            
            .logo-content {
                font-size: 18px;
            }
            
            .logo-img {
                width: 40px;
                height: 40px;
            }
            
            .nav-links {
                justify-content: center;
            }
            
            .nav-links a {
                padding: 6px 14px;
                font-size: 12px;
            }
            
            .container {
                padding: 0 16px;
                margin: 20px auto;
            }
            
            .request-content {
                padding: 18px;
            }
            
            .request-header {
                padding: 18px 20px;
            }
            
            .request-title {
                font-size: 1.1rem;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                min-height: 50px;
                padding: 12px 16px;
                font-size: 0.95rem;
            }
            
            .dropdown-content {
                left: auto;
                right: 0;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .buyer-info-grid {
                grid-template-columns: 1fr;
            }
            
            .buyer-section {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .request-title {
                font-size: 1rem;
            }
            
            .request-meta {
                font-size: 11px;
                gap: 10px;
            }
            
            .info-item {
                padding: 12px 14px;
            }
            
            .info-icon {
                width: 38px;
                height: 38px;
            }
            
            .info-icon i {
                font-size: 16px;
            }
            
            .info-value {
                font-size: 13px;
            }
            
            .buyer-avatar {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
            
            .buyer-name {
                font-size: 1rem;
            }
            
            .buyer-info-item {
                padding: 10px 12px;
            }
            
            .buyer-info-item i {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            
            .buyer-info-item .info-text {
                font-size: 13px;
            }
            
            .description-box {
                padding: 14px 16px;
            }
            
            .description-box p {
                font-size: 13px;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <a href="index.html" style="text-decoration:none;">
            <div class="logo-content">
                <img src="709548215_2209434319875128_7640925248715427952_n.jpg"
                     class="logo-img" alt="كيماتو">
                <div class="logo-text">
                    <span>كيماتو</span>
                    <span> | تفاصيل الطلب</span>
                </div>
            </div>
        </a>
    </div>
    <div class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="all-products.html"><i class="fas fa-flask"></i> المنتجات</a>
        <a href="all-requests.html"><i class="fas fa-clipboard-list"></i> الطلبات</a>
        <div class="dropdown">
            <button class="dropdown-btn"><i class="fas fa-user-circle"></i> القائمة</button>
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>
    </div>
</div>

<div class="container">
    <div id="requestDetail">
        <div class="loader">
            <div class="spinner"></div>
            <div>⏳ جاري تحميل تفاصيل الطلب...</div>
        </div>
    </div>
    <div class="text-center">
        <a href="all-requests.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة لجميع الطلبات</a>
    </div>
</div>

<div class="footer">
    <div class="footer-links">
        <a href="index.html">الرئيسية</a>
        <a href="all-products.html">جميع المنتجات</a>
        <a href="all-requests.html">جميع الطلبات</a>
        <a href="auth.html">تسجيل الدخول</a>
        <a href="supplier-dashboard.html">للموردين</a>
        <a href="buyer-dashboard.html">للعملاء</a>
    </div>
    <div>© جميع الحقوق محفوظة Hazem Mohamady 2026 | كيماتو - سوق المواد الكيماوية</div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const urlParams = new URLSearchParams(window.location.search)
    const requestId = urlParams.get('id')

    let currentUser = null
    let currentProfile = null

    // ========== القائمة المنسدلة ==========
    function setupDropdown() {
        const dropdownBtn = document.querySelector('.dropdown-btn')
        const dropdownContent = document.getElementById('dropdownContent')
        
        if (dropdownBtn && dropdownContent) {
            dropdownBtn.addEventListener('click', (e) => {
                e.stopPropagation()
                dropdownContent.classList.toggle('show')
            })
            document.addEventListener('click', () => {
                dropdownContent.classList.remove('show')
            })
        }
    }

    async function updateDropdownContent() {
        const { data: { user } } = await supabase.auth.getUser()
        currentUser = user
        const dropdownContent = document.getElementById('dropdownContent')
        
        if (user) {
            const { data: profile } = await supabase.from('profiles').select('user_type').eq('id', user.id).single()
            currentProfile = profile
            dropdownContent.innerHTML = `
                <a href="${profile?.user_type === 'supplier' ? 'supplier-dashboard.html' : 'buyer-dashboard.html'}"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a>
                <a href="profile.html"><i class="fas fa-user"></i> الملف الشخصي</a>
                <a href="#" id="logoutLink" class="logout-item"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
            `
            const logoutLink = document.getElementById('logoutLink')
            if (logoutLink) {
                logoutLink.onclick = async (e) => {
                    e.preventDefault()
                    await supabase.auth.signOut()
                    window.location.href = 'index.html'
                }
            }
        } else {
            dropdownContent.innerHTML = `
                <a href="auth.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
                <a href="auth.html"><i class="fas fa-user-plus"></i> حساب جديد</a>
                <a href="supplier-dashboard.html"><i class="fas fa-warehouse"></i> للموردين</a>
                <a href="buyer-dashboard.html"><i class="fas fa-shopping-cart"></i> للعملاء</a>
            `
        }
    }

    // ========== دالة إنشاء رابط واتساب ==========
    function getWhatsAppLink(phone, productName) {
        if (!phone) return '#'
        const cleanPhone = phone.replace(/\D/g, '')
        const formattedPhone = cleanPhone.startsWith('20') ? cleanPhone : `20${cleanPhone}`
        const message = `مرحباً، أنا مهتم بتوفير: ${productName} (منصة كيماتو)`
        return `https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`
    }

    // ========== عرض رسالة منبثقة ==========
    function showToast(message) {
        const toast = document.createElement('div')
        toast.className = 'toast'
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`
        document.body.appendChild(toast)
        setTimeout(() => toast.remove(), 2500)
    }

    // ========== نسخ النص ==========
    window.copyToClipboard = (text) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
            showToast('✅ تم نسخ الرقم بنجاح')
        } else {
            // Fallback
            const textarea = document.createElement('textarea')
            textarea.value = text
            document.body.appendChild(textarea)
            textarea.select()
            document.execCommand('copy')
            document.body.removeChild(textarea)
            showToast('✅ تم نسخ الرقم بنجاح')
        }
    }

    // ========== فتح واتساب ==========
    window.openWhatsApp = (phone, productName) => {
        if (phone) {
            const link = getWhatsAppLink(phone, productName)
            window.open(link, '_blank')
        } else {
            showToast('⚠️ رقم الهاتف غير متاح')
        }
    }

    // ========== الاتصال ==========
    window.makeCall = (phone) => {
        if (phone) {
            window.location.href = `tel:${phone}`
        } else {
            showToast('⚠️ رقم الهاتف غير متاح')
        }
    }

    // ========== تحميل وعرض الطلب ==========
    async function loadRequest() {
        if (!requestId) {
            document.getElementById('requestDetail').innerHTML = `
                <div class="error-box">
                    <i class="fas fa-exclamation-circle"></i>
                    <h2>❌ خطأ</h2>
                    <p>لم يتم تحديد الطلب المطلوب</p>
                </div>
            `
            return
        }

        const { data, error } = await supabase
            .from('purchase_requests')
            .select('*, profiles(full_name, company_name, phone, city, address, user_type)')
            .eq('id', requestId)
            .single()

        if (error || !data) {
            document.getElementById('requestDetail').innerHTML = `
                <div class="error-box">
                    <i class="fas fa-search-minus"></i>
                    <h2>❌ عذراً</h2>
                    <p>${error?.message || 'الطلب غير موجود أو تم حذفه'}</p>
                </div>
            `
            return
        }

        const statusMap = {
            'open': { text: '🟢 مفتوح للعروض', class: 'status-open' },
            'matched': { text: '🟡 تم التوفيق مع مورد', class: 'status-matched' },
            'closed': { text: '🔴 مغلق', class: 'status-closed' }
        }

        const buyerName = data.profiles?.company_name || data.profiles?.full_name || 'عميل'
        const buyerInitial = buyerName.charAt(0)
        const phoneNumber = data.profiles?.phone || ''
        const whatsappLink = getWhatsAppLink(phoneNumber, data.product_name)

        document.getElementById('requestDetail').innerHTML = `
            <div class="request-card">
                <div class="request-header">
                    <span class="request-status ${statusMap[data.status]?.class}">${statusMap[data.status]?.text}</span>
                    <h1 class="request-title">📦 طلب شراء: ${data.product_name}</h1>
                    <div class="request-meta">
                        <span><i class="fas fa-calendar-alt"></i> ${new Date(data.created_at).toLocaleDateString('ar-EG')}</span>
                        <span><i class="fas fa-hashtag"></i> ${data.id.substring(0, 12)}...</span>
                    </div>
                </div>
                
                <div class="request-content">
                    <div class="info-section">
                        <div class="section-title">
                            <i class="fas fa-info-circle"></i>
                            <span>تفاصيل الطلب</span>
                        </div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-icon"><i class="fas fa-box"></i></div>
                                <div>
                                    <div class="info-label">المنتج المطلوب</div>
                                    <div class="info-value">${data.product_name}</div>
                                </div>
                            </div>
                            <div class="info-item">
                                <div class="info-icon"><i class="fas fa-balance-scale"></i></div>
                                <div>
                                    <div class="info-label">الكمية المطلوبة</div>
                                    <div class="info-value">${data.quantity_needed || 'غير محدد'}</div>
                                </div>
                            </div>
                            ${data.deadline ? `
                            <div class="info-item">
                                <div class="info-icon"><i class="fas fa-calendar-times"></i></div>
                                <div>
                                    <div class="info-label">آخر موعد للاستلام</div>
                                    <div class="info-value">${new Date(data.deadline).toLocaleDateString('ar-EG')}</div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                        
                        ${data.description ? `
                            <div class="description-box">
                                <span class="label"><i class="fas fa-align-right"></i> وصف الطلب</span>
                                <p>${data.description.replace(/\n/g, '<br>')}</p>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="buyer-section">
                        <div class="buyer-header">
                            <div class="buyer-avatar">${buyerInitial}</div>
                            <div>
                                <div class="buyer-name">${buyerName}</div>
                                <div class="buyer-type">${data.profiles?.user_type === 'supplier' ? '🏭 مورد' : '🛒 عميل'}</div>
                            </div>
                        </div>
                        
                        <div class="buyer-info-grid">
                            <div class="buyer-info-item">
                                <i class="fas fa-city"></i>
                                <div class="info-text">${data.profiles?.city || 'مدينة غير محددة'}</div>
                            </div>
                            <div class="buyer-info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <div class="info-text">${data.profiles?.address || 'عنوان غير محدد'}</div>
                            </div>
                            ${phoneNumber ? `
                            <div class="buyer-info-item">
                                <i class="fas fa-phone"></i>
                                <div class="info-text" dir="ltr">${phoneNumber}</div>
                                <button class="copy-btn" onclick="copyToClipboard('${phoneNumber}')" title="نسخ الرقم">
                                    <i class="fas fa-copy"></i>
                                </button>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <a href="${whatsappLink}" target="_blank" class="btn btn-whatsapp">
                            <i class="fab fa-whatsapp"></i> تواصل عبر واتساب
                        </a>
                        <a href="tel:${phoneNumber}" class="btn btn-call">
                            <i class="fas fa-phone-alt"></i> اتصال
                        </a>
                        ${phoneNumber ? `
                        <button class="btn btn-copy" onclick="copyToClipboard('${phoneNumber}')">
                            <i class="fas fa-copy"></i> نسخ الرقم
                        </button>
                        ` : ''}
                    </div>
                </div>
            </div>
        `
    }

    // ========== بدء التشغيل ==========
    setupDropdown()
    updateDropdownContent()
    loadRequest()
</script>
</body>
</html>
