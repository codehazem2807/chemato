<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>كيماتو | تفاصيل الطلب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a2f2f;
            --primary: #1a5f5f;
            --primary-light: #2a8f8f;
            --accent: #ffb347;
            --accent-dark: #e69500;
            --gray-light: #f8fafc;
            --gray: #e2e8f0;
            --gray-dark: #64748b;
            --text-dark: #1e2a3e;
            --text-light: #475569;
            --white: #ffffff;
            --danger: #e53e3e;
            --success: #2a9d8f;
            --warning: #f4a261;
            --whatsapp: #25D366;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.1);
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
        }

        body {
            font-family: 'Cairo', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #eef2f7 0%, #d9e0e8 100%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* ========== الهيدر ========== */
        .navbar {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
        }

        @media (min-width: 768px) {
            .navbar {
                padding: 18px 40px;
            }
        }

        .logo a {
            text-decoration: none;
        }

        .logo-content {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
        }

        @media (min-width: 768px) {
            .logo-content {
                font-size: 22px;
                gap: 12px;
            }
        }

        .logo-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #2563eb;
            object-fit: cover;
        }

        @media (min-width: 768px) {
            .logo-img {
                width: 45px;
                height: 45px;
            }
        }

        .logo-text span:first-child { color: #2563eb; }
        .logo-text span:last-child { color: #94a3b8; font-size: 14px; }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .nav-links {
                gap: 15px;
            }
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: 500;
            font-size: 13px;
        }

        @media (min-width: 768px) {
            .nav-links a {
                padding: 8px 20px;
                font-size: 1rem;
            }
        }

        .nav-links a:hover {
            background: var(--accent);
            color: var(--text-dark);
        }

        /* ========== القائمة المنسدلة ========== */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            font-size: 13px;
            font-family: inherit;
        }

        @media (min-width: 768px) {
            .dropdown-btn {
                padding: 8px 20px;
                gap: 8px;
                font-size: 1rem;
            }
        }

        .dropdown-btn:hover {
            background: var(--accent);
            color: var(--text-dark);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            min-width: 180px;
            box-shadow: var(--shadow-lg);
            border-radius: var(--radius-sm);
            z-index: 1000;
            overflow: hidden;
            margin-top: 8px;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content a {
            color: var(--text-dark);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            transition: 0.2s;
            font-size: 14px;
            border-bottom: 1px solid var(--gray);
        }

        .dropdown-content a:hover {
            background: var(--gray-light);
            color: var(--primary);
        }

        .dropdown-content .logout-item {
            color: var(--danger);
            border-top: 1px solid var(--gray);
        }

        .dropdown-content .logout-item:hover {
            background: #fee2e2;
        }

        /* ========== المحتوى الرئيسي ========== */
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 16px;
        }

        @media (min-width: 768px) {
            .container {
                margin: 40px auto;
                padding: 0 24px;
            }
        }

        /* بطاقة الطلب */
        .request-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        /* رأس الطلب */
        .request-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 24px;
            color: white;
        }

        @media (min-width: 768px) {
            .request-header {
                padding: 30px;
            }
        }

        .request-status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        @media (min-width: 768px) {
            .request-status {
                font-size: 14px;
                padding: 8px 20px;
            }
        }

        .status-open {
            background: var(--success);
            color: white;
        }

        .status-matched {
            background: var(--warning);
            color: var(--text-dark);
        }

        .status-closed {
            background: var(--gray-dark);
            color: white;
        }

        .request-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        @media (min-width: 768px) {
            .request-title {
                font-size: 1.8rem;
            }
        }

        .request-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.9;
        }

        @media (min-width: 768px) {
            .request-meta {
                font-size: 14px;
                gap: 25px;
            }
        }

        .request-meta i {
            margin-left: 5px;
        }

        /* محتوى الطلب */
        .request-content {
            padding: 24px;
        }

        @media (min-width: 768px) {
            .request-content {
                padding: 35px;
            }
        }

        /* أقسام المعلومات */
        .info-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--primary-dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (min-width: 768px) {
            .section-title {
                font-size: 1.3rem;
            }
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 640px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .info-item {
            background: var(--gray-light);
            padding: 15px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-icon {
            width: 45px;
            height: 45px;
            background: var(--white);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .info-icon {
                width: 50px;
                height: 50px;
            }
        }

        .info-icon i {
            font-size: 20px;
            color: var(--primary);
        }

        @media (min-width: 768px) {
            .info-icon i {
                font-size: 24px;
            }
        }

        .info-label {
            font-size: 12px;
            color: var(--gray-dark);
        }

        @media (min-width: 768px) {
            .info-label {
                font-size: 13px;
            }
        }

        .info-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-dark);
        }

        @media (min-width: 768px) {
            .info-value {
                font-size: 16px;
            }
        }

        /* وصف الطلب */
        .description-box {
            background: var(--gray-light);
            padding: 20px;
            border-radius: var(--radius-sm);
            margin-top: 15px;
        }

        .description-box p {
            line-height: 1.6;
            color: var(--text-light);
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .description-box p {
                font-size: 15px;
            }
        }

        /* معلومات العميل */
        .buyer-section {
            background: linear-gradient(135deg, var(--gray-light), var(--gray));
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 25px 0;
        }

        @media (min-width: 768px) {
            .buyer-section {
                padding: 25px;
            }
        }

        .buyer-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .buyer-avatar {
            width: 55px;
            height: 55px;
            background: var(--primary);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        @media (min-width: 768px) {
            .buyer-avatar {
                width: 65px;
                height: 65px;
                font-size: 26px;
            }
        }

        .buyer-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-dark);
        }

        @media (min-width: 768px) {
            .buyer-name {
                font-size: 1.3rem;
            }
        }

        .buyer-info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 640px) {
            .buyer-info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .buyer-info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--white);
            border-radius: var(--radius-sm);
        }

        .buyer-info-item i {
            width: 35px;
            height: 35px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .buyer-info-item i {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
        }

        /* أزرار التواصل */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        @media (min-width: 640px) {
            .action-buttons {
                flex-direction: row;
                gap: 15px;
            }
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        @media (min-width: 768px) {
            .btn {
                padding: 14px 20px;
                font-size: 1rem;
            }
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: white;
        }

        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }

        .btn-call {
            background: var(--accent);
            color: var(--text-dark);
        }

        .btn-call:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .btn-copy {
            background: var(--gray-dark);
            color: white;
        }

        .btn-copy:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .btn-back {
            background: transparent;
            border: 2px solid var(--gray);
            color: var(--text-dark);
        }

        .btn-back:hover {
            background: var(--gray);
        }

        /* رسالة منبثقة */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-dark);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 1000;
            font-size: 13px;
            white-space: nowrap;
            animation: fadeOut 2s ease forwards;
        }

        @media (min-width: 768px) {
            .toast {
                bottom: 30px;
                padding: 12px 25px;
                font-size: 14px;
            }
        }

        @keyframes fadeOut {
            0% { opacity: 1; bottom: 20px; }
            70% { opacity: 1; bottom: 20px; }
            100% { opacity: 0; bottom: 40px; visibility: hidden; }
        }

        /* حالة التحميل */
        .loader {
            text-align: center;
            padding: 50px;
            background: var(--white);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            color: var(--primary);
        }

        @media (min-width: 768px) {
            .loader {
                padding: 80px;
                font-size: 1.2rem;
            }
        }

        .error-box {
            text-align: center;
            padding: 40px;
            background: var(--white);
            border-radius: var(--radius-lg);
            color: var(--danger);
        }

        @media (min-width: 768px) {
            .error-box {
                padding: 60px;
            }
        }

        /* الفوتر */
        .footer {
            background: var(--primary-dark);
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        @media (min-width: 768px) {
            .footer {
                padding: 35px;
                margin-top: 60px;
            }
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .footer-links {
                gap: 30px;
                margin-bottom: 20px;
            }
        }

        .footer-links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
        }

        @media (min-width: 768px) {
            .footer-links a {
                font-size: 14px;
            }
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <a href="index.html" style="text-decoration:none;">
            <div class="logo-content">
                <img src="logo.png"
                     class="logo-img" alt="كيماتو">
                <div class="logo-text">
                    <span>كيماتو</span>
                    <span> | تفاصيل الطلب</span>
                </div>
            </div>
        </a>
    </div>
    <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="all-products.html">📦 المنتجات</a>
        <a href="all-requests.html">📋 الطلبات</a>
        <div class="dropdown">
            <button class="dropdown-btn"><i class="fas fa-bars"></i> القائمة</button>
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>
    </div>
</div>

<div class="container">
    <div id="requestDetail" class="loader">⏳ جاري تحميل تفاصيل الطلب...</div>
    <div style="text-align: center; margin-top: 20px;">
        <a href="all-requests.html" class="btn btn-back" style="display: inline-block; width: auto; padding: 10px 25px;">
            <i class="fas fa-arrow-right"></i> العودة لجميع الطلبات
        </a>
    </div>
</div>

<div class="footer">
    <div class="footer-links">
        <a href="index.html">الرئيسية</a>
        <a href="all-products.html">جميع المنتجات</a>
        <a href="all-requests.html">جميع الطلبات</a>
        <a href="auth.html">تسجيل الدخول</a>
    </div>
    <div>© جميع الحقوق محفوظة Hazem Mohamady 2026 | كيماتو - سوق المواد الكيماوية</div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://soqvhvqtpgeoxwmkvbih.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvcXZodnF0cGdlb3h3bWt2YmloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTYwODQsImV4cCI6MjA5NTY3MjA4NH0.7o0KP2SEV4Pr2Y_tEcQ3rEFyo_PBwI8rbq9CMh2AveA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const urlParams = new URLSearchParams(window.location.search)
    const requestId = urlParams.get('id')

    let currentUser = null
    let currentProfile = null

    // ========== القائمة المنسدلة ==========
    function setupDropdown() {
        const dropdownBtn = document.querySelector('.dropdown-btn')
        const dropdownContent = document.getElementById('dropdownContent')
        
        if (dropdownBtn && dropdownContent) {
            dropdownBtn.addEventListener('click', (e) => {
                e.stopPropagation()
                dropdownContent.classList.toggle('show')
            })
            document.addEventListener('click', () => {
                dropdownContent.classList.remove('show')
            })
        }
    }

    async function updateDropdownContent() {
        const { data: { user } } = await supabase.auth.getUser()
        currentUser = user
        const dropdownContent = document.getElementById('dropdownContent')
        
        if (user) {
            const { data: profile } = await supabase.from('profiles').select('user_type').eq('id', user.id).single()
            currentProfile = profile
            dropdownContent.innerHTML = `
                <a href="${profile?.user_type === 'supplier' ? 'supplier-dashboard.html' : 'buyer-dashboard.html'}">📦 لوحة التحكم</a>
                <a href="profile.html">👤 الملف الشخصي</a>
                <a href="#" id="logoutLink" class="logout-item">🚪 تسجيل خروج</a>
            `
            const logoutLink = document.getElementById('logoutLink')
            if (logoutLink) {
                logoutLink.onclick = async (e) => {
                    e.preventDefault()
                    await supabase.auth.signOut()
                    window.location.href = 'index.html'
                }
            }
        } else {
            dropdownContent.innerHTML = `
                <a href="auth.html">🔐 تسجيل الدخول</a>
                <a href="auth.html">📝 حساب جديد</a>
                <a href="supplier-dashboard.html">📦 للموردين</a>
                <a href="buyer-dashboard.html">🛒 للعملاء</a>
            `
        }
    }

    // ========== عرض رسالة منبثقة ==========
    function showToast(message) {
        const toast = document.createElement('div')
        toast.className = 'toast'
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`
        document.body.appendChild(toast)
        setTimeout(() => toast.remove(), 2000)
    }

    // ========== نسخ النص ==========
    window.copyToClipboard = (text) => {
        navigator.clipboard.writeText(text)
        showToast('✅ تم نسخ الرقم بنجاح')
    }

    // ========== فتح واتساب ==========
    window.openWhatsApp = (phone) => {
        if (phone) {
            let whatsappNumber = phone.replace(/[^0-9]/g, '')
            if (whatsappNumber.startsWith('0')) {
                whatsappNumber = '2' + whatsappNumber
            }
            window.open(`https://wa.me/${whatsappNumber}`, '_blank')
        } else {
            showToast('⚠️ رقم الهاتف غير متاح')
        }
    }

    // ========== الاتصال ==========
    window.makeCall = (phone) => {
        if (phone) {
            window.location.href = `tel:${phone}`
        } else {
            showToast('⚠️ رقم الهاتف غير متاح')
        }
    }

    // ========== تحميل وعرض الطلب ==========
    async function loadRequest() {
        if (!requestId) {
            document.getElementById('requestDetail').innerHTML = `
                <div class="error-box">
                    <h2>❌ خطأ</h2>
                    <p>لم يتم تحديد الطلب المطلوب</p>
                </div>
            `
            return
        }

        const { data, error } = await supabase
            .from('purchase_requests')
            .select('*, profiles(full_name, company_name, phone, city, address, whatsapp, user_type)')
            .eq('id', requestId)
            .single()

        if (error || !data) {
            document.getElementById('requestDetail').innerHTML = `
                <div class="error-box">
                    <h2>❌ عذراً</h2>
                    <p>${error?.message || 'الطلب غير موجود أو تم حذفه'}</p>
                </div>
            `
            return
        }

        const statusMap = {
            'open': { text: '🟢 مفتوح للعروض', class: 'status-open' },
            'matched': { text: '🟡 تم التوفيق مع مورد', class: 'status-matched' },
            'closed': { text: '🔴 مغلق', class: 'status-closed' }
        }

        const buyerName = data.profiles?.company_name || data.profiles?.full_name || 'عميل'
        const buyerInitial = buyerName.charAt(0)
        const phoneNumber = data.profiles?.phone || ''
        const whatsappNumber = data.profiles?.whatsapp || data.profiles?.phone || ''

        document.getElementById('requestDetail').innerHTML = `
            <div class="request-card">
                <div class="request-header">
                    <span class="request-status ${statusMap[data.status]?.class}">${statusMap[data.status]?.text}</span>
                    <h1 class="request-title">📦 طلب شراء: ${data.product_name}</h1>
                    <div class="request-meta">
                        <span><i class="fas fa-calendar"></i> ${new Date(data.created_at).toLocaleDateString('ar-EG')}</span>
                        <span><i class="fas fa-hashtag"></i> ${data.id.substring(0, 12)}...</span>
                    </div>
                </div>
                
                <div class="request-content">
                    <div class="info-section">
                        <div class="section-title">
                            <i class="fas fa-info-circle"></i>
                            <span>تفاصيل الطلب</span>
                        </div>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-icon"><i class="fas fa-box"></i></div>
                                <div>
                                    <div class="info-label">المنتج المطلوب</div>
                                    <div class="info-value">${data.product_name}</div>
                                </div>
                            </div>
                            <div class="info-item">
                                <div class="info-icon"><i class="fas fa-balance-scale"></i></div>
                                <div>
                                    <div class="info-label">الكمية المطلوبة</div>
                                    <div class="info-value">${data.quantity_needed || 'غير محدد'}</div>
                                </div>
                            </div>
                            ${data.deadline ? `
                            <div class="info-item">
                                <div class="info-icon"><i class="fas fa-calendar-alt"></i></div>
                                <div>
                                    <div class="info-label">آخر موعد للاستلام</div>
                                    <div class="info-value">${new Date(data.deadline).toLocaleDateString('ar-EG')}</div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                        
                        ${data.description ? `
                            <div class="description-box">
                                <div class="info-label" style="margin-bottom: 10px;"><i class="fas fa-align-right"></i> وصف الطلب</div>
                                <p>${data.description.replace(/\n/g, '<br>')}</p>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="buyer-section">
                        <div class="buyer-header">
                            <div class="buyer-avatar">${buyerInitial}</div>
                            <div>
                                <div class="buyer-name">${buyerName}</div>
                                <div style="font-size: 12px; color: var(--gray-dark);">${data.profiles?.user_type === 'supplier' ? 'مورد' : 'عميل'}</div>
                            </div>
                        </div>
                        
                        <div class="buyer-info-grid">
                            <div class="buyer-info-item">
                                <i class="fas fa-city"></i>
                                <div>${data.profiles?.city || 'مدينة غير محددة'}</div>
                            </div>
                            <div class="buyer-info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>${data.profiles?.address || 'عنوان غير محدد'}</div>
                            </div>
                            ${phoneNumber ? `
                            <div class="buyer-info-item">
                                <i class="fas fa-phone"></i>
                                <div>${phoneNumber}</div>
                                <button onclick="copyToClipboard('${phoneNumber}')" style="background: none; border: none; cursor: pointer; margin-right: auto; color: var(--primary);">
                                    <i class="fas fa-copy"></i>
                                </button>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-whatsapp" onclick="openWhatsApp('${whatsappNumber}')">
                            <i class="fab fa-whatsapp"></i> واتساب
                        </button>
                        <button class="btn btn-call" onclick="makeCall('${phoneNumber}')">
                            <i class="fas fa-phone-alt"></i> اتصال
                        </button>
                        ${phoneNumber ? `
                        <button class="btn btn-copy" onclick="copyToClipboard('${phoneNumber}')">
                            <i class="fas fa-copy"></i> نسخ الرقم
                        </button>
                        ` : ''}
                    </div>
                </div>
            </div>
        `
    }

    // ========== بدء التشغيل ==========
    setupDropdown()
    updateDropdownContent()
    loadRequest()
</script>
</body>
</html>
